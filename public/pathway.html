<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ByteForge — Skill Tree</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { padding-top:64px; background:var(--bg); overflow:hidden; }

    /* ── Toolbar ── */
    .tree-toolbar {
      position:fixed; top:64px; left:0; right:0; z-index:50;
      padding:10px 20px; background:rgba(13,15,26,.92); backdrop-filter:blur(16px);
      border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .toolbar-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-faint); margin-right:4px; }
    .pathway-chip { padding:5px 14px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--border); background:var(--bg-card); color:var(--fg-dim); transition:.15s; }
    .pathway-chip:hover  { border-color:var(--border-hi); color:var(--fg); }
    .pathway-chip.active { color:#fff; border-color:transparent; }
    .divider { width:1px; height:20px; background:var(--border); margin:0 4px; }
    .zoom-btn { width:32px; height:32px; border-radius:8px; background:var(--bg-card); border:1px solid var(--border); color:var(--fg); font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s; }
    .zoom-btn:hover { background:var(--bg-raised); }
    .legend { display:flex; gap:12px; margin-left:auto; }
    .legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--fg-dim); }
    .legend-dot { width:10px; height:10px; border-radius:50%; border:2px solid; }

    /* ── Tree container ── */
    .tree-container {
      position:fixed; top:108px; left:0; right:0; bottom:0;
      overflow:hidden; cursor:grab; user-select:none;
    }
    .tree-container.dragging { cursor:grabbing; }
    #skill-tree { display:block; width:100%; height:100%; }

    /* ── Node panel (slide-in from right) ── */
    .node-panel {
      position:fixed; top:64px; right:-360px; bottom:0; width:340px;
      background:var(--bg-card); border-left:1px solid var(--border);
      transition:right .3s cubic-bezier(.4,0,.2,1);
      z-index:60; display:flex; flex-direction:column; overflow:hidden;
    }
    .node-panel.open { right:0; }
    .panel-close { position:absolute; top:14px; right:14px; width:28px; height:28px; border-radius:6px; background:var(--bg); border:1px solid var(--border); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--fg-dim); }
    .panel-close:hover { color:var(--fg); }
    .panel-inner { padding:24px; overflow-y:auto; flex:1; }
    .panel-icon  { font-size:40px; text-align:center; margin-bottom:12px; }
    .panel-title { font-size:20px; font-weight:800; letter-spacing:-.02em; margin-bottom:6px; }
    .panel-desc  { font-size:14px; color:var(--fg-dim); line-height:1.6; margin-bottom:16px; }
    .panel-meta  { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
    .meta-item   { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
    .meta-label  { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-faint); margin-bottom:3px; }
    .meta-value  { font-size:14px; font-weight:700; }
    .mastery-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .mastery-bar-bg { flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
    .mastery-bar-fill { height:8px; border-radius:4px; transition:width .6s; }
    .status-badge { padding:4px 12px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    .status-locked    { background:rgba(255,255,255,.06); color:var(--fg-faint); }
    .status-available { background:rgba(59,130,246,.12); color:var(--blue); }
    .status-started   { background:rgba(249,115,22,.12); color:var(--orange); }
    .status-practicing{ background:rgba(234,179,8,.12); color:var(--yellow); }
    .status-mastered  { background:rgba(34,197,94,.12); color:var(--green); }
    .prereq-list { margin-bottom:16px; }
    .prereq-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-faint); margin-bottom:8px; }
    .prereq-chip  { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:6px; font-size:12px; border:1px solid var(--border); background:var(--bg); margin:0 4px 4px 0; }
    .weakness-list { margin-bottom:16px; font-size:13px; color:#fca5a5; }
    .panel-cta { position:sticky; bottom:0; padding:16px 24px; background:var(--bg-card); border-top:1px solid var(--border); }
    .panel-cta a { display:block; text-align:center; padding:14px; border-radius:10px; background:var(--orange); color:#fff; font-weight:700; font-size:15px; text-decoration:none; transition:.15s; }
    .panel-cta a:hover { background:#ea580c; }
    .panel-cta-locked { display:block; text-align:center; padding:14px; border-radius:10px; background:rgba(255,255,255,.05); color:var(--fg-faint); font-size:14px; }

    /* ── Instruction overlay ── */
    .hint { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:8px 18px; border-radius:999px; background:rgba(13,15,26,.9); border:1px solid var(--border); font-size:13px; color:var(--fg-dim); pointer-events:none; z-index:10; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo"><div class="logo-icon">⚒</div><span class="logo-text">Byte<span>Forge</span></span></div>
    <div class="nav-links">
      <a href="dashboard-student.html" id="back-link">← Dashboard</a>
      <a href="achievements.html">Achievements</a>
    </div>
    <a href="login.html" class="nav-cta" id="nav-auth">Sign In</a>
  </nav>

  <!-- Toolbar -->
  <div class="tree-toolbar">
    <span class="toolbar-label">Pathway:</span>
    <button class="pathway-chip active" data-path="all" onclick="filterPathway('all',this)">All Concepts</button>
    <div id="pathway-chips"></div>
    <div class="divider"></div>
    <button class="zoom-btn" onclick="zoom(0.15)" title="Zoom in">+</button>
    <button class="zoom-btn" onclick="zoom(-0.15)" title="Zoom out">−</button>
    <button class="zoom-btn" onclick="resetView()" title="Reset view" style="font-size:14px">⌂</button>
    <div class="divider"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="border-color:#2a2f4a;background:#1a1e35"></div>Locked</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#3b82f6;background:#1e3a5f"></div>Available</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#f97316;background:#5c3000"></div>Started</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#eab308;background:#4d3b00"></div>Practicing</div>
      <div class="legend-item"><div class="legend-dot" style="border-color:#22c55e;background:#0f3320"></div>Mastered</div>
    </div>
  </div>

  <!-- Skill tree SVG -->
  <div class="tree-container" id="tree-container">
    <svg id="skill-tree" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L0,10 L10,5 z" fill="rgba(255,255,255,0.2)"/>
        </marker>
        <marker id="arrow-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M0,0 L0,10 L10,5 z" fill="rgba(249,115,22,0.8)"/>
        </marker>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glow-strong">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="tree-root">
        <g id="edges-layer"></g>
        <g id="nodes-layer"></g>
      </g>
    </svg>
  </div>

  <!-- Node detail panel -->
  <div class="node-panel" id="node-panel">
    <button class="panel-close" onclick="closePanel()">✕</button>
    <div class="panel-inner" id="panel-inner"></div>
    <div class="panel-cta" id="panel-cta"></div>
  </div>

  <div class="hint" id="hint">Scroll to zoom · Drag to pan · Click a node to explore</div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/concepts.js"></script>
  <script src="js/mastery.js"></script>
  <script src="js/adaptive.js"></script>
  <script>
    BF.seed();
    BFA.seedDemoMastery();
    const me = BF.session();
    if (me) {
      document.getElementById('nav-auth').textContent = me.role === 'teacher' ? 'Teacher Dashboard' : 'My Dashboard';
      document.getElementById('nav-auth').href = me.role === 'teacher' ? 'dashboard-teacher.html' : 'dashboard-student.html';
      document.getElementById('back-link').href = me.role === 'teacher' ? 'dashboard-teacher.html' : 'dashboard-student.html';
    }

    // ── Layout ──────────────────────────────────────────────────────
    const SVG_W  = 2200;
    const SVG_H  = 1500;
    const R      = 34;  // node radius
    const positions = BFC.computeLayout(SVG_W, SVG_H);

    // Mastery data
    const mastery = me ? BFM.getMastery(me.id) : null;

    function getStatus(conceptId) {
      if (!mastery) return 'available';
      return mastery.concepts[conceptId]?.status || 'locked';
    }
    function getMasteryScore(conceptId) {
      if (!mastery) return 0;
      return mastery.concepts[conceptId]?.masteryScore || 0;
    }

    // ── Colors by status ─────────────────────────────────────────────
    const STATUS_FILL   = { locked:'#0d1020', available:'#0d1a30', started:'#200e00', practicing:'#1a1500', mastered:'#052010' };
    const STATUS_STROKE = { locked:'#2a2f4a', available:'#3b82f6', started:'#f97316', practicing:'#eab308', mastered:'#22c55e' };
    const STATUS_GLOW   = { locked:false, available:false, started:false, practicing:true, mastered:true };

    // ── Pan / Zoom state ─────────────────────────────────────────────
    let vx = 0, vy = 0, scale = 0.7;
    let dragging = false, lastX = 0, lastY = 0;

    const container  = document.getElementById('tree-container');
    const treeRoot   = document.getElementById('tree-root');
    const svg        = document.getElementById('skill-tree');
    const edgesLayer = document.getElementById('edges-layer');
    const nodesLayer = document.getElementById('nodes-layer');

    // Center the view initially
    function resetView() {
      const rect = container.getBoundingClientRect();
      vx = (rect.width - SVG_W * scale) / 2;
      vy = 44;
      applyTransform();
    }

    function applyTransform() {
      treeRoot.setAttribute('transform', `translate(${vx},${vy}) scale(${scale})`);
    }

    function zoom(delta) {
      const newScale = Math.max(0.3, Math.min(2, scale + delta));
      const factor   = newScale / scale;
      const rect     = container.getBoundingClientRect();
      const cx = rect.width  / 2;
      const cy = rect.height / 2;
      vx = cx - factor * (cx - vx);
      vy = cy - factor * (cy - vy);
      scale = newScale;
      applyTransform();
    }

    container.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 0.1 : -0.1); }, { passive:false });
    container.addEventListener('mousedown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; container.classList.add('dragging'); });
    window.addEventListener('mousemove', e => { if(!dragging) return; vx+=e.clientX-lastX; vy+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; applyTransform(); });
    window.addEventListener('mouseup', () => { dragging=false; container.classList.remove('dragging'); });
    // Touch support
    let lastTouch = null;
    container.addEventListener('touchstart', e => { if(e.touches.length===1){lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};} });
    container.addEventListener('touchmove', e => { e.preventDefault(); if(e.touches.length===1&&lastTouch){const t=e.touches[0];vx+=t.clientX-lastTouch.x;vy+=t.clientY-lastTouch.y;lastTouch={x:t.clientX,y:t.clientY};applyTransform();} }, {passive:false});

    // ── Draw edges ───────────────────────────────────────────────────
    function drawEdges(activePath = null) {
      edgesLayer.innerHTML = '';
      BFC.CONCEPTS.forEach(concept => {
        const to = positions.get(concept.id);
        if (!to) return;
        concept.prerequisites.forEach(preId => {
          const from = positions.get(preId);
          if (!from) return;

          const inPath = activePath && activePath.conceptIds.includes(concept.id) && activePath.conceptIds.includes(preId);
          const cx1 = from.x, cy1 = from.y + R;
          const cx2 = to.x,   cy2 = to.y   - R;
          const d = `M${from.x},${cy1} C${cx1},${cy1+60} ${cx2},${cy2-60} ${to.x},${cy2}`;

          const path = document.createElementNS('http://www.w3.org/2000/svg','path');
          path.setAttribute('d', d);
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', inPath ? 'rgba(249,115,22,0.6)' : 'rgba(255,255,255,0.08)');
          path.setAttribute('stroke-width', inPath ? '2.5' : '1.5');
          path.setAttribute('marker-end', inPath ? 'url(#arrow-path)' : 'url(#arrow)');
          edgesLayer.appendChild(path);
        });
      });
    }

    // ── Draw nodes ───────────────────────────────────────────────────
    let activePathFilter = null;

    function drawNodes(activePath = null) {
      nodesLayer.innerHTML = '';

      BFC.CONCEPTS.forEach(concept => {
        const pos    = positions.get(concept.id);
        if (!pos) return;
        const status = getStatus(concept.id);
        const score  = getMasteryScore(concept.id);
        const inPath = !activePath || activePath.conceptIds.includes(concept.id);
        const opacity= inPath ? 1 : 0.2;

        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('transform', `translate(${pos.x},${pos.y})`);
        g.setAttribute('opacity', opacity);
        g.style.cursor = 'pointer';
        g.dataset.conceptId = concept.id;

        // Glow filter for practicing/mastered
        if (STATUS_GLOW[status] && inPath) {
          g.setAttribute('filter', status === 'mastered' ? 'url(#glow-strong)' : 'url(#glow)');
        }

        // Mastery ring (stroke-dasharray progress arc)
        const circum = 2 * Math.PI * (R - 3);
        const dash   = circum * score / 100;

        // Background circle
        const bg = document.createElementNS('http://www.w3.org/2000/svg','circle');
        bg.setAttribute('r', R);
        bg.setAttribute('fill', STATUS_FILL[status]);
        bg.setAttribute('stroke', STATUS_STROKE[status]);
        bg.setAttribute('stroke-width', '2');
        g.appendChild(bg);

        // Mastery progress ring
        if (score > 0) {
          const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
          ring.setAttribute('r', R - 3);
          ring.setAttribute('fill', 'none');
          ring.setAttribute('stroke', STATUS_STROKE[status]);
          ring.setAttribute('stroke-width', '3');
          ring.setAttribute('stroke-dasharray', `${dash} ${circum}`);
          ring.setAttribute('stroke-linecap', 'round');
          ring.setAttribute('transform', 'rotate(-90)');
          ring.setAttribute('opacity', '0.4');
          g.appendChild(ring);
        }

        // Icon
        const icon = document.createElementNS('http://www.w3.org/2000/svg','text');
        icon.setAttribute('text-anchor', 'middle');
        icon.setAttribute('dominant-baseline', 'central');
        icon.setAttribute('y', '-5');
        icon.setAttribute('font-size', status === 'locked' ? '14' : '18');
        icon.setAttribute('opacity', status === 'locked' ? '0.3' : '1');
        icon.textContent = concept.icon;
        g.appendChild(icon);

        // Score text (if not locked)
        if (score > 0) {
          const scoreText = document.createElementNS('http://www.w3.org/2000/svg','text');
          scoreText.setAttribute('text-anchor', 'middle');
          scoreText.setAttribute('dominant-baseline', 'central');
          scoreText.setAttribute('y', '12');
          scoreText.setAttribute('font-size', '9');
          scoreText.setAttribute('fill', STATUS_STROKE[status]);
          scoreText.setAttribute('font-family', 'JetBrains Mono, monospace');
          scoreText.textContent = score + '%';
          g.appendChild(scoreText);
        }

        // Tier badge for tier 0
        if (concept.tier === 0) {
          const badge = document.createElementNS('http://www.w3.org/2000/svg','circle');
          badge.setAttribute('cx', R - 5); badge.setAttribute('cy', -(R - 5));
          badge.setAttribute('r', '7'); badge.setAttribute('fill', '#f97316');
          g.appendChild(badge);
          const badgeText = document.createElementNS('http://www.w3.org/2000/svg','text');
          badgeText.setAttribute('x', R - 5); badgeText.setAttribute('y', -(R - 5));
          badgeText.setAttribute('text-anchor', 'middle'); badgeText.setAttribute('dominant-baseline', 'central');
          badgeText.setAttribute('font-size', '7'); badgeText.setAttribute('fill', '#fff'); badgeText.setAttribute('font-weight', '700');
          badgeText.textContent = '★';
          g.appendChild(badgeText);
        }

        // Name label (below node)
        const words = concept.name.split(' ');
        const lines = [];
        let line = '';
        words.forEach(w => { if ((line+' '+w).trim().length > 14) { lines.push(line.trim()); line = w; } else { line = (line+' '+w).trim(); } });
        if (line) lines.push(line.trim());
        lines.forEach((l, li) => {
          const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
          txt.setAttribute('text-anchor', 'middle');
          txt.setAttribute('y', R + 14 + li * 13);
          txt.setAttribute('font-size', '10');
          txt.setAttribute('fill', status === 'locked' ? '#4a4f68' : '#e8eaf0');
          txt.setAttribute('font-family', 'Inter, sans-serif');
          txt.setAttribute('font-weight', '600');
          txt.textContent = l;
          g.appendChild(txt);
        });

        g.addEventListener('click', (e) => { e.stopPropagation(); openPanel(concept.id); });
        nodesLayer.appendChild(g);
      });
    }

    // ── Pathway filter chips ─────────────────────────────────────────
    document.getElementById('pathway-chips').innerHTML = BFC.PATHWAYS.map(p => `
      <button class="pathway-chip" data-path="${p.id}" onclick="filterPathway('${p.id}',this)"
        style="--pc:${p.color}">${p.icon} ${p.name}</button>`).join('');

    function filterPathway(id, btn) {
      document.querySelectorAll('.pathway-chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (id !== 'all') btn.style.background = btn.style.borderColor = BFC.PATHWAYS.find(p=>p.id===id)?.color || 'var(--orange)';
      else btn.style.background = btn.style.borderColor = '';
      activePathFilter = id === 'all' ? null : BFC.PATHWAYS.find(p => p.id === id);
      drawEdges(activePathFilter);
      drawNodes(activePathFilter);
    }

    // ── Node detail panel ─────────────────────────────────────────────
    function openPanel(conceptId) {
      const concept = BFC.conceptById(conceptId);
      if (!concept) return;
      const status = getStatus(conceptId);
      const score  = getMasteryScore(conceptId);
      const cm     = mastery?.concepts[conceptId];
      const prereqConcepts = concept.prerequisites.map(id => ({ id, concept: BFC.conceptById(id), status: getStatus(id) }));
      const diffStars = '★'.repeat(concept.difficulty) + '☆'.repeat(5 - concept.difficulty);
      const modeLabels = { text:'📖 Reading', 'binary-cards':'🃏 Cards', blockly:'🧱 Blockly', pseudocode:'📝 Pseudocode', ide:'💻 IDE', flowchart:'📊 Flowchart', 'algo-viz':'⚡ Animation' };

      document.getElementById('panel-inner').innerHTML = `
        <div class="panel-icon">${concept.icon}</div>
        <div class="panel-title">${concept.name}</div>
        <div style="margin-bottom:12px"><span class="status-badge status-${status}">${status}</span></div>
        <div class="panel-desc">${concept.description || 'Learn this concept through interactive exercises and examples.'}</div>

        <div class="mastery-row">
          <div class="mastery-bar-bg"><div class="mastery-bar-fill" style="width:${score}%;background:${STATUS_STROKE[status]}"></div></div>
          <span style="font-size:12px;font-weight:700;color:${STATUS_STROKE[status]};width:36px;text-align:right">${score}%</span>
        </div>

        <div class="panel-meta">
          <div class="meta-item"><div class="meta-label">Difficulty</div><div class="meta-value" style="color:#f97316;letter-spacing:1px;font-size:12px">${diffStars}</div></div>
          <div class="meta-item"><div class="meta-label">Time</div><div class="meta-value">${concept.estimatedMinutes} min</div></div>
          <div class="meta-item"><div class="meta-label">Grade</div><div class="meta-value">Grade ${concept.gradeMin}+</div></div>
          <div class="meta-item"><div class="meta-label">Attempts</div><div class="meta-value">${cm?.attempts || 0}</div></div>
        </div>

        <div style="margin-bottom:12px">
          <div class="prereq-title">Learning modes</div>
          ${concept.learningModes.map(m => `<span class="prereq-chip">${modeLabels[m]||m}</span>`).join('')}
        </div>

        ${prereqConcepts.length ? `<div class="prereq-list">
          <div class="prereq-title">Prerequisites</div>
          ${prereqConcepts.map(p => `<span class="prereq-chip" style="border-color:${STATUS_STROKE[p.status]||'var(--border)'}">
            ${p.concept?.icon||'?'} ${p.concept?.name||p.id} <span style="color:${STATUS_STROKE[p.status]};font-size:10px">●</span></span>`).join('')}
        </div>` : ''}

        ${cm?.weaknesses?.length ? `<div class="weakness-list">⚠️ Weak areas: ${cm.weaknesses.join(', ')}</div>` : ''}
      `;

      const ctaEl = document.getElementById('panel-cta');
      if (status === 'locked') {
        ctaEl.innerHTML = `<div class="panel-cta-locked">🔒 Complete prerequisites first</div>`;
      } else {
        ctaEl.innerHTML = `<a href="${concept.lessonUrl}?conceptId=${concept.id}">${status === 'mastered' ? '🔄 Review' : '▶ Practice Now'} — ${concept.name}</a>`;
      }

      document.getElementById('node-panel').classList.add('open');
      document.getElementById('hint').style.opacity = '0';
    }

    function closePanel() {
      document.getElementById('node-panel').classList.remove('open');
      document.getElementById('hint').style.opacity = '1';
    }

    // Close panel on background click
    svg.addEventListener('click', closePanel);

    // ── Init ──────────────────────────────────────────────────────────
    resetView();
    drawEdges(null);
    drawNodes(null);

    // Fade out hint after 5s
    setTimeout(() => { document.getElementById('hint').style.transition = 'opacity 1s'; document.getElementById('hint').style.opacity = '0'; }, 5000);
  </script>
</body>
</html>
