<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Join a Class — ByteForge</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; background:var(--bg); }
    .join-card { background:var(--bg-card); border:1px solid var(--border-hi); border-radius:24px; padding:48px 40px; max-width:440px; width:100%; text-align:center; }
    .logo { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:36px; }
    .logo-icon { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,#f97316,#a855f7); display:flex; align-items:center; justify-content:center; font-size:20px; }
    .logo-text { font-size:22px; font-weight:800; letter-spacing:-.03em; }
    .logo-text span { color:var(--orange); }
    .class-preview { background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:24px; margin-bottom:28px; text-align:left; }
    .class-preview-loading { text-align:center; color:var(--fg-dim); font-size:14px; padding:12px 0; }
    .preview-tag { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; margin-bottom:10px; }
    .preview-name { font-size:18px; font-weight:800; margin-bottom:6px; }
    .preview-desc { font-size:13px; color:var(--fg-dim); line-height:1.5; }
    .preview-meta { display:flex; gap:14px; margin-top:14px; font-size:12px; color:var(--fg-dim); flex-wrap:wrap; }
    .code-display { font-family:var(--mono); font-size:28px; font-weight:800; letter-spacing:.25em; color:var(--orange); background:rgba(249,115,22,.07); border:1px solid rgba(249,115,22,.15); border-radius:12px; padding:14px 20px; margin-bottom:20px; }
    .page-title { font-size:24px; font-weight:800; margin-bottom:8px; }
    .page-sub   { font-size:14px; color:var(--fg-dim); margin-bottom:28px; line-height:1.5; }
    .btn { width:100%; padding:14px; border-radius:12px; font-size:15px; font-weight:800; cursor:pointer; border:none; transition:.2s; margin-bottom:12px; }
    .btn-orange { background:var(--orange); color:#fff; }
    .btn-orange:hover { background:#ea580c; }
    .btn-ghost  { background:var(--bg-raised); color:var(--fg); border:1px solid var(--border-hi); }
    .btn-ghost:hover { background:rgba(255,255,255,.08); }
    .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--fg-faint); font-size:12px; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .form-input { width:100%; padding:12px 14px; border-radius:10px; background:var(--bg); border:1px solid var(--border); color:var(--fg); font-size:14px; font-family:inherit; outline:none; transition:.2s; box-sizing:border-box; margin-bottom:12px; }
    .form-input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(249,115,22,.12); }
    .code-input { font-family:var(--mono); font-size:18px; font-weight:700; text-align:center; letter-spacing:.15em; text-transform:uppercase; }
    .error-state { color:#f87171; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); border-radius:10px; padding:12px 16px; font-size:13px; margin-bottom:16px; display:none; }
    .success-state { text-align:center; display:none; }
    .success-icon { font-size:56px; margin-bottom:16px; }
    .toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600; transform:translateY(60px); opacity:0; transition:.3s; z-index:9999; }
    .toast-success { background:#166534; color:#bbf7d0; border:1px solid #16a34a; }
    .toast-error   { background:#7f1d1d; color:#fecaca; border:1px solid #dc2626; }
    .toast-show    { transform:translateY(0); opacity:1; }
  </style>
</head>
<body>
  <div class="join-card">
    <div class="logo">
      <div class="logo-icon">⚒</div>
      <div class="logo-text">Byte<span>Forge</span></div>
    </div>

    <!-- State: class preview from URL code -->
    <div id="state-preview">
      <div class="page-title">You've been invited! 🎉</div>
      <div class="page-sub">Your teacher shared this class with you.</div>

      <div class="class-preview" id="class-preview">
        <div class="class-preview-loading">Loading class info…</div>
      </div>

      <div class="code-display" id="code-display">—</div>

      <button class="btn btn-orange" onclick="handleJoin()">Join This Class</button>
      <button class="btn btn-ghost" onclick="showManualState()">Enter a different code</button>
    </div>

    <!-- State: manual code entry -->
    <div id="state-manual" style="display:none">
      <div class="page-title">Join a Class</div>
      <div class="page-sub">Enter the join code your teacher gave you.</div>
      <div id="error-box" class="error-state"></div>
      <input id="manual-code" class="form-input code-input" placeholder="XXXXXX" maxlength="6" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')handleJoin()"/>
      <button class="btn btn-orange" onclick="handleJoin()">Join Class</button>
      <div class="divider">or</div>
      <button class="btn btn-ghost" onclick="location.href='login.html'">Back to login</button>
    </div>

    <!-- State: success -->
    <div id="state-success" class="success-state">
      <div class="success-icon">🎉</div>
      <div style="font-size:22px;font-weight:800;margin-bottom:8px">You're in!</div>
      <div style="font-size:14px;color:var(--fg-dim);margin-bottom:28px">Redirecting to your dashboard…</div>
      <button class="btn btn-orange" onclick="location.href='dashboard-student.html'">Go to Dashboard</button>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    BF.seed();

    const CURR_INFO = {
      igcse:     { label:'IGCSE Computer Science',   icon:'🎓', tagStyle:'background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.2)' },
      'as-level':{ label:'AS Level Computer Science', icon:'⚙️', tagStyle:'background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.2)' },
      'a-level': { label:'A Level Computer Science',  icon:'🚀', tagStyle:'background:rgba(168,85,247,.12);color:#c084fc;border:1px solid rgba(168,85,247,.2)' },
      general:   { label:'Computer Science / ICT',    icon:'📚', tagStyle:'background:rgba(249,115,22,.12);color:#f97316;border:1px solid rgba(249,115,22,.2)' },
    };

    let codeFromURL = '';
    let foundClass  = null;

    function init() {
      const params = new URLSearchParams(location.search);
      codeFromURL  = (params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g,'').trim();

      if (codeFromURL) {
        document.getElementById('code-display').textContent = codeFromURL;
        foundClass = BF.classes().find(c => (c.joinCode||'').toUpperCase() === codeFromURL);
        if (foundClass) {
          renderClassPreview(foundClass);
        } else {
          document.getElementById('class-preview').innerHTML = `
            <div style="color:#f87171;font-size:13px">⚠️ Class not found for code <strong>${codeFromURL}</strong>. Ask your teacher to check the code.</div>`;
        }
      } else {
        showManualState();
      }
    }

    function renderClassPreview(cls) {
      const info     = CURR_INFO[cls.curriculum] || CURR_INFO.general;
      const teacher  = BF.userById(cls.teacherId);
      const students = (cls.students||[]).length;
      const units    = (cls.units||[]).length;
      document.getElementById('class-preview').innerHTML = `
        <div class="preview-tag" style="${info.tagStyle}">${info.icon} ${info.label}</div>
        <div class="preview-name">${cls.name}</div>
        <div class="preview-desc">${cls.description || ''}</div>
        <div class="preview-meta">
          <span>👤 ${teacher?.name || 'Teacher'}</span>
          <span>📅 ${cls.grade || ''}</span>
          <span>👥 ${students} student${students!==1?'s':''}</span>
          <span>📦 ${units} unit${units!==1?'s':''}</span>
        </div>`;
    }

    function showManualState() {
      document.getElementById('state-preview').style.display = 'none';
      document.getElementById('state-manual').style.display  = '';
      document.getElementById('manual-code').focus();
    }

    function handleJoin() {
      const session = BF.session();
      const code    = codeFromURL || document.getElementById('manual-code')?.value.trim();

      if (!code) { showError('Please enter a join code.'); return; }

      if (!session) {
        // Not logged in → redirect to login with code param
        location.href = `login.html?join=${code}`;
        return;
      }

      if (session.role !== 'student') {
        showError('Only students can join classes. Teachers create classes from the dashboard.');
        return;
      }

      try {
        const cls = BF.joinClass(session.id, code);
        showSuccess(cls.name);
      } catch(e) {
        showError(e.message);
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-box');
      if (el) { el.textContent = '⚠️ ' + msg; el.style.display = ''; }
      else toast(msg, 'error');
    }

    function showSuccess(name) {
      ['state-preview','state-manual'].forEach(id => { document.getElementById(id).style.display='none'; });
      document.getElementById('state-success').style.display = '';
      toast(`Joined "${name}"! Welcome! 🎉`);
      setTimeout(() => { location.href = 'dashboard-student.html'; }, 2500);
    }

    init();
  </script>
</body>
</html>
