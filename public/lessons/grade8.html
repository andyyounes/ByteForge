<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ByteForge — Grade 8 Python</title>
  <link rel="stylesheet" href="../styles.css"/>
  <!-- CodeMirror 5 — Python mode -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.js"></script>
  <!-- Pyodide — Python in WASM -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { padding-top:64px; background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; }

    .layout {
      display:grid;
      grid-template-columns: 1fr 480px;
      height:calc(100vh - 64px);
      overflow:hidden;
    }

    /* ── Left: Python editor ── */
    .editor-panel { display:flex; flex-direction:column; border-right:1px solid var(--border); overflow:hidden; }

    .ed-header { flex-shrink:0; padding:10px 16px; background:var(--bg-card); border-bottom:1px solid var(--border);
                 display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .ed-title  { display:flex; align-items:center; gap:8px; }
    .grade-badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px;
                   background:rgba(59,130,246,.15); color:#60a5fa; border:1px solid rgba(59,130,246,.3); }
    .lang-badge  { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px;
                   background:rgba(234,179,8,.12); color:#fbbf24; border:1px solid rgba(234,179,8,.25); }
    .btn { padding:6px 13px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;
           transition:.15s; border:none; }
    .btn-brand  { background:#b8ef4a; color:#0d0f1a; }
    .btn-brand:hover { background:#a5d83d; }
    .btn-ghost  { background:var(--bg-raised); color:var(--fg); border:1px solid var(--border-hi); }
    .btn-ghost:hover { background:rgba(255,255,255,.08); }
    .btn-danger { background:rgba(239,68,68,.1); color:#f87171; border:1px solid rgba(239,68,68,.25); }
    .btn-danger:hover { background:rgba(239,68,68,.18); }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .btn-row { display:flex; gap:6px; }

    .cm-outer { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .cm-outer .CodeMirror {
      height:100% !important;
      font-size:13px !important;
      font-family:var(--mono) !important;
      background:#060912 !important;
      line-height:1.65 !important;
    }
    .cm-outer .CodeMirror-scroll { background:#060912 !important; }
    .cm-outer .CodeMirror-gutters { background:#090d1c !important; border-right:1px solid var(--border) !important; }

    /* loading overlay */
    .py-loading { position:absolute; inset:0; background:rgba(6,9,18,.85); z-index:20;
                  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
    .spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:#b8ef4a;
               border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .py-loading-text { font-size:13px; color:var(--fg-dim); }

    /* ── Right panel ── */
    .right-panel { display:flex; flex-direction:column; overflow:hidden; }

    .ch-header { flex-shrink:0; background:var(--bg-card); border-bottom:1px solid var(--border); padding:10px 14px; }
    .ch-pills  { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; max-height:220px; overflow-y:auto; }
    .ch-nav-strip { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .ch-nav-btn { padding:4px 12px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
                  background:var(--bg-raised); border:1px solid var(--border-hi); color:var(--fg-dim); }
    .ch-nav-btn:hover { color:var(--fg); border-color:#60a5fa; }
    .ch-nav-current { flex:1; font-size:12.5px; font-weight:700; color:var(--fg-dim); }
    .ch-nav-current b { color:#60a5fa; }
    .ch-nav-toggle { padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;
                     background:none; border:1px solid var(--border); color:var(--fg-faint); }
    .ch-nav-toggle:hover { color:var(--fg); border-color:var(--border-hi); }
    .ch-nav-toggle.open { color:#60a5fa; border-color:#60a5fa; }
    .ch-lesson { flex-shrink:0; background:#12141f; border:1px solid rgba(129,140,248,.18); border-radius:8px; margin-bottom:8px; overflow:hidden; }
    .cl-toggle { padding:8px 12px; font-size:12px; font-weight:800; color:#a5b4fc; cursor:pointer;
                 display:flex; align-items:center; gap:6px; user-select:none; }
    .cl-toggle:hover { color:#c7d2fe; }
    #cl-arrow { margin-left:auto; font-size:10px; color:#6b7280; }
    .cl-body { padding:0 12px 12px; font-size:12px; color:#c7d2e0; line-height:1.7; }
    .cl-body.collapsed { display:none; }
    .cl-block { background:#0d0f1a; border:1px solid rgba(255,255,255,.07); border-radius:8px; padding:10px 13px; margin-bottom:8px; }
    .cl-block:last-child { margin-bottom:0; }
    .cl-block h4 { font-size:10.5px; font-weight:800; color:#fbbf24; margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em; }
    .cl-block code { background:rgba(184,239,74,.1); color:#b8ef4a; padding:1px 5px; border-radius:3px; font-size:11.5px; }
    .ch-pill   { padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;
                 border:1px solid var(--border); color:var(--fg-dim); cursor:pointer; transition:.15s; }
    .ch-pill:hover  { border-color:var(--border-hi); color:var(--fg); }
    .ch-pill.active { background:rgba(59,130,246,.12); border-color:#60a5fa; color:#60a5fa; }
    .ch-pill.done   { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.35); color:#4ade80; }
    .ch-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .ch-text { font-size:11.5px; color:var(--fg-dim); line-height:1.55; flex:1; }
    .ch-text strong { color:var(--fg); }
    .ch-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
    .xp-pill { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px;
               background:rgba(234,179,8,.12); color:#fbbf24; border:1px solid rgba(234,179,8,.25); }
    .hint-btn { font-size:11px; color:#fbbf24; cursor:pointer; }

    .canvas-wrap { flex-shrink:0; background:#030510; border-bottom:1px solid var(--border); position:relative; }
    #out-canvas  { display:block; }
    .pass-badge  { position:absolute; top:8px; left:50%; transform:translateX(-50%);
                   padding:5px 13px; border-radius:8px; font-size:12px; font-weight:700;
                   background:rgba(34,197,94,.2); border:1px solid rgba(34,197,94,.5); color:#4ade80; display:none; }

    .console-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .console-hdr { flex-shrink:0; padding:7px 14px; background:var(--bg); border-bottom:1px solid var(--border);
                   display:flex; justify-content:space-between; align-items:center; }
    .console-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-faint); }
    pre#console  { flex:1; overflow-y:auto; margin:0; padding:10px 14px; font-family:var(--mono); font-size:11.5px;
                   line-height:1.65; background:#050710; color:#9ca3af; white-space:pre-wrap; }
    pre#console .ok   { color:#4ade80; }
    pre#console .err  { color:#f87171; }
    pre#console .info { color:#b8ef4a; }
    pre#console .out  { color:#e2e8f0; }

    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(60px);
             padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600;
             background:#1a2e1a; color:#bbf7d0; border:1px solid #16a34a;
             opacity:0; transition:.3s; z-index:9999; pointer-events:none; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    @media(max-width:900px) {
      .layout { grid-template-columns:1fr; grid-template-rows:50vh 1fr; }
    }
  </style>

<script>
'use strict'

// ── Canvas drawing state ──────────────────────────────────────────────────────
const canvas = document.getElementById('out-canvas')
const ctx    = canvas.getContext('2d')
const W = canvas.width, H = canvas.height

let _fill   = '#b8ef4a'
let _stroke = 'none'
let _lw     = 2
let _fontSz = 16
let _font   = '16px Plus Jakarta Sans, sans-serif'

// Validation counters (reset each run)
let drawLog = { rects:0, circles:0, lines:0, texts:0, calls:0 }

function applyFill()   { ctx.fillStyle = _fill }
function applyStroke() { if (_stroke !== 'none') { ctx.strokeStyle = _stroke; ctx.lineWidth = _lw } }

// Expose JS drawing API as window._bf_* so Python (js module) can call them
window._bf_set_fill   = c => { _fill = c }
window._bf_set_stroke = c => { _stroke = c }
window._bf_set_lw     = n => { _lw = n }
window._bf_set_font   = n => { _fontSz = n; _font = `${n}px Plus Jakarta Sans, sans-serif` }
window._bf_clear      = ()        => { ctx.clearRect(0,0,W,H); drawLog.calls++ }
window._bf_background = c         => { ctx.fillStyle = c; ctx.fillRect(0,0,W,H); drawLog.calls++ }
window._bf_rect       = (x,y,w,h) => {
  applyFill(); ctx.fillRect(x,y,w,h)
  if (_stroke !== 'none') { applyStroke(); ctx.strokeRect(x,y,w,h) }
  drawLog.rects++; drawLog.calls++
}
window._bf_circle     = (x,y,r)   => {
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2)
  applyFill(); ctx.fill()
  if (_stroke !== 'none') { applyStroke(); ctx.stroke() }
  drawLog.circles++; drawLog.calls++
}
window._bf_line       = (x1,y1,x2,y2) => {
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2)
  ctx.strokeStyle = _stroke !== 'none' ? _stroke : _fill
  ctx.lineWidth = _lw; ctx.stroke()
  drawLog.lines++; drawLog.calls++
}
window._bf_text       = (s,x,y)   => {
  ctx.font = _font; ctx.fillStyle = _fill; ctx.fillText(String(s),x,y)
  drawLog.texts++; drawLog.calls++
}

// ── Byteforge Python module source (installed into sys.modules) ───────────────
const BYTEFORGE_PY = `
from js import (
    _bf_set_fill, _bf_set_stroke, _bf_set_lw, _bf_set_font,
    _bf_clear, _bf_background, _bf_rect, _bf_circle, _bf_line, _bf_text
)

WIDTH  = 480
HEIGHT = 260

def fill(r, g=None, b=None):
    """Set the fill colour. Use fill(r,g,b) or fill('#hex')."""
    if g is None:
        _bf_set_fill(str(r))
    else:
        _bf_set_fill(f'rgb({int(r)},{int(g)},{int(b)})')

def stroke(r, g=None, b=None):
    """Set the outline colour. Use stroke(r,g,b) or stroke('#hex')."""
    if g is None:
        _bf_set_stroke(str(r))
    else:
        _bf_set_stroke(f'rgb({int(r)},{int(g)},{int(b)})')

def no_stroke():
    """Remove the outline."""
    _bf_set_stroke('none')

def stroke_width(n):
    """Set outline thickness in pixels."""
    _bf_set_lw(float(n))

def font_size(n):
    """Set the text size in pixels."""
    _bf_set_font(float(n))

def rect(x, y, w, h):
    """Draw a filled rectangle."""
    _bf_rect(float(x), float(y), float(w), float(h))

def circle(x, y, r):
    """Draw a filled circle at (x, y) with radius r."""
    _bf_circle(float(x), float(y), float(r))

def line(x1, y1, x2, y2):
    """Draw a line from (x1,y1) to (x2,y2)."""
    _bf_line(float(x1), float(y1), float(x2), float(y2))

def text(s, x, y):
    """Draw text string s at position (x, y)."""
    _bf_text(str(s), float(x), float(y))

def clear():
    """Clear the canvas."""
    _bf_clear()

def background(r, g=None, b=None):
    """Fill the canvas with a background colour."""
    if g is None:
        _bf_background(str(r))
    else:
        _bf_background(f'rgb({int(r)},{int(g)},{int(b)})')

__all__ = [
    'WIDTH', 'HEIGHT',
    'fill', 'stroke', 'no_stroke', 'stroke_width', 'font_size',
    'rect', 'circle', 'line', 'text', 'clear', 'background',
]
`

// ── Pyodide init ──────────────────────────────────────────────────────────────
let pyodide = null
let pyReady = false

async function initPyodide() {
  try {
    clog('Loading Python 3 engine (Pyodide)…', 'info')
    pyodide = await globalThis.loadPyodide()

    // Install byteforge module into sys.modules
    pyodide.runPython(`
import types as _types, sys as _sys
_bf_mod = _types.ModuleType('byteforge')
exec(${JSON.stringify(BYTEFORGE_PY)}, _bf_mod.__dict__)
_sys.modules['byteforge'] = _bf_mod
del _types, _sys, _bf_mod
`)

    pyReady = true
    document.getElementById('py-loading').style.display = 'none'
    const btn = document.getElementById('run-btn')
    btn.textContent = '▶ Run'; btn.disabled = false
    clog('Python 3 ready! Press ▶ Run to execute your code.', 'ok')
  } catch(e) {
    clog('Failed to load Python: ' + e.message, 'err')
    document.getElementById('py-loading').style.display = 'none'
  }
}

// ── CodeMirror ────────────────────────────────────────────────────────────────
const editor = CodeMirror.fromTextArea(document.getElementById('py-editor'), {
  mode:         'python',
  theme:        'dracula',
  lineNumbers:   true,
  indentUnit:    4,
  tabSize:       4,
  indentWithTabs:false,
  lineWrapping:  false,
  autofocus:     true,
  extraKeys: {
    Tab: cm => {
      if (cm.somethingSelected()) { cm.indentSelection('add') }
      else { cm.replaceSelection('    ') }
    },
    'Shift-Tab': cm => cm.indentSelection('subtract'),
  },
})

// ── Web editor (HTML/CSS/JS) — Web Story stages (lang:'web') ──────────────────
const webEditors = {
  html: CodeMirror.fromTextArea(document.getElementById('web-editor-html'), { mode:'htmlmixed', theme:'dracula', lineNumbers:true, indentUnit:2, tabSize:2, lineWrapping:false }),
  css:  CodeMirror.fromTextArea(document.getElementById('web-editor-css'),  { mode:'css',       theme:'dracula', lineNumbers:true, indentUnit:2, tabSize:2, lineWrapping:false }),
  js:   CodeMirror.fromTextArea(document.getElementById('web-editor-js'),   { mode:'javascript', theme:'dracula', lineNumbers:true, indentUnit:2, tabSize:2, lineWrapping:false }),
}
let webTab = 'html'
function switchWebTab(tab) {
  webTab = tab
  ;['html','css','js'].forEach(t => {
    document.getElementById('web-editor-' + t).nextSibling // no-op, CodeMirror wraps the textarea
  })
  document.getElementById('web-tab-html').style.cssText = 'padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;color:var(--fg-faint);'
  document.getElementById('web-tab-css').style.cssText  = 'padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;color:var(--fg-faint);'
  document.getElementById('web-tab-js').style.cssText   = 'padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;color:var(--fg-faint);'
  document.getElementById('web-tab-' + tab).style.cssText = 'padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;border-bottom:2px solid #fbbf24;color:#fbbf24;'
  Object.entries(webEditors).forEach(([t, ed]) => { ed.getWrapperElement().style.display = (t === tab) ? '' : 'none' })
  webEditors[tab].refresh()
}
function resetWebToStarter() {

  webEditors.html.setValue(ch.webStarter.html || '')
  webEditors.css.setValue(ch.webStarter.css || '')
  webEditors.js.setValue(ch.webStarter.js || '')

async function runWebCode() {
  const html = webEditors.html.getValue()
  const css  = webEditors.css.getValue()
  const js   = webEditors.js.getValue()
  const iframe = document.getElementById('out-web')
  document.getElementById('pass-badge').style.display = 'none'

  // Built with '<' + 'script>' pieces rather than a literal opening tag —
  // this whole function lives inside the page's OWN script block, and the
  // literal closing-tag sequence in a JS string (or even a comment) here
  // would close THAT tag early, the instant the browser's HTML parser (not
  // just the JS engine) sees the raw character sequence.
  const openTag  = '<' + 'script>'
  const closeTag = '<' + '/script>'
  const srcdoc = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}`
    + `${openTag}window.onerror = function(msg){ parent.postMessage({__bfWebError: String(msg)}, '*'); };\n`
    + `try {\n${js}\n} catch(e) { parent.postMessage({__bfWebError: String(e.message)}, '*'); }\n${closeTag}</body></html>`

  await new Promise(resolve => {
    const onLoad = () => { iframe.removeEventListener('load', onLoad); resolve() }
    iframe.addEventListener('load', onLoad)
    iframe.srcdoc = srcdoc
  })
  // Give any script (esp. one relying on DOMContentLoaded timing) a beat to settle.
  await new Promise(r => setTimeout(r, 50))

  let webError = null
  const errHandler = (e) => { if (e.data && e.data.__bfWebError) webError = e.data.__bfWebError }
  window.addEventListener('message', errHandler)
  await new Promise(r => setTimeout(r, 30))
  window.removeEventListener('message', errHandler)

  if (webError) { clog('Error: ' + webError, 'err'); return }

  let doc, win
  try { doc = iframe.contentDocument; win = iframe.contentWindow } catch (e) { clog('Could not read the page: ' + e.message, 'err'); return }

  const webLog = {
    html, css, js,
    bodyText: doc.body ? doc.body.textContent : '',
    h1s: doc.querySelectorAll('h1,h2,h3').length,
    paragraphs: doc.querySelectorAll('p').length,
    buttons: doc.querySelectorAll('button').length,
    listItems: doc.querySelectorAll('li').length,
    // JS state — Week 1 (objects/arrays for story state). Read straight off
    // the iframe's global scope, since `let`/`const` at top level of a
    // classic (non-module) <script> attach to that window's globals.
    globals: win,
    hasArray:  /\b(?:let|const|var)\s+\w+\s*=\s*\[/.test(js),
    hasObject: /\b(?:let|const|var)\s+\w+\s*=\s*\{/.test(js),
    hasPush:   /\.push\s*\(/.test(js),
    // Week 2 — functions organizing story logic. functionCount requires TWO
    // distinct functions for stages that need "functions working together",
    // not just one — a genuinely different bar than "any function at all".
    hasFunction:  /\bfunction\s+\w+\s*\(/.test(js),
    functionCount: (js.match(/\bfunction\s+\w+\s*\(/g) || []).length,
    hasReturn:    /\breturn\b/.test(js),
  }
  clog('Ran — checking your page…', 'info')
  checkWebChallenge(webLog)
}

// Lines injected before user code (for line-number adjustment in errors)
const PREAMBLE_LINES = 6

const PREAMBLE = `
import sys as _sys, io as _io
_stdout_buf = _io.StringIO()
_sys.stdout = _stdout_buf
_sys.stderr = _stdout_buf
from byteforge import *
`.trim()

async function runPython() {
  if (!pyReady) { clog('Python is still loading — please wait.', 'info'); return }

  const code = editor.getValue()
  if (!code.trim()) { clog('Nothing to run — write some Python first!', 'info'); return }

  // Reset canvas & draw counters
  ctx.clearRect(0,0,W,H)
  drawLog = { rects:0, circles:0, lines:0, texts:0, calls:0 }
  _fill='#b8ef4a'; _stroke='none'; _lw=2; _fontSz=16; _font='16px Plus Jakarta Sans, sans-serif'
  document.getElementById('pass-badge').style.display = 'none'

  // Write any files this challenge declares into Pyodide's virtual filesystem
  // so open("students.csv") etc. is a real file read, not a simulation.
  const activeFiles = CHALLENGES[activeIdx]?.files
  if (activeFiles) {
    for (const [name, content] of Object.entries(activeFiles)) {
      pyodide.FS.writeFile(name, content)
    }
  }

  const fullCode = PREAMBLE + '\n' + code + '\n_stdout_buf.getvalue()'

  clog('— Running —', 'info')
  const t0 = Date.now()

  try {
    const result = await pyodide.runPythonAsync(fullCode)
    const elapsed = Date.now() - t0

    // Print captured stdout
    const printed = String(result || '').trim()
    if (printed) {
      printed.split('\n').forEach(line => clog(line, 'out'))
    }

    clog(`Finished in ${elapsed}ms.`, 'ok')
    validateChallenge(code)

  } catch(rawErr) {
    const { msg, line } = parsePyError(rawErr.message, code)
    clog(msg, 'err')
    if (line > 0) highlightError(line)
  }
}

function parsePyError(raw, userCode) {
  // Adjust line numbers — remove preamble offset
  const preambleLen = PREAMBLE.split('\n').length + 1
  let msg = raw

  // Extract line number from traceback
  const lineMatch = raw.match(/line (\d+)/g)
  let line = 0
  if (lineMatch) {
    const lastLine = lineMatch[lineMatch.length - 1]
    const n = parseInt(lastLine.replace('line ',''))
    line = Math.max(0, n - preambleLen)
    msg = raw.replace(lastLine, `line ${line}`)
  }

  // Friendly rewrites
  const friendly = {
    'NameError': (m) => {
      const name = m.match(/name '(\w+)' is not defined/)?.[1]
      return name ? `NameError: "${name}" is not defined. Did you spell it correctly? Remember Python is case-sensitive.` : m
    },
    'IndentationError': (m) => `IndentationError: Check your indentation! Python uses 4 spaces to indent code inside if/for/def blocks.`,
    'SyntaxError': (m) => `SyntaxError: Something's wrong with the structure of your code. Check for missing colons (:) after if/for/def, or mismatched brackets.`,
    'TypeError': (m) => {
      if (m.includes("argument")) return `TypeError: Wrong number or type of arguments. Check what your function expects.`
      return `TypeError: ${m.split('\n').pop()}`
    },
    'ZeroDivisionError': () => `ZeroDivisionError: You divided by zero! Make sure your divisor is not 0.`,
    'IndexError': (m) => `IndexError: You tried to access a list item that doesn't exist. Lists start at index 0.`,
    'ValueError': (m) => `ValueError: ${m.split('\n').pop()}`,
    'FileNotFoundError': (m) => {
      const name = m.match(/'([^']+)'/)?.[1]
      return `FileNotFoundError: ${name ? `"${name}" doesn't exist.` : 'That file doesn\'t exist.'} Double-check the filename matches exactly, including the .csv or .txt ending.`
    },
  }

  for (const [errType, fn] of Object.entries(friendly)) {
    if (msg.includes(errType)) {
      const lastLine = msg.split('\n').filter(Boolean).pop() || msg
      return { msg: (line>0?`Line ${line}: `:'') + fn(lastLine), line }
    }
  }

  // Fallback: last meaningful line
  const lines = msg.split('\n').filter(l => l.trim() && !l.includes('File') && !l.includes('Traceback'))
  return { msg: (line>0?`Line ${line}: `:'') + (lines.pop() || msg), line }
}

function highlightError(line) {
  editor.addLineClass(line - 1, 'background', 'cm-error-line')
  setTimeout(() => editor.removeLineClass(line - 1, 'background', 'cm-error-line'), 4000)
}

    <div class="cl-block"><h4>int() converts it into a real number</h4>
      <p><code>int(age_text)</code> converts that text into an actual number you can calculate with — this exact "get text, convert it" pattern is needed literally any time a program asks a user for a number.</p></div>` },
  m1s5: { title: 'A real formula, not just a print statement', html: `
    <div class="cl-block"><h4>Order of operations works like maths class</h4>
      <p><code>celsius * 9 / 5 + 32</code> — Python does × and ÷ before +, exactly like normal maths rules. This is a genuine, widely-used real-world formula, not a made-up exercise.</p></div>
    <div class="cl-block"><h4>Reusing one formula for many inputs</h4>
      <p>Converting three different Celsius values with the SAME formula (just different starting numbers) is exactly why formulas — not one-off calculations — are worth writing as reusable code.</p></div>` },

  // ── M2 — Choices & Loops ─────────────────────────────────────────────────────
  m2s1: { title: 'if/else — real syntax for a decision', html: `
    <div class="cl-block"><h4>% is the remainder operator</h4>
      <p><code>number % 2</code> gives what's LEFT OVER after dividing by 2 — 0 for even numbers, 1 for odd ones. This is the exact same MOD idea from Grade 7's conditions, just written as <code>%</code> instead of a "remainder" block.</p></div>
    <div class="cl-block"><h4>Getting the label right, not just the branch</h4>
      <p>It's easy to write working code that prints the WRONG label (e.g. calling odd numbers "even") — matching your if-branch's outcome to what it actually represents is a real, common source of bugs worth double-checking.</p></div>` },
  m2s2: { title: 'for loops with range(), and elif chains', html: `
    <div class="cl-block"><h4>range(1, 11) counts 1 through 10</h4>
      <p><code>for i in range(1, 11):</code> loops <code>i</code> through 1, 2, 3… 10 — the second number is EXCLUSIVE (not included), which is why you need 11 to reach 10. This trips up almost everyone the first time.</p></div>
    <div class="cl-block"><h4>elif — checking several conditions in order</h4>
      <p><code>if / elif / else</code> checks conditions top-to-bottom, running only the FIRST one that matches — exactly like Grade 7's chained IF/ELSE IF, just real Python syntax.</p></div>` },
  m2s3: { title: 'while loops — repeat until a condition is false', html: `
    <div class="cl-block"><h4>for vs. while — known count vs. unknown count</h4>
      <p><code>for</code> loops are perfect when you know exactly how many times to repeat. <code>while size > 0:</code> instead keeps going for as long as a CONDITION stays true — you don't need to know the exact count in advance, just when to stop.</p></div>
    <div class="cl-block"><h4>The loop MUST change the condition eventually</h4>
      <p>Shrinking <code>size</code> by 20 each pass is what eventually makes <code>size > 0</code> false — forget that line and the loop runs forever (an "infinite loop"), a genuine, common real bug.</p></div>` },
  m2s4: { title: 'Chained if/elif — order decides correctness', html: `
    <div class="cl-block"><h4>Check from the strictest condition down</h4>
      <p>Checking <code>&gt;= 70</code> BEFORE <code>&gt;= 90</code> would wrongly grade a 95 as a "B", since 95 also satisfies &gt;=70 and elif stops at the first match. Order in a chain of conditions genuinely changes the result.</p></div>
    <div class="cl-block"><h4>else catches everything left over</h4>
      <p>The final <code>else</code> handles anything that didn't match ANY of the numbered conditions above it — a safety net so every possible score gets SOME grade, not just the ones you explicitly checked for.</p></div>` },
  m2s5: { title: 'Accumulating a running total', html: `
    <div class="cl-block"><h4>Two variables working together</h4>
      <p><code>total</code> tracks the running sum; <code>n</code> tracks which number you're currently adding — both change every single pass through the loop, and both matter to getting the right final answer.</p></div>
    <div class="cl-block"><h4>This "accumulator" pattern is everywhere</h4>
      <p>Start at a base value, then keep updating it inside a loop — this exact shape (accumulator + loop) is behind totals, counts, and averages throughout real programming, not just this one exercise.</p></div>` },

  // ── M3 — Functions ───────────────────────────────────────────────────────────
  m3s1: { title: 'Functions with parameters — real def syntax', html: `
    <div class="cl-block"><h4>def name(params): — the real syntax for "My Blocks"</h4>
      <p><code>def draw_smiley(x, y, r, ...):</code> defines a reusable function, exactly like Grade 7's custom blocks — just typed instead of dragged. Parameters (x, y, r, colors) let each CALL customise the result.</p></div>
    <div class="cl-block"><h4>Indentation IS the function's body</h4>
      <p>Unlike Blockly (where blocks visibly nest inside each other), Python uses INDENTATION to show what's inside the function — every indented line belongs to <code>draw_smiley</code>; the first non-indented line is outside it again.</p></div>` },
  m3s2: { title: 'A loop that calls a function repeatedly', html: `
    <div class="cl-block"><h4>Combining a function with a loop</h4>
      <p>Calling <code>colored_tile(...)</code> inside a <code>for</code> loop, with different x/y each time, builds a whole grid from ONE function definition — functions and loops combine constantly in real code.</p></div>
    <div class="cl-block"><h4>Parameters make the loop's repeats different</h4>
      <p>Without parameters, every call to the function would look identical — passing different x, y, and color values each time is what makes 6 calls produce 6 DIFFERENT tiles instead of the same one six times.</p></div>` },
  m3s3: { title: 'return — a function that hands back a value', html: `
    <div class="cl-block"><h4>Drawing vs. returning are different jobs</h4>
      <p>Earlier functions drew shapes directly — a side effect. <code>average(a, b, c)</code> instead computes a VALUE and hands it back with <code>return</code>, to be used however the caller wants (here, as a circle's radius).</p></div>
    <div class="cl-block"><h4>Store what's returned, then use it</h4>
      <p><code>r = average(20, 60, 100)</code> captures the returned value in a variable — <code>r</code> now holds a real number, completely independent of how it was calculated.</p></div>` },
  m3s4: { title: 'A function with a loop INSIDE it', html: `
    <div class="cl-block"><h4>Functions can contain anything a normal program can</h4>
      <p><code>is_prime(n)</code> has a real <code>for</code> loop inside its own definition — functions aren't limited to one-line calculations; they can contain loops, ifs, even calls to other functions.</p></div>
    <div class="cl-block"><h4>return exits IMMEDIATELY, even mid-loop</h4>
      <p>The moment a factor is found, <code>return False</code> exits the function right away — the loop doesn't keep checking remaining numbers once the answer is already known. This "stop as soon as you know" pattern makes code faster and clearer.</p></div>` },
  m3s5: { title: 'Returning MORE than one value', html: `
    <div class="cl-block"><h4>return a, b — two values, one return statement</h4>
      <p>Python lets a function return several values at once, separated by commas — <code>return smallest, largest</code> packages both numbers together automatically (technically into something called a tuple).</p></div>
    <div class="cl-block"><h4>Unpacking two variables from one call</h4>
      <p><code>low, high = min_and_max(scores)</code> unpacks both returned values into two separate variables in one line — genuinely convenient compared to calling two separate functions to get each value one at a time.</p></div>` },

  // ── M4 — Lists ───────────────────────────────────────────────────────────────
  m4s1: { title: 'A list is an ordered collection of values', html: `
    <div class="cl-block"><h4>[22, 35, 28, ...] — a list literal</h4>
      <p>A list holds many values under one name, in order — <code>temperatures</code> is one variable containing 7 numbers. <code>for temp in temperatures:</code> visits each one in turn, exactly like Grade 7's array ideas.</p></div>
    <div class="cl-block"><h4>Scaling a value to a pixel size</h4>
      <p><code>bar_height = temp * 5</code> converts a real-world number (degrees) into a visual size (pixels) — a genuine, common task any time you're charting real data.</p></div>` },
  m4s2: { title: 'Tuples — a fixed little group of values', html: `
    <div class="cl-block"><h4>(r, g, b) — three numbers, one item</h4>
      <p>A tuple groups a FIXED number of related values together — here, one color is really three numbers (red, green, blue) bundled as a single list item. A list of tuples is a list where every item is itself a small group.</p></div>
    <div class="cl-block"><h4>Unpacking — splitting a tuple back into named parts</h4>
      <p><code>r, g, b = color</code> splits one tuple into three separate variables in a single line — much cleaner than writing <code>color[0]</code>, <code>color[1]</code>, <code>color[2]</code> every time you need each part.</p></div>` },
  m4s3: { title: 'sorted() and slicing — built-in tools, not loops', html: `
    <div class="cl-block"><h4>Python already has sorting built in</h4>
      <p><code>sorted(player_scores)</code> returns a NEW list in order, lowest to highest — no loop required, Python does the sorting for you. This is real, efficient, professional-grade sorting, not a simplified version.</p></div>
    <div class="cl-block"><h4>[-5:] — slicing from the end</h4>
      <p>A negative index counts from the END of a list — <code>[-5:]</code> means "the last 5 items". Combined with <code>sorted()</code>, that's an easy way to get the top 5 highest scores.</p></div>` },
  m4s4: { title: 'Filtering — building a new, smaller list', html: `
    <div class="cl-block"><h4>Only keep what matches a condition</h4>
      <p><strong>Filtering</strong> means looping through a list and building a NEW list containing only the items that pass a test (here, being even) — the original list stays untouched.</p></div>
    <div class="cl-block"><h4>One of the most common real tasks</h4>
      <p>"Give me only the results that match X" is an everywhere-task in real software — search results, shopping filters, spam folders — and it's always this same "loop + condition + build a new list" pattern.</p></div>` },
  m4s5: { title: 'The "in" keyword — checking membership', html: `
    <div class="cl-block"><h4>x in some_list — True or False</h4>
      <p><code>if ticket in seen:</code> checks whether <code>ticket</code> already exists ANYWHERE inside the <code>seen</code> list — a clean, direct way to ask "have I already encountered this?"</p></div>
    <div class="cl-block"><h4>Building a "seen so far" list to detect repeats</h4>
      <p>Growing a second list as you go, and checking each new item against it, is exactly how real software finds duplicates — in a guest list, in ticket numbers, in usernames during sign-up.</p></div>` },

  // ── M5 — Strings & Validation ────────────────────────────────────────────────
  m5s1: { title: 'String methods and slicing', html: `
    <div class="cl-block"><h4>.strip() and .lower() — cleaning text</h4>
      <p>Real user input is messy — extra spaces, inconsistent capitalization. <code>.strip()</code> removes leading/trailing spaces; <code>.lower()</code> makes everything lowercase; chaining them (<code>.strip().lower()</code>) does both in one line.</p></div>
    <div class="cl-block"><h4>Slicing works on strings, just like lists</h4>
      <p><code>name[0:3]</code> grabs the first 3 characters — text slicing uses the exact same <code>[start:end]</code> syntax as list slicing, since a string is really just a sequence of characters.</p></div>` },
  m5s2: { title: 'Never trust input blindly — validation', html: `
    <div class="cl-block"><h4>Checking a length AND a content requirement</h4>
      <p>A strong password needs to pass MULTIPLE tests at once — length (<code>len(password) >= 8</code>) AND content (contains a digit). Combining both with <code>and</code> means BOTH have to be true for acceptance.</p></div>
    <div class="cl-block"><h4>.isdigit() checks one character at a time</h4>
      <p>Looping through every character and checking <code>ch.isdigit()</code> is how you search a whole string for ANY digit — there's no single built-in "does this string contain a digit" check, so you build it from a loop.</p></div>` },
  m5s3: { title: 'The Caesar cipher, in real code', html: `
    <div class="cl-block"><h4>ord() and chr() — letters as numbers, in code</h4>
      <p><code>ord(ch)</code> converts a letter to its ASCII number; <code>chr(n)</code> converts a number back to a letter — the exact "text is secretly numbers" idea from Grade 7's ASCII challenge, now doing real work.</p></div>
    <div class="cl-block"><h4>% 26 — wrapping the alphabet around</h4>
      <p>Shifting "z" forward should wrap back to "a", not go past the alphabet — <code>% 26</code> (26 letters in the alphabet) does exactly that wraparound, the same MOD trick from every wrapping problem you've met.</p></div>` },
  m5s4: { title: 'Reversing a string with [::-1]', html: `
    <div class="cl-block"><h4>A step of -1 walks backward through the whole string</h4>
      <p><code>text[::-1]</code> is a slice with no start, no end, and a step of -1 — meaning "walk the whole string, but backward". This one small piece of syntax reverses an entire string in a single expression.</p></div>
    <div class="cl-block"><h4>A palindrome is its own reverse</h4>
      <p>Comparing <code>cleaned == cleaned[::-1]</code> is the entire palindrome test — if a string equals its own reverse, it reads the same both ways.</p></div>` },
  m5s5: { title: '.split() with no arguments — splitting on whitespace', html: `
    <div class="cl-block"><h4>Different from Class Register's .split(",")</h4>
      <p><code>sentence.split()</code> with NO argument splits on any whitespace (spaces) automatically — different from M6's CSV splitting on a comma. Same method, different separator, different use.</p></div>
    <div class="cl-block"><h4>Scanning for the longest — the same pattern as Crew Roster</h4>
      <p>Tracking the longest word by comparing <code>len(word)</code> against the best-so-far is the exact same "assume first, check the rest" scanning pattern you'll meet again and again this year.</p></div>` },

  // ── M6 — Files & Data ────────────────────────────────────────────────────────
  m6s1: { title: 'Opening and reading a real file', html: `
    <div class="cl-block"><h4>open(), .readlines(), .close()</h4>
      <p><code>open("students.csv")</code> opens a real file; <code>.readlines()</code> gives you every line as a list of strings, INCLUDING the trailing newline character; always <code>.close()</code> when you're done.</p></div>
    <div class="cl-block"><h4>Skipping the header row</h4>
      <p><code>lines[1:]</code> skips index 0 (the header "name,grade") and starts from the real data — CSV files almost always have a header row you need to skip before processing the actual records.</p></div>` },
  m6s2: { title: 'Built-in stats functions on real data', html: `
    <div class="cl-block"><h4>max(), min(), sum(), len() — no loop needed</h4>
      <p>Once your grades are in a real list, Python's built-in functions do the heavy lifting — exactly what a spreadsheet's AVERAGE/MAX/MIN/COUNT do, just written as code instead of clicked in a UI.</p></div>
    <div class="cl-block"><h4>int() converts text to a number BEFORE you can calculate</h4>
      <p>Every value read from a file starts as TEXT — <code>int(grade_text)</code> converts it to a real number first, or <code>max()</code>/<code>sum()</code> would compare/add text instead of numbers, giving wrong or broken results.</p></div>` },
  m6s3: { title: 'Binary search — a real, faster search', html: `
    <div class="cl-block"><h4>Jump to the middle, throw away half</h4>
      <p>Instead of checking names one by one (linear search), binary search jumps to the MIDDLE of the sorted list — if the target isn't there, an entire HALF of the remaining list can be safely thrown away, every single step.</p></div>
    <div class="cl-block"><h4>Only works because the data is SORTED</h4>
      <p>Binary search's whole trick — "everything before the middle is smaller, everything after is bigger" — completely depends on the list already being in order. Unsorted data breaks the algorithm entirely.</p></div>` },
  m6s4: { title: 'Linking two datasets by a shared key', html: `
    <div class="cl-block"><h4>A dictionary as a fast lookup table</h4>
      <p><code>grades_by_id[student_id] = grade</code> builds a dictionary — a REAL lookup table, mapping one value (id) to another (grade) so you can find it instantly later, without searching through a list.</p></div>
    <div class="cl-block"><h4>This is exactly how a relational database joins tables</h4>
      <p>Two separate files, linked by one shared column (id) — that's the entire idea behind a database "join". Grade 8's roster.csv/results.csv is a tiny, real version of exactly what a school's actual student database does.</p></div>` },
  m6s5: { title: 'Append mode ("a") vs. write mode ("w")', html: `
    <div class="cl-block"><h4>"w" erases; "a" adds to the end</h4>
      <p>Opening a file in write mode ("w") WIPES it clean every single time — dangerous if you wanted to keep old entries. Append mode ("a") instead adds new content to the END, leaving everything already there untouched.</p></div>
    <div class="cl-block"><h4>A real log file works exactly this way</h4>
      <p>Every time your computer logs an event (an error, a login, a game score), it appends a new line — it would be useless if opening the log to add one entry deleted every previous entry first.</p></div>` },
  m6s6: { title: 'Read, filter, and write — the whole data pipeline', html: `
    <div class="cl-block"><h4>Combining every M6 skill in one pipeline</h4>
      <p>Read a file (Read the Class Register), filter by a condition (the same idea as Filter the Evens), then WRITE the result to a new file — reading, filtering, and writing together is a genuine, complete real-world data task.</p></div>
    <div class="cl-block"><h4>Why filter BEFORE writing, not after</h4>
      <p>Checking the condition (grade >= 75) as you loop, and only writing qualifying names, means the output file contains EXACTLY the right data from the start — no need for a separate cleanup pass afterward.</p></div>` },

  // ── M7 — Inside the Machine ──────────────────────────────────────────────────
  m7s1: { title: 'Storage units and binary, for real', html: `
    <div class="cl-block"><h4>1024, not 1000 — powers of two</h4>
      <p>1 KB = 1024 bytes, not 1000 — because computers count in binary (base 2), and 1024 is a power of 2 (2¹⁰). Everything in computing tends to use powers of 2 rather than round decimal numbers.</p></div>
    <div class="cl-block"><h4>bin() shows a number the way the computer really stores it</h4>
      <p><code>bin(42)</code> reveals the actual binary digits underneath — the SAME idea as Grade 6's binary cards, just displayed by real code instead of physically flipped.</p></div>` },
  m7s2: { title: 'Images ARE numbers — grayscale conversion', html: `
    <div class="cl-block"><h4>Every pixel is really three numbers</h4>
      <p>A colour pixel is a tuple <code>(r, g, b)</code> — exactly the RGB idea from Grade 6's Color Lab and Grade 8's Rainbow Row, now processed with real code instead of sliders or circles.</p></div>
    <div class="cl-block"><h4>Averaging three channels into one brightness value</h4>
      <p><code>(r + g + b) // 3</code> — averaging red, green, and blue gives a single "how bright is this pixel" number, which is exactly how a real photo-editing app converts a colour photo to grayscale.</p></div>` },
  m7s3: { title: 'Interpreter vs. compiler', html: `
    <div class="cl-block"><h4>Python runs your code one line at a time</h4>
      <p>Python is an <strong>interpreter</strong> — it translates and runs each line as it goes, so everything BEFORE a crash has already genuinely happened. A <strong>compiler</strong> instead translates the WHOLE program first and refuses to produce anything if there's an error anywhere in it.</p></div>
    <div class="cl-block"><h4>try/except — surviving an error on purpose</h4>
      <p>Wrapping risky code in <code>try:</code>/<code>except ErrorType:</code> lets your program keep running even after something breaks — proving, first-hand, that interpreted code really does execute line by line.</p></div>` },
  m7s4: { title: 'Encoding and decoding a message', html: `
    <div class="cl-block"><h4>A full round-trip: text → numbers → text</h4>
      <p><code>ord()</code> turns each character into its ASCII number; <code>chr()</code> turns a number back into a character — doing BOTH directions proves the conversion is reversible, not a one-way trick.</p></div>
    <div class="cl-block"><h4>Real encoding always works both ways</h4>
      <p>Any real encoding scheme (ASCII, Unicode, even encryption) has to be reversible — otherwise the original message could never be recovered. Building both directions yourself makes that concrete.</p></div>` },
  m7s5: { title: 'Run-length encoding — real compression', html: `
    <div class="cl-block"><h4>Counting repeats instead of storing them all</h4>
      <p>"aaaabbbccd" stored as "4a3b2c1d" is genuinely shorter — instead of every repeated character, you store a COUNT plus the character once. This is a real compression technique, used in actual image and file formats.</p></div>
    <div class="cl-block"><h4>Detecting where one run ends and the next begins</h4>
      <p>Comparing each character to the PREVIOUS one (<code>text[i] == text[i-1]</code>) is how you detect "still the same run" vs. "a new character has started" — the moment they differ, the current run is finished.</p></div>` },

  // ── M8 — The Connected World ─────────────────────────────────────────────────
  m8s1: { title: 'Packets — messages arrive out of order', html: `
    <div class="cl-block"><h4>Real internet messages are chopped into numbered pieces</h4>
      <p>A message is split into <strong>packets</strong>, sent separately, and can arrive in ANY order — sorting them back into place by their index is exactly what the real internet's TCP protocol does, constantly, for every message you've ever sent.</p></div>
    <div class="cl-block"><h4>sorted() on tuples sorts by the first item</h4>
      <p><code>sorted(arrived)</code> automatically sorts a list of (index, chunk) tuples BY the index — Python compares tuples by their first element first, which is exactly what reassembling packets needs.</p></div>` },
  m8s2: { title: 'Generating real HTML with Python', html: `
    <div class="cl-block"><h4>A web page is just a text file</h4>
      <p>Every website is really a plain text file written in HTML — servers routinely BUILD that text on the fly using a real programming language, exactly what you're doing with an f-string here.</p></div>
    <div class="cl-block"><h4>Staying safe: what NOT to put in a public profile</h4>
      <p>Never include your real full name, address, or school in anything public-facing — keep it to a first name or nickname, even in practice exercises like this one.</p></div>` },
  m8s3: { title: 'Password strength — combining checks in a function', html: `
    <div class="cl-block"><h4>Two conditions, combined with "and"</h4>
      <p><code>is_strong(password)</code> returns True only when BOTH the length check AND the digit check pass — <code>and</code> requires every condition to be true, unlike <code>or</code> which only needs one.</p></div>
    <div class="cl-block"><h4>any() — checking if ANY character matches</h4>
      <p><code>any(ch.isdigit() for ch in password)</code> is a compact way to ask "does at least one character satisfy this test?" — true the moment even a single digit is found anywhere in the string.</p></div>` },
  m8s4: { title: 'https:// vs. http:// — a real security check', html: `
    <div class="cl-block"><h4>.startswith() checks the beginning of a string</h4>
      <p><code>url.startswith("https://")</code> checks whether a string begins with EXACTLY that text — the "s" in https means the connection is encrypted; without it, anything you type (including passwords) travels unprotected.</p></div>
    <div class="cl-block"><h4>A genuinely useful real-world habit</h4>
      <p>Checking for that padlock/https before entering sensitive information is real, practical online-safety advice — this challenge writes the exact check your browser performs automatically.</p></div>` },
  m8s5: { title: 'Linking pages — a real multi-page website', html: `
    <div class="cl-block"><h4>&lt;a href="..."&gt; — the HTML link tag</h4>
      <p><code>&lt;a href="about.html"&gt;About Me&lt;/a&gt;</code> creates a clickable link — <code>href</code> names the destination file, the text between the tags is what's actually clickable on the page.</p></div>
    <div class="cl-block"><h4>Real websites are many pages, connected</h4>
      <p>A single HTML page is rarely the whole story — real sites are collections of pages, all linked together, exactly like this two-page profile connecting a home page to an about page.</p></div>` },

  // ── M9 — Interactive Apps ────────────────────────────────────────────────────
  m9s1: { title: 'Three kinds of bugs, three different fixes', html: `
    <div class="cl-block"><h4>Syntax, logic, and runtime errors are NOT the same thing</h4>
      <p>A <strong>syntax error</strong> means Python can't even parse your code's structure (a missing colon). A <strong>logic error</strong> means it runs but gives the wrong answer (backwards condition). A <strong>runtime error</strong> crashes only on certain inputs (dividing by zero on an empty list).</p></div>
    <div class="cl-block"><h4>Real debugging starts with naming which kind you have</h4>
      <p>Recognising WHICH of the three you're dealing with points you toward the right fix immediately — a syntax error needs a punctuation fix, a logic error needs re-reading your condition, a runtime error needs a guard clause.</p></div>` },
  m9s2: { title: 'Trace tables — debugging by watching, not guessing', html: `
    <div class="cl-block"><h4>A print() inside the loop IS a trace table</h4>
      <p>Printing every variable's value on every pass through the loop is exactly what a paper trace table records — just automated, showing you every intermediate value instead of only the final result.</p></div>
    <div class="cl-block"><h4>Reading rows top to bottom to find where it goes wrong</h4>
      <p>When code gives a wrong final answer, tracing shows you EXACTLY which line first produced a wrong value — far faster than guessing where the bug might be.</p></div>` },
  m9s3: { title: 'app_state — a real state machine', html: `
    <div class="cl-block"><h4>One variable controlling which screen draws</h4>
      <p><code>app_state</code> is text ("menu", "running", "results") checked with if/elif — exactly Grade 7's state-machine idea (G7 — Game States), now controlling a real interactive app instead of a game.</p></div>
    <div class="cl-block"><h4>else — a safety net for unexpected states</h4>
      <p>A final <code>else</code> catches ANY value that isn't one of the states you explicitly planned for — real apps need this, since real user data is rarely as clean as what you tested with.</p></div>` },
  m9s4: { title: 'Combining state, guards, and drawing', html: `
    <div class="cl-block"><h4>Guarding against a real runtime error first</h4>

const STAGE_INDEX = {}
CHALLENGES.forEach((s, i) => { STAGE_INDEX[s.id] = i })

// ── Builder City map — sequential unlock, same intent as the pill list below
// (any pill is currently clickable regardless of order; the map itself is the
// paced/sequential front door, matching Grade 6/7's landing-map convention).
function showJourney() {
  const STAGE_EMO = ['🐍', '📗', '🧩']
  const worlds = MODULES.map(m => {
    if (!m.live) return { name: m.name, sub: m.sub, live: false, count: m.count }
    const stages = m.stages.map((s, i) => ({
      id: s.id, emoji: STAGE_EMO[i % STAGE_EMO.length], label: s.name,
      done: completed.has(STAGE_INDEX[s.id]),
    }))
    return { name: m.name, sub: m.sub, live: true, stages }
  })
  QuestMap.show({
    title: '🏙 Builder City',
    subtitle: 'Real Python, a real editor, real data. From your first print() to a shipped app.',
    accent: '#60a5fa',
    layout: 'path', softLock: true,
    avatarSvg: '<span style="font-size:22px;">🐍</span>',
    worlds,
    onOpen: (id) => selectChallenge(STAGE_INDEX[id]),
  })
}

// -- BF Integration --
BF.seed();
// Soft auth: allow access from Next.js/Supabase context (me = null → XP skipped)
const me = (() => { try { return BF.session() || null; } catch(_) { return null; } })();

const completed = new Set()
let activeIdx = 0
let hintIdx   = 0

function renderPills() {
  const row = document.getElementById('ch-pills')
  row.innerHTML = ''
  CHALLENGES.forEach((ch,i) => {
    const el = document.createElement('div')
    el.className = 'ch-pill' + (i===activeIdx?' active':'') + (completed.has(i)?' done':'')
    el.textContent = (completed.has(i)?'✓ ':'') + ch.mod + ' ' + ch.name
    el.onclick = () => selectChallenge(i)
    row.appendChild(el)
  })
  renderNavStrip()
}

// Compact "Challenge N of TOTAL" strip — see the ch-nav-strip comment above
// the markup for why this replaced the always-visible pill wall.
function renderNavStrip() {
  const el = document.getElementById('ch-nav-current')
  if (!el) return
  const ch = CHALLENGES[activeIdx]
  const done = completed.has(activeIdx) ? ' ✓' : ''
  el.innerHTML = `<b>${activeIdx + 1}</b> / ${CHALLENGES.length} — ${ch ? ch.mod + ' ' + ch.name : ''}${done}`
}
function stepChallenge(delta) {
  const next = activeIdx + delta
  if (next < 0 || next >= CHALLENGES.length) return
  selectChallenge(next)
}
function toggleChallengeList() {
  const list = document.getElementById('ch-pills')
  const btn  = document.getElementById('ch-nav-toggle')
  const open = list.style.display === 'none'
  list.style.display = open ? 'flex' : 'none'
  btn.classList.toggle('open', open)
}

let challengeStartedAt = Date.now()

function selectChallenge(i) {
  activeIdx = i
  hintIdx   = 0
  challengeStartedAt = Date.now()
  const ch  = CHALLENGES[i]
  document.getElementById('ch-text').innerHTML = ch.text
  document.getElementById('xp-pill').textContent = '+' + ch.xp + ' XP'
  document.getElementById('pass-badge').style.display = 'none'
  // Web Story stages (lang:'web') swap in the real HTML/CSS/JS editor and
  // iframe preview in place of the Python editor + canvas.
  const isWeb = ch.lang === 'web'
  document.getElementById('py-editor-panel').style.display  = isWeb ? 'none' : ''
  document.getElementById('web-editor-panel').style.display = isWeb ? '' : 'none'
  document.getElementById('out-canvas').style.display = isWeb ? 'none' : 'block'
  document.getElementById('out-web').style.display    = isWeb ? 'block' : 'none'
  if (isWeb) {
    webEditors.html.setValue((ch.webStarter && ch.webStarter.html) || '')
    webEditors.css.setValue((ch.webStarter && ch.webStarter.css) || '')
    webEditors.js.setValue((ch.webStarter && ch.webStarter.js) || '')
    switchWebTab('html')
    document.getElementById('out-web').srcdoc = '<body style="font-family:sans-serif;color:#94a3b8;font-size:12px;padding:14px;">Page output — write HTML/CSS/JS, then press ▶ Run</body>'
  } else {
    editor.setValue(ch.starter || '# Write your Python here\n')
    editor.focus()
    ctx.clearRect(0,0,W,H)
  }
  renderPills()
  renderChallengeLesson(ch)
  clog('Challenge: ' + ch.name, 'info')
}

// 📘 Full per-challenge lesson content — CHALLENGE_LESSON is defined further
// down (right after CHALLENGES), keyed by challenge id.
let _clExpanded = true
function renderChallengeLesson(ch) {
  const wrap  = document.getElementById('ch-lesson')
  const body  = document.getElementById('cl-body')
  const title = document.getElementById('cl-title')
  if (!wrap) return
  const lesson = typeof CHALLENGE_LESSON !== 'undefined' ? CHALLENGE_LESSON[ch.id] : null
  if (!lesson) { wrap.style.display = 'none'; return }
  wrap.style.display = ''
  title.textContent = lesson.title
  body.innerHTML = lesson.html
  body.classList.toggle('collapsed', !_clExpanded)
  document.getElementById('cl-arrow').textContent = _clExpanded ? '▾' : '▸'
}
function toggleChallengeLesson() {
  _clExpanded = !_clExpanded
  document.getElementById('cl-body').classList.toggle('collapsed', !_clExpanded)
  document.getElementById('cl-arrow').textContent = _clExpanded ? '▾' : '▸'
}

// ── Real progress: bridge to the account's actual concept_mastery/profile.xp ──
// Same root-cause fix as grade7.html: public/js/db.js's BF.addXP/recordAttempt
// only ever wrote to a localStorage-only mock database, disconnected from the
// real Supabase profile/concept_mastery rows /student/dashboard reads. Map
// each of Grade 8's 10 modules onto the matching concept in lib/concepts.ts
// (8 of these 10 concepts did not exist before this fix — only
// functions-params/lists-data did, for modules M3/M4).
const G8_MODULE_CONCEPT = {
  m1:'g8-text', m2:'g8-loops', m3:'functions-params', m4:'lists-data', m5:'g8-strings',
  m6:'g8-files', m7:'g8-hardware', m8:'g8-web', m9w:'g8-apps', m10:'g8-capstone',
}
async function reportRealProgress(ch, timeSpentMs) {
  const concept_id = G8_MODULE_CONCEPT[ch.mod]
  if (!concept_id) return
  try {
    await fetch('/api/progress', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ concept_id, correct: true, time_spent_ms: Math.max(0, Math.min(3600000, timeSpentMs)) }),
    })
  } catch (e) { console.warn('[grade8] progress report failed (offline?):', e.message) }
}

function resetToStarter() {
  const ch = CHALLENGES[activeIdx]
  if (ch) editor.setValue(ch.starter || '')
  ctx.clearRect(0,0,W,H)
  document.getElementById('pass-badge').style.display = 'none'
  clog('Reset to starter code.', 'info')
}

function clearEditor() {
  editor.setValue('')
  ctx.clearRect(0,0,W,H)
  document.getElementById('pass-badge').style.display = 'none'
}

// Every check() is a regex match over raw source text — strip Python
// comments first, or a starter's own instructional "# TODO: use a while
// loop" comment can satisfy a check looking for the literal word "while"
// before the student has written a single real line (found via
// scripts/test-g8-challenges.mjs asserting every starter must NOT pass).
function stripPyComments(code) { return code.replace(/#.*$/gm, '') }

function validateChallenge(code) {
  const ch = CHALLENGES[activeIdx]
  if (!ch || completed.has(activeIdx)) return
  // Third arg is the RAW source: a few challenges legitimately instruct the
  // student to write comments (e.g. M9 "Name That Error" asks them to label
  // each fix with the error type), and those words are gone from the stripped
  // copy. Checks that don't need it simply ignore the extra argument.
  if (ch.check(stripPyComments(code), drawLog, code)) {
    completed.add(activeIdx)
    renderPills()
    document.getElementById('pass-badge').style.display = 'block'
    showToast('Challenge complete! +' + ch.xp + ' XP')
    clog('Challenge complete! +' + ch.xp + ' XP', 'ok')
    if (me) { BF.addXP(me.id, ch.xp); BF.recordAttempt(me.id, 'g8-c' + activeIdx, { passed: true, score: 100 }); }
    LessonSaves.save('grade8', ch.id, { passed: true, xpEarned: ch.xp, code })
    reportRealProgress(ch, Date.now() - challengeStartedAt)
  }
}

function showHint() {
  const ch = CHALLENGES[activeIdx]
  if (!ch) return
  if (hintIdx < ch.hints.length) clog('Hint ' + (hintIdx+1) + ': ' + ch.hints[hintIdx++], 'info')
  else clog('No more hints!', 'info')
}

// ── Console ───────────────────────────────────────────────────────────────────
function clog(msg, cls='') {
  const pre = document.getElementById('console')
  const span = document.createElement('span')
  span.className = cls
  span.textContent = msg + '\n'
  pre.appendChild(span)
  pre.scrollTop = pre.scrollHeight
  if (pre.children.length > 120) pre.removeChild(pre.firstChild)
}

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 3200)
}

// Add a CodeMirror style for error lines
const style = document.createElement('style')
style.textContent = `.cm-error-line { background:rgba(239,68,68,.18) !important; }`
document.head.appendChild(style)

// ── Init — restore Supabase saves, then render ───────────────────────────────
initPyodide()
;(async () => {
  await LessonSaves.load('grade8')
  // completedIds() is id-keyed (survives new challenges being inserted
  // anywhere); completedSet() is the legacy index-keyed fallback for any
  // save row written before this migration.
  LessonSaves.completedIds().forEach(id => { if (STAGE_INDEX[id] !== undefined) completed.add(STAGE_INDEX[id]) })
  LessonSaves.completedSet().forEach(idx => completed.add(idx))
  renderPills()
  showJourney()   // land on the map — nothing else renders until a stage is picked
})()
</script>
