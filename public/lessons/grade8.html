<script>
'use strict'

// ── Canvas drawing state ──────────────────────────────────────────────────────
const canvas = document.getElementById('out-canvas')
const ctx    = canvas.getContext('2d')
const W = canvas.width, H = canvas.height

let _fill   = '#b8ef4a'
let _stroke = 'none'
let _lw     = 2
let _fontSz = 16
let _font   = '16px Plus Jakarta Sans, sans-serif'

// Validation counters (reset each run)
let drawLog = { rects:0, circles:0, lines:0, texts:0, calls:0 }

function applyFill()   { ctx.fillStyle = _fill }
function applyStroke() { if (_stroke !== 'none') { ctx.strokeStyle = _stroke; ctx.lineWidth = _lw } }

// Expose JS drawing API as window._bf_* so Python (js module) can call them
window._bf_set_fill   = c => { _fill = c }
window._bf_set_stroke = c => { _stroke = c }
window._bf_set_lw     = n => { _lw = n }
window._bf_set_font   = n => { _fontSz = n; _font = `${n}px Plus Jakarta Sans, sans-serif` }
window._bf_clear      = ()        => { ctx.clearRect(0,0,W,H); drawLog.calls++ }
window._bf_background = c         => { ctx.fillStyle = c; ctx.fillRect(0,0,W,H); drawLog.calls++ }
window._bf_rect       = (x,y,w,h) => {
  applyFill(); ctx.fillRect(x,y,w,h)
  if (_stroke !== 'none') { applyStroke(); ctx.strokeRect(x,y,w,h) }
  drawLog.rects++; drawLog.calls++
}
window._bf_circle     = (x,y,r)   => {
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2)
  applyFill(); ctx.fill()
  if (_stroke !== 'none') { applyStroke(); ctx.stroke() }
  drawLog.circles++; drawLog.calls++
}
window._bf_line       = (x1,y1,x2,y2) => {
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2)
  ctx.strokeStyle = _stroke !== 'none' ? _stroke : _fill
  ctx.lineWidth = _lw; ctx.stroke()
  drawLog.lines++; drawLog.calls++
}
window._bf_text       = (s,x,y)   => {
  ctx.font = _font; ctx.fillStyle = _fill; ctx.fillText(String(s),x,y)
  drawLog.texts++; drawLog.calls++
}

// ── Byteforge Python module source (installed into sys.modules) ───────────────
const BYTEFORGE_PY = `
from js import (
    _bf_set_fill, _bf_set_stroke, _bf_set_lw, _bf_set_font,
    _bf_clear, _bf_background, _bf_rect, _bf_circle, _bf_line, _bf_text
)

WIDTH  = 480
HEIGHT = 260

def fill(r, g=None, b=None):
    """Set the fill colour. Use fill(r,g,b) or fill('#hex')."""
    if g is None:
        _bf_set_fill(str(r))
    else:
        _bf_set_fill(f'rgb({int(r)},{int(g)},{int(b)})')

def stroke(r, g=None, b=None):
    """Set the outline colour. Use stroke(r,g,b) or stroke('#hex')."""
    if g is None:
        _bf_set_stroke(str(r))
    else:
        _bf_set_stroke(f'rgb({int(r)},{int(g)},{int(b)})')

def no_stroke():
    """Remove the outline."""
    _bf_set_stroke('none')

def stroke_width(n):
    """Set outline thickness in pixels."""
    _bf_set_lw(float(n))

def font_size(n):
    """Set the text size in pixels."""
    _bf_set_font(float(n))

def rect(x, y, w, h):
    """Draw a filled rectangle."""
    _bf_rect(float(x), float(y), float(w), float(h))

def circle(x, y, r):
    """Draw a filled circle at (x, y) with radius r."""
    _bf_circle(float(x), float(y), float(r))

def line(x1, y1, x2, y2):
    """Draw a line from (x1,y1) to (x2,y2)."""
    _bf_line(float(x1), float(y1), float(x2), float(y2))

def text(s, x, y):
    """Draw text string s at position (x, y)."""
    _bf_text(str(s), float(x), float(y))

def clear():
    """Clear the canvas."""
    _bf_clear()

def background(r, g=None, b=None):
    """Fill the canvas with a background colour."""
    if g is None:
        _bf_background(str(r))
    else:
        _bf_background(f'rgb({int(r)},{int(g)},{int(b)})')

__all__ = [
    'WIDTH', 'HEIGHT',
    'fill', 'stroke', 'no_stroke', 'stroke_width', 'font_size',
    'rect', 'circle', 'line', 'text', 'clear', 'background',
]
`

// ── Pyodide init ──────────────────────────────────────────────────────────────
let pyodide = null
let pyReady = false

async function initPyodide() {
  try {
    clog('Loading Python 3 engine (Pyodide)…', 'info')
    pyodide = await globalThis.loadPyodide()

    // Install byteforge module into sys.modules
    pyodide.runPython(`
import types as _types, sys as _sys
_bf_mod = _types.ModuleType('byteforge')
exec(${JSON.stringify(BYTEFORGE_PY)}, _bf_mod.__dict__)
_sys.modules['byteforge'] = _bf_mod
del _types, _sys, _bf_mod
`)

    pyReady = true
    document.getElementById('py-loading').style.display = 'none'
    const btn = document.getElementById('run-btn')
    btn.textContent = '▶ Run'; btn.disabled = false
    clog('Python 3 ready! Press ▶ Run to execute your code.', 'ok')
  } catch(e) {
    clog('Failed to load Python: ' + e.message, 'err')
    document.getElementById('py-loading').style.display = 'none'
  }
}

// ── CodeMirror ────────────────────────────────────────────────────────────────
const editor = CodeMirror.fromTextArea(document.getElementById('py-editor'), {
  mode:         'python',
  theme:        'dracula',
  lineNumbers:   true,
  indentUnit:    4,
  tabSize:       4,
  indentWithTabs:false,
  lineWrapping:  false,
  autofocus:     true,
  extraKeys: {
    Tab: cm => {
      if (cm.somethingSelected()) { cm.indentSelection('add') }
      else { cm.replaceSelection('    ') }
    },
    'Shift-Tab': cm => cm.indentSelection('subtract'),
  },
})

// ── Execution ─────────────────────────────────────────────────────────────────
// Lines injected before user code (for line-number adjustment in errors)
const PREAMBLE_LINES = 6

const PREAMBLE = `
import sys as _sys, io as _io
_stdout_buf = _io.StringIO()
_sys.stdout = _stdout_buf
_sys.stderr = _stdout_buf
from byteforge import *
`.trim()

async function runPython() {
  if (!pyReady) { clog('Python is still loading — please wait.', 'info'); return }

  const code = editor.getValue()
  if (!code.trim()) { clog('Nothing to run — write some Python first!', 'info'); return }

  // Reset canvas & draw counters
  ctx.clearRect(0,0,W,H)
  drawLog = { rects:0, circles:0, lines:0, texts:0, calls:0 }
  _fill='#b8ef4a'; _stroke='none'; _lw=2; _fontSz=16; _font='16px Plus Jakarta Sans, sans-serif'
  document.getElementById('pass-badge').style.display = 'none'

  const fullCode = PREAMBLE + '\n' + code + '\n_stdout_buf.getvalue()'

  clog('— Running —', 'info')
  const t0 = Date.now()

  try {
    const result = await pyodide.runPythonAsync(fullCode)
    const elapsed = Date.now() - t0

    // Print captured stdout
    const printed = String(result || '').trim()
    if (printed) {
      printed.split('\n').forEach(line => clog(line, 'out'))
    }

    clog(`Finished in ${elapsed}ms.`, 'ok')
    validateChallenge(code)

  } catch(rawErr) {
    const { msg, line } = parsePyError(rawErr.message, code)
    clog(msg, 'err')
    if (line > 0) highlightError(line)
  }
}

function parsePyError(raw, userCode) {
  // Adjust line numbers — remove preamble offset
  const preambleLen = PREAMBLE.split('\n').length + 1
  let msg = raw

  // Extract line number from traceback
  const lineMatch = raw.match(/line (\d+)/g)
  let line = 0
  if (lineMatch) {
    const lastLine = lineMatch[lineMatch.length - 1]
    const n = parseInt(lastLine.replace('line ',''))
    line = Math.max(0, n - preambleLen)
    msg = raw.replace(lastLine, `line ${line}`)
  }

  // Friendly rewrites
  const friendly = {
    'NameError': (m) => {
      const name = m.match(/name '(\w+)' is not defined/)?.[1]
      return name ? `NameError: "${name}" is not defined. Did you spell it correctly? Remember Python is case-sensitive.` : m
    },
    'IndentationError': (m) => `IndentationError: Check your indentation! Python uses 4 spaces to indent code inside if/for/def blocks.`,
    'SyntaxError': (m) => `SyntaxError: Something's wrong with the structure of your code. Check for missing colons (:) after if/for/def, or mismatched brackets.`,
    'TypeError': (m) => {
      if (m.includes("argument")) return `TypeError: Wrong number or type of arguments. Check what your function expects.`
      return `TypeError: ${m.split('\n').pop()}`
    },
    'ZeroDivisionError': () => `ZeroDivisionError: You divided by zero! Make sure your divisor is not 0.`,
    'IndexError': (m) => `IndexError: You tried to access a list item that doesn't exist. Lists start at index 0.`,
    'ValueError': (m) => `ValueError: ${m.split('\n').pop()}`,
  }

  for (const [errType, fn] of Object.entries(friendly)) {
    if (msg.includes(errType)) {
      const lastLine = msg.split('\n').filter(Boolean).pop() || msg
      return { msg: (line>0?`Line ${line}: `:'') + fn(lastLine), line }
    }
  }

  // Fallback: last meaningful line
  const lines = msg.split('\n').filter(l => l.trim() && !l.includes('File') && !l.includes('Traceback'))
  return { msg: (line>0?`Line ${line}: `:'') + (lines.pop() || msg), line }
}

function highlightError(line) {
  editor.addLineClass(line - 1, 'background', 'cm-error-line')
  setTimeout(() => editor.removeLineClass(line - 1, 'background', 'cm-error-line'), 4000)
}

// ── Builder City — 10 modules, Python-first (from-blocks-to-text -> a real
// data app capstone). M1-M4 are live this session; M5-M10 stubbed locked on
// the map. check(code, log) gets the raw source text plus drawLog
// {rects,circles,lines,texts,calls} from the just-finished run — validation
// is deliberately structural (right constructs used + it ran clean), same
// leniency as the pre-existing M9/M10 content below.
const MODULES = [
  { id:'m1', name:'🔤 M1 — From Blocks to Text', sub:'print, input, variables, types — the G7 skills, now in real Python', live:true, stages:[
    { id:'m1s1', name:'Say Hello', xp:20,
      text:`<strong>Challenge 1 — Your First Line</strong> — Use <code>print()</code> to say hello. Then print it again with your own message.`,
      hints:[
        'print("Hello, World!") — the classic first line of code in any language.',
        'Add a second print() with a different message, like your name.',
        'Run it — you should see both lines in the console below.',
      ],
      starter:`# Grade 8 — Your first Python lines
# Use print() to display a message

print("Hello, World!")
# TODO: add a second print() with your own message
`,
      check:(code) => (code.match(/print\s*\(/g) || []).length >= 2,
    },
    { id:'m1s2', name:'About Me', xp:30,
      text:`<strong>Challenge 2 — Variables</strong> — Create THREE variables: your name (text), your age (a number), and a favourite thing (text). Print all three using an f-string like <code>f"My name is {name}"</code>.`,
      hints:[
        'A variable is just: name = "Alex". Text needs quotes, numbers don\'t.',
        'Make three variables: name, age, favourite.',
        'An f-string looks like: print(f"My name is {name} and I am {age}").',
      ],
      starter:`# Grade 8 — Variables & f-strings
name = "Alex"
age = 13
# TODO: create a "favourite" variable (a text, e.g. a game or food)

print(f"My name is {name} and I am {age} years old.")
# TODO: print favourite using an f-string too
`,
      check:(code) => {
        const assigns = (code.match(/^\s*\w+\s*=\s*.+$/gm) || []).length
        const fstrings = (code.match(/f['"]/g) || []).length
        return assigns >= 3 && fstrings >= 2
      },
    },
    { id:'m1s3', name:'Type Detective', xp:35,
      text:`<strong>Challenge 3 — Types</strong> — Every value in Python has a TYPE. Create an int, a float, a string, and a boolean. Use <code>type()</code> and print the result for each one.`,
      hints:[
        'int: whole numbers like 7. float: decimals like 7.5. str: text in quotes. bool: True or False.',
        'type(x) tells you the type — try print(type(7)), print(type(7.5)), print(type("hi")).',
        'Make 4 variables (one of each type) and print(type(...)) for all four.',
      ],
      starter:`# Grade 8 — Types: int, float, str, bool
whole_number = 7
decimal_number = 7.5
# TODO: make a string variable and a boolean variable

print(type(whole_number))
print(type(decimal_number))
# TODO: print the type() of your string and boolean too
`,
      check:(code) => (code.match(/type\s*\(/g) || []).length >= 4 && (code.match(/print\s*\(/g) || []).length >= 4,
    },
  ]},

  { id:'m2', name:'🚦 M2 — Choices & Loops', sub:'if/elif/else, while, for-range — predict the drawing before you run it', live:true, stages:[
    { id:'m2s1', name:'Odd or Even', xp:35,
      text:`<strong>Challenge 1 — If / Else</strong> — Create a <em>number</em> variable. Use <code>%</code> (the remainder operator) and an if/else to print whether it's odd or even.`,
      hints:[

const CHALLENGES = MODULES.filter(m => m.live).flatMap(m => m.stages.map(s => ({ ...s, mod: m.id.toUpperCase() })))
const STAGE_INDEX = {}
CHALLENGES.forEach((s, i) => { STAGE_INDEX[s.id] = i })

// ── Builder City map — sequential unlock, same intent as the pill list below
// (any pill is currently clickable regardless of order; the map itself is the
// paced/sequential front door, matching Grade 6/7's landing-map convention).
function showJourney() {
  const STAGE_EMO = ['🐍', '📗', '🧩']
  const worlds = MODULES.map(m => {
    if (!m.live) return { name: m.name, sub: m.sub, live: false, count: m.count }
    const stages = m.stages.map((s, i) => ({
      id: s.id, emoji: STAGE_EMO[i % STAGE_EMO.length], label: s.name,
      done: completed.has(STAGE_INDEX[s.id]),
    }))
    return { name: m.name, sub: m.sub, live: true, stages }
  })
  QuestMap.show({
    title: '🏙 Builder City',
    subtitle: 'Real Python, a real editor, real data. From your first print() to a shipped app.',
    accent: '#60a5fa',
    layout: 'path', softLock: true,
    avatarSvg: '<span style="font-size:22px;">🐍</span>',
    worlds,
    onOpen: (id) => selectChallenge(STAGE_INDEX[id]),
  })
}

// -- BF Integration --
BF.seed();
// Soft auth: allow access from Next.js/Supabase context (me = null → XP skipped)
const me = (() => { try { return BF.session() || null; } catch(_) { return null; } })();

const completed = new Set()
let activeIdx = 0
let hintIdx   = 0

function renderPills() {
  const row = document.getElementById('ch-pills')
  row.innerHTML = ''
  CHALLENGES.forEach((ch,i) => {
    const el = document.createElement('div')
    el.className = 'ch-pill' + (i===activeIdx?' active':'') + (completed.has(i)?' done':'')
    el.textContent = (completed.has(i)?'✓ ':'') + ch.mod + ' ' + ch.name
    el.onclick = () => selectChallenge(i)
    row.appendChild(el)
  })
}

function selectChallenge(i) {
  activeIdx = i
  hintIdx   = 0
  const ch  = CHALLENGES[i]
  document.getElementById('ch-text').innerHTML = ch.text
  document.getElementById('xp-pill').textContent = '+' + ch.xp + ' XP'
  document.getElementById('pass-badge').style.display = 'none'
  editor.setValue(ch.starter || '# Write your Python here\n')
  editor.focus()
  ctx.clearRect(0,0,W,H)
  renderPills()
  clog('Challenge: ' + ch.name, 'info')
}

function resetToStarter() {
  const ch = CHALLENGES[activeIdx]
  if (ch) editor.setValue(ch.starter || '')
  ctx.clearRect(0,0,W,H)
  document.getElementById('pass-badge').style.display = 'none'
  clog('Reset to starter code.', 'info')
}

function clearEditor() {
  editor.setValue('')
  ctx.clearRect(0,0,W,H)
  document.getElementById('pass-badge').style.display = 'none'
}

function validateChallenge(code) {
  const ch = CHALLENGES[activeIdx]
  if (!ch || completed.has(activeIdx)) return
  if (ch.check(code, drawLog)) {
    completed.add(activeIdx)
    renderPills()
    document.getElementById('pass-badge').style.display = 'block'
    showToast('Challenge complete! +' + ch.xp + ' XP')
    clog('Challenge complete! +' + ch.xp + ' XP', 'ok')
    if (me) { BF.addXP(me.id, ch.xp); BF.recordAttempt(me.id, 'g8-c' + activeIdx, { passed: true, score: 100 }); }
    LessonSaves.save('grade8', activeIdx, { passed: true, xpEarned: ch.xp, code })
  }
}

function showHint() {
  const ch = CHALLENGES[activeIdx]
  if (!ch) return
  if (hintIdx < ch.hints.length) clog('Hint ' + (hintIdx+1) + ': ' + ch.hints[hintIdx++], 'info')
  else clog('No more hints!', 'info')
}

// ── Console ───────────────────────────────────────────────────────────────────
function clog(msg, cls='') {
  const pre = document.getElementById('console')
  const span = document.createElement('span')
  span.className = cls
  span.textContent = msg + '\n'
  pre.appendChild(span)
  pre.scrollTop = pre.scrollHeight
  if (pre.children.length > 120) pre.removeChild(pre.firstChild)
}

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 3200)
}

// Add a CodeMirror style for error lines
const style = document.createElement('style')
style.textContent = `.cm-error-line { background:rgba(239,68,68,.18) !important; }`
document.head.appendChild(style)

// ── Init — restore Supabase saves, then render ───────────────────────────────
initPyodide()
;(async () => {
  await LessonSaves.load('grade8')
  LessonSaves.completedSet().forEach(idx => completed.add(idx))
  renderPills()
  showJourney()   // land on the map — nothing else renders until a stage is picked
})()
</script>
