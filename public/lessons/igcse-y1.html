    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    .layout { display:grid; grid-template-columns:1fr 480px; height:calc(100vh - 64px); overflow:hidden; }

    /* ── Left: answer panel ── */

    .ans-title  { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
    .badge      { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; }
    .badge-gy1  { background:rgba(56,189,248,.15); color:#7dd3fc; border:1px solid rgba(56,189,248,.3); }
    .badge-type { background:rgba(168,85,247,.12); color:#c084fc; border:1px solid rgba(168,85,247,.25); font-size:9px; }

    .ans-body   { flex:1; display:flex; flex-direction:column; padding:16px; gap:12px; overflow-y:auto; }
    .ans-prompt { font-size:13px; color:var(--fg-dim); line-height:1.6; }
    .ans-input  { width:100%; padding:8px 12px; border-radius:6px; border:1px solid var(--border);
                  background:var(--bg-raised); color:var(--fg); font-size:13px; font-family:var(--mono);
                  resize:vertical; }
    .ans-input:focus { outline:none; border-color:#7dd3fc; }
    textarea.ans-input { min-height:120px; line-height:1.6; }
    .ans-footer { flex-shrink:0; display:flex; gap:8px; padding:10px 14px; background:var(--bg-card);
                  border-top:1px solid var(--border); align-items:center; justify-content:space-between; }
    .btn { padding:6px 14px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:.15s; border:none; }
    .btn-brand  { background:#b8ef4a; color:#0d0f1a; }
    .btn-brand:hover  { background:#a5d83d; }
    .btn-ghost  { background:var(--bg-raised); color:var(--fg); border:1px solid var(--border-hi); }

    .feedback { font-size:12px; font-weight:600; }
    .feedback.ok  { color:#4ade80; }
    .feedback.err { color:#f87171; }

    /* ── Right panel ── */
    .right-panel { display:flex; flex-direction:column; overflow:hidden; }
    .ch-header   { flex-shrink:0; background:var(--bg-card); border-bottom:1px solid var(--border); padding:10px 14px; }
    .ch-pills    { display:none; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
    .ch-pills.expanded { display:flex; }
    .ch-nav-strip  { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .ch-nav-btn    { padding:3px 10px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;
                     border:1px solid var(--border); background:var(--bg-raised); color:var(--fg-dim); }
    .ch-nav-btn:hover { border-color:var(--border-hi); color:var(--fg); }
    .ch-nav-btn:disabled { opacity:.35; cursor:default; }
    .ch-nav-current { font-size:11.5px; font-weight:700; color:var(--fg); flex:1; }
    .ch-nav-toggle { font-size:11px; color:#7dd3fc; cursor:pointer; font-weight:700; }
    .ch-lesson { flex-shrink:0; background:var(--bg-card); border:1px solid rgba(125,211,252,.18); border-radius:8px; margin-bottom:8px; overflow:hidden; }
    .cl-toggle { padding:8px 12px; font-size:12px; font-weight:800; color:#7dd3fc; cursor:pointer;
                 display:flex; align-items:center; gap:6px; user-select:none; }
    .cl-toggle:hover { color:#a5e8ff; }
    #cl-arrow { margin-left:auto; font-size:10px; color:#6b7280; }
    .cl-body { padding:0 12px 12px; font-size:12px; color:var(--fg-dim); line-height:1.7; }
    .cl-body.collapsed { display:none; }
    .cl-block { background:var(--bg-raised); border:1px solid var(--border); border-radius:8px; padding:10px 13px; margin-bottom:8px; }
    .cl-block:last-child { margin-bottom:0; }

    .cl-block code { background:rgba(184,239,74,.1); color:#b8ef4a; padding:1px 5px; border-radius:3px; font-size:11.5px; }
    .ch-pill     { padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;

    .ch-pill:hover  { border-color:var(--border-hi); color:var(--fg); }
    .ch-pill.active { background:rgba(56,189,248,.12); border-color:#7dd3fc; color:#7dd3fc; }
    .ch-pill.done   { background:rgba(34,197,94,.08);  border-color:rgba(34,197,94,.35); color:#4ade80; }
    .ch-row  { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .ch-text { font-size:11.5px; color:var(--fg-dim); line-height:1.55; flex:1; }
    .ch-text strong { color:var(--fg); }
    .xp-pill { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px;
               background:rgba(234,179,8,.12); color:#fbbf24; border:1px solid rgba(234,179,8,.25); white-space:nowrap; }
    .hint-btn { font-size:11px; color:#fbbf24; cursor:pointer; }
    .ch-meta  { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }

    /* Toast */
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(60px);

    @media(max-width:900px) { .layout { grid-template-columns:1fr; } }

<script>
'use strict'

// ── BF integration ────────────────────────────────────────────────────────────
BF.seed()
const me = (() => { try { return BF.session() || null } catch(_) { return null } })()
const completed = new Set()
let activeIdx = 0
let hintIdx   = 0
let challengeStartedAt = Date.now()
let currentClassId = null   // set by applyClassOverrides() — used for book-lesson iframe src

// ── Bridge to the real Supabase-backed progress system ───────────────────────
// Mirrors the pattern used in grade7/8/9.html: BF.addXP/recordAttempt above is
// a localStorage-only mock the real /student/dashboard never reads. Best-effort
// module→concept mapping since IGCSE Y1's 5 theory modules don't map 1:1 onto
// the pre-existing concept graph (M4 Security had no concept at all until now).
const IGCSE_Y1_MODULE_CONCEPT = { M1:'binary-intro', M2:'cpu-basics', M3:'networking-basics', M4:'igcse-security', M5:'sort-bubble' }
async function reportRealProgress(ch, timeSpentMs) {
  const conceptId = IGCSE_Y1_MODULE_CONCEPT[ch.mod]
  if (!conceptId) return
  try {
    await fetch('/api/progress', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ concept_id: conceptId, correct: true, time_spent_ms: timeSpentMs || 0 }),
    })
  } catch (e) {}
}

// ── Challenges ────────────────────────────────────────────────────────────────
// type: 'convert' → exact numeric/text match
//       'theory'  → keyword presence check
//       'trace'   → comma-separated values match
// ── Answer-matching helpers ───────────────────────────────────────────────────
// These checks used to be bare `answer.includes('...')` calls, which matched
// SUBSTRINGS of ordinary English and so accepted nonsense and — worse —
// accepted fully inverted answers, i.e. exactly the misconception each question
// exists to catch. Real examples that used to pass:
//   'lan'        ⊂ "p<lan>"          → "I want a plan for a large area"  ACCEPTED
//   'wan'        ⊂ "<wan>t"
//   'alu'        ⊂ "v<alu>e"         → "Aluminium is accurate in the register." ACCEPTED
//   'cu'         ⊂ "ac<cu>rate"
//   'symmetric'  ⊂ "a<symmetric>"    → one word satisfied both clauses
//   'virus'      ⊂ "anti<virus>"
// word() does a word-boundary match, killing the substring class outright.
// about() additionally checks the CLAUSE a term appears in, so a claim can be
// tied to the right subject and an inverted definition is rejected.
function word(a, w) { return new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i').test(a) }
function anyWord(a, ...ws) { return ws.some(w => word(a, w)) }
// Split into clauses so "RAM is volatile" and "ROM is not" can be judged apart.
function clauses(a) { return a.split(/[.;,\n]|\band\b|\bwhereas\b|\bwhile\b|\bbut\b/i).filter(c => c.trim()) }
// True if some clause mentioning `subject` also asserts one of `traits`
// (and, if `not` is given, does NOT assert any of those).
function about(a, subject, traits, not) {
  return clauses(a).some(c =>
    word(c, subject) &&
    traits.some(t => word(c, t)) &&
    (!not || !not.some(t => word(c, t))))
}

const CHALLENGES = [
  // ── Module 1: Data Representation ─────────────────────────────────────────
  { mod:'M1', name:'1.1a Binary Numbers', xp:15, type:'lesson', bookFile:'1-1a-binary-numbers.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {
    mod:'M1', name:'Binary→Decimal', xp:30, type:'convert',
    text:`<strong>Challenge 1 — Data Representation</strong><br>Convert the binary number <code>11010110</code> to decimal.<br>Type only the decimal number as your answer.`,
    hints:['Work right to left: position values are 128, 64, 32, 16, 8, 4, 2, 1.', '1×128 + 1×64 + 0×32 + 1×16 + 0×8 + 1×4 + 1×2 + 0×1', 'Answer: 214'],
    check: ans => parseInt(ans.trim()) === 214,
  },
  {
    mod:'M1', name:'Binary Place Values', xp:20, type:'complete',
    text:`<strong>Complete it — 1.1a Binary Numbers</strong><br>The binary place values, right to left, are: <code>128, 64, 32, 16, 8, 4, 2, ___</code>.<br>What's the missing value?`,
    hints:['Each place value is exactly half of the one to its left.', '2 ÷ 2 = ?'],
    check: ans => ans.trim() === '1',
  },
  { mod:'M1', name:'1.1b Hexadecimal', xp:15, type:'lesson', bookFile:'1-1b-hexadecimal.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {
    mod:'M1', name:'Decimal→Hex', xp:30, type:'convert',
    text:`<strong>Challenge 2 — Data Representation</strong><br>Convert decimal <code>175</code> to hexadecimal.<br>Type your answer in uppercase (e.g. A3).`,
    hints:['Divide 175 by 16. 175 ÷ 16 = 10 remainder 15.', '10 = A, 15 = F in hex.', 'Answer: AF'],
    check: ans => ans.trim().toUpperCase() === 'AF',
  },
  {
    mod:'M1', name:'Hex Digit Fill-In', xp:20, type:'fill',
    text:`<strong>Fill in the blank — 1.1b Hexadecimal</strong><br>The hex digit <code>B</code> represents the decimal value ___.`,
    hints:['Hex digits A-F stand in for decimal 10-15, in order: A=10, B=11, C=12…'],
    check: ans => ans.trim() === '11',
  },
  { mod:'M1', name:'1.1c Binary Addition & Overflow', xp:15, type:'lesson', bookFile:'1-1c-binary-addition.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {
    mod:'M1', name:'Binary Addition', xp:40, type:'convert',
    text:`<strong>Challenge 3b — Binary Addition</strong><br>Add the two 8-bit binary numbers <code>01001101</code> and <code>00100110</code>.<br>Type only the 8-bit binary result as your answer (no spaces).`,
    hints:['Add from the rightmost bit, carrying 1s left: 0+0=0, 1+1=0 carry 1, 1+1+1=1 carry 1 …', 'Work column by column exactly like decimal addition, but base 2.', 'Answer: 01110011'],
    check: ans => ans.trim().replace(/\s/g,'') === '01110011',
  },
  {
    mod:'M1', name:'Overflow Spotter', xp:20, type:'identify',
    text:`<strong>Identify it — 1.1c Binary Addition & Overflow</strong><br>An 8-bit register holds <code>11111111</code>. You add <code>00000001</code> to it.<br>Does this cause overflow? Type <code>yes</code> or <code>no</code>.`,
    hints:['The true result needs 9 bits — but an 8-bit register can only hold 8.'],
    check: ans => /^y/i.test(ans.trim()),
  },
  { mod:'M1', name:'1.1d Logical Shifts', xp:15, type:'lesson', bookFile:'1-1d-logical-shifts.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {
    mod:'M1', name:'Shift Effect', xp:20, type:'complete',
    text:`<strong>Complete it — 1.1d Logical Shifts</strong><br>Shifting a binary number one place to the LEFT ______ its value by 2 (assuming no overflow).`,
    hints:['Think about what happens to decimal 6 (00000110) after a left shift → 00001100.'],
    check: ans => /multipl/i.test(ans.trim()),
  },
  { mod:'M1', name:'1.1e Two\'s Complement', xp:15, type:'lesson', bookFile:'1-1e-twos-complement.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {
    mod:'M1', name:'Binary Subtraction', xp:40, type:'convert',
    text:`<strong>Challenge 3c — Binary Subtraction</strong><br>Using <strong>two's complement</strong>, calculate <code>01011010</code> − <code>00010110</code> as 8-bit binary numbers.<br>Type only the 8-bit binary result as your answer (no spaces).`,
    hints:["Find the two's complement of 00010110: invert all bits (11101001), then add 1 → 11101010.", 'Add that to 01011010 using binary addition, discarding any overflow carry off the top.', 'Answer: 01000100'],
    check: ans => ans.trim().replace(/\s/g,'') === '01000100',
  },
  {
    mod:'M1', name:"Two's Complement Method", xp:20, type:'complete',
    text:`<strong>Complete it — 1.1e Two's Complement</strong><br>To find the two's complement of a binary number: invert all the bits, then ______.`,
    hints:['This is the step that turns "ones complement" into "twos complement".'],
    check: ans => /add\s*1|\+\s*1/i.test(ans.trim()),
  },
  { mod:'M1', name:'1.2a ASCII & Unicode', xp:15, type:'lesson', bookFile:'1-2a-ascii-unicode.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {
    mod:'M1', name:'ASCII or Unicode?', xp:20, type:'identify',
    text:`<strong>Identify it — 1.2a ASCII &amp; Unicode</strong><br>Which character set can represent emoji (😀) and every writing system in the world: <code>ASCII</code> or <code>Unicode</code>?`,
    hints:['ASCII only has 128 (or 256 extended) codes — nowhere near enough for emoji plus every alphabet.'],
    check: ans => /unicode/i.test(ans.trim()),
  },
  { mod:'M1', name:'1.2b Representation of Sound', xp:15, type:'lesson', bookFile:'1-2b-sound-representation.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {
    mod:'M1', name:'Sound Digitisation', xp:40, type:'theory',
    text:`<strong>Challenge 4 — Sound Digitisation</strong><br>Explain how sound is digitised. Your answer must mention: <em>analogue</em>, <em>sample</em>, <em>sample rate</em> (or frequency), and <em>bit depth</em> (or sample depth / resolution).`,
    hints:['Sound is an analogue wave. An ADC (analogue-to-digital converter) takes samples at regular intervals.', 'Sample rate = number of samples per second (Hz). Higher sample rate = better quality.', 'Bit depth = number of bits per sample. Higher bit depth = more amplitude levels = better quality.'],
    check: ans => {
      const a = ans.toLowerCase()
      return a.includes('analogue') && (a.includes('sample rate') || a.includes('frequency')) &&
             (a.includes('bit depth') || a.includes('sample depth') || a.includes('resolution')) &&
             a.includes('sample')
    },
  },
  {
    mod:'M1', name:'Sample Rate Fill-In', xp:20, type:'fill',
    text:`<strong>Fill in the blank — 1.2b Representation of Sound</strong><br>The number of samples taken per second during sound digitisation is called the sample ______.`,
    hints:['Measured in Hz — e.g. CD-quality audio samples 44,100 times a second.'],
    check: ans => /rate/i.test(ans.trim()),
  },
  { mod:'M1', name:'1.2c Representation of Images', xp:15, type:'lesson', bookFile:'1-2c-image-representation.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {
    mod:'M1', name:'Pixel Grid File Size', xp:20, type:'identify',
    text:`<strong>Identify it — 1.2c Representation of Images</strong><br>
      <div style="display:flex;justify-content:center;margin:10px 0;">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <g stroke="#333">
            <rect x="0" y="0" width="35" height="35" fill="#111"/><rect x="35" y="0" width="35" height="35" fill="#eee"/><rect x="70" y="0" width="35" height="35" fill="#666"/><rect x="105" y="0" width="35" height="35" fill="#fff"/>
            <rect x="0" y="35" width="35" height="35" fill="#eee"/><rect x="35" y="35" width="35" height="35" fill="#111"/><rect x="70" y="35" width="35" height="35" fill="#fff"/><rect x="105" y="35" width="35" height="35" fill="#666"/>
            <rect x="0" y="70" width="35" height="35" fill="#666"/><rect x="35" y="70" width="35" height="35" fill="#fff"/><rect x="70" y="70" width="35" height="35" fill="#111"/><rect x="105" y="70" width="35" height="35" fill="#eee"/>
            <rect x="0" y="105" width="35" height="35" fill="#fff"/><rect x="35" y="105" width="35" height="35" fill="#666"/><rect x="70" y="105" width="35" height="35" fill="#eee"/><rect x="105" y="105" width="35" height="35" fill="#111"/>
          </g>
        </svg>
      </div>
      This is a 4×4 pixel bitmap using <strong>2 bits per pixel</strong> (4 shades of grey). What is the total file size, in <strong>bits</strong> (ignore any header)?`,
    hints:['Total bits = width × height × bits-per-pixel.', '4 × 4 × 2 = ?'],
    check: ans => parseInt(ans.trim()) === 32,
  },
  { mod:'M1', name:'1.3a Units & File Size', xp:15, type:'lesson', bookFile:'1-3a-units-file-size.html', hints:[],
    text:'Read the full lesson (theory, key terms, worked examples) and try its 6 practice questions, then mark it complete.' },
  {

  {
    mod:'M2', name:'RAM vs ROM', xp:30, type:'theory',
    text:`<strong>Challenge 6 — Memory</strong><br>State <strong>two differences</strong> between RAM and ROM.<br>Your answer should mention volatility and write access.`,
    hints:['RAM is volatile — it loses data when power is removed. ROM is non-volatile.', 'RAM can be read and written. ROM can only be read (Read-Only Memory).', 'RAM stores running programs; ROM stores firmware/BIOS.'],
    check: ans => {
      const a = ans.toLowerCase()
      // Previously never even required the word ROM, and accepted
      // "I read a book about power." plus the fully inverted answer
      // "ROM is volatile … RAM is non-volatile and read-only."
      // Now both terms are required, and each must carry its OWN correct
      // property: RAM volatile (and not described as non-volatile), ROM the
      // opposite.
      if (!word(a, 'ram') || !word(a, 'rom')) return false
      const ramVolatile = about(a, 'ram', ['volatile', 'loses', 'lost', 'temporary'], ['non-volatile', 'nonvolatile', 'permanent'])
                          || /ram[^.;]*\blos(e|es|t)\b[^.;]*power/i.test(a)
      // Careful: '-' is not a word character, so \bvolatile\b matches INSIDE
      // "non-volatile". Strip that phrase before testing for a bare "volatile",
      // or a correct ROM answer trips its own negative guard.
      const romPermanent = clauses(a).some(c => {
        if (!word(c, 'rom')) return false
        const saysPermanent = /\bnon-?volatile\b/i.test(c) || anyWord(c, 'permanent', 'keeps', 'retains', 'read-only')
        const saysVolatile  = word(c.replace(/\bnon-?volatile\b/ig, ''), 'volatile')
        return saysPermanent && !saysVolatile
      })
      return ramVolatile && romPermanent
    },
  },

    mod:'M3', name:'Encryption', xp:40, type:'theory',
    text:`<strong>Challenge 13 — Encryption</strong><br>Define <em>encryption</em>. Then explain the difference between <strong>symmetric</strong> and <strong>asymmetric</strong> encryption.`,
    hints:['Encryption converts plaintext into ciphertext using an algorithm and a key.', 'Symmetric: the same key is used for encryption and decryption. Fast but key distribution is a problem.', 'Asymmetric: uses a public key to encrypt and a private key to decrypt. Slower but more secure for key exchange.'],

      // SYMMETRIC) passed. \b fixes this: \bsymmetric\b does not match inside
      // "asymmetric". Each term must also carry its correct key count.

      return symOneKey && asymTwoKey
    },

  {
    mod:'M5', name:'Bubble Sort Trace', xp:50, type:'trace',
    text:`<strong>Challenge 17 — Bubble Sort</strong><br>Starting array: <code>[5, 3, 8, 1, 6]</code><br>Show the array after each <strong>complete pass</strong> of bubble sort (pass 1, 2, 3, 4).<br>Enter each pass on a new line as comma-separated values, e.g.:<br><code>3, 5, 1, 6, 8</code>`,
    hints:['Pass 1: compare adjacent pairs. 5,3→swap; 3,5,8,1,6 → 3,5,1,8,6 → 3,5,1,6,8', 'Pass 2: 3,1,5,6,8', 'Pass 3: 1,3,5,6,8 — Pass 4: 1,3,5,6,8 (already sorted)'],
    check: ans => {
      // Used to check ONLY line 1 (`expected.some(e => lines[0] === e)`),
      // and accepted ANY of the four passes there — so the final sorted array
      // counted as pass 1, and lines 2-4 were never looked at at all:
      // "1,3,5,6,8\nqqqq" passed this 50-XP challenge. Now every pass must be

      const lines = ans.trim().split('\n').map(l=>l.replace(/\s/g,'')).filter(Boolean)
      const expected = ['3,5,1,6,8','3,1,5,6,8','1,3,5,6,8','1,3,5,6,8']
      return lines.length === expected.length && expected.every((e,i)=>lines[i]===e)

  {
    mod:'M5', name:'Search Complexity', xp:40, type:'theory',
    text:`<strong>Challenge 18 — Time Complexity</strong><br>State the <strong>worst-case time complexity</strong> of linear search and binary search. For binary search, explain <em>why</em> it is faster and what condition the data must meet.`,
    hints:['Linear search: O(n) — must check every element in the worst case.', 'Binary search: O(log n) — halves the search space each time.', 'Binary search requires the data to be sorted first.'],
    check: ans => {
      const a = ans.toLowerCase()
      // The clauses used to be independent, so the SWAPPED answer
      // "Linear search is O(log n) and binary search is O(n)" passed:
      // 'linear' satisfied clause 1 and 'log n' satisfied clause 2 regardless
      // of which algorithm they were attached to. Now each complexity must sit
      // in the same clause as its own algorithm.
      const linearIsN   = clauses(a).some(c => word(c, 'linear') && /o\s*\(\s*n\s*\)/i.test(c) && !/log/i.test(c))
      const binaryIsLog = clauses(a).some(c => word(c, 'binary') && /log/i.test(c))
      const condition   = anyWord(a, 'sort', 'sorted', 'order', 'ordered') || /halv|half/i.test(a)
      return linearIsN && binaryIsLog && condition
    },

  {
    mod:'M5', name:'Stacks (LIFO)', xp:40, type:'theory',
    text:`<strong>Challenge 19 — Stacks</strong><br>Explain what a <strong>stack</strong> is and what LIFO means. Describe the <code>PUSH</code> and <code>POP</code> operations and give one real-world example of a stack being used in computing.`,
    hints:['LIFO = Last In, First Out — the last item added is the first to be removed.', 'PUSH adds an item to the top of the stack. POP removes the top item.', 'Real-world uses: undo/redo in editors, function call stack (return addresses), browser back button.'],
    check: ans => {
      const a = ans.toLowerCase()
      // Used to accept the inverted definition:
      // "LIFO means first in first out. PUSH removes the top item."
      // Reject an explicit FIFO expansion, and require PUSH/POP to be
      // described the right way round.
      if (!word(a, 'lifo')) return false
      if (/first\s+in\s*,?\s*first\s+out/i.test(a)) return false
      const pushAdds    = about(a, 'push', ['add', 'adds', 'put', 'puts', 'place', 'places', 'insert', 'inserts', 'onto', 'on'], ['remove', 'removes', 'take', 'takes', 'delete'])
      const popRemoves  = about(a, 'pop',  ['remove', 'removes', 'take', 'takes', 'off', 'delete', 'deletes', 'retrieve'], ['add', 'adds', 'insert'])
      const hasUse      = anyWord(a, 'undo', 'call', 'back', 'browser', 'function', 'return', 'recursion', 'backtrack')
      return (pushAdds || popRemoves) && hasUse
    },
  },

      const lines = ans.trim().split('\n').map(l=>l.trim()).filter(Boolean)
      return lines.length === 2 && lines[0] === '3' && lines[1] === '5'
    },
  },

const CHALLENGE_LESSON = {
  // ── M1 — Data Representation ────────────────────────────────────────────────
  'M1/Binary→Decimal': { title: 'Binary place values, right to left', html: `
    <div class="cl-block"><h4>Each position is worth a power of 2</h4>
      <p>An 8-bit binary number's positions, right to left, are worth 1, 2, 4, 8, 16, 32, 64, 128 — sum the values of the positions that are "1" to get the decimal number.</p></div>
    <div class="cl-block"><h4>Why base 2, not base 10</h4>
      <p>A computer's memory is built from switches with only two real states (on/off) — binary is the natural way to count using exactly two symbols, the same way our normal counting uses ten (0-9) because we have ten fingers.</p></div>` },
  'M1/Decimal→Hex': { title: 'Hexadecimal — base 16, using A-F for 10-15', html: `
    <div class="cl-block"><h4>Divide by 16, track the remainder</h4>
      <p>Converting to hex means repeatedly dividing by 16 and recording the remainder — since a single digit can't represent 10-15, hex borrows the letters A (10) through F (15) to keep each digit single-character.</p></div>
    <div class="cl-block"><h4>Why hex exists at all</h4>
      <p>Hex is popular because ONE hex digit represents exactly 4 binary digits (a "nibble") — a long, hard-to-read binary string becomes a short, human-friendly hex string, used constantly for memory addresses and colour codes.</p></div>` },
  'M1/File Size': { title: 'File size = pixels × colour depth', html: `
    <div class="cl-block"><h4>Every pixel needs a fixed number of bits</h4>
      <p>Total bits = width × height × bits-per-pixel (colour depth) — an 800×600 image at 24-bit colour needs 800×600×24 bits just to store every pixel's colour.</p></div>
    <div class="cl-block"><h4>Converting bits → bytes → MB</h4>
      <p>Divide by 8 to get bytes (there are 8 bits in a byte), then divide by 1,048,576 (1024×1024) to get megabytes — the SAME "divide by 1024" idea from Grade 8's storage-units challenge, just chained twice.</p></div>` },
  'M1/Binary Addition': { title: 'Binary addition — carrying, just like decimal', html: `
    <div class="cl-block"><h4>The same column-addition method, base 2</h4>
      <p>Add from the rightmost bit: 0+0=0, 0+1=1, 1+1=0 carry 1, 1+1+1=1 carry 1 — exactly the column-by-column carrying method you already know from decimal addition, just with only two digits instead of ten.</p></div>
    <div class="cl-block"><h4>Overflow — running out of room</h4>
      <p>If a carry is left over after adding the leftmost bit, that's called <strong>overflow</strong> — the true result needs MORE bits than the register has room for, an important limitation of fixed-width binary storage.</p></div>` },
  'M1/Binary Subtraction': { title: "Two's complement — subtraction via addition", html: `
    <div class="cl-block"><h4>Subtracting by adding a negative</h4>
      <p>Computers don't have a separate "subtract" circuit for this — instead, they find the two's complement (the negative) of the second number, then just ADD, reusing the same addition circuit for both operations.</p></div>
    <div class="cl-block"><h4>The two's complement recipe</h4>
      <p>Invert every bit, then add 1 — that's it. This gives a genuinely correct negative representation that lets addition and subtraction share the exact same hardware.</p></div>` },
  'M1/Sound Digitisation': { title: 'Sound is analogue — sampling makes it digital', html: `
    <div class="cl-block"><h4>An ADC takes snapshots of a continuous wave</h4>
      <p>Real sound is a continuous, smooth (analogue) wave — an Analogue-to-Digital Converter (ADC) takes regular snapshots (samples) of that wave's height, turning it into a series of discrete numbers a computer can store.</p></div>
    <div class="cl-block"><h4>Sample rate and bit depth both affect quality</h4>
      <p><strong>Sample rate</strong> = how many snapshots per second (more = smoother over time). <strong>Bit depth</strong> = how many possible height values each snapshot can have (more = more accurate amplitude). Both independently improve quality — and both cost more storage.</p></div>` },

  // ── M2 — Hardware & Software ─────────────────────────────────────────────────
  'M2/CPU Components': { title: 'ALU, CU, and registers — the CPU\'s core parts', html: `
    <div class="cl-block"><h4>Three parts, three jobs</h4>
      <p>The <strong>ALU</strong> (Arithmetic Logic Unit) does calculations and comparisons. The <strong>CU</strong> (Control Unit) fetches, decodes, and coordinates every instruction. <strong>Registers</strong> are tiny, ultra-fast storage locations right inside the CPU.</p></div>
    <div class="cl-block"><h4>Why registers, when there's already RAM?</h4>
      <p>Registers are dramatically faster than RAM but hold only a handful of values at a time — the CPU keeps whatever it's working on RIGHT NOW in registers, reaching out to slower RAM only when it must.</p></div>` },
  'M2/RAM vs ROM': { title: 'Volatile vs. non-volatile memory', html: `
    <div class="cl-block"><h4>RAM forgets when the power goes; ROM doesn\'t</h4>
      <p><strong>RAM</strong> is volatile — everything in it vanishes the instant power is removed. <strong>ROM</strong> is non-volatile — it keeps its contents with no power at all, which is exactly why it's used to store a computer's startup instructions (firmware/BIOS).</p></div>
    <div class="cl-block"><h4>Read AND write vs. read only</h4>
      <p>RAM can be both read from and written to constantly, as programs run. ROM (Read-Only Memory) is normally only ever READ from during normal operation — that's literally what its name says.</p></div>` },
  'M2/FDE Cycle': { title: 'Fetch — Decode — Execute, the CPU\'s heartbeat', html: `
    <div class="cl-block"><h4>Every single instruction goes through all three stages</h4>
      <p><strong>Fetch</strong>: the address in the PC is copied to the MAR, and the instruction at that address is copied into the MDR then the CIR. <strong>Decode</strong>: the CU figures out what the instruction in the CIR actually means. <strong>Execute</strong>: the ALU (or other component) carries it out.</p></div>
    <div class="cl-block"><h4>A tight, endlessly repeating loop</h4>
      <p>The moment one instruction finishes executing, the cycle immediately starts again on the NEXT instruction — this fetch-decode-execute loop runs continuously, billions of times per second, for as long as the computer is on.</p></div>` },
  'M2/Device Types': { title: 'Input, output, and storage — three different jobs', html: `
    <div class="cl-block"><h4>Getting data IN, showing results OUT, keeping data long-term</h4>
      <p><strong>Input devices</strong> (keyboard, mouse, scanner) get data INTO the computer. <strong>Output devices</strong> (monitor, printer, speaker) present results back to the user. <strong>Storage devices</strong> (hard disk, SSD, USB) keep data even when the computer is off.</p></div>
    <div class="cl-block"><h4>Some devices do more than one job</h4>
      <p>A touchscreen is BOTH input (you touch it) and output (it displays) — a genuine exception worth noticing, since most devices cleanly fit into just one category.</p></div>` },

  // ── M3 — Networking ───────────────────────────────────────────────────────────
  'M3/LAN vs WAN': { title: 'Scale — local vs. wide area networks', html: `
    <div class="cl-block"><h4>A LAN covers one site; a WAN spans many</h4>
      <p>A <strong>LAN</strong> (Local Area Network) covers a small area, like one building, usually owned by one organisation. A <strong>WAN</strong> (Wide Area Network) spans huge geographic areas — cities, countries, even the whole planet — and typically links MULTIPLE organisations.</p></div>
    <div class="cl-block"><h4>The internet is the ultimate WAN</h4>
      <p>Your school's own network is a LAN; the internet itself — connecting millions of separate networks worldwide — is the largest WAN that exists.</p></div>` },
  'M3/Client-Server vs P2P': { title: 'A central authority vs. everyone equal', html: `
    <div class="cl-block"><h4>Client-server: one central provider</h4>
      <p>In a client-server model, a central SERVER provides resources to many clients — easier to manage security and backups centrally, but if the server fails, EVERY client is affected at once.</p></div>
    <div class="cl-block"><h4>Peer-to-peer: no single point of failure</h4>
      <p>In peer-to-peer, every device is equal, sharing resources directly with each other — no single server to fail, but much harder to control security consistently across every device.</p></div>` },
  'M3/TCP/IP Layers': { title: 'Four layers, each with its own job', html: `
    <div class="cl-block"><h4>Application → Transport → Internet → Network Access</h4>
      <p><strong>Application</strong> provides the services apps actually use (HTTP, FTP, DNS). <strong>Transport</strong> ensures reliable delivery end-to-end. <strong>Internet</strong> handles addressing and routing via IP addresses. <strong>Network Access</strong> handles the physical transmission over the local network.</p></div>
    <div class="cl-block"><h4>Why split into layers at all?</h4>
      <p>Each layer only has to worry about its OWN job — the Application layer doesn't need to know how bits physically travel down a cable, and the Network Access layer doesn't need to know what a web page is. This separation is what lets the internet's technology evolve one layer at a time.</p></div>` },
  'M3/Protocols': { title: 'Different jobs need different protocols', html: `
    <div class="cl-block"><h4>SMTP, HTTPS, and FTP each solve one specific task</h4>
      <p><strong>SMTP</strong> (Simple Mail Transfer Protocol) sends email. <strong>HTTPS</strong> (HTTP Secure) is encrypted, secure web browsing. <strong>FTP</strong> (File Transfer Protocol) moves files between servers.</p></div>
    <div class="cl-block"><h4>A protocol is just an agreed set of rules</h4>
      <p>Every protocol is really just a shared agreement about HOW two computers should communicate for a specific purpose — matching the right protocol to the right task is exactly what this challenge tests.</p></div>` },

  // ── M4 — Security & Privacy ───────────────────────────────────────────────────
  'M4/Encryption': { title: 'Symmetric — one key; Asymmetric — two keys', html: `
    <div class="cl-block"><h4>Encryption scrambles data using a key</h4>
      <p>Encryption converts readable plaintext into scrambled ciphertext using an algorithm and a key — only someone with the correct key can reverse it back to plaintext.</p></div>
    <div class="cl-block"><h4>Same key vs. a public/private pair</h4>
      <p><strong>Symmetric</strong> encryption uses the SAME key for both encrypting and decrypting — fast, but sharing that key safely is a real problem. <strong>Asymmetric</strong> uses a public key to encrypt and a DIFFERENT private key to decrypt — slower, but solves the key-sharing problem.</p></div>` },
  'M4/Malware Types': { title: 'Different malware, different behaviour', html: `
    <div class="cl-block"><h4>A keylogger secretly records what you type</h4>
      <p>Software that silently records every keystroke (including passwords) and sends it to an attacker is called a <strong>keylogger</strong> — a type of spyware.</p></div>
    <div class="cl-block"><h4>Viruses, worms, trojans, ransomware — each spreads differently</h4>
      <p>A <strong>virus</strong> attaches to files and replicates. A <strong>worm</strong> self-replicates across a network with no help needed. A <strong>trojan</strong> disguises itself as legitimate software. <strong>Ransomware</strong> encrypts your files and demands payment to unlock them.</p></div>` },
  'M4/Network Protection': { title: 'Multiple layers of defence', html: `
    <div class="cl-block"><h4>A firewall filters traffic based on rules</h4>
      <p>A <strong>firewall</strong> monitors incoming/outgoing traffic and blocks anything unauthorised — like a security guard checking every packet against a rulebook.</p></div>
    <div class="cl-block"><h4>Encryption and authentication protect differently</h4>
      <p><strong>Encryption</strong> scrambles data so it's useless even if intercepted. <strong>Authentication</strong> (passwords, MFA, biometrics) ensures only the right PEOPLE get access in the first place. Real networks layer several of these methods together, since no single one covers every threat.</p></div>` },
  'M4/Ethics Dilemma': { title: 'Security vs. privacy — a genuine trade-off', html: `
    <div class="cl-block"><h4>There's rarely a clean right answer</h4>
      <p>Mass surveillance genuinely could help catch criminals faster — but it also genuinely invades the privacy and freedom of everyone, not just wrongdoers. Real technology ethics questions like this usually involve balancing two legitimate concerns against each other.</p></div>
    <div class="cl-block"><h4>A good answer acknowledges BOTH sides</h4>
      <p>Dismissing one side entirely ("privacy doesn't matter" or "security doesn't matter") misses the point of the question — a strong answer engages honestly with the real trade-off between privacy, security, and freedom.</p></div>` },

  // ── M5 — Algorithms ────────────────────────────────────────────────────────────
  'M5/Bubble Sort Trace': { title: 'Bubble sort — swap adjacent pairs, pass after pass', html: `
    <div class="cl-block"><h4>Compare neighbours, swap if out of order</h4>
      <p>Each PASS walks through the array comparing every pair of neighbours, swapping them if they're in the wrong order — the largest unsorted value "bubbles" up to its correct position by the end of each pass.</p></div>
    <div class="cl-block"><h4>Tracing every pass, not just the final result</h4>
      <p>Showing the array after EVERY pass (not just the final sorted result) proves you understand the mechanism, not just that you know the array ends up sorted — the same "show your working" idea as a maths trace table.</p></div>` },
  'M5/Search Complexity': { title: 'O(n) vs. O(log n) — why binary search wins', html: `
    <div class="cl-block"><h4>Linear search checks everything; binary search halves each time</h4>
      <p>Linear search's worst case is <strong>O(n)</strong> — it might have to check every single element. Binary search's worst case is <strong>O(log n)</strong> — it throws away half the remaining data with every single comparison.</p></div>
    <div class="cl-block"><h4>Binary search only works on SORTED data</h4>
      <p>The "throw away half" trick only works because sorted data lets you know instantly which half the target must be in — binary search on unsorted data would give completely wrong results.</p></div>` },
  'M5/Stacks (LIFO)': { title: 'LIFO — Last In, First Out', html: `
    <div class="cl-block"><h4>PUSH adds to the top; POP removes from the top</h4>
      <p>A stack only ever adds or removes from ONE end — the top. <strong>PUSH</strong> adds a new item on top; <strong>POP</strong> removes whatever is currently on top. The last item pushed is always the first one popped — that's what LIFO means.</p></div>
    <div class="cl-block"><h4>Real uses: undo, and the function call stack</h4>
      <p>An editor's undo button is a real stack — the MOST RECENT action is always the first one undone. A program's own function calls work the same way: the call stack tracks which function to return to, most-recent-first.</p></div>` },
  'M5/Trace Table': { title: 'Tracing a WHILE loop, step by step', html: `
    <div class="cl-block"><h4>Update the variable, check the condition, repeat</h4>
      <p>x starts at 1. Each pass: add 2 to x, then OUTPUT it, THEN check whether the loop condition (x &lt; 5) still holds before looping again.</p></div>
    <div class="cl-block"><h4>The loop stops the moment the condition is false</h4>
      <p>Once x reaches 5, the condition <code>x &lt; 5</code> is no longer true — the loop stops immediately, BEFORE running its body again. Getting the exact stopping point right is the single most common trace-table mistake.</p></div>` },
}

// ── State ─────────────────────────────────────────────────────────────────────
function getAnswer() {
  const el = document.getElementById('ans-field')
  return el ? el.value : ''
}

function clearAnswer() {
  const el = document.getElementById('ans-field')
  if (el) el.value = ''
  document.getElementById('feedback').textContent = ''
}

function renderAnswerInput(ch) {
  const wrap = document.getElementById('ans-input-wrap')
  const checkBtn = document.getElementById('check-btn')
  const hintFooterBtn = document.getElementById('hint-footer-btn')
  if (ch.type === 'lesson') {
    // Self-check book lesson — no graded answer at all. Embed the real,
    // teacher-editable static lesson page (same file the teacher's editor
    // and the student "Browse textbook" index both use) instead of
    // duplicating its content here.
    const qs = currentClassId ? ('?classId=' + encodeURIComponent(currentClassId)) : ''
    wrap.innerHTML = `<iframe src="/lessons/igcse-y1-book/${ch.bookFile}${qs}" style="width:100%;height:52vh;min-height:380px;border:0;border-radius:10px;background:#0d0f1a;" title="Lesson"></iframe>`
    if (checkBtn) checkBtn.textContent = '✓ Mark lesson complete'
    if (hintFooterBtn) hintFooterBtn.style.display = 'none'
  } else {
    const multiline = ch.type === 'theory' || ch.type === 'trace'
    if (multiline) {
      wrap.innerHTML = `<textarea class="ans-input" id="ans-field" placeholder="Type your answer here…" rows="8"></textarea>`
    } else {
      wrap.innerHTML = `<input class="ans-input" id="ans-field" type="text" placeholder="Type your answer here…" />`
    }
    if (checkBtn) checkBtn.textContent = '✓ Check'
    if (hintFooterBtn) hintFooterBtn.style.display = ''
  }
  document.getElementById('ch-type-badge').textContent = ch.type.toUpperCase()
}

function renderPills() {
  const row = document.getElementById('ch-pills'); row.innerHTML = ''
  CHALLENGES.forEach((ch, i) => {
    const el = document.createElement('div')
    el.className = 'ch-pill' + (i === activeIdx ? ' active' : '') + (completed.has(i) ? ' done' : '')
    el.textContent = (completed.has(i) ? '✓ ' : '') + ch.mod + ' ' + ch.name
    el.onclick = () => selectChallenge(i)
    row.appendChild(el)
  })
  renderNavStrip()
}

function renderNavStrip() {
  const cur = document.getElementById('ch-nav-current')
  const ch  = CHALLENGES[activeIdx]
  if (cur && ch) cur.textContent = (activeIdx + 1) + ' / ' + CHALLENGES.length + ' — ' + ch.mod + ' ' + ch.name + (completed.has(activeIdx) ? ' ✓' : '')
}

function stepChallenge(delta) {
  const next = activeIdx + delta
  if (next < 0 || next >= CHALLENGES.length) return
  selectChallenge(next)
}

function toggleChallengeList() {
  const row = document.getElementById('ch-pills')
  const tog = document.getElementById('ch-nav-toggle')
  const expanded = row.classList.toggle('expanded')
  if (tog) tog.textContent = expanded ? '✕ Hide list' : '☰ All challenges'
}

function selectChallenge(i) {
  activeIdx = i; hintIdx = 0; challengeStartedAt = Date.now()
  const ch = CHALLENGES[i]
  document.getElementById('ch-text').innerHTML = ch.text
  document.getElementById('xp-pill').textContent = '+' + ch.xp + ' XP'
  document.getElementById('ans-prompt').innerHTML = ch.type === 'lesson'
    ? 'Read through the lesson below, then mark it complete when you’re done.'
    : ch.text
  document.getElementById('hint-log').innerHTML = ''
  document.getElementById('feedback').textContent = ''
  renderAnswerInput(ch)
  renderPills()
  renderChallengeLesson(ch)
}

// 📘 Full per-challenge lesson — CHALLENGE_LESSON defined after CHALLENGES,
// keyed by "mod/name" (no dedicated id field on these challenges).
let _clExpanded = true
function renderChallengeLesson(ch) {
  const wrap  = document.getElementById('ch-lesson')
  const body  = document.getElementById('cl-body')
  const title = document.getElementById('cl-title')
  if (!wrap) return
  const key = ch.mod + '/' + ch.name
  const lesson = typeof CHALLENGE_LESSON !== 'undefined' ? CHALLENGE_LESSON[key] : null
  if (!lesson) { wrap.style.display = 'none'; return }
  wrap.style.display = ''
  title.textContent = lesson.title
  body.innerHTML = lesson.html
  body.classList.toggle('collapsed', !_clExpanded)
  document.getElementById('cl-arrow').textContent = _clExpanded ? '▾' : '▸'
}
function toggleChallengeLesson() {
  _clExpanded = !_clExpanded
  document.getElementById('cl-body').classList.toggle('collapsed', !_clExpanded)
  document.getElementById('cl-arrow').textContent = _clExpanded ? '▾' : '▸'
}

function markLessonComplete() {
  const ch = CHALLENGES[activeIdx]
  if (!ch) return
  if (completed.has(activeIdx)) {
    document.getElementById('feedback').className = 'feedback ok'
    document.getElementById('feedback').textContent = '✓ Already marked complete.'
    return
  }
  completed.add(activeIdx)
  renderPills()
  showToast('Lesson complete! +' + ch.xp + ' XP')
  if (me) { BF.addXP(me.id, ch.xp); BF.recordAttempt(me.id, 'gy1-c' + activeIdx, { passed: true, score: 100 }) }
  LessonSaves.save('igcse-y1', ch.mod + '/' + ch.name, { passed: true, xpEarned: ch.xp, code: 'self-check' })
  try { reportRealProgress(ch, Date.now() - challengeStartedAt) } catch (e) {}
  document.getElementById('feedback').className = 'feedback ok'
  document.getElementById('feedback').textContent = '✓ Marked complete!'
}

function checkAnswer() {
  const ch = CHALLENGES[activeIdx]
  if (!ch) return
  if (ch.type === 'lesson') { markLessonComplete(); return }
  const ans = getAnswer().trim()
  if (!ans) { document.getElementById('feedback').className = 'feedback err'; document.getElementById('feedback').textContent = 'Please type an answer first.'; return }

  if (ch.check(ans)) {
    document.getElementById('feedback').className = 'feedback ok'
    document.getElementById('feedback').textContent = '✓ Correct!'
    if (!completed.has(activeIdx)) {
      completed.add(activeIdx)
      renderPills()
      showToast('Challenge complete! +' + ch.xp + ' XP')
      if (me) { BF.addXP(me.id, ch.xp); BF.recordAttempt(me.id, 'gy1-c' + activeIdx, { passed: true, score: 100 }) }
      LessonSaves.save('igcse-y1', ch.mod + '/' + ch.name, { passed: true, xpEarned: ch.xp, code: ans })
      try { reportRealProgress(ch, Date.now() - challengeStartedAt) } catch (e) {}
    }
  } else {
    document.getElementById('feedback').className = 'feedback err'
    document.getElementById('feedback').textContent = '✗ Not quite — check the hint for guidance.'
  }
}

function showHint() {
  const ch = CHALLENGES[activeIdx]; if (!ch) return
  const log = document.getElementById('hint-log')
  if (hintIdx < ch.hints.length) {
    const div = document.createElement('div')
    div.className = 'hint-line'
    div.textContent = '💡 Hint ' + (hintIdx + 1) + ': ' + ch.hints[hintIdx++]
    log.appendChild(div)
  } else {
    const div = document.createElement('div')
    div.className = 'hint-line'
    div.textContent = '— No more hints!'
    log.appendChild(div)
  }
}

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3200)
}

// A teacher previewing this page (embedded via IgcseLessonEditor.tsx's
// iframe, ?classId=&teacher=1 — the same convention every lesson editor
// uses) must be able to open ANY stage regardless of student progress, since
// there IS no student progress in that context.
function isTeacherPreview() { return new URLSearchParams(window.location.search).get('teacher') === '1' }

// ── Quest Map — 🏔 Theory Peaks ──────────────────────────────
function showQuestMap() {
  const EMO = {M1:'💾',M2:'🖥',M3:'🌐',M4:'🔐',M5:'🧮',M6:'🌍',M7:'🤖'}
  const stagesFor = mod => CHALLENGES
    .map((c, i) => ({ c, i }))
    .filter(x => x.c.mod === mod)
    .map(x => ({ id: String(x.i), emoji: EMO[mod] || '📘', label: x.c.name, done: completed.has(x.i) }))
  QuestMap.show({
    title: '🏔 Theory Peaks — IGCSE Year 1',
    subtitle: 'Climb seven peaks of Cambridge 0478 theory — each mixes the full textbook lesson with hands-on challenges on the same topic. Every summit counts.',
    accent: '#2dd4bf',
    layout: 'path', softLock: true, hardLock: !isTeacherPreview(),
    avatarSvg: '<span style="font-size:22px;">🏔</span>',
    worlds: [
      { name: '💾 Peak 1 — Data Representation', sub: 'Lessons: binary, hex, sound & images · Challenges: conversions, file sizes', live: true, stages: stagesFor('M1') },
      { name: '🖥 Peak 2 — Hardware & Software', sub: 'Lessons: CPU, storage, devices, OS & languages · Challenges: CPU, memory, FDE cycle', live: true, stages: stagesFor('M2') },
      { name: '🌐 Peak 3 — Data Transmission & Networking', sub: 'Lessons: packets, error checks, encryption · Challenges: LANs, protocols, TCP/IP', live: true, stages: stagesFor('M3') },
      { name: '🔐 Peak 4 — Security & Privacy', sub: 'Encryption, malware, staying safe', live: true, stages: stagesFor('M4') },
      { name: '🧮 Peak 5 — Algorithms', sub: 'Sorting, searching, trace tables', live: true, stages: stagesFor('M5') },
      { name: '🌍 Peak 6 — The Internet & Its Uses', sub: 'Textbook: URLs, DNS, cookies, cryptocurrency, cyber security', live: true, stages: stagesFor('M6') },
      { name: '🤖 Peak 7 — Automated & Emerging Tech', sub: 'Textbook: automated systems, robotics, AI', live: true, stages: stagesFor('M7') },
    ],
    onOpen: id => { selectChallenge(parseInt(id)) },
  })
}

// ── Teacher-editable per-class content overrides ─────────────────────────────
// Mutates CHALLENGES entries IN PLACE (direct array indexing everywhere —
// CHALLENGES[i] IS the same object real rendering reads, no object-spread
// copy issue). Both scopes are keyed by INDEX, not the mod/name pair a
// challenge is otherwise identified by (a rename would break a compound-key
// lookup on the next edit — see lib/igcse-content.ts).
async function fetchClassIdIgcse() {
  const urlParam = new URLSearchParams(window.location.search).get('classId')
  if (urlParam) return urlParam
  if (!me) return null
  try {
    const res = await fetch('/api/profile')
    if (!res.ok) return null
    const data = await res.json()
    return data.classId ?? data.class_id ?? null
  } catch (e) { return null }
}
async function applyClassOverrides() {
  const classId = await fetchClassIdIgcse()
  currentClassId = classId   // used to build the book-lesson iframe src so teacher edits show up
  if (!classId) return
  try {
    const res = await fetch(`/api/class-lesson-overrides?classId=${encodeURIComponent(classId)}&lessonKey=igcse-y1`)
    if (!res.ok) return
    const { overrides } = await res.json()
    if (!overrides || !overrides.length) return
    const stageOv  = new Map(overrides.filter(o => o.scope === 'stage').map(o => [o.target_id, o.override_data]))
    const lessonOv = new Map(overrides.filter(o => o.scope === 'lesson').map(o => [o.target_id, o.override_data]))
    // Capture each challenge's ORIGINAL mod/name BEFORE applying any stage
    // override — a stage override can rename `name`, and looking up
    // CHALLENGE_LESSON with the already-renamed value would silently miss
    // the real entry (the same pitfall this whole index-keyed design exists
    // to avoid — must not reintroduce it here by ordering these two passes
    // wrong).
    const originalKeys = CHALLENGES.map(ch => ch.mod + '/' + ch.name)
    CHALLENGES.forEach((ch, i) => {
      const so = stageOv.get(String(i))
      if (so) Object.assign(ch, so)
    })
    if (typeof CHALLENGE_LESSON !== 'undefined') {
      CHALLENGES.forEach((ch, i) => {
        const lo = lessonOv.get(String(i))
        if (!lo) return
        const key = originalKeys[i]
        CHALLENGE_LESSON[key] = CHALLENGE_LESSON[key] ? Object.assign(CHALLENGE_LESSON[key], lo) : lo
      })
    }
  } catch (e) { console.warn('[igcse-y1] override load failed (offline?):', e.message) }
}

// ── Init ──────────────────────────────────────────────────────────────────────
;(async () => {
  await applyClassOverrides()
  await LessonSaves.load('igcse-y1')
  LessonSaves.completedIds().forEach(id => { if (STAGE_INDEX[id] !== undefined) completed.add(STAGE_INDEX[id]) })
  LessonSaves.completedSet().forEach(idx => completed.add(idx))
  renderPills()
  showQuestMap()   // land on the map — nothing else renders until a stage is picked
})()
</script>
