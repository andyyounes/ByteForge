<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ByteForge — Pixel Grid Editor</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    body { padding-top:64px; min-height:100vh; }
    .layout { display:grid; grid-template-columns:1fr 340px; height:calc(100vh - 64px); overflow:hidden; }

    /* ── Left: canvas area ── */
    .canvas-panel { display:flex; flex-direction:column; border-right:1px solid var(--border); overflow:hidden; }
    .panel-header { padding:14px 20px; background:var(--bg-card); border-bottom:1px solid var(--border);
                    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0; }
    .panel-title { font-size:15px; font-weight:700; }
    .btn-row { display:flex; gap:8px; }
    .btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:.15s; }
    .btn-brand  { background:#b8ef4a; color:#0d0f1a; }
    .btn-brand:hover  { background:#a5d83d; }
    .btn-ghost  { background:var(--bg-raised); color:var(--fg); border:1px solid var(--border-hi); }
    .btn-ghost:hover  { background:rgba(255,255,255,.08); }

    .canvas-wrap { flex:1; display:flex; align-items:center; justify-content:center;
                   background:repeating-conic-gradient(rgba(255,255,255,.03) 0% 25%, transparent 0% 50%) 0 0 / 20px 20px;
                   overflow:auto; padding:24px; }
    #pixel-canvas { cursor:crosshair; image-rendering:pixelated; border:1px solid var(--border-hi);
                    box-shadow:0 0 40px rgba(0,0,0,.6); }

    /* ── Right: tools panel ── */
    .tools-panel { display:flex; flex-direction:column; overflow-y:auto; background:var(--bg-card); }
    .tools-section { padding:16px 20px; border-bottom:1px solid var(--border); }
    .tools-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.1em;
                   color:var(--fg-faint); margin-bottom:12px; }

    /* Color picker */
    .color-display { width:100%; height:48px; border-radius:8px; border:2px solid var(--border-hi);
                     cursor:pointer; transition:.2s; }
    .color-display:hover { border-color:var(--border-hi); transform:scale(1.01); }
    .rgb-sliders { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
    .slider-row { display:flex; align-items:center; gap:10px; }
    .slider-letter { width:14px; font-size:12px; font-weight:700; font-family:var(--mono); }
    .slider-letter.r { color:#f87171; }
    .slider-letter.g { color:#4ade80; }
    .slider-letter.b { color:#60a5fa; }
    input[type=range] { flex:1; height:4px; accent-color:#b8ef4a; cursor:pointer; }
    .slider-val { width:32px; text-align:right; font-size:12px; font-weight:600; font-family:var(--mono); color:var(--fg-dim); }

    /* Palette */
    .palette-grid { display:flex; flex-wrap:wrap; gap:6px; }
    .swatch { width:28px; height:28px; border-radius:6px; border:2px solid transparent; cursor:pointer; transition:.15s; }
    .swatch:hover  { transform:scale(1.15); }
    .swatch.active { border-color:#fff; box-shadow:0 0 0 1px rgba(255,255,255,.3); }
    .swatch.custom { border-style:dashed; border-color:var(--border-hi); display:flex; align-items:center; justify-content:center;
                     font-size:14px; color:var(--fg-faint); background:var(--bg-raised); }

    /* Tools */
    .tool-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .tool-btn { padding:9px 8px; border-radius:8px; font-size:12px; font-weight:600; text-align:center;
                background:var(--bg-raised); border:1px solid var(--border); color:var(--fg-dim); cursor:pointer; transition:.15s; }
    .tool-btn:hover  { border-color:var(--border-hi); color:var(--fg); }
    .tool-btn.active { background:rgba(184,239,74,.12); border-color:#b8ef4a; color:#b8ef4a; }

    /* Grid size */
    .size-grid { display:flex; gap:6px; flex-wrap:wrap; }
    .size-btn { padding:7px 12px; border-radius:6px; font-size:12px; font-weight:600;
                background:var(--bg-raised); border:1px solid var(--border); color:var(--fg-dim); cursor:pointer; transition:.15s; }
    .size-btn:hover  { border-color:var(--border-hi); color:var(--fg); }
    .size-btn.active { background:rgba(184,239,74,.12); border-color:#b8ef4a; color:#b8ef4a; }

    /* Challenge panel */
    .challenge-panel { flex-shrink:0; border-top:1px solid var(--border); }
    .challenge-inner { padding:16px 20px; }
    .challenge-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .challenge-title { font-size:13px; font-weight:700; }
    .challenge-target { display:flex; gap:12px; align-items:center; }
    .target-canvas { border:1px solid var(--border-hi); border-radius:4px; image-rendering:pixelated; }
    .challenge-text { font-size:12px; color:var(--fg-dim); line-height:1.5; }
    .match-score { font-size:22px; font-weight:800; font-family:var(--mono); }
    .match-score.good  { color:#4ade80; }
    .match-score.ok    { color:#fbbf24; }
    .match-score.start { color:var(--fg-faint); }

    /* Toast */
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px);
             padding:12px 24px; border-radius:10px; font-size:14px; font-weight:600;
             background:#1a2e1a; color:#bbf7d0; border:1px solid #16a34a;
             opacity:0; transition:.3s; z-index:9999; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    @media(max-width:760px) { .layout { grid-template-columns:1fr; grid-template-rows:55vh 1fr; } }
  </style>
  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/lesson-saves.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M10 1.5L18.5 10L10 18.5L1.5 10Z" fill="rgba(184,239,74,.18)" stroke="#b8ef4a" stroke-width="1.25" stroke-linejoin="round"/>
      <path d="M11.5 6.5L9 10.5H11.5L8.5 14" stroke="#b8ef4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">ByteForge</span>
  </div>
  <div class="nav-links"><a href="/student/dashboard">← Dashboard</a></div>
</nav>

<div class="layout">

  <!-- Left: Canvas -->
  <div class="canvas-panel">
    <div class="panel-header">
      <div class="panel-title">Pixel Grid Editor</div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="clearCanvas()">Clear</button>
        <button class="btn btn-ghost" onclick="downloadCanvas()">Download</button>
        <button class="btn btn-brand" onclick="checkChallenge()">Check my work</button>
      </div>
    </div>
    <div class="canvas-wrap">
      <canvas id="pixel-canvas" width="512" height="512"></canvas>
    </div>
  </div>

  <!-- Right: Tools -->
  <div class="tools-panel">

    <!-- Active colour -->
    <div class="tools-section">
      <div class="tools-label">Active Colour</div>
      <div id="color-display" class="color-display" style="background:#f97316" onclick="document.getElementById('native-picker').click()"></div>
      <input type="color" id="native-picker" style="display:none" value="#f97316" oninput="onNativeColor(this.value)"/>
      <div class="rgb-sliders">
        <div class="slider-row">
          <span class="slider-letter r">R</span>
          <input type="range" id="r-slider" min="0" max="255" value="249" oninput="onSlider()"/>
          <span class="slider-val" id="r-val">249</span>
        </div>
        <div class="slider-row">
          <span class="slider-letter g">G</span>
          <input type="range" id="g-slider" min="0" max="255" value="115" oninput="onSlider()"/>
          <span class="slider-val" id="g-val">115</span>
        </div>
        <div class="slider-row">
          <span class="slider-letter b">B</span>
          <input type="range" id="b-slider" min="0" max="255" value="22" oninput="onSlider()"/>
          <span class="slider-val" id="b-val">22</span>
        </div>
      </div>
    </div>

    <!-- Palette -->
    <div class="tools-section">
      <div class="tools-label">Colour Palette</div>
      <div class="palette-grid" id="palette"></div>
    </div>

    <!-- Tools -->
    <div class="tools-section">
      <div class="tools-label">Tools</div>
      <div class="tool-grid">
        <div class="tool-btn active" id="tool-draw"  onclick="setTool('draw')">✏ Draw</div>
        <div class="tool-btn"        id="tool-erase" onclick="setTool('erase')">◻ Erase</div>
        <div class="tool-btn"        id="tool-fill"  onclick="setTool('fill')">▣ Fill</div>
        <div class="tool-btn"        id="tool-pick"  onclick="setTool('pick')">⊙ Pick colour</div>
      </div>
    </div>

    <!-- Grid size -->
    <div class="tools-section">
      <div class="tools-label">Grid Size</div>
      <div class="size-grid">
        <div class="size-btn"        onclick="setGrid(8, event)">8×8</div>
        <div class="size-btn active" onclick="setGrid(16, event)">16×16</div>
        <div class="size-btn"        onclick="setGrid(32, event)">32×32</div>
        <div class="size-btn"        onclick="setGrid(64, event)">64×64</div>
      </div>
    </div>

    <!-- Challenge -->
    <div class="challenge-panel">
      <div class="challenge-inner">
        <div class="challenge-header">
          <div class="challenge-title">Challenge — Recreate the pattern</div>
          <button class="btn btn-ghost" style="padding:6px 10px;font-size:11px;" onclick="nextChallenge()">Next</button>
        </div>
        <div class="challenge-target">
          <canvas id="target-canvas" class="target-canvas" width="64" height="64" style="width:64px;height:64px;"></canvas>
          <div>
            <div class="challenge-text" id="challenge-text">Match the target pattern on the left using the pixel grid.</div>
            <div class="match-score start" id="match-score">— %</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let GRID = 16
let CELL
let pixels = []          // flat array of rgba strings
let activeTool = 'draw'
let isDrawing  = false
let activeColor = 'rgb(249,115,22)'
let r = 249, g = 115, b = 22

const PALETTE = [
  '#f87171','#fb923c','#fbbf24','#a3e635','#34d399','#38bdf8','#818cf8','#e879f9',
  '#ffffff','#d1d5db','#6b7280','#374151','#1f2937','#111827','#b8ef4a','#000000',
]

const CHALLENGES = [
  { name:'Heart', size:16, data: buildHeart() },
  { name:'Star',  size:16, data: buildStar()  },
  { name:'House', size:16, data: buildHouse() },
  { name:'Flag',  size:16, data: buildFlag()  },
]
let challengeIdx = 0

// ── Canvas setup ─────────────────────────────────────────────────────────────
const mainCanvas = document.getElementById('pixel-canvas')
const ctx = mainCanvas.getContext('2d')
const targetCanvas = document.getElementById('target-canvas')
const tctx = targetCanvas.getContext('2d')

function setGrid(n, ev) {
  GRID = n
  CELL = 512 / GRID
  pixels = Array(GRID * GRID).fill('transparent')
  // This was event.target.classList.add('active'), relying on the deprecated
  // global window.event. setGrid is ALSO called programmatically -- loadChallenge
  // calls it during init -- and there window.event is undefined, so this threw a
  // TypeError that halted top-level execution. Everything after it was lost:
  // the LessonSaves.load() IIFE never ran, so saved artwork and completion state
  // were never restored, and draw() was skipped so the grid did not even render.
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'))
  const btn = (ev && ev.target && ev.target.classList.contains('size-btn'))
    ? ev.target
    : Array.from(document.querySelectorAll('.size-btn'))
        .find(b => (b.getAttribute('onclick') || '').includes('setGrid(' + n))
  if (btn) btn.classList.add('active')
  draw()
}

function initGrid() {
  CELL = 512 / GRID
  pixels = Array(GRID * GRID).fill('transparent')
  draw()
}

function draw() {
  ctx.clearRect(0, 0, 512, 512)
  for (let i = 0; i < GRID; i++) {
    for (let j = 0; j < GRID; j++) {
      const c = pixels[i * GRID + j]
      if (c !== 'transparent') {
        ctx.fillStyle = c
        ctx.fillRect(j * CELL, i * CELL, CELL, CELL)
      }
    }
  }
  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'
  ctx.lineWidth = 1
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath()
    ctx.moveTo(i * CELL, 0)
    ctx.lineTo(i * CELL, 512)
    ctx.stroke()
    ctx.beginPath()
    ctx.moveTo(0, i * CELL)
    ctx.lineTo(512, i * CELL)
    ctx.stroke()
  }
}

function paintPixel(e) {
  const rect = mainCanvas.getBoundingClientRect()
  const scaleX = 512 / rect.width
  const scaleY = 512 / rect.height
  const mx = (e.clientX - rect.left) * scaleX
  const my = (e.clientY - rect.top)  * scaleY
  const j = Math.floor(mx / CELL)
  const i = Math.floor(my / CELL)
  if (i < 0 || i >= GRID || j < 0 || j >= GRID) return
  const idx = i * GRID + j
  if (activeTool === 'draw')  pixels[idx] = activeColor
  else if (activeTool === 'erase') pixels[idx] = 'transparent'
  else if (activeTool === 'pick') { setColorFromPixel(idx); setTool('draw') }
  else if (activeTool === 'fill') floodFill(j, i, pixels[idx], activeColor)
  draw()
  liveMatchScore()
}

mainCanvas.addEventListener('mousedown', e => { isDrawing = true; paintPixel(e) })
mainCanvas.addEventListener('mousemove', e => { if (isDrawing) paintPixel(e) })
let _pixelSaveTimer = null
mainCanvas.addEventListener('mouseup',   () => {
  isDrawing = false
  clearTimeout(_pixelSaveTimer)
  _pixelSaveTimer = setTimeout(() => {
    LessonSaves.save('pixel-grid', -1, { saveData: { pixels: pixels.slice() } })
  }, 2000)
})
mainCanvas.addEventListener('mouseleave',() => { isDrawing = false })
mainCanvas.addEventListener('touchstart', e => { isDrawing = true; paintPixel(e.touches[0]); e.preventDefault() }, {passive:false})
mainCanvas.addEventListener('touchmove',  e => { if (isDrawing) paintPixel(e.touches[0]); e.preventDefault() }, {passive:false})
mainCanvas.addEventListener('touchend',   () => { isDrawing = false })

function floodFill(x, y, target, replacement) {
  if (target === replacement) return
  const stack = [[x, y]]
  while (stack.length) {
    const [cx, cy] = stack.pop()
    if (cx < 0 || cx >= GRID || cy < 0 || cy >= GRID) continue
    if (pixels[cy * GRID + cx] !== target) continue
    pixels[cy * GRID + cx] = replacement
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])
  }
}

// ── Colour ───────────────────────────────────────────────────────────────────
function onSlider() {
  r = +document.getElementById('r-slider').value
  g = +document.getElementById('g-slider').value
  b = +document.getElementById('b-slider').value
  document.getElementById('r-val').textContent = r
  document.getElementById('g-val').textContent = g
  document.getElementById('b-val').textContent = b
  activeColor = `rgb(${r},${g},${b})`
  document.getElementById('color-display').style.background = activeColor
  document.getElementById('native-picker').value = rgbToHex(r,g,b)
}

function onNativeColor(hex) {
  const [nr,ng,nb] = hexToRgb(hex)
  r=nr; g=ng; b=nb
  document.getElementById('r-slider').value = r
  document.getElementById('g-slider').value = g
  document.getElementById('b-slider').value = b
  document.getElementById('r-val').textContent = r
  document.getElementById('g-val').textContent = g
  document.getElementById('b-val').textContent = b
  activeColor = `rgb(${r},${g},${b})`
  document.getElementById('color-display').style.background = activeColor
}

function setColorFromPixel(idx) {
  const c = pixels[idx]
  if (!c || c === 'transparent') return
  const m = c.match(/\d+/g)
  if (m) { r=+m[0]; g=+m[1]; b=+m[2]; onNativeColor(rgbToHex(r,g,b)) }
}

function hexToRgb(h) {
  const r = parseInt(h.slice(1,3),16)
  const g = parseInt(h.slice(3,5),16)
  const b = parseInt(h.slice(5,7),16)
  return [r,g,b]
}
function rgbToHex(r,g,b) {
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')
}

// ── Palette ───────────────────────────────────────────────────────────────────
function buildPalette() {
  const container = document.getElementById('palette')
  PALETTE.forEach(hex => {
    const sw = document.createElement('div')
    sw.className = 'swatch'
    sw.style.background = hex
    sw.onclick = () => { onNativeColor(hex); setActiveSwatch(sw) }
    container.appendChild(sw)
  })
  container.children[0].classList.add('active')
}
function setActiveSwatch(el) {
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'))
  el.classList.add('active')
}

// ── Tools ─────────────────────────────────────────────────────────────────────
function setTool(t) {
  activeTool = t
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'))
  document.getElementById('tool-' + t).classList.add('active')
  mainCanvas.style.cursor = t === 'pick' ? 'crosshair' : t === 'fill' ? 'cell' : 'crosshair'
}

// ── Challenges ────────────────────────────────────────────────────────────────
function buildHeart() {
  const pattern = [
    '........',
    '.XX.XX..',
    'XXXXXXX.',
    'XXXXXXX.',
    '.XXXXX..',
    '..XXX...',
    '...X....',
    '........',
  ]
  return expandPattern(pattern, 16)
}
function buildStar() {
  const pattern = [
    '...X....',
    '...X....',
    'XXXXXXX.',
    '..XXX...',
    '.XXXXX..',
    '.X.X.X..',
    'X.....X.',
    '........',
  ]
  return expandPattern(pattern, 16)
}
function buildHouse() {
  const pattern = [
    '...XXX..',
    '..XXXXX.',
    '.XXXXXXX',
    '.X.XXX.X',
    '.X.XXX.X',
    '.XXXXXXX',
    '.XXXXXXX',
    '........',
  ]
  return expandPattern(pattern, 16)
}
function buildFlag() {
  const pattern = [
    'XXXXXXXX',
    'XXXXXXXX',
    'XXXXXXXX',
    'X.......',
    'X.......',
    'X.......',
    'X.......',
    'X.......',
  ]
  return expandPattern(pattern, 16)
}

function expandPattern(rows, size) {
  const result = Array(size * size).fill('transparent')
  const scale = Math.floor(size / rows.length)
  rows.forEach((row, ri) => {
    for (let ci = 0; ci < row.length; ci++) {
      if (row[ci] === 'X') {
        for (let sy = 0; sy < scale; sy++) {
          for (let sx = 0; sx < scale; sx++) {
            const y = ri * scale + sy
            const x = ci * scale + sx
            if (y < size && x < size) result[y * size + x] = '#b8ef4a'
          }
        }
      }
    }
  })
  return result
}

function renderTarget(data, size) {
  const cellSize = 64 / size
  tctx.clearRect(0, 0, 64, 64)
  for (let i = 0; i < size; i++) {
    for (let j = 0; j < size; j++) {
      const c = data[i * size + j]
      if (c !== 'transparent') {
        tctx.fillStyle = c
        tctx.fillRect(j * cellSize, i * cellSize, cellSize, cellSize)
      }
    }
  }
}

function nextChallenge() {
  challengeIdx = (challengeIdx + 1) % CHALLENGES.length
  loadChallenge()
}

function loadChallenge() {
  const ch = CHALLENGES[challengeIdx]
  document.getElementById('challenge-text').textContent = `Recreate the "${ch.name}" in ${ch.size}×${ch.size} mode.`
  document.getElementById('match-score').textContent = '— %'
  document.getElementById('match-score').className = 'match-score start'
  renderTarget(ch.data, ch.size)
  setGrid(ch.size)
  // find matching size btn
  document.querySelectorAll('.size-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === `${ch.size}×${ch.size}`)
  })
}

function liveMatchScore() {
  const ch = CHALLENGES[challengeIdx]
  if (ch.size !== GRID) return
  let matches = 0
  const total = GRID * GRID
  for (let i = 0; i < total; i++) {
    const target = ch.data[i]
    const current = pixels[i]
    const bothEmpty = (target === 'transparent' && current === 'transparent')
    const bothFilled = (target !== 'transparent' && current !== 'transparent')
    if (bothEmpty || bothFilled) matches++
  }
  const pct = Math.round(matches / total * 100)
  const el = document.getElementById('match-score')
  el.textContent = pct + '%'
  el.className = 'match-score ' + (pct >= 80 ? 'good' : pct >= 50 ? 'ok' : 'start')
}

function checkChallenge() {
  const ch = CHALLENGES[challengeIdx]
  if (ch.size !== GRID) { showToast('Switch to ' + ch.size + '×' + ch.size + ' mode first'); return }
  let matches = 0
  const total = GRID * GRID
  for (let i = 0; i < total; i++) {
    const target = ch.data[i]
    const current = pixels[i]
    const bothEmpty  = (target === 'transparent' && current === 'transparent')
    const bothFilled = (target !== 'transparent' && current !== 'transparent')
    if (bothEmpty || bothFilled) matches++
  }
  const pct = Math.round(matches / total * 100)
  if (pct >= 80) {
    showToast('Great work! ' + pct + '% match — challenge complete!')
    if (me) { BF.addXP(me.id, 50); BF.recordAttempt(me.id, 'g6-pixel-c' + challengeIdx, { passed: true, score: pct }); }
    LessonSaves.save('pixel-grid', challengeIdx, { passed: true, xpEarned: 50, saveData: { pixels: pixels.slice() } })
  } else showToast('You\'re at ' + pct + '% — keep going, you\'re close!')
}

function clearCanvas() {
  pixels = Array(GRID * GRID).fill('transparent')
  draw()
  document.getElementById('match-score').textContent = '— %'
  document.getElementById('match-score').className = 'match-score start'
}

function downloadCanvas() {
  const link = document.createElement('a')
  link.download = 'pixel-art.png'
  link.href = mainCanvas.toDataURL()
  link.click()
}

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 3000)
}

// -- BF Integration --
BF.seed();
// Soft auth: allow access from Next.js/Supabase context (me = null → XP skipped)
const me = (() => { try { return BF.session() || null; } catch(_) { return null; } })();

// ── Init — restore Supabase saves, then render ───────────────────────────────
buildPalette()
initGrid()
loadChallenge()
;(async () => {
  await LessonSaves.load('pixel-grid')
  // Restore the saved pixel state for the current challenge (if any)
  const ws = LessonSaves.savedWorkspace()   // we store current-challenge state at idx=-1
  if (ws?.pixels && Array.isArray(ws.pixels)) {
    pixels = ws.pixels
    draw()
  }
})()
</script>
