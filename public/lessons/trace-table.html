<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Trace Table — ByteForge</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    body { padding-top:64px; background:var(--bg); }
    .page { max-width:1120px; margin:0 auto; padding:32px 24px 80px; }

    /* ── Header ── */
    .ex-header   { margin-bottom:24px; }
    .breadcrumb  { font-size:13px; color:var(--fg-dim); margin-bottom:10px; }
    .breadcrumb a{ color:var(--orange); text-decoration:none; }
    .type-chip   { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; background:rgba(168,85,247,.12); color:#c084fc; border:1px solid rgba(168,85,247,.2); margin-bottom:12px; }
    .ex-title    { font-size:24px; font-weight:800; letter-spacing:-.02em; margin-bottom:8px; }
    .ex-meta     { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:0; }
    .meta-pill   { font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px; background:var(--bg-card); border:1px solid var(--border); color:var(--fg-dim); }

    /* ── Question ── */
    .question-box { font-size:15px; line-height:1.75; color:var(--fg); white-space:pre-wrap; margin:20px 0 24px; padding:18px 22px; background:var(--bg-card); border-radius:12px; border-left:3px solid #a855f7; }

    /* ── Two-panel layout ── */
    .trace-layout { display:grid; grid-template-columns:minmax(240px,2fr) 3fr; gap:20px; align-items:start; }
    @media(max-width:800px){ .trace-layout { grid-template-columns:1fr; } }

    /* ── Code panel ── */
    .code-panel { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; overflow:hidden; position:sticky; top:80px; }
    .panel-header { padding:12px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
    .panel-label  { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--fg-faint); }
    .code-block   { padding:14px 0; overflow-x:auto; }
    .code-line    { display:flex; align-items:baseline; min-height:22px; transition:background .1s; }
    .code-line:hover { background:rgba(255,255,255,.03); }
    .line-num  { width:34px; text-align:right; font-size:11px; color:var(--fg-faint); font-family:var(--mono); padding:0 10px 0 0; flex-shrink:0; user-select:none; line-height:1.9; }
    .line-text { font-size:13px; font-family:var(--mono); color:var(--fg-dim); white-space:pre; padding-right:16px; line-height:1.9; }
    /* Syntax colours */
    .kw  { color:#c084fc; }
    .fn  { color:#60a5fa; }
    .num { color:#f59e0b; }
    .str { color:#86efac; }
    .cmt { color:#4b5563; font-style:italic; }
    .op  { color:#f97316; }

    /* ── Table panel ── */
    .table-panel { background:var(--bg-card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
    .table-panel-header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .table-panel-title  { font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; }
    .row-hint-chip { font-size:12px; color:#eab308; font-weight:600; background:rgba(234,179,8,.08); border:1px solid rgba(234,179,8,.2); padding:2px 10px; border-radius:20px; }

    .trace-wrap { overflow-x:auto; padding-bottom:2px; }
    table.tt    { border-collapse:collapse; width:100%; min-width:200px; }
    table.tt th { padding:10px 12px; text-align:center; font-size:12px; font-weight:800; font-family:var(--mono); color:var(--fg); background:var(--bg); border-bottom:2px solid var(--border); white-space:nowrap; }
    table.tt th.del-col { width:32px; }
    table.tt td { padding:4px 5px; border-bottom:1px solid rgba(255,255,255,.04); vertical-align:top; }
    table.tt td.del-td  { vertical-align:middle; text-align:center; padding:4px 4px; }

    .tc { /* trace cell */
      width:100%; min-width:54px; padding:7px 8px; background:var(--bg); border:1.5px solid var(--border);
      border-radius:7px; color:var(--fg); font-size:13px; font-family:var(--mono);
      text-align:center; outline:none; transition:.15s; box-sizing:border-box;
    }
    .tc:focus { border-color:#a855f7; box-shadow:0 0 0 2px rgba(168,85,247,.15); }
    .tc.correct { border-color:#22c55e !important; background:rgba(34,197,94,.07) !important; color:#22c55e !important; }
    .tc.wrong   { border-color:#ef4444 !important; background:rgba(239,68,68,.06) !important; color:#f87171 !important; }
    .tc:disabled { cursor:default; opacity:.8; }
    .correct-hint { font-size:11px; color:#22c55e; text-align:center; margin-top:2px; font-family:var(--mono); padding:0 4px; }

    .del-btn { width:24px; height:24px; border-radius:5px; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.15); color:#f87171; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s; flex-shrink:0; }
    .del-btn:hover { background:rgba(239,68,68,.2); }

    /* ── Action bar ── */
    .action-bar { padding:14px 18px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .btn-add    { padding:9px 16px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid var(--border-hi); background:var(--bg-raised); color:var(--fg); transition:.15s; display:flex; align-items:center; gap:6px; }
    .btn-add:hover { background:rgba(255,255,255,.08); }
    .btn-check  { padding:10px 24px; border-radius:8px; font-size:14px; font-weight:800; cursor:pointer; border:none; background:#a855f7; color:#fff; transition:.2s; }
    .btn-check:hover { background:#9333ea; }
    .btn-check:disabled { opacity:.4; cursor:default; }
    .btn-hint   { padding:9px 14px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid rgba(234,179,8,.2); background:rgba(234,179,8,.06); color:#eab308; transition:.15s; }
    .btn-hint:hover { background:rgba(234,179,8,.14); }

    /* ── Score banner ── */
    .score-banner { margin:0 18px 14px; border-radius:10px; padding:13px 16px; font-size:14px; font-weight:600; line-height:1.45; }
    .sb-great { background:rgba(34,197,94,.08);  border:1px solid rgba(34,197,94,.2);  color:#22c55e; }
    .sb-ok    { background:rgba(234,179,8,.08);  border:1px solid rgba(234,179,8,.2);  color:#eab308; }
    .sb-poor  { background:rgba(239,68,68,.07);  border:1px solid rgba(239,68,68,.2);  color:#f87171; }

    /* ── Hints section ── */
    .hints-block { margin:20px 0 0; background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; }
    .hints-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-faint); margin-bottom:8px; }
    .hints-list  { padding-left:18px; margin:0; }
    .hints-list li { font-size:13px; color:var(--fg-dim); margin-bottom:5px; line-height:1.55; }

    /* ── Completion ── */
    .completion { text-align:center; padding:44px 24px; background:var(--bg-card); border:1px solid var(--border); border-radius:20px; margin-top:24px; }
    .comp-icon  { font-size:52px; margin-bottom:12px; }
    .comp-title { font-size:24px; font-weight:800; margin-bottom:6px; }
    .comp-sub   { font-size:14px; color:var(--fg-dim); margin-bottom:24px; }
    .comp-stats { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:26px; }
    .c-stat     { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px 20px; min-width:80px; }
    .c-stat-num { font-size:26px; font-weight:800; }
    .c-stat-lbl { font-size:12px; color:var(--fg-dim); margin-top:3px; }
    .comp-btns  { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

    /* ── XP pop ── */
    @keyframes xpPop { 0%{opacity:0;transform:translateY(0) scale(.6)} 40%{opacity:1;transform:translateY(-32px) scale(1.2)} 100%{opacity:0;transform:translateY(-64px) scale(1)} }
    .xp-pop { position:fixed; font-size:18px; font-weight:800; color:#eab308; pointer-events:none; animation:xpPop .9s ease forwards; z-index:9999; }

    /* Toast */
    .toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600; transform:translateY(60px); opacity:0; transition:.3s; z-index:9999; }
    .toast-success { background:#166534; color:#bbf7d0; border:1px solid #16a34a; }
    .toast-error   { background:#7f1d1d; color:#fecaca; border:1px solid #dc2626; }
    .toast-info    { background:#1e3a5f; color:#93c5fd; border:1px solid #3b82f6; }
    .toast-show    { transform:translateY(0); opacity:1; }

    @media(max-width:600px) { .page { padding:20px 16px 60px; } .ex-title { font-size:20px; } }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-logo">
      <div class="logo-icon">⚒</div>
      <span class="logo-text">Byte<span>Forge</span></span>
    </div>
    <div class="nav-links" id="nav-back-link"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <a id="nav-notif-bell" href="../dashboard-student.html#notifications-panel"
         style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--bg-raised);border:1px solid var(--border-hi);text-decoration:none;font-size:16px"
         title="Notifications">
        🔔
        <span id="nav-notif-dot" style="display:none;position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid var(--bg)"></span>
      </a>
      <button class="nav-cta" onclick="logout()" style="background:var(--bg-raised);border:1px solid var(--border-hi);color:var(--fg)">Sign Out</button>
    </div>
  </nav>

  <div class="page">
    <div id="main-area"></div>
  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const me = requireAuth('student');
    if (!me) throw new Error('Redirecting');

    // ── Notification bell ────────────────────────────────────────────────────
    try {
      if (BF.getUnseenCount(me.id) > 0)
        document.getElementById('nav-notif-dot').style.display = 'block';
    } catch(e) {}

    // ── URL params ───────────────────────────────────────────────────────────
    const params     = new URLSearchParams(location.search);
    const classId    = params.get('classId');
    const exerciseId = params.get('exerciseId');
    if (!classId) { location.href = '../dashboard-student.html'; throw 0; }

    const cls = BF.classById(classId);
    if (!cls)  { location.href = '../dashboard-student.html'; throw 0; }

    // ── Locate exercise ──────────────────────────────────────────────────────
    let exercise  = null;
    let unitTitle = '';

    outer: for (const u of (cls.units || [])) {
      for (const e of (u.exercises || [])) {
        if (e.id === exerciseId) { exercise = e; unitTitle = u.title; break outer; }
      }
    }

    if (!exercise) {
      document.getElementById('main-area').innerHTML = `
        <div style="text-align:center;padding:60px;color:var(--fg-dim)">
          <div style="font-size:40px;margin-bottom:12px">😕</div>
          <div style="font-size:16px;font-weight:700;margin-bottom:8px">Exercise not found</div>
          <a href="../dashboard-student.html" style="color:var(--orange)">← Back to Dashboard</a>
        </div>`;
      throw 0;
    }

    document.title = `${exercise.title || 'Trace Table'} — ByteForge`;
    document.getElementById('nav-back-link').innerHTML =
      `<a href="../dashboard-student.html">← Back to class</a>`;

    // ── Exercise data ────────────────────────────────────────────────────────
    const columns      = exercise.columns      || [];
    const correctTrace = exercise.correctTrace || [];
    const alreadyDone  = (BF.progress(me.id).completedExercises || []).includes(exerciseId);

    // ── State ────────────────────────────────────────────────────────────────
    let marked    = alreadyDone;
    let sessionXP = 0;

    // ── Syntax highlighter ───────────────────────────────────────────────────
    const KWS = 'FOR|TO|STEP|NEXT|WHILE|DO|ENDWHILE|REPEAT|UNTIL|IF|THEN|ELSE|ENDIF|CASE|OF|OTHERWISE|ENDCASE|FUNCTION|RETURNS|RETURN|ENDFUNCTION|PROCEDURE|ENDPROCEDURE|DECLARE|BYREF|BYVAL|ARRAY|RECORD|ENDRECORD|INPUT|OUTPUT|CALL|NOT|AND|OR|MOD|DIV|TRUE|FALSE|NULL|INTEGER|REAL|BOOLEAN|CHAR|STRING';

    function highlightLine(raw) {
      let t = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      // Comments
      const ci = t.indexOf('//');
      if (ci >= 0) {
        return t.slice(0, ci)
             + `<span class="cmt">${t.slice(ci)}</span>`;
      }
      // Strings
      t = t.replace(/"([^"]*?)"/g, '<span class="str">"$1"</span>');
      // Numbers (before keywords to avoid wrapping keyword digits)
      t = t.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');
      // Keywords
      t = t.replace(new RegExp(`\\b(${KWS})\\b`, 'g'), '<span class="kw">$1</span>');
      // Assignment arrow
      t = t.replace(/←/g, '<span class="op">←</span>');
      return t;
    }

    function renderCode(code) {
      return (code || '// No code provided').split('\n').map((line, i) =>
        `<div class="code-line">
           <span class="line-num">${i + 1}</span>
           <span class="line-text">${highlightLine(line)}</span>
         </div>`
      ).join('');
    }

    // ── HTML helpers ─────────────────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Returns inner HTML for a table row (cells + optional delete btn)
    function rowInner(rowIndex, values, disabled) {
      const cells = columns.map((col, ci) =>
        `<td><input type="text" class="tc"
          data-row="${rowIndex}" data-col="${ci}" data-colname="${esc(col)}"
          value="${esc(values?.[col] ?? '')}"
          ${disabled ? 'disabled' : ''}
          onkeydown="onKey(event,${rowIndex},${ci})"
          autocomplete="off" spellcheck="false"/></td>`
      ).join('');
      const del = disabled ? '' :
        `<td class="del-td"><button class="del-btn" onclick="delRow(this)" title="Remove row">✕</button></td>`;
      return cells + del;
    }

    // ── Main render ──────────────────────────────────────────────────────────
    function renderPage() {
      const xp      = exercise.xpReward || exercise.xp_reward || 100;
      const marks   = exercise.marks || '';
      const diff    = '●'.repeat(exercise.difficulty || 2) + '○'.repeat(5 - (exercise.difficulty || 2));
      const rowInfo = correctTrace.length ? `${correctTrace.length} row${correctTrace.length !== 1 ? 's' : ''}` : '';

      // Decide initial rows:
      // • Already done → show correct trace (cells pre-filled, marked green)
      // • Fresh → start with a sensible number of empty rows (avoid giving away count)
      const initCount   = correctTrace.length
        ? Math.max(2, Math.floor(correctTrace.length * 0.6))
        : 3;
      const initRows    = alreadyDone
        ? correctTrace.map(r => Object.fromEntries(columns.map(c => [c, r[c] ?? ''])))
        : Array.from({ length: initCount }, () => ({}));

      const bodyHtml = initRows.map((row, i) =>
        `<tr data-row="${i}">${rowInner(i, row, alreadyDone)}</tr>`
      ).join('');

      document.getElementById('main-area').innerHTML = `
        <div class="ex-header">
          <div class="breadcrumb">
            <a href="../dashboard-student.html">Dashboard</a> ›
            <a href="../dashboard-student.html">${esc(cls.name)}</a> ›
            ${esc(unitTitle)}
          </div>
          <div class="type-chip">📊 Trace Table</div>
          <div class="ex-title">${esc(exercise.title || 'Trace Table')}</div>
          <div class="ex-meta">
            <span class="meta-pill">${diff}</span>
            <span class="meta-pill">⚡ ${xp} XP</span>
            ${marks   ? `<span class="meta-pill">📝 ${marks} marks</span>` : ''}
            ${rowInfo ? `<span class="meta-pill">📋 ${rowInfo}</span>`    : ''}
            ${alreadyDone ? `<span class="meta-pill" style="color:#22c55e">✓ Completed</span>` : ''}
          </div>
        </div>

        ${exercise.question
          ? `<div class="question-box">${esc(exercise.question)}</div>`
          : ''}

        <div class="trace-layout">

          <!-- ── Code panel ── -->
          <div class="code-panel">
            <div class="panel-header">
              <span style="font-size:15px">📄</span>
              <span class="panel-label">Pseudocode</span>
            </div>
            <div class="code-block">${renderCode(exercise.code)}</div>
          </div>

          <!-- ── Trace table panel ── -->
          <div class="table-panel" id="table-panel">

            <div class="table-panel-header">
              <div class="table-panel-title">
                📊 Trace Table
                ${alreadyDone ? `<span style="font-size:12px;color:#22c55e;font-weight:600">✓ Completed</span>` : ''}
              </div>
              <span id="row-hint-area"></span>
            </div>

            <div id="score-area"></div>

            <div class="trace-wrap">
              <table class="tt">
                <thead><tr>
                  ${columns.map(c => `<th>${esc(c)}</th>`).join('')}
                  ${alreadyDone ? '' : '<th class="del-col"></th>'}
                </tr></thead>
                <tbody id="tbody">${bodyHtml}</tbody>
              </table>
            </div>

            <div class="action-bar" id="action-bar">
              ${alreadyDone
                ? `<a href="../dashboard-student.html" style="text-decoration:none" class="btn-add">← Back to Dashboard</a>`
                : `<button class="btn-add"   onclick="addRow()">＋ Add Row</button>
                   <button class="btn-hint"  onclick="showRowHint()" id="hint-btn">💡 Row count hint</button>
                   <button class="btn-check" id="check-btn" onclick="markTrace()">✓ Check Answers</button>`
              }
            </div>

          </div><!-- /table-panel -->

        </div><!-- /trace-layout -->

        ${exercise.hints?.length
          ? `<details class="hints-block">
               <summary style="cursor:pointer;font-size:13px;font-weight:700;color:var(--fg-dim)">💡 Hints (${exercise.hints.length})</summary>
               <ol class="hints-list" style="margin-top:8px">
                 ${exercise.hints.map(h => `<li>${esc(h)}</li>`).join('')}
               </ol>
             </details>`
          : ''}

        <div id="completion-area"></div>
      `;

      // If already done → mark cells green + show score
      if (alreadyDone) applyDoneStyle();
      else setTimeout(() => document.querySelector('.tc')?.focus(), 80);
    }

    // ── Show how many rows the correct answer has ────────────────────────────
    function showRowHint() {
      if (!correctTrace.length) { toast('No hint available', 'info'); return; }
      const area = document.getElementById('row-hint-area');
      if (area) area.innerHTML =
        `<span class="row-hint-chip">Expected: ${correctTrace.length} row${correctTrace.length !== 1 ? 's' : ''}</span>`;
      const btn = document.getElementById('hint-btn');
      if (btn) btn.style.display = 'none';
    }

    // ── Add / delete rows ────────────────────────────────────────────────────
    function addRow() {
      if (marked) return;
      const tbody = document.getElementById('tbody');
      const ri    = tbody.rows.length;
      const tr    = tbody.insertRow();
      tr.dataset.row = ri;
      tr.innerHTML   = rowInner(ri, {}, false);
      tr.querySelector('.tc')?.focus();
    }

    function delRow(btn) {
      if (marked) return;
      const tbody = document.getElementById('tbody');
      if (tbody.rows.length <= 1) { toast('Keep at least one row', 'error'); return; }
      btn.closest('tr').remove();
      // Re-index data-row on remaining rows
      Array.from(tbody.rows).forEach((tr, i) => {
        tr.dataset.row = i;
        tr.querySelectorAll('.tc').forEach(c => { c.dataset.row = i; });
      });
    }

    // ── Tab / Enter keyboard navigation ─────────────────────────────────────
    function onKey(e, row, col) {
      if (e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey)) {
        e.preventDefault();
        const next = nextCell(row, col);
        if (next) { next.focus(); next.select(); }
        else if (e.key === 'Enter') addRow(); // Enter on last cell → new row
      } else if (e.key === 'Tab' && e.shiftKey) {
        e.preventDefault();
        const prev = prevCell(row, col);
        if (prev) { prev.focus(); prev.select(); }
      }
    }

    function getCell(row, col) {
      return document.querySelector(`.tc[data-row="${row}"][data-col="${col}"]`);
    }

    function nextCell(row, col) {
      if (col < columns.length - 1) return getCell(row, col + 1);
      const tbody = document.getElementById('tbody');
      return row + 1 < tbody.rows.length ? getCell(row + 1, 0) : null;
    }

    function prevCell(row, col) {
      if (col > 0) return getCell(row, col - 1);
      return row > 0 ? getCell(row - 1, columns.length - 1) : null;
    }

    // ── Marking ──────────────────────────────────────────────────────────────
    function norm(v) {
      return String(v ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function markTrace() {
      if (!correctTrace.length) {
        toast('No answer key for this exercise — ask your teacher', 'info');
        return;
      }
      marked = true;
      document.getElementById('check-btn').disabled = true;

      // Collect student's rows from the DOM
      const tbody  = document.getElementById('tbody');
      const stuRows = Array.from(tbody.rows).map(tr => {
        const obj = {};
        tr.querySelectorAll('.tc').forEach(c => { obj[c.dataset.colname] = c.value; });
        return obj;
      });

      let total = 0, correct = 0;

      correctTrace.forEach((ansRow, ri) => {
        columns.forEach((col, ci) => {
          const expected = norm(ansRow[col] ?? '');
          if (expected === '') return; // blank expected = not marked
          total++;

          const cell = getCell(ri, ci);
          if (!cell) { /* student missed this row entirely — counted wrong */ return; }

          cell.disabled = true;
          const isOk = norm(cell.value) === expected;
          cell.classList.add(isOk ? 'correct' : 'wrong');
          if (isOk) {
            correct++;
          } else {
            // Show correct value below the wrong cell
            const hint = document.createElement('div');
            hint.className = 'correct-hint';
            hint.textContent = ansRow[col] ?? '';
            cell.closest('td').appendChild(hint);
          }
        });
      });

      // Mark any extra rows the student added as wrong
      Array.from(tbody.rows).slice(correctTrace.length).forEach(tr => {
        tr.querySelectorAll('.tc').forEach(c => {
          if (c.value.trim()) c.classList.add('wrong');
          c.disabled = true;
        });
      });

      const pct   = total > 0 ? Math.round(correct / total * 100) : 0;
      const cls2  = pct >= 80 ? 'sb-great' : pct >= 50 ? 'sb-ok' : 'sb-poor';
      const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '👍' : '📚';

      document.getElementById('score-area').innerHTML =
        `<div class="score-banner ${cls2}">
           ${emoji} <strong>${correct}/${total}</strong> cells correct (${pct}%)
           ${pct >= 80 ? ' — Outstanding trace!' : pct >= 50 ? ' — Good effort, review the cells in red.' : ' — Study the pseudocode again and retry.'}
         </div>`;

      // Award XP (proportional to %)
      const xpBase = exercise.xpReward || exercise.xp_reward || 100;
      const xpEarn = Math.round(xpBase * pct / 100);
      if (xpEarn > 0 && !alreadyDone) {
        BF.addXP(me.id, xpEarn);
        sessionXP = xpEarn;
        popXP(xpEarn);
      }
      BF.recordAttempt(me.id, exerciseId, { passed: pct >= 50, score: pct });
      if (pct >= 50 && !alreadyDone) confetti();

      // Completion card
      document.getElementById('completion-area').innerHTML = `
        <div class="completion">
          <div class="comp-icon">${pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '📚'}</div>
          <div class="comp-title">${pct >= 80 ? 'Excellent trace!' : pct >= 50 ? 'Good effort!' : 'Keep practising!'}</div>
          <div class="comp-sub">${esc(cls.name)} · ${esc(unitTitle)}</div>
          <div class="comp-stats">
            <div class="c-stat"><div class="c-stat-num" style="color:#22c55e">${correct}</div><div class="c-stat-lbl">Correct</div></div>
            <div class="c-stat"><div class="c-stat-num">${total}</div><div class="c-stat-lbl">Cells</div></div>
            <div class="c-stat"><div class="c-stat-num" style="color:#eab308">${xpEarn}</div><div class="c-stat-lbl">XP earned</div></div>
            <div class="c-stat"><div class="c-stat-num" style="color:var(--orange)">${pct}%</div><div class="c-stat-lbl">Score</div></div>
          </div>
          <div class="comp-btns">
            <a href="../dashboard-student.html"
               style="text-decoration:none;padding:12px 26px;border-radius:9px;font-size:14px;font-weight:800;background:#a855f7;color:#fff">
              ← Back to Dashboard
            </a>
            ${pct < 80
              ? `<button class="btn-add" onclick="retry()" style="padding:12px 20px">🔄 Try Again</button>`
              : ''}
          </div>
        </div>`;

      document.getElementById('completion-area').scrollIntoView({ behavior:'smooth', block:'nearest' });
    }

    function applyDoneStyle() {
      document.querySelectorAll('.tc').forEach(c => {
        c.classList.add('correct');
        c.disabled = true;
      });
      const total = columns.length * correctTrace.length;
      if (total > 0) {
        document.getElementById('score-area').innerHTML =
          `<div class="score-banner sb-great">✅ Already completed — ${total} cells traced correctly.</div>`;
      }
    }

    function retry() {
      marked    = false;
      sessionXP = 0;
      renderPage();
    }

    // ── XP pop ────────────────────────────────────────────────────────────────
    function popXP(amount) {
      const el = document.createElement('div');
      el.className  = 'xp-pop';
      el.textContent= `+${amount} XP!`;
      el.style.left = (window.innerWidth / 2 - 40) + 'px';
      el.style.top  = (window.innerHeight / 2) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    renderPage();
  </script>
</body>
</html>
