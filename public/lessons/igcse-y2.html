  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { padding-top:64px; background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; }
    .layout { display:grid; grid-template-columns:1fr 460px; height:calc(100vh - 64px); overflow:hidden; }
    .ed-panel  { display:flex; flex-direction:column; border-right:1px solid var(--border); overflow:hidden; }
    .ed-header { flex-shrink:0; padding:10px 14px; background:var(--bg-card); border-bottom:1px solid var(--border);
                 display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .ed-title  { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
    .badge     { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; }
    .badge-gy2 { background:rgba(56,189,248,.15); color:#7dd3fc; border:1px solid rgba(56,189,248,.3); }
    .char-toolbar { flex-shrink:0; display:flex; align-items:center; gap:4px; padding:5px 14px;
                    background:var(--bg); border-bottom:1px solid var(--border); }
    .char-toolbar span { font-size:10px; color:var(--fg-faint); margin-right:4px; }
    .char-btn { padding:3px 8px; border-radius:4px; font-size:13px; font-family:var(--mono);
                border:1px solid var(--border); background:var(--bg-raised); color:var(--fg);
                cursor:pointer; transition:.1s; }
    .char-btn:hover { background:rgba(56,189,248,.15); border-color:#7dd3fc; color:#7dd3fc; }
    .cm-outer { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .cm-outer .CodeMirror {
      height:100% !important; font-size:13px !important; font-family:var(--mono) !important;
      background:#070910 !important; line-height:1.7 !important;
    }
    .cm-outer .CodeMirror-scroll   { background:#070910 !important; }
    .cm-outer .CodeMirror-gutters  { background:#0b0e1c !important; border-right:1px solid var(--border) !important; }
    .run-bar { flex-shrink:0; display:flex; gap:6px; padding:8px 14px; background:var(--bg-card);
               border-top:1px solid var(--border); align-items:center; justify-content:space-between; }
    .btn { padding:6px 13px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:.15s; border:none; }
    .btn-brand  { background:#b8ef4a; color:#0d0f1a; }
    .btn-brand:hover  { background:#a5d83d; }
    .btn-ghost  { background:var(--bg-raised); color:var(--fg); border:1px solid var(--border-hi); }
    .btn-ghost:hover  { background:rgba(255,255,255,.08); }
    .btn-danger { background:rgba(239,68,68,.1); color:#f87171; border:1px solid rgba(239,68,68,.25); }
    .btn-row    { display:flex; gap:6px; }
    .input-section { display:flex; align-items:center; gap:6px; }
    .input-section label { font-size:11px; color:var(--fg-faint); white-space:nowrap; }
    .input-section input { padding:4px 8px; border-radius:5px; border:1px solid var(--border);
                           background:var(--bg-raised); color:var(--fg); font-size:12px; font-family:var(--mono); width:160px; }
    .input-section input:focus { outline:none; border-color:#7dd3fc; }
    .right-panel { display:flex; flex-direction:column; overflow:hidden; }
    .ch-header { flex-shrink:0; background:var(--bg-card); border-bottom:1px solid var(--border); padding:10px 14px; }
    .ch-pills  { display:none; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
    .ch-pills.expanded { display:flex; }
    .ch-nav-strip  { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .ch-nav-btn    { padding:3px 10px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;
                     border:1px solid var(--border); background:var(--bg-raised); color:var(--fg-dim); }
    .ch-nav-btn:hover { border-color:var(--border-hi); color:var(--fg); }
    .ch-nav-btn:disabled { opacity:.35; cursor:default; }
    .ch-nav-current { font-size:11.5px; font-weight:700; color:var(--fg); flex:1; }
    .ch-nav-toggle { font-size:11px; color:#7dd3fc; cursor:pointer; font-weight:700; }
    .ch-lesson { flex-shrink:0; background:var(--bg-card); border:1px solid rgba(125,211,252,.18); border-radius:8px; margin-bottom:8px; overflow:hidden; }

    table.trace tr.changed td { background:rgba(56,189,248,.06); }
    table.trace td.changed-val { color:#7dd3fc; font-weight:600; }
    table.trace td.out-col { color:#b8ef4a; }
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(60px);

    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    @media(max-width:900px) { .layout { grid-template-columns:1fr; } }

<script>
'use strict'

// ══════════════════════════════════════════════════════════════════════════════
// IGCSE Year 2 Pseudocode Interpreter
// (extends Grade 9 engine — BYVAL/BYREF, file simulation, OOP basics)
// ══════════════════════════════════════════════════════════════════════════════

const KEYWORDS = new Set([
  'DECLARE','IF','THEN','ELSE','ELSEIF','ENDIF',
  'FOR','TO','STEP','NEXT',
  'WHILE','DO','ENDWHILE',
  'REPEAT','UNTIL',
  'PROCEDURE','ENDPROCEDURE',
  'FUNCTION','ENDFUNCTION','RETURNS','RETURN',
  'CALL','OUTPUT','INPUT',
  'AND','OR','NOT','DIV','MOD',
  'ARRAY','OF','CASE','OTHERWISE','ENDCASE',
  'BYVAL','BYREF',
  'CLASS','ENDCLASS','NEW','INHERITS','PUBLIC','PRIVATE',
  'OPENFILE','CLOSEFILE','READFILE','WRITEFILE','EOF',
])
const TYPES  = new Set(['INTEGER','REAL','STRING','BOOLEAN','CHAR'])
const BOOLKW = new Set(['TRUE','FALSE'])

function tokenize(src) {
  src = src.replace(/<-/g, '←')
  const toks = []
  let i = 0, len = src.length
  while (i < len) {
    const c = src[i]
    if (/\s/.test(c)) { i++; continue }
    if (c === '/' && src[i+1] === '/') break
    if (c === '←') { toks.push({t:'ASSIGN'}); i++; continue }
    if (c === ':' && src[i+1] === '=') { toks.push({t:'ASSIGN'}); i+=2; continue }
    if (c === ':') { toks.push({t:'COLON'}); i++; continue }
    if (c === '"') {
      let s='', j=i+1
      while (j<len && src[j]!=='"') s+=src[j++]
      toks.push({t:'STR',v:s}); i=j+1; continue
    }
    if (c === "'") { toks.push({t:'STR',v:src[i+1]||''}); i+=3; continue }
    const prevTok = toks[toks.length-1]
    const negOk = !prevTok || ['ASSIGN','LPAREN','COMMA','OP'].includes(prevTok.t)
    if (/[0-9]/.test(c) || (c==='-' && negOk && /[0-9]/.test(src[i+1]||''))) {
      let n = c==='-' ? (i++, '-') : ''
      while (i<len && /[0-9.]/.test(src[i])) n+=src[i++]
      toks.push({t:'NUM',v:parseFloat(n)}); continue
    }
    if (/[A-Za-z_]/.test(c)) {
      let w='', j=i
      while (j<len && /[\w]/.test(src[j])) w+=src[j++]
      const u = w.toUpperCase()
      if      (BOOLKW.has(u))   toks.push({t:'BOOL',v:u==='TRUE'})
      else if (KEYWORDS.has(u)) toks.push({t:'KW',v:u})
      else if (TYPES.has(u))    toks.push({t:'TYPE',v:u})
      else                      toks.push({t:'ID',v:w})
      i=j; continue
    }
    if (c==='≤') { toks.push({t:'OP',v:'<='}); i++; continue }
    if (c==='≥') { toks.push({t:'OP',v:'>='}); i++; continue }
    if (c==='<' && src[i+1]==='>') { toks.push({t:'OP',v:'<>'}); i+=2; continue }
    if (c==='<' && src[i+1]==='=') { toks.push({t:'OP',v:'<='}); i+=2; continue }
    if (c==='>' && src[i+1]==='=') { toks.push({t:'OP',v:'>='}); i+=2; continue }
    const single = {'+':'OP','-':'OP','*':'OP','/':'OP','^':'OP','&':'OP','<':'OP','>':'OP','=':'OP',
                    '(':'LPAREN',')':'RPAREN','[':'LBR',']':'RBR',',':'COMMA','.':'DOT'}
    if (c in single) { toks.push({t:single[c],v:c}); i++; continue }
    i++
  }
  toks.push({t:'EOF'})
  return toks
}

class ExprParser {
  constructor(toks, env, interp) { this.t=toks; this.p=0; this.env=env; this.interp=interp }
  peek()    { return this.t[this.p]||{t:'EOF'} }
  advance() { return this.t[this.p++]||{t:'EOF'} }
  check(t,v){ const tk=this.peek(); return tk.t===t&&(v===undefined||tk.v===v) }
  eat(t,v)  { if(this.check(t,v)) return this.advance(); return null }
  parse()   { return this.parseBool() }
  parseBool() {
    let v=this.parseNot()
    while(this.check('KW','AND')||this.check('KW','OR')){
      const op=this.advance().v; const r=this.parseNot()
      v=op==='AND'?v&&r:v||r
    }
    return v
  }
  // NOT sits BETWEEN AND/OR and the comparisons, per Cambridge precedence:
  // `NOT a = b` is `NOT (a = b)`. It used to live in parseUnary (tightest
  // binding), so it parsed as `(NOT a) = b` and `IF NOT 1 = 2` was FALSE.
  parseNot(){if(this.check('KW','NOT')){this.advance();return!this.parseNot()}return this.parseCmp()}
  parseCmp() {
    let v=this.parseConcat()
    const ops=['=','<>','<','>','<=','>=']
    if(this.check('OP')&&ops.includes(this.peek().v)){
      const op=this.advance().v; const r=this.parseConcat()
      if(op==='=')return v===r; if(op==='<>')return v!==r
      if(op==='<')return v<r;   if(op==='>')return v>r
      if(op==='<=')return v<=r; if(op==='>=')return v>=r
    }
    return v
  }
  parseConcat() {
    let v=this.parseAdd()
    while(this.check('OP','&')){this.advance();v=String(v)+String(this.parseAdd())}
    return v
  }
  parseAdd() {
    let v=this.parseMul()
    while(this.check('OP','+')||this.check('OP','-')){
      const op=this.advance().v;const r=this.parseMul();v=op==='+'?v+r:v-r
    }
    return v
  }
  parseMul() {
    let v=this.parseUnary()
    while(this.check('OP','*')||this.check('OP','/')||this.check('KW','DIV')||this.check('KW','MOD')){
      const op=this.advance();const r=this.parseUnary()
      if(op.v==='*')v=v*r
      else if(op.v==='/'){if(r===0)throw new Error('Division by zero');v=v/r}
      else if(op.v==='DIV'){if(r===0)throw new Error('Integer division by zero');v=Math.trunc(v/r)}
      else if(op.v==='MOD')v=((v%r)+r)%r
    }
    return v
  }
  parseUnary() {
    if(this.check('OP','-'))  {this.advance();return-this.parsePow()}
    if(this.check('OP','+'))  {this.advance();return this.parsePow()}
    return this.parsePow()
  }
  parsePow() {
    let v=this.parsePrimary()
    if(this.check('OP','^')){this.advance();v=Math.pow(v,this.parseUnary())}
    return v
  }
  parsePrimary() {
    const tk=this.peek()
    if(tk.t==='NUM'){this.advance();return tk.v}
    if(tk.t==='STR'){this.advance();return tk.v}
    if(tk.t==='BOOL'){this.advance();return tk.v}
    if(tk.t==='LPAREN'){this.advance();const v=this.parse();this.eat('RPAREN');return v}
    if(tk.t==='ID'){
      this.advance();const name=tk.v
      const builtins={
        LENGTH:a=>Array.isArray(a[0])?a[0].length:String(a[0]).length,
        LCASE:a=>String(a[0]).toLowerCase(),UCASE:a=>String(a[0]).toUpperCase(),
        INT:a=>Math.trunc(a[0]),ROUND:a=>Number(parseFloat(a[0]).toFixed(a[1]||0)),
        LEFT:a=>String(a[0]).slice(0,a[1]),RIGHT:a=>String(a[0]).slice(-a[1]),
        SUBSTR:a=>String(a[0]).substr(a[1]-1,a[2]),RAND:a=>Math.random()*(a[0]||1),
        NUM_TO_STR:a=>String(a[0]),STR_TO_NUM:a=>parseFloat(a[0]),
        IS_NUM:a=>!isNaN(parseFloat(a[0])),SQRT:a=>Math.sqrt(a[0]),ABS:a=>Math.abs(a[0]),
      }
      if(this.check('LPAREN')){

        if(!this.check('RPAREN')){args.push(this.parse());while(this.eat('COMMA'))args.push(this.parse())}

      if(this.check('LBR')){
        this.advance();const idx=this.parse();this.eat('RBR')

        if(this.check('COMMA')){
          this.advance();const col=this.parse();this.eat('RBR')

        const i=Math.round(idx)-arr._base
        if(i<0||i>=arr._data.length)throw new Error(`Array index ${idx} out of bounds for '${name}'`)
        return arr._data[i]

      return this.env.get(name)
    }
    throw new Error(`Unexpected token "${tk.v||tk.t}" in expression`)
  }
}

function evalExpr(src,env,interp){return new ExprParser(tokenize(src),env,interp).parse()}

class Env {
  constructor(parent=null){this.vars={};this.parent=parent}
  get(name){
    const k=name.toUpperCase()
    if(k in this.vars)return this.vars[k]
    if(this.parent)return this.parent.get(name)
    throw new Error(`Variable '${name}' has not been declared. Add: DECLARE ${name} : INTEGER`)
  }
  set(name,value){
    const k=name.toUpperCase()
    if(k in this.vars){this.vars[k]=value;return}
    if(this.parent&&this.parent.has(name)){this.parent.set(name,value);return}
    this.vars[k]=value
  }
  setLocal(name,value){this.vars[name.toUpperCase()]=value}
  has(name){const k=name.toUpperCase();return k in this.vars||(this.parent&&this.parent.has(name))}
  snapshot(){const s={};if(this.parent)Object.assign(s,this.parent.snapshot());Object.assign(s,this.vars);return s}
}

function parseBlock(rawLines,pos,stopAt){
  const block=[];const stops=stopAt||[]
  while(pos<rawLines.length){
    const{text,n}=rawLines[pos];const u=text.toUpperCase().trim()
    if(stops.some(s=>u===s||u.startsWith(s+' ')||u.startsWith(s+'(')))break
    if(u.startsWith('IF '))         {const[s,p]=parseIf(rawLines,pos);   block.push(s);pos=p}
    else if(u.startsWith('FOR '))   {const[s,p]=parseFor(rawLines,pos);  block.push(s);pos=p}
    else if(u.startsWith('WHILE ')) {const[s,p]=parseWhile(rawLines,pos);block.push(s);pos=p}
    else if(u==='REPEAT')           {const[s,p]=parseRepeat(rawLines,pos);block.push(s);pos=p}
    else if(u.startsWith('PROCEDURE ')){const[s,p]=parseProc(rawLines,pos);block.push(s);pos=p}
    else if(u.startsWith('FUNCTION ')){const[s,p]=parseFunc(rawLines,pos);block.push(s);pos=p}
    else{block.push({type:'STMT',text,n});pos++}
  }
  return[block,pos]
}
function parseIf(lines,pos){
  const start=lines[pos];pos++
  const[tbody,p1]=parseBlock(lines,pos,['ELSE','ELSEIF','ENDIF']);pos=p1
  const branches=[{cond:start.text,body:tbody}]
  while(pos<lines.length&&lines[pos].text.toUpperCase().trimStart().startsWith('ELSEIF ')){
    const eib=lines[pos];pos++
    const[eb,p]=parseBlock(lines,pos,['ELSE','ELSEIF','ENDIF'])
    branches.push({cond:eib.text,body:eb});pos=p
  }
  let elsebody=null
  if(pos<lines.length&&lines[pos].text.toUpperCase().trim()==='ELSE'){
    pos++;const[eb,p]=parseBlock(lines,pos,['ENDIF']);elsebody=eb;pos=p
  }
  if(pos<lines.length&&lines[pos].text.toUpperCase().trim()==='ENDIF')pos++
  return[{type:'IF',branches,elsebody,n:start.n},pos]
}
function parseFor(lines,pos){
  const start=lines[pos];pos++
  const[body,p]=parseBlock(lines,pos,['NEXT'])
  if(p<lines.length)pos=p+1;else pos=p
  return[{type:'FOR',text:start.text,n:start.n,body},pos]
}
function parseWhile(lines,pos){
  const start=lines[pos];pos++
  const[body,p]=parseBlock(lines,pos,['ENDWHILE'])
  pos=p<lines.length?p+1:p
  return[{type:'WHILE',text:start.text,n:start.n,body},pos]
}
function parseRepeat(lines,pos){
  pos++
  const[body,p]=parseBlock(lines,pos,['UNTIL'])
  const cond=p<lines.length?lines[p].text:''
  pos=p<lines.length?p+1:p
  return[{type:'REPEAT',n:pos,body,untilText:cond},pos]
}
function parseProc(lines,pos){
  const hdr=lines[pos];pos++
  const[body,p]=parseBlock(lines,pos,['ENDPROCEDURE'])
  pos=p<lines.length?p+1:p
  return[{type:'PROC_DEF',hdr:hdr.text,n:hdr.n,body},pos]
}
function parseFunc(lines,pos){
  const hdr=lines[pos];pos++
  const[body,p]=parseBlock(lines,pos,['ENDFUNCTION'])
  pos=p<lines.length?p+1:p
  return[{type:'FUNC_DEF',hdr:hdr.text,n:hdr.n,body},pos]
}

class Interpreter {
  constructor(){this.reset()}
  reset(){
    this.globals=new Env();this.procs={};this.funcs={}
    this.output=[];this.trace=[];this.inputQ=[];this.steps=0;this.MAX=5000
    this.files={}  // simulated file store: name → {lines:[], ptr:0}
  }
  run(code,inputValues=[]){
    this.reset();this.inputQ=[...inputValues]
    // A single line can hold several ";"-separated statements (e.g. the
    // Stack examples' own "top ← top + 1; arr[top] ← val") — but nothing
    // here ever actually SPLIT on ";", so only the first statement before
    // it ever ran and everything after was silently dropped, no error at
    // all (found via scripts/test-igcse-y2-challenges.mjs's minimal-repro
    // debugging: "a ← 1; b ← 2" left b at its default value). splitOnSemicolons
    // splits on ";" outside double-quoted strings so OUTPUT "a; b" isn't
    // affected.
    const rawLines=code.split('\n')
      .flatMap((text,i)=>splitOnSemicolons(text.replace(/\/\/.*$/,''))
        .flatMap(t=>expandInlineIf(t.trim()).map(seg=>({text:seg,n:i+1}))))
      .filter(l=>l.text)

  }
  evalE(src,env){return evalExpr(src,env,this)}
  callFunc(name,args,callerEnv){
    const u=name.toUpperCase();const def=this.funcs[u]

    const local=new Env(this.globals)
    def.params.forEach((p,i)=>local.setLocal(p.name,args[i]??null))
    try{this.execBlock(def.body,local)}
    catch(e){if(e&&e.type==='RETURN')return e.value;throw e}
    return null
  }
  record(stmt,env,out=null){
    this.trace.push({step:++this.steps,n:stmt.n||'?',code:stmt.text||stmt.type,vars:env.snapshot(),out})
    if(this.steps>this.MAX)throw new Error(`Too many steps (${this.MAX} limit). Check for infinite loop.`)
  }
  execBlock(block,env){for(const stmt of block)this.execStmt(stmt,env)}
  execStmt(stmt,env){
    if(stmt.type==='IF')       return this.execIf(stmt,env)
    if(stmt.type==='FOR')      return this.execFor(stmt,env)
    if(stmt.type==='WHILE')    return this.execWhile(stmt,env)
    if(stmt.type==='REPEAT')   return this.execRepeatUntil(stmt,env)
    if(stmt.type==='PROC_DEF') return this.registerProc(stmt)
    if(stmt.type==='FUNC_DEF') return this.registerFunc(stmt)
    if(stmt.type==='STMT')     return this.execSimple(stmt,env)
  }
  execIf(node,env){
    this.record({n:node.n,text:node.branches[0].cond},env)
    for(const branch of node.branches){
      const condSrc=branch.cond.replace(/^IF\s+/i,'').replace(/^ELSEIF\s+/i,'').replace(/\s+THEN\s*$/i,'').trim()
      if(this.evalE(condSrc,env)){this.execBlock(branch.body,env);return}
    }

  }
  execFor(node,env){
    const text=node.text.replace(/^FOR\s+/i,'').trim()
    const stepMatch=text.match(/\bSTEP\s+(.+)$/i)
    const stepExpr=stepMatch?stepMatch[1].trim():'1'
    const noStep=stepMatch?text.slice(0,stepMatch.index).trim():text
    const toIdx=noStep.search(/\bTO\b/i)
    const lhs=noStep.slice(0,toIdx).trim();const endExpr=noStep.slice(toIdx+2).trim()
    const arrowIdx=lhs.indexOf('←')>=0?lhs.indexOf('←'):lhs.indexOf(':=')
    const varName=lhs.slice(0,arrowIdx).trim()
    const startVal=this.evalE(lhs.slice(arrowIdx+1).trim(),env)
    const endVal=this.evalE(endExpr,env);const stepVal=this.evalE(stepExpr,env)
    env.set(varName,startVal);const going=stepVal>0
    while(going?env.get(varName)<=endVal:env.get(varName)>=endVal){
      this.record({n:node.n,text:node.text},env)
      this.execBlock(node.body,env);env.set(varName,env.get(varName)+stepVal)
    }
  }
  execWhile(node,env){
    const condSrc=node.text.replace(/^WHILE\s+/i,'').replace(/\s+DO\s*$/i,'').trim()
    while(this.evalE(condSrc,env)){this.record({n:node.n,text:node.text},env);this.execBlock(node.body,env)}
  }
  execRepeatUntil(node,env){
    const condSrc=node.untilText.replace(/^UNTIL\s+/i,'').trim()
    do{this.record({n:node.n,text:'REPEAT'},env);this.execBlock(node.body,env)}
    while(!this.evalE(condSrc,env))
  }
  registerProc(node){
    const m=node.hdr.match(/^PROCEDURE\s+(\w+)\s*(?:\(([^)]*)\))?/i)
    if(!m)throw new Error('Invalid PROCEDURE header: '+node.hdr)

  registerFunc(node){

    if(!m)throw new Error('Invalid FUNCTION header: '+node.hdr)

  execSimple(stmt,env){

      // Opening FOR READ must NOT wipe the file. This used to reset `lines` to
      // [] on every OPENFILE, so the write→CLOSEFILE→re-open-FOR-READ pattern —
      // which Challenge 6's text, all three of its hints AND its own supplied
      // starter line all instruct — discarded everything just written, making
      // the challenge unsolvable as taught. FOR WRITE still truncates, which is
      // what "open for writing" means.
      if(m){const fn=m[1].trim();const mode=m[2].toUpperCase()

        this.files[fn].lines.push(String(val));this.record(stmt,env,`→ file: ${val}`)}
      return
    }

    if(u.startsWith('READFILE ')){
      const m=text.match(/READFILE\s+"?([^",]+)"?\s*,\s*(\w+)/i)
      if(m){const fn=m[1].trim();const f=this.files[fn]

    }
    if(u.startsWith('CALL ')){

      const mCall=rest.match(/^(\w+)\s*(?:\(([^)]*)\))?$/)
      if(!mCall)throw new Error('Invalid CALL: '+text)

      def.params.forEach((p,i)=>{
        if(p.byref){
          // pass-by-reference: write back to caller env after exec
          local.setLocal(p.name,args[i]??null)

      def.params.forEach((p,i)=>{

    }
    if(u.startsWith('OUTPUT ')){
      const val=this.evalE(text.slice(7).trim(),env)
      const out=String(val);this.output.push(out);this.record(stmt,env,out);return
    }
    if(u.startsWith('INPUT ')){
      const varName=text.slice(6).trim()

    if(assign>=0){

        // arrays were entirely unusable — Challenge 1's own hints crashed.

          const c=Math.round(this.evalE(parts[1].trim(),env))-arr._base2

          if(c<0||c>=arr._data[r].length)throw new Error(`Array column ${c+arr._base2} out of bounds for '${arrM[1]}'`)
          arr._data[r][c]=val

          // vanished and a[99] silently grew the array — an off-by-one in a
          // stack/sort challenge passed instead of erroring.

    if(MARKERS.some(m=>u===m||u.startsWith(m+' ')))return

    // fell through to the scalar branch and the variable became null. The

      // hi got the TYPE string ("INTEGER"), and parseInt("INTEGER") is NaN,

      // array length" the moment it ran (found via

      const[,name,lo,hi]=m1;const base=parseInt(lo);const size=parseInt(hi)-base+1

    }

    if(m2)env.setLocal(m2[1],typeDefault(m2[2]))
  }
}

// Splits a line on ";" into separate statements, ignoring any ";" that
// appears inside a double-quoted string literal (so OUTPUT "a; b" stays intact).
function splitOnSemicolons(text){
  const parts=[];let cur='',inStr=false
  for(let i=0;i<text.length;i++){
    const ch=text[i]
    if(ch==='"')inStr=!inStr
    if(ch===';'&&!inStr){parts.push(cur);cur='';continue}
    cur+=ch
  }
  parts.push(cur)
  return parts
}

// Turns one physical line that packs an inline IF/THEN/ELSE/ENDIF (e.g.
// "IF x > 5 THEN y ← 1 ELSE y ← 2 ENDIF", or a lone "ELSE y ← 2") into
// several separate line-texts — one per control keyword and one per
// statement between them — so the line-oriented parseIf()/parseBlock()
// (which only ever look at whole lines) see each part on its own line,
// exactly like the multi-line form they already handled correctly. Fixes
// a known bug where inline trailing content after THEN/ELSE was silently
// dropped (previously routed around at the content level; see docs/TODO.md
// and scripts/test-igcse-y2-challenges.mjs). Quote-aware: a keyword that
// happens to appear inside a "string literal" is never treated as a
// delimiter.
function expandInlineIf(text){
  let masked='',inStr=false
  for(let i=0;i<text.length;i++){
    const ch=text[i]
    if(ch==='"')inStr=!inStr
    masked+=(inStr&&ch!=='"')?'x':ch
  }
  const re=/\b(IF\s+.+?\s+THEN|ELSEIF\s+.+?\s+THEN|ELSE|ENDIF)\b/gi
  if(!re.test(masked))return[text]
  re.lastIndex=0
  const parts=[];let last=0,m
  while((m=re.exec(masked))){
    if(m.index>last)parts.push(text.slice(last,m.index))
    parts.push(text.slice(m.index,re.lastIndex))
    last=re.lastIndex
  }
  if(last<text.length)parts.push(text.slice(last))
  return parts.map(p=>p.trim()).filter(Boolean)
}

function parseParams(src){
  if(!src.trim())return[]
  return splitArgs(src).map(p=>{
    const clean=p.replace(/\bBYVAL\b/i,'').replace(/\bBYREF\b/i,'').trim()
    const byref=/\bBYREF\b/i.test(p)
    const m=clean.match(/^(\w+)\s*(?::\s*(\w+))?/)
    return{name:m?.[1]||clean,type:m?.[2]||'ANY',byref}
  })
}
function splitArgs(src){
  const result=[];let depth=0,cur=''
  for(const c of src){
    if(c==='('||c==='[')depth++; else if(c===')'||c===']')depth--
    if(c===','&&depth===0){result.push(cur.trim());cur=''}else cur+=c
  }
  if(cur.trim())result.push(cur.trim());return result
}
function typeDefault(t){
  const u=t.toUpperCase()
  if(u==='INTEGER'||u==='REAL')return 0
  if(u==='STRING')return '';if(u==='BOOLEAN')return false;if(u==='CHAR')return '';return null
}
function coerceInput(v){
  if(v.trim().toUpperCase()==='TRUE')return true
  if(v.trim().toUpperCase()==='FALSE')return false
  const n=parseFloat(v);return isNaN(n)?v.trim():n
}

CodeMirror.defineSimpleMode('pseudocode2', {
  start:[
    {regex:/\/\/.*$/,token:'comment'},
    {regex:/"[^"]*"/,token:'string'},
    {regex:/'[^']*'/,token:'string'},

// ── UI helpers ────────────────────────────────────────────────────────────────
let traceVisible=true
const interp=new Interpreter()

function normaliseArrows(src){return src.replace(/<-/g,'←').replace(/=>/g,'←')}

function runCode(){
  const code=normaliseArrows(editor.getValue())
  if(!code.trim()){appendOut('// Nothing to run.','out');return}
  LessonSaves.save('igcse-y2',-1,{code:editor.getValue()})
  const rawInputs=document.getElementById('input-vals').value
  const inputVals=rawInputs.trim()?rawInputs.split(',').map(s=>s.trim()).filter(Boolean):[]
  document.getElementById('output').innerHTML='';clearTraceTable()
  let result
  try{result=interp.run(code,inputVals)}
  catch(e){appendOut(friendlyErr(e),'out-err');return}
  if(result.output.length)result.output.forEach(l=>appendOut(l,'out'))
  else appendOut('(no OUTPUT statements)','out')
  renderTraceTable(result.trace)
  validateChallenge(code,result)
}
function friendlyErr(e){
  if(typeof e==='object'&&e.type==='RETURN')return'RETURN used outside a function/procedure.'
  const msg=e?.message||String(e)
  if(msg.includes('not been declared'))return`⚠ ${msg}`
  if(msg.includes('not defined'))return`⚠ ${msg}`
  if(msg.includes('Too many steps'))return`⚠ ${msg}`
  if(msg.includes('out of bounds'))return`⚠ ${msg}`
  if(msg.includes('Division by zero'))return`⚠ ${msg}`
  if(msg.includes('Unexpected token'))return`⚠ Syntax error: ${msg}`
  return`⚠ Error: ${msg}`
}
function appendOut(text,cls='out'){
  const pre=document.getElementById('output');const span=document.createElement('span')
  span.className=cls;span.textContent=text+'\n';pre.appendChild(span)
}
function clearTraceTable(){
  document.getElementById('trace-head').innerHTML=''
  document.getElementById('trace-body').innerHTML=''
}
function renderTraceTable(trace){
  if(!trace.length)return
  const allVars=new Set();trace.forEach(s=>Object.keys(s.vars).forEach(k=>allVars.add(k)))
  const varNames=[...allVars].filter(v=>!v.startsWith('_'))
  const hdr=document.getElementById('trace-head')
  hdr.innerHTML='<th>#</th><th>Line</th><th>Statement</th>'+varNames.map(v=>`<th>${v}</th>`).join('')+'<th>Output</th>'
  const tbody=document.getElementById('trace-body');tbody.innerHTML='';let prevVars={}
  trace.forEach((step)=>{
    const tr=document.createElement('tr')
    if(varNames.some(v=>step.vars[v]!==prevVars[v]))tr.className='changed'
    const trunc=step.code.length>28?step.code.slice(0,27)+'…':step.code
    tr.innerHTML=`<td>${step.step}</td><td>${step.n}</td><td title="${step.code}">${trunc}</td>`+
      varNames.map(v=>{
        const val=step.vars[v];const disp=val===null?'–':Array.isArray(val?._data)?`[${val._data.join(',')}]`:String(val)
        return`<td class="${step.vars[v]!==prevVars[v]?' changed-val':''}">${disp}</td>`
      }).join('')+`<td class="out-col">${step.out??''}</td>`
    tbody.appendChild(tr);prevVars={...step.vars}
  })
}
function toggleTrace(){traceVisible=!traceVisible;document.getElementById('trace-wrap').style.display=traceVisible?'':'none'}

    <div class="cl-block"><h4>Nested loops fill a 2D array</h4>

    <div class="cl-block"><h4>Why this matters</h4>
      <p>BYVAL is the SAFE default — a procedure can freely modify its own copy of a parameter without any risk of accidentally corrupting the caller's original data.</p></div>` },

    <div class="cl-block"><h4>Three steps, always in this order</h4>
      <p>Every file operation follows the same shape: OPEN it (stating whether you're reading or writing), do your WRITEFILE/READFILE operations, then always CLOSE it when finished.</p></div>
    <div class="cl-block"><h4>A loop can write many lines, one WRITEFILE at a time</h4>
      <p>Each <code>WRITEFILE</code> call writes exactly ONE line — a FOR loop calling it three times, with different text each time, is how you write multiple lines without three separate hardcoded WRITEFILE statements.</p></div>` },
  'M3/EOF Loop': { title: 'Writing, then reading the SAME file back', html: `
    <div class="cl-block"><h4>Close before you reopen for a different purpose</h4>
      <p>A file opened FOR WRITE has to be CLOSED before it can be reopened FOR READ — you can't write and read the same open file handle at once in this model.</p></div>
    <div class="cl-block"><h4>READFILE pulls one line at a time, in order</h4>
      <p>Just like WRITEFILE writes one line per call, READFILE reads back exactly one line per call — looping the same number of times as you originally wrote reads every line back, in the same order they were written.</p></div>` },

  // ── M4 — Stacks & Queues ──────────────────────────────────────────────────────
  'M4/Stack PUSH': { title: 'An array-based stack — PUSH', html: `
    <div class="cl-block"><h4>top tracks where the next item goes</h4>
      <p><code>top</code> starts at 0 (empty). PUSHing increments <code>top</code> FIRST, then stores the new value at <code>arr[top]</code> — top always points at the most recently pushed item.</p></div>
    <div class="cl-block"><h4>Overflow — the stack has a fixed maximum size</h4>
      <p>The array only holds 5 items — checking <code>IF top >= 5</code> BEFORE pushing catches overflow, the real, fixed-capacity limitation every array-based (rather than dynamically-growing) stack has.</p></div>` },
  'M4/Stack POP': { title: 'POP — removing from the top, LIFO order', html: `
    <div class="cl-block"><h4>Read the top value, THEN decrement top</h4>
      <p>Popping reads <code>arr[top]</code> to get the value, THEN decrements <code>top</code> by 1 — the opposite order from PUSH (which increments first, then writes), since POP is removing what's already there.</p></div>
    <div class="cl-block"><h4>Underflow — you can't pop an empty stack</h4>
      <p><code>IF top = 0</code> means the stack is empty — popping anyway would try to read a cell that was never validly pushed. Checking for underflow before popping is exactly as important as checking overflow before pushing.</p></div>` },

  // ── M5 — Sorting & Searching ──────────────────────────────────────────────────
  'M5/Bubble Sort': { title: 'Bubble sort — nested loops, adjacent swaps', html: `
    <div class="cl-block"><h4>Outer loop = number of passes; inner loop = comparisons</h4>
      <p>The outer loop controls HOW MANY passes to make; the inner loop walks through the array comparing each adjacent pair — swapping whenever they're in the wrong order.</p></div>
    <div class="cl-block"><h4>A temp variable is required to swap</h4>
      <p>Swapping <code>arr[j]</code> and <code>arr[j+1]</code> needs a THIRD variable to hold one value temporarily — otherwise assigning one directly to the other would overwrite and lose it before the swap completes.</p></div>` },
  'M5/Binary Search': { title: 'Binary search, in real pseudocode', html: `
    <div class="cl-block"><h4>low/high/mid — narrowing the search window</h4>
      <p><code>low</code> and <code>high</code> mark the current search window; <code>mid</code> is the middle. If the target is bigger than <code>arr[mid]</code>, the whole LEFT half (including mid) can be discarded by moving <code>low</code> up; otherwise discard the right half by moving <code>high</code> down.</p></div>
    <div class="cl-block"><h4>The loop ends when the window closes or a match is found</h4>
      <p><code>WHILE low <= high</code> keeps searching for as long as there's still a valid window left — the moment <code>low</code> passes <code>high</code>, the target genuinely isn't in the array, and the function returns -1.</p></div>` },

  // ── M6 — OOP Basics ───────────────────────────────────────────────────────────
  'M6/Class Declaration': { title: 'Simulating a class with named procedures', html: `
    <div class="cl-block"><h4>A "constructor" is just a setup procedure</h4>
      <p><code>Animal_New</code> plays the role of a constructor — a procedure that initialises an object's data (here, simulated with plain variables named by convention, <code>animalName</code>/<code>animalSound</code>).</p></div>
    <div class="cl-block"><h4>A "method" is just a procedure that uses that data</h4>
      <p><code>Animal_Speak</code> reads the data <code>Animal_New</code> set up and does something with it — exactly the relationship between a constructor and a method in real object-oriented code (which you'll write for real in AS/A Level).</p></div>` },
  'M6/Inheritance': { title: 'Inheritance — building on top of an existing "class"', html: `
    <div class="cl-block"><h4>Reusing Animal's setup, then adding something new</h4>
      <p><code>Dog_New</code> calls <code>Animal_New</code> to reuse ALL of its existing setup logic, then adds ONE new piece of data (<code>breed</code>) specific to dogs — building on top of existing code instead of rewriting it from scratch.</p></div>
    <div class="cl-block"><h4>Real inheritance works the same way</h4>
      <p>A real <code>Dog</code> class inheriting from <code>Animal</code> gets every one of Animal's attributes and methods for free, then adds its own extras — exactly what this naming-convention simulation is standing in for.</p></div>` },
}

function renderPills(){
  const row=document.getElementById('ch-pills');row.innerHTML=''
  CHALLENGES.forEach((ch,i)=>{
    const el=document.createElement('div')
    el.className='ch-pill'+(i===activeIdx?' active':'')+(completed.has(i)?' done':'')
    el.textContent=(completed.has(i)?'✓ ':'')+ch.mod+' '+ch.name
    el.onclick=()=>selectChallenge(i);row.appendChild(el)
  })
  renderNavStrip()
}

function renderNavStrip() {
  const cur = document.getElementById('ch-nav-current')
  const ch  = CHALLENGES[activeIdx]
  if (cur && ch) cur.textContent = (activeIdx + 1) + ' / ' + CHALLENGES.length + ' — ' + ch.mod + ' ' + ch.name + (completed.has(activeIdx) ? ' ✓' : '')
}

function stepChallenge(delta) {
  const next = activeIdx + delta
  if (next < 0 || next >= CHALLENGES.length) return
  selectChallenge(next)
}

function toggleChallengeList() {
  const row = document.getElementById('ch-pills')
  const tog = document.getElementById('ch-nav-toggle')
  const expanded = row.classList.toggle('expanded')
  if (tog) tog.textContent = expanded ? '✕ Hide list' : '☰ All challenges'
}
// Self-check book lessons (type:'lesson') have no starter/output/trace at
// all — this swaps the whole editor+output layout for the lesson-wrap
// overlay (real static lesson page + a manual mark-complete button)
// instead of a graded pseudocode challenge.
function showMissionMain(show) {
  document.getElementById('mission-main').style.display = show ? '' : 'none'
  document.getElementById('lesson-wrap').style.display = show ? 'none' : ''
}
function selectChallenge(i){
  activeIdx=i;hintIdx=0;challengeStartedAt=Date.now();const ch=CHALLENGES[i]
  if (ch.type === 'lesson') {
    showMissionMain(false)
    document.getElementById('lesson-wrap-title').textContent = ch.mod + ' ' + ch.name
    const qs = currentClassId ? ('?classId=' + encodeURIComponent(currentClassId)) : ''
    document.getElementById('lesson-wrap-iframe').src = '/lessons/igcse-y2-book/' + ch.bookFile + qs
    document.getElementById('lesson-wrap-feedback').textContent = completed.has(i) ? '✓ Already complete' : ''
    document.getElementById('lesson-wrap-feedback').style.color = '#4ade80'
    renderPills()
    return
  }
  showMissionMain(true)
  document.getElementById('ch-text').innerHTML=ch.text
  document.getElementById('xp-pill').textContent='+'+ch.xp+' XP'
  editor.setValue(ch.starter||'')
  document.getElementById('output').innerHTML='';clearTraceTable();renderPills()
  renderChallengeLesson(ch)
}
function markLessonComplete() {
  const ch = CHALLENGES[activeIdx]
  if (!ch || ch.type !== 'lesson') return
  const fb = document.getElementById('lesson-wrap-feedback')
  if (completed.has(activeIdx)) { fb.textContent = '✓ Already marked complete.'; return }
  completed.add(activeIdx)
  renderPills()
  showToast('Lesson complete! +' + ch.xp + ' XP')
  if (me) { BF.addXP(me.id, ch.xp); BF.recordAttempt(me.id, 'gy2-c' + activeIdx, { passed: true, score: 100 }) }
  LessonSaves.save('igcse-y2', ch.mod + '/' + ch.name, { passed: true, xpEarned: ch.xp, code: 'self-check' })
  try { reportRealProgress(ch, Date.now() - challengeStartedAt) } catch (e) {}
  fb.textContent = '✓ Marked complete!'
}

// 📘 Full per-challenge lesson — CHALLENGE_LESSON defined after CHALLENGES,
// keyed by "mod/name" (no dedicated id field on these challenges).
let _clExpanded = true
function renderChallengeLesson(ch) {
  const wrap  = document.getElementById('ch-lesson')
  const body  = document.getElementById('cl-body')
  const title = document.getElementById('cl-title')
  if (!wrap) return
  const key = ch.mod + '/' + ch.name
  const lesson = typeof CHALLENGE_LESSON !== 'undefined' ? CHALLENGE_LESSON[key] : null
  if (!lesson) { wrap.style.display = 'none'; return }
  wrap.style.display = ''
  title.textContent = lesson.title
  body.innerHTML = lesson.html
  body.classList.toggle('collapsed', !_clExpanded)
  document.getElementById('cl-arrow').textContent = _clExpanded ? '▾' : '▸'
}
function toggleChallengeLesson() {
  _clExpanded = !_clExpanded
  document.getElementById('cl-body').classList.toggle('collapsed', !_clExpanded)
  document.getElementById('cl-arrow').textContent = _clExpanded ? '▾' : '▸'
}

function resetStarter(){
  const ch=CHALLENGES[activeIdx];if(ch)editor.setValue(ch.starter||'')
  document.getElementById('output').innerHTML='';clearTraceTable()
}
function validateChallenge(code,result){
  const ch=CHALLENGES[activeIdx];if(!ch||completed.has(activeIdx))return
  if(ch.check(code,result)){
    completed.add(activeIdx);renderPills();showToast('Challenge complete! +'+ch.xp+' XP')
    if(me){BF.addXP(me.id,ch.xp);BF.recordAttempt(me.id,'gy2-c'+activeIdx,{passed:true,score:100})}
    LessonSaves.save('igcse-y2', ch.mod + '/' + ch.name, {passed:true,xpEarned:ch.xp,code})
    try { reportRealProgress(ch, Date.now() - challengeStartedAt) } catch (e) {}
  }
}
function showHint(){
  const ch=CHALLENGES[activeIdx];if(!ch)return
  if(hintIdx<ch.hints.length)appendOut('Hint '+(hintIdx+1)+': '+ch.hints[hintIdx++],'out-ok')
  else appendOut('No more hints!','out-ok')
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)
}

// A teacher previewing this page (embedded via IgcseLessonEditor.tsx's
// iframe, ?classId=&teacher=1 — the same convention every lesson editor
// uses) must be able to open ANY stage regardless of student progress, since
// there IS no student progress in that context.
function isTeacherPreview() { return new URLSearchParams(window.location.search).get('teacher') === '1' }

// ── Quest Map — 🧭 Code Expedition ───────────────────────────
function showQuestMap() {
  const EMO = {M1:'🗃',M2:'⚖',M3:'📂',M4:'📚',M5:'🔀',M6:'🧱',M7:'🧩',M8:'🐍',M9:'🗄️',M10:'⚡'}
  const stagesFor = mod => CHALLENGES
    .map((c, i) => ({ c, i }))
    .filter(x => x.c.mod === mod)
    .map(x => ({ id: String(x.i), emoji: EMO[mod] || '🐍', label: x.c.name, done: completed.has(x.i) }))
  QuestMap.show({
    title: '🧭 Code Expedition — IGCSE Year 2',
    subtitle: 'Ten camps on the road to Paper 2 — each camp mixes textbook lessons with hands-on pseudocode challenges on the same topic. Pseudocode is your gear.',
    accent: '#a78bfa',
    layout: 'path', softLock: true, hardLock: !isTeacherPreview(),
    avatarSvg: '<span style="font-size:22px;">🧭</span>',
    worlds: [
      { name: '🗃 Camp 1 — Arrays & Records', sub: 'Lessons: 1D & 2D arrays · Challenges: 2D arrays, records', live: true, stages: stagesFor('M1') },
      { name: '⚖ Camp 2 — Procedures, Functions & Parameters', sub: 'Lessons: procedures, scope · Challenges: BYVAL, BYREF', live: true, stages: stagesFor('M2') },
      { name: '📂 Camp 3 — File Handling', sub: 'Lesson: file handling · Challenges: OPENFILE, EOF and friends', live: true, stages: stagesFor('M3') },
      { name: '📚 Camp 4 — Stacks & Queues', sub: 'Lesson: stacks & queues · Challenges: PUSH, POP and pointers', live: true, stages: stagesFor('M4') },
      { name: '🔀 Camp 5 — Sorting & Searching', sub: 'Lessons: linear search, bubble sort · Challenges: bubble sort, binary search', live: true, stages: stagesFor('M5') },
      { name: '🧱 Camp 6 — OOP Basics', sub: 'Classes, NEW and inheritance', live: true, stages: stagesFor('M6') },
      { name: '🧩 Camp 7 — Algorithm Design & Problem Solving', sub: 'Textbook: structure diagrams, validation, trace tables', live: true, stages: stagesFor('M7') },
      { name: '🐍 Camp 8 — Programming Fundamentals', sub: 'Textbook: real pseudocode-to-Python, operators, nesting', live: true, stages: stagesFor('M8') },
      { name: '🗄️ Camp 9 — Databases', sub: 'Textbook: tables, primary keys, SQL', live: true, stages: stagesFor('M9') },
      { name: '⚡ Camp 10 — Logic Gates', sub: 'Textbook: the six gates, circuits, truth tables', live: true, stages: stagesFor('M10') },
    ],
    onOpen: id => { selectChallenge(parseInt(id)) },
  })
}

// ── Teacher-editable per-class content overrides ─────────────────────────────
// Same as igcse-y1.html — see that file's comment for the full rationale
// (index-keyed overrides, original mod/name captured before any rename).
async function fetchClassIdIgcse() {
  const urlParam = new URLSearchParams(window.location.search).get('classId')
  if (urlParam) return urlParam
  if (!me) return null
  try {
    const res = await fetch('/api/profile')
    if (!res.ok) return null
    const data = await res.json()
    return data.classId ?? data.class_id ?? null
  } catch (e) { return null }
}
async function applyClassOverrides() {
  const classId = await fetchClassIdIgcse()
  currentClassId = classId   // used to build the book-lesson iframe src so teacher edits show up
  if (!classId) return
  try {
    const res = await fetch(`/api/class-lesson-overrides?classId=${encodeURIComponent(classId)}&lessonKey=igcse-y2`)
    if (!res.ok) return
    const { overrides } = await res.json()
    if (!overrides || !overrides.length) return
    const stageOv  = new Map(overrides.filter(o => o.scope === 'stage').map(o => [o.target_id, o.override_data]))
    const lessonOv = new Map(overrides.filter(o => o.scope === 'lesson').map(o => [o.target_id, o.override_data]))
    const originalKeys = CHALLENGES.map(ch => ch.mod + '/' + ch.name)
    CHALLENGES.forEach((ch, i) => {
      const so = stageOv.get(String(i))
      if (so) Object.assign(ch, so)
    })
    if (typeof CHALLENGE_LESSON !== 'undefined') {
      CHALLENGES.forEach((ch, i) => {
        const lo = lessonOv.get(String(i))
        if (!lo) return
        const key = originalKeys[i]
        CHALLENGE_LESSON[key] = CHALLENGE_LESSON[key] ? Object.assign(CHALLENGE_LESSON[key], lo) : lo
      })
    }
  } catch (e) { console.warn('[igcse-y2] override load failed (offline?):', e.message) }
}

// ── Init ──────────────────────────────────────────────────────────────────────
;(async()=>{
  await applyClassOverrides()
  await LessonSaves.load('igcse-y2')
  LessonSaves.completedIds().forEach(id => { if (STAGE_INDEX[id] !== undefined) completed.add(STAGE_INDEX[id]) })
  LessonSaves.completedSet().forEach(idx=>completed.add(idx))
  renderPills()
  showQuestMap()   // land on the map — nothing else renders until a stage is picked
})()
</script>
