<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ByteForge — Live Canvas Editor</title>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    body { padding-top:64px; min-height:100vh; }
    .layout { display:grid; grid-template-columns:1fr 420px; height:calc(100vh - 64px); overflow:hidden; }

    /* ── Left: canvas ── */
    .canvas-panel { display:flex; flex-direction:column; border-right:1px solid var(--border); }
    .panel-header { padding:14px 20px; background:var(--bg-card); border-bottom:1px solid var(--border);
                    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0; }
    .panel-title { font-size:15px; font-weight:700; }
    .stage-badge { font-size:11px; font-weight:700; padding:3px 8px; border-radius:4px;
                   background:rgba(184,239,74,.12); color:#b8ef4a; border:1px solid rgba(184,239,74,.25); }
    .btn-row { display:flex; gap:8px; }
    .btn { padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:.15s; }
    .btn-brand { background:#b8ef4a; color:#0d0f1a; }
    .btn-brand:hover { background:#a5d83d; }
    .btn-ghost { background:var(--bg-raised); color:var(--fg); border:1px solid var(--border-hi); }
    .btn-ghost:hover { background:rgba(255,255,255,.08); }
    .canvas-wrap { flex:1; display:flex; align-items:center; justify-content:center;
                   background:#05080f; overflow:hidden; }
    #main-canvas { display:block; border:1px solid rgba(255,255,255,.06); }

    /* ── Right: editor ── */
    .right-panel { display:flex; flex-direction:column; overflow:hidden; }

    /* Challenge list */
    .challenges { flex-shrink:0; background:var(--bg-card); border-bottom:1px solid var(--border); max-height:160px; overflow-y:auto; }
    .ch-header { padding:10px 16px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
                 color:var(--fg-faint); border-bottom:1px solid var(--border); }
    .ch-item { padding:9px 16px; display:flex; align-items:center; gap:10px;
               border-bottom:1px solid rgba(255,255,255,.04); cursor:pointer; transition:.15s; }
    .ch-item:hover { background:rgba(255,255,255,.03); }
    .ch-item.active { background:rgba(184,239,74,.07); }
    .ch-dot { width:7px; height:7px; border-radius:50%; background:var(--border-hi); flex-shrink:0; }
    .ch-dot.done { background:#4ade80; }
    .ch-name { font-size:13px; font-weight:600; flex:1; }
    .ch-tag  { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .ch-tag.grade7 { background:rgba(6,182,212,.15); color:#67e8f9; }
    .ch-tag.grade8 { background:rgba(59,130,246,.15); color:#93c5fd; }

    /* Editor */
    .editor-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .editor-header { padding:10px 16px; font-size:11px; font-weight:700; text-transform:uppercase;
                     letter-spacing:.08em; color:var(--fg-faint); background:var(--bg);
                     border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .hint-btn { cursor:pointer; color:#fbbf24; font-size:11px; }
    textarea#editor {
      flex:1; width:100%; resize:none; padding:16px; background:#070a10;
      color:#abb2bf; font-family:var(--mono); font-size:13px; line-height:1.7;
      border:none; outline:none; tab-size:2;
    }

    /* Output */
    .output { flex-shrink:0; max-height:110px; overflow-y:auto; padding:10px 16px;
              background:#050710; border-top:1px solid var(--border); font-family:var(--mono); font-size:12px; }
    .out-line      { color:#6b7280; margin-bottom:2px; }
    .out-line.ok   { color:#4ade80; }
    .out-line.err  { color:#f87171; }
    .out-line.info { color:#b8ef4a; }
    .out-line.warn { color:#fbbf24; }

    /* Toast */
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px);
             padding:12px 24px; border-radius:10px; font-size:14px; font-weight:600;
             background:#1a2e1a; color:#bbf7d0; border:1px solid #16a34a;
             opacity:0; transition:.3s; z-index:9999; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    @media(max-width:800px) { .layout { grid-template-columns:1fr; grid-template-rows:45vh 1fr; } }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M10 1.5L18.5 10L10 18.5L1.5 10Z" fill="rgba(184,239,74,.18)" stroke="#b8ef4a" stroke-width="1.25" stroke-linejoin="round"/>
      <path d="M11.5 6.5L9 10.5H11.5L8.5 14" stroke="#b8ef4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">ByteForge</span>
  </div>
  <div class="nav-links"><a href="/student/dashboard">← Dashboard</a></div>
</nav>

<div class="layout">

  <!-- Canvas -->
  <div class="canvas-panel">
    <div class="panel-header">
      <div class="panel-title">Live Canvas <span class="stage-badge" id="stage-badge">Grade 7</span></div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="clearCanvas()">Clear</button>
        <button class="btn btn-brand" onclick="runCode()">▶ Run</button>
      </div>
    </div>
    <div class="canvas-wrap">
      <canvas id="main-canvas" width="560" height="520"></canvas>
    </div>
  </div>

  <!-- Editor -->
  <div class="right-panel">

    <div class="challenges">
      <div class="ch-header">Challenges</div>
      <div id="ch-list"></div>
    </div>

    <div class="editor-wrap">
      <div class="editor-header">
        <span>Code</span>
        <span class="hint-btn" onclick="showHint()">💡 Hint</span>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>

    <div class="output" id="output">
      <div class="out-line info">Ready — press Run to execute your code.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/lesson-saves.js"></script>
<script>
// ── BF Integration ────────────────────────────────────────────────────────────
BF.seed()
const me = (() => { try { return BF.session() || null } catch(_) { return null } })()
// ── Canvas API exposed to student code ────────────────────────────────────────
const canvas = document.getElementById('main-canvas')
const ctx    = canvas.getContext('2d')
const W      = canvas.width
const H      = canvas.height

let pressedKeys  = new Set()
let mouseX = W/2, mouseY = H/2
let rafId

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect()
  mouseX = (e.clientX - r.left) * (W / r.width)
  mouseY = (e.clientY - r.top)  * (H / r.height)
})
document.addEventListener('keydown', e => pressedKeys.add(e.key))
document.addEventListener('keyup',   e => pressedKeys.delete(e.key))

// Student-facing drawing API
const API = {
  // Drawing
  rect(x, y, w, h, color='#b8ef4a')    { ctx.fillStyle=color; ctx.fillRect(x,y,w,h) },
  circle(x, y, r, color='#b8ef4a')     { ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill() },
  line(x1,y1,x2,y2,color='#b8ef4a',w=2){ ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke() },
  text(str, x, y, size=16, color='#e8eaf0') { ctx.fillStyle=color; ctx.font=`${size}px Inter,sans-serif`; ctx.fillText(str,x,y) },
  clear(color='#070a10')               { ctx.fillStyle=color; ctx.fillRect(0,0,W,H) },
  background(color)                    { ctx.fillStyle=color; ctx.fillRect(0,0,W,H) },
  // Input
  isKeyDown(key)  { return pressedKeys.has(key) },
  mouseX()        { return Math.round(mouseX) },
  mouseY()        { return Math.round(mouseY) },
  // Maths
  random(min, max){ return Math.random()*(max-min)+min },
  floor: Math.floor,
  abs: Math.abs,
  sin: Math.sin,
  cos: Math.cos,
  // Dimensions
  WIDTH:  W,
  HEIGHT: H,
  print: (...args) => log(args.join(' '),'info'),
}

function clearCanvas() {
  cancelAnimationFrame(rafId)
  ctx.fillStyle = '#070a10'
  ctx.fillRect(0, 0, W, H)
}

// ── Code runner ───────────────────────────────────────────────────────────────
function runCode() {
  cancelAnimationFrame(rafId)
  clearCanvas()
  const src = document.getElementById('editor').value
  const wrapped = buildWrapper(src)
  try {
    const fn = new Function(...Object.keys(API), wrapped)
    const result = fn(...Object.values(API))
    if (typeof result === 'function') {
      // Student returned an update/loop function
      let frameCount = 0
      function loop() {
        result(frameCount++)
        rafId = requestAnimationFrame(loop)
      }
      loop()
    }
    checkChallenge()
  } catch(e) {
    const friendly = friendlyError(e.message)
    log('Error: ' + friendly, 'err')
  }
}

function buildWrapper(src) {
  // Detect if student used a loop/game pattern
  if (src.includes('function update') || src.includes('def update')) {
    return src + '\nreturn update'
  }
  return src
}

function friendlyError(msg) {
  if (msg.includes('is not defined')) {
    const name = msg.match(/(\w+) is not defined/)?.[1]
    return `"${name}" hasn't been defined yet. Check the spelling or add it before you use it.`
  }
  if (msg.includes('Cannot read')) return 'Looks like you\'re using a variable before it has a value.'
  if (msg.includes('Unexpected')) return 'Syntax error — check for missing parentheses or a typo.'
  return msg
}

// ── Output ────────────────────────────────────────────────────────────────────
function log(msg, cls='') {
  const panel = document.getElementById('output')
  const div   = document.createElement('div')
  div.className = 'out-line' + (cls ? ' ' + cls : '')
  div.textContent = msg
  panel.appendChild(div)
  panel.scrollTop = panel.scrollHeight
  if (panel.children.length > 60) panel.removeChild(panel.firstChild)
}

// ── Challenges ────────────────────────────────────────────────────────────────
const CHALLENGES = [
  // Grade 7: Variables
  {
    name: 'Colour Mixer',
    grade: 7,
    xp: 25,
    hint: 'Create three variables for r, g, b (0–255) and use rect() to fill the canvas.',
    starter: `// Colour mixer — change the variables to mix a new colour!
let r = 0
let g = 200
let b = 255

background(\`rgb(\${r},\${g},\${b})\`)
text("R:" + r + "  G:" + g + "  B:" + b, 20, 30, 14, "#fff")`,
    check: (src) => src.includes('rgb') && src.includes('background'),
  },
  // Grade 7: Conditionals
  {
    name: 'Traffic Light',
    grade: 7,
    xp: 35,
    hint: 'Use a variable called state (0, 1, or 2). Use if/else to draw the correct light in colour.',
    starter: `// Traffic light — change state to 0, 1, or 2
let state = 0   // 0 = red, 1 = green, 2 = yellow

clear()
// Draw the housing
rect(230, 80, 100, 280, "#1a1a1a")

// Draw the lights — change colors based on state
let redColor    = state === 0 ? "#ef4444" : "#3f0f0f"
let greenColor  = state === 1 ? "#22c55e" : "#0f3f0f"
let yellowColor = state === 2 ? "#eab308" : "#3f3300"

circle(280, 140, 35, redColor)
circle(280, 220, 35, yellowColor)
circle(280, 300, 35, greenColor)`,
    check: (src) => src.includes('state') && (src.includes('if') || src.includes('===') || src.includes('?')),
  },
  // Grade 7: Events
  {
    name: 'Move the Box',
    grade: 7,
    xp: 40,
    hint: 'Use isKeyDown("ArrowLeft") etc. inside an update function. Change x and y variables.',
    starter: `// Move the box with arrow keys!
let x = WIDTH / 2
let y = HEIGHT / 2
let speed = 4

function update() {
  clear()
  if (isKeyDown("ArrowLeft"))  x -= speed
  if (isKeyDown("ArrowRight")) x += speed
  if (isKeyDown("ArrowUp"))    y -= speed
  if (isKeyDown("ArrowDown"))  y += speed
  rect(x - 25, y - 25, 50, 50, "#b8ef4a")
  text("Use arrow keys", 10, HEIGHT - 15, 12, "#6b7280")
}

return update`,
    check: (src) => src.includes('isKeyDown') && src.includes('update'),
  },
  // Grade 8: Functions
  {
    name: 'Village with Functions',
    grade: 8,
    xp: 50,
    hint: 'Define drawHouse(x, y, color). Call it 4 times with different x positions and colors.',
    starter: `// Functions — define once, call many times
function drawHouse(x, y, color) {
  // Body (walls)
  rect(x, y + 40, 80, 60, color)
  // Roof (triangle approximated by lines)
  line(x, y + 40,       x + 40, y,       "#e8eaf0", 2)
  line(x + 40, y,       x + 80, y + 40,  "#e8eaf0", 2)
  // Door
  rect(x + 30, y + 70, 20, 30, "#0d0f1a")
}

clear()
drawHouse(60,  200, "#3b82f6")
drawHouse(180, 200, "#f97316")
drawHouse(300, 200, "#22c55e")
drawHouse(420, 200, "#a855f7")`,
    check: (src) => src.includes('function') && src.match(/drawHouse.*,.*,/),
  },
  // Grade 8: Lists
  {
    name: 'Leaderboard',
    grade: 8,
    xp: 55,
    hint: 'Store scores in an array. Sort them. Draw the top 5 as bars.',
    starter: `// Lists — store and display scores
let scores = [82, 47, 91, 63, 55, 78, 34, 99, 71, 50]

// Sort descending
scores.sort((a, b) => b - a)

clear()
text("Top Scores", 20, 35, 18, "#e8eaf0")

for (let i = 0; i < 5; i++) {
  let y = 60 + i * 70
  let w = scores[i] * 4
  rect(0, y, w, 50, i === 0 ? "#b8ef4a" : "#3b82f6")
  text("#" + (i+1) + "  " + scores[i] + " pts", 10, y + 32, 15, i === 0 ? "#0d0f1a" : "#e8eaf0")
}`,
    check: (src) => src.includes('sort') && src.includes('[') && src.includes('for'),
  },
]

const completed = new Set()
let activeIdx = 0

function renderChallenges() {
  const list = document.getElementById('ch-list')
  list.innerHTML = ''
  CHALLENGES.forEach((ch, i) => {
    const el = document.createElement('div')
    el.className = 'ch-item' + (i === activeIdx ? ' active' : '')
    el.innerHTML = `
      <div class="ch-dot ${completed.has(i) ? 'done' : ''}"></div>
      <div class="ch-name">${ch.name}</div>
      <span class="ch-tag grade${ch.grade}">Gr ${ch.grade}</span>
    `
    el.onclick = () => selectChallenge(i)
    list.appendChild(el)
  })
}

function selectChallenge(i) {
  activeIdx = i
  const ch  = CHALLENGES[i]
  document.getElementById('editor').value = ch.starter
  document.getElementById('stage-badge').textContent = 'Grade ' + ch.grade
  clearCanvas()
  log('Challenge: ' + ch.name + ' — edit and press Run.', 'info')
  renderChallenges()
}

function checkChallenge() {
  const ch  = CHALLENGES[activeIdx]
  const src = document.getElementById('editor').value
  if (ch && ch.check(src)) {
    if (!completed.has(activeIdx)) {
      completed.add(activeIdx)
      renderChallenges()
      showToast('Challenge complete! +' + ch.xp + ' XP')
      log('Challenge complete! +' + ch.xp + ' XP', 'ok')
      if (me) { BF.addXP(me.id, ch.xp); BF.recordAttempt(me.id, 'canvas-c' + activeIdx, { passed: true, score: 100 }); }
      LessonSaves.save('canvas-code', activeIdx, { passed: true, xpEarned: ch.xp, code: document.getElementById('editor').value })
    }
  }
}

function showHint() {
  const ch = CHALLENGES[activeIdx]
  if (ch) log('Hint: ' + ch.hint, 'warn')
}

function showToast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 3000)
}

// ── Init — restore Supabase saves, then render ───────────────────────────────
;(async () => {
  await LessonSaves.load('canvas-code')
  LessonSaves.completedSet().forEach(idx => completed.add(idx))
  renderChallenges()
  selectChallenge(0)
})()
</script>
</body>
</html>
