<!DOCTYPE html>
<html lang="en">
<head>

  <title>ByteForge — Grade 9 Programming</title>
  <link rel="stylesheet" href="../styles.css"/>

  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { padding-top:64px; background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; }
    .layout { display:grid; grid-template-columns:1fr 460px; height:calc(100vh - 64px); overflow:hidden; }

    /* ── Left: editor panel ── */
    .ed-panel  { display:flex; flex-direction:column; border-right:1px solid var(--border); overflow:hidden; }
    .ed-header { flex-shrink:0; padding:10px 14px; background:var(--bg-card); border-bottom:1px solid var(--border);
                 display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .ed-title  { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
    .badge     { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; }
    .badge-9   { background:rgba(168,85,247,.15); color:#c084fc; border:1px solid rgba(168,85,247,.3); }

    .char-toolbar { flex-shrink:0; display:flex; align-items:center; gap:4px; padding:5px 14px;
                    background:var(--bg); border-bottom:1px solid var(--border); }
    .char-toolbar span { font-size:10px; color:var(--fg-faint); margin-right:4px; }
    .char-btn { padding:3px 8px; border-radius:4px; font-size:13px; font-family:var(--mono);
                border:1px solid var(--border); background:var(--bg-raised); color:var(--fg);
                cursor:pointer; transition:.1s; }
    .char-btn:hover { background:rgba(168,85,247,.15); border-color:#c084fc; color:#c084fc; }

    .cm-outer { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .cm-outer .CodeMirror {
      height:100% !important; font-size:13px !important; font-family:var(--mono) !important;
      background:#070910 !important; line-height:1.7 !important;
    }
    .cm-outer .CodeMirror-scroll   { background:#070910 !important; }
    .cm-outer .CodeMirror-gutters  { background:#0b0e1c !important; border-right:1px solid var(--border) !important; }
    .cm-error-line { background:rgba(239,68,68,.15) !important; }

    .run-bar { flex-shrink:0; display:flex; gap:6px; padding:8px 14px; background:var(--bg-card);
               border-top:1px solid var(--border); align-items:center; justify-content:space-between; }
    .btn { padding:6px 13px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:.15s; border:none; }
    .btn-brand { background:#b8ef4a; color:#0d0f1a; }
    .btn-brand:hover { background:#a5d83d; }
    .btn-ghost { background:var(--bg-raised); color:var(--fg); border:1px solid var(--border-hi); }
    .btn-ghost:hover { background:rgba(255,255,255,.08); }
    .btn-danger { background:rgba(239,68,68,.1); color:#f87171; border:1px solid rgba(239,68,68,.25); }
    .btn-row { display:flex; gap:6px; }
    .input-section { display:flex; align-items:center; gap:6px; }
    .input-section label { font-size:11px; color:var(--fg-faint); white-space:nowrap; }
    .input-section input { padding:4px 8px; border-radius:5px; border:1px solid var(--border);
                           background:var(--bg-raised); color:var(--fg); font-size:12px; font-family:var(--mono);
                           width:160px; }
    .input-section input:focus { outline:none; border-color:#c084fc; }

    /* ── Right panel ── */
    .right-panel { display:flex; flex-direction:column; overflow:hidden; }

    .ch-header { flex-shrink:0; background:var(--bg-card); border-bottom:1px solid var(--border); padding:10px 14px; }
    .ch-pills  { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
    .ch-pill   { padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;
                 border:1px solid var(--border); color:var(--fg-dim); cursor:pointer; transition:.15s; }
    .ch-pill:hover  { border-color:var(--border-hi); color:var(--fg); }
    .ch-pill.active { background:rgba(168,85,247,.12); border-color:#c084fc; color:#c084fc; }
    .ch-pill.done   { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.35); color:#4ade80; }
    .ch-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .ch-text { font-size:11.5px; color:var(--fg-dim); line-height:1.55; flex:1; }
    .ch-text strong { color:var(--fg); }
    .xp-pill  { font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px;
                background:rgba(234,179,8,.12); color:#fbbf24; border:1px solid rgba(234,179,8,.25); white-space:nowrap; }
    .hint-btn { font-size:11px; color:#fbbf24; cursor:pointer; }
    .ch-meta  { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }

    /* Output */
    .out-section { flex-shrink:0; border-bottom:1px solid var(--border); }
    .section-hdr { padding:7px 14px; background:var(--bg); border-bottom:1px solid var(--border);
                   display:flex; justify-content:space-between; align-items:center; }
    .section-lbl { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--fg-faint); }
    pre#output   { padding:10px 14px; font-family:var(--mono); font-size:12px; line-height:1.7;
                   background:#050810; color:#e2e8f0; min-height:60px; max-height:130px;
                   overflow-y:auto; white-space:pre-wrap; }
    .out-err { color:#f87171; }
    .out-ok  { color:#4ade80; }

    /* Trace table */
    .trace-section { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .trace-toggle  { cursor:pointer; color:#c084fc; font-size:11px; }
    .trace-scroll  { flex:1; overflow-y:auto; background:#040610; }
    table.trace { width:100%; border-collapse:collapse; font-size:11px; font-family:var(--mono); }
    table.trace th { position:sticky; top:0; padding:5px 10px; background:#0d1025;
                     color:var(--fg-faint); font-weight:700; text-align:left; border-bottom:1px solid var(--border); }
    table.trace td { padding:4px 10px; border-bottom:1px solid rgba(255,255,255,.04); color:#9ca3af; }
    table.trace tr.changed td { background:rgba(168,85,247,.06); }
    table.trace td.changed-val { color:#c084fc; font-weight:600; }
    table.trace td.out-col { color:#b8ef4a; }

    /* Toast */
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(60px);
             padding:10px 20px; border-radius:10px; font-size:13px; font-weight:600;
             background:#1a2e1a; color:#bbf7d0; border:1px solid #16a34a;
             opacity:0; transition:.3s; z-index:9999; pointer-events:none; }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

    @media(max-width:900px) { .layout { grid-template-columns:1fr; } }

<script>
'use strict'

// ══════════════════════════════════════════════════════════════════════════════
// Grade 9 Pseudocode Interpreter
// ══════════════════════════════════════════════════════════════════════════════

// ── Tokenizer ────────────────────────────────────────────────────────────────
const KEYWORDS = new Set([
  'DECLARE','IF','THEN','ELSE','ELSEIF','ENDIF',
  'FOR','TO','STEP','NEXT',
  'WHILE','DO','ENDWHILE',
  'REPEAT','UNTIL',
  'PROCEDURE','ENDPROCEDURE',
  'FUNCTION','ENDFUNCTION','RETURNS','RETURN',
  'CALL','OUTPUT','INPUT',
  'AND','OR','NOT','DIV','MOD',
  'ARRAY','OF','CASE','OTHERWISE','ENDCASE',
])
const TYPES  = new Set(['INTEGER','REAL','STRING','BOOLEAN','CHAR'])
const BOOLKW = new Set(['TRUE','FALSE'])

function tokenize(src) {
  // Normalise typed alternatives before tokenising
  src = src.replace(/<-/g, '←')
  const toks = []
  let i = 0, len = src.length

  while (i < len) {
    const c = src[i]

    // whitespace
    if (/\s/.test(c)) { i++; continue }
    // comment
    if (c === '/' && src[i+1] === '/') break

    // ← assignment
    if (c === '←') { toks.push({t:'ASSIGN'}); i++; continue }
    if (c === ':' && src[i+1] === '=') { toks.push({t:'ASSIGN'}); i+=2; continue }
    // colon (for DECLARE) — but :=  handled above
    if (c === ':') { toks.push({t:'COLON'}); i++; continue }

    // string literal
    if (c === '"') {
      let s='', j=i+1
      while (j<len && src[j]!=='"') s+=src[j++]
      toks.push({t:'STR',v:s}); i=j+1; continue
    }
    // char literal
    if (c === "'") {
      toks.push({t:'STR',v:src[i+1]||''}); i+=3; continue
    }

    // number (allow leading -)
    const prevTok = toks[toks.length-1]
    const negOk = !prevTok || ['ASSIGN','LPAREN','COMMA','OP'].includes(prevTok.t)
    if (/[0-9]/.test(c) || (c==='-' && negOk && /[0-9]/.test(src[i+1]||''))) {
      let n = c=== '-' ? (i++, '-') : ''
      while (i<len && /[0-9.]/.test(src[i])) n+=src[i++]
      toks.push({t:'NUM',v:parseFloat(n)}); continue
    }

    // word (keyword / type / identifier)
    if (/[A-Za-z_]/.test(c)) {
      let w='', j=i
      while (j<len && /[\w]/.test(src[j])) w+=src[j++]
      const u = w.toUpperCase()
      if      (BOOLKW.has(u))   toks.push({t:'BOOL',v:u==='TRUE'})
      else if (KEYWORDS.has(u)) toks.push({t:'KW',v:u})
      else if (TYPES.has(u))    toks.push({t:'TYPE',v:u})
      else                      toks.push({t:'ID',v:w})
      i=j; continue
    }

    // ≤ ≥ (unicode)
    if (c==='≤') { toks.push({t:'OP',v:'<='}); i++; continue }
    if (c==='≥') { toks.push({t:'OP',v:'>='}); i++; continue }

    // multi-char ops
    if (c==='<' && src[i+1]==='>') { toks.push({t:'OP',v:'<>'}); i+=2; continue }
    if (c==='<' && src[i+1]==='=') { toks.push({t:'OP',v:'<='}); i+=2; continue }
    if (c==='>' && src[i+1]==='=') { toks.push({t:'OP',v:'>='}); i+=2; continue }

    // single char
    const single = {'+':'OP','-':'OP','*':'OP','/':'OP','^':'OP','&':'OP','<':'OP','>':'OP','=':'OP',
                    '(':'LPAREN',')':'RPAREN','[':'LBR',']':'RBR',',':'COMMA'}
    if (c in single) { toks.push({t:single[c],v:c}); i++; continue }
    i++
  }
  toks.push({t:'EOF'})
  return toks
}

// ── Expression Parser ─────────────────────────────────────────────────────────
class ExprParser {
  constructor(toks, env, interp) {
    this.t = toks; this.p = 0; this.env = env; this.interp = interp
  }
  peek()    { return this.t[this.p] || {t:'EOF'} }
  advance() { return this.t[this.p++] || {t:'EOF'} }
  check(t,v){ const tk=this.peek(); return tk.t===t&&(v===undefined||tk.v===v) }
  eat(t,v)  { if(this.check(t,v)) return this.advance(); return null }

  parse() { return this.parseBool() }

  parseBool() {
    let v = this.parseNot()
    while (this.check('KW','AND') || this.check('KW','OR')) {
      const op = this.advance().v
      const r = this.parseNot()
      v = op==='AND' ? v&&r : v||r
    }
    return v
  }
// NOT sits BETWEEN AND/OR and the comparisons, per Cambridge precedence:
  // `NOT a = b` is `NOT (a = b)`. It used to live in parseUnary (tightest
  // binding), so it parsed as `(NOT a) = b` and `IF NOT 1 = 2` was FALSE.
  parseNot(){if(this.check('KW','NOT')){this.advance();return!this.parseNot()}return this.parseCmp()}

  parseCmp() {
    let v = this.parseConcat()
    const ops = ['=','<>','<','>','<=','>=']
    if (this.check('OP') && ops.includes(this.peek().v)) {
      const op = this.advance().v
      const r = this.parseConcat()
      if (op==='=')  return v===r
      if (op==='<>') return v!==r
      if (op==='<')  return v<r
      if (op==='>') return v>r
      if (op==='<=') return v<=r
      if (op==='>=') return v>=r
    }
    return v
  }

  parseConcat() {
    let v = this.parseAdd()
    while (this.check('OP','&')) { this.advance(); v = String(v)+String(this.parseAdd()) }
    return v
  }

  parseAdd() {
    let v = this.parseMul()
    while (this.check('OP','+') || this.check('OP','-')) {
      const op = this.advance().v; const r = this.parseMul()
      v = op==='+' ? v+r : v-r
    }
    return v
  }

  parseMul() {
    let v = this.parseUnary()
    while (this.check('OP','*')||this.check('OP','/')||this.check('KW','DIV')||this.check('KW','MOD')) {
      const op = this.advance()
      const r = this.parseUnary()
      if (op.v==='*')   v = v*r
      else if (op.v==='/') { if(r===0)throw new Error('Division by zero'); v=v/r }
      else if (op.v==='DIV') { if(r===0)throw new Error('Integer division by zero'); v=Math.trunc(v/r) }
      else if (op.v==='MOD') v=((v%r)+r)%r
    }
    return v
  }

  parseUnary() {
    if (this.check('OP','-'))   { this.advance(); return -this.parsePow() }
    if (this.check('OP','+'))   { this.advance(); return this.parsePow() }
    return this.parsePow()
  }

  parsePow() {
    let v = this.parsePrimary()
    if (this.check('OP','^')) { this.advance(); v = Math.pow(v, this.parseUnary()) }
    return v
  }

  parsePrimary() {
    const tk = this.peek()

    if (tk.t==='NUM')  { this.advance(); return tk.v }
    if (tk.t==='STR')  { this.advance(); return tk.v }
    if (tk.t==='BOOL') { this.advance(); return tk.v }

    if (tk.t==='LPAREN') {
      this.advance(); const v=this.parse(); this.eat('RPAREN'); return v
    }

    if (tk.t==='ID') {
      this.advance(); const name = tk.v

      // Built-in functions
      const builtins = {
        LENGTH:  args => Array.isArray(args[0]) ? args[0].length : String(args[0]).length,
        LCASE:   args => String(args[0]).toLowerCase(),
        UCASE:   args => String(args[0]).toUpperCase(),
        INT:     args => Math.trunc(args[0]),
        ROUND:   args => Number(parseFloat(args[0]).toFixed(args[1]||0)),
        LEFT:    args => String(args[0]).slice(0, args[1]),
        RIGHT:   args => String(args[0]).slice(-args[1]),
        SUBSTR:  args => String(args[0]).substr(args[1]-1, args[2]),
        RAND:    args => Math.random()*(args[0]||1),
        NUM_TO_STR: args => String(args[0]),
        STR_TO_NUM: args => parseFloat(args[0]),
        IS_NUM:  args => !isNaN(parseFloat(args[0])),
        SQRT:    args => Math.sqrt(args[0]),
        ABS:     args => Math.abs(args[0]),
      }

      // Function call  name(…)
      if (this.check('LPAREN')) {
        this.advance(); const args=[]
        if (!this.check('RPAREN')) {
          args.push(this.parse())
          while (this.eat('COMMA')) args.push(this.parse())
        }
        this.eat('RPAREN')
        const upper = name.toUpperCase()
        if (upper in builtins) return builtins[upper](args)
        return this.interp.callFunc(name, args, this.env)
      }

      // Array access  name[expr]
      if (this.check('LBR')) {
        this.advance(); const idx=this.parse(); this.eat('RBR')
        const arr = this.env.get(name)
        if (!Array.isArray(arr._data)) throw new Error(`'${name}' is not an array`)
        const i = Math.round(idx) - arr._base
        if (i<0||i>=arr._data.length) throw new Error(`Array index ${idx} out of bounds for '${name}'`)
        return arr._data[i]
      }

      // Variable
      return this.env.get(name)
    }

    throw new Error(`Unexpected token "${tk.v||tk.t}" in expression`)
  }

  parseArgs() {
    const args = []
    if (!this.check('RPAREN')) {
      args.push(this.parse())
      while (this.eat('COMMA')) args.push(this.parse())
    }
    return args
  }
}

function evalExpr(src, env, interp) {
  const toks = tokenize(src)
  return new ExprParser(toks, env, interp).parse()
}

// ── Environment (variable scoping) ───────────────────────────────────────────
class Env {
  constructor(parent=null) { this.vars={}; this.parent=parent }

  get(name) {
    const k = name.toUpperCase()
    if (k in this.vars) return this.vars[k]
    if (this.parent) return this.parent.get(name)
    throw new Error(`Variable '${name}' has not been declared. Add: DECLARE ${name} : INTEGER`)
  }
  set(name, value) {
    const k = name.toUpperCase()
    if (k in this.vars) { this.vars[k]=value; return }
    if (this.parent && this.parent.has(name)) { this.parent.set(name,value); return }
    // auto-declare
    this.vars[k] = value
  }
  setLocal(name,value) { this.vars[name.toUpperCase()]=value }
  has(name) { const k=name.toUpperCase(); return k in this.vars||(this.parent&&this.parent.has(name)) }

  snapshot() {
    const snap = {}
    if (this.parent) Object.assign(snap, this.parent.snapshot())
    Object.assign(snap, this.vars)
    return snap
  }
}

// ── Block structure parser ────────────────────────────────────────────────────
// Returns a tree of statement nodes

// Splits a physical line on `;` outside of string literals, so several
// statements chained on one line each become their own line-text.
function splitOnSemicolons(text){
  const parts=[];let cur='',inStr=false
  for(let i=0;i<text.length;i++){
    const ch=text[i]
    if(ch==='"')inStr=!inStr
    if(ch===';'&&!inStr){parts.push(cur);cur='';continue}
    cur+=ch
  }
  parts.push(cur)
  return parts
}

// Turns one physical line packing an inline IF/THEN/ELSE/ENDIF (e.g.
// "IF x > 5 THEN y ← 1 ELSE y ← 2 ENDIF", or a lone "ELSE y ← 2") into
// several separate line-texts, so the line-oriented parseIf()/parseBlock()
// see each part on its own line exactly like the multi-line form they
// already handle. Quote-aware: a keyword inside a string is not a split point.
function expandInlineIf(text){
  let masked='',inStr=false
  for(let i=0;i<text.length;i++){
    const ch=text[i]
    if(ch==='"')inStr=!inStr
    masked+=(inStr&&ch!=='"')?'x':ch
  }
  const re=/\b(IF\s+.+?\s+THEN|ELSEIF\s+.+?\s+THEN|ELSE|ENDIF)\b/gi
  if(!re.test(masked))return[text]
  re.lastIndex=0
  const parts=[];let last=0,m
  while((m=re.exec(masked))){
    if(m.index>last)parts.push(text.slice(last,m.index))
    parts.push(text.slice(m.index,re.lastIndex))
    last=re.lastIndex
  }
  if(last<text.length)parts.push(text.slice(last))
  return parts.map(p=>p.trim()).filter(Boolean)
}

function parseBlock(rawLines, pos, stopAt) {
  const block = []; const stops = stopAt || []
  while (pos < rawLines.length) {
    const {text,n} = rawLines[pos]
    const u = text.toUpperCase().trim()
    if (stops.some(s=>u===s||u.startsWith(s+' ')||u.startsWith(s+'('))) break

    if      (u.startsWith('IF '))          { const [s,p]=parseIf(rawLines,pos);    block.push(s); pos=p }
    else if (u.startsWith('FOR '))         { const [s,p]=parseFor(rawLines,pos);   block.push(s); pos=p }
    else if (u.startsWith('WHILE '))       { const [s,p]=parseWhile(rawLines,pos); block.push(s); pos=p }
    else if (u==='REPEAT')                 { const [s,p]=parseRepeat(rawLines,pos);block.push(s); pos=p }
    else if (u.startsWith('PROCEDURE '))   { const [s,p]=parseProc(rawLines,pos);  block.push(s); pos=p }
    else if (u.startsWith('FUNCTION '))    { const [s,p]=parseFunc(rawLines,pos);  block.push(s); pos=p }
    else { block.push({type:'STMT',text,n}); pos++ }
  }
  return [block, pos]
}

function parseIf(lines, pos) {
  const start = lines[pos]; pos++
  const [tbody, p1] = parseBlock(lines, pos, ['ELSE','ELSEIF','ENDIF'])
  pos = p1
  const branches = [{cond: start.text, body: tbody}]
  while (pos<lines.length && lines[pos].text.toUpperCase().trimStart().startsWith('ELSEIF ')) {
    const eib = lines[pos]; pos++
    const [eb, p] = parseBlock(lines, pos, ['ELSE','ELSEIF','ENDIF'])
    branches.push({cond: eib.text, body: eb}); pos=p
  }
  let elsebody = null
  if (pos<lines.length && lines[pos].text.toUpperCase().trim()==='ELSE') {
    pos++
    const [eb, p] = parseBlock(lines, pos, ['ENDIF']); elsebody=eb; pos=p
  }
  if (pos<lines.length && lines[pos].text.toUpperCase().trim()==='ENDIF') pos++
  return [{type:'IF', branches, elsebody, n: start.n}, pos]
}

function parseFor(lines, pos) {
  const start = lines[pos]; pos++
  const [body, p] = parseBlock(lines, pos, ['NEXT'])
  if (p<lines.length) pos=p+1
  else pos=p
  return [{type:'FOR', text: start.text, n: start.n, body}, pos]
}

function parseWhile(lines, pos) {
  const start = lines[pos]; pos++
  const [body, p] = parseBlock(lines, pos, ['ENDWHILE'])
  pos = p<lines.length ? p+1 : p
  return [{type:'WHILE', text: start.text, n: start.n, body}, pos]
}

function parseRepeat(lines, pos) {
  pos++  // skip REPEAT
  const [body, p] = parseBlock(lines, pos, ['UNTIL'])
  const cond = p<lines.length ? lines[p].text : ''
  pos = p<lines.length ? p+1 : p
  return [{type:'REPEAT', n: pos, body, untilText: cond}, pos]
}

function parseProc(lines, pos) {
  const hdr = lines[pos]; pos++
  const [body, p] = parseBlock(lines, pos, ['ENDPROCEDURE'])
  pos = p<lines.length ? p+1 : p
  return [{type:'PROC_DEF', hdr: hdr.text, n: hdr.n, body}, pos]
}

function parseFunc(lines, pos) {
  const hdr = lines[pos]; pos++
  const [body, p] = parseBlock(lines, pos, ['ENDFUNCTION'])
  pos = p<lines.length ? p+1 : p
  return [{type:'FUNC_DEF', hdr: hdr.text, n: hdr.n, body}, pos]
}

// ── Interpreter ───────────────────────────────────────────────────────────────
class Interpreter {
  constructor() { this.reset() }

  reset() {
    this.globals = new Env()
    this.procs   = {}   // name → {params, body}
    this.funcs   = {}   // name → {params, retType, body}
    this.output  = []
    this.trace   = []
    this.inputQ  = []
    this.steps   = 0
    this.MAX     = 5000
  }

  run(code, inputValues=[]) {
    this.reset()
    this.inputQ = [...inputValues]

    // Two preprocessing passes, both ported from igcse-y2.html after
    // scripts/test-g9-challenges.mjs proved Grade 9 had the same two defects:
    //   splitOnSemicolons — `a ← 1; b ← 2` previously ran ONLY the first
    //     statement, silently. Challenge 10's starter fills its array as
    //     `arr[1]←2; arr[2]←5; …`, so 9 of its 10 elements stayed 0.
    //   expandInlineIf   — `IF x > 5 THEN OUTPUT "big"` on one physical line
    //     had its trailing statement silently dropped by the line-oriented
    //     parseBlock()/parseIf().
    const rawLines = code.split('\n')
      .flatMap((text,i)=>splitOnSemicolons(text.replace(/\/\/.*$/,''))
        .flatMap(t=>expandInlineIf(t.trim()).map(seg=>({text:seg, n:i+1}))))
      .filter(l=>l.text)

    const [block] = parseBlock(rawLines, 0)
    this.execBlock(block, this.globals)
    return {output: this.output, trace: this.trace}
  }

  evalE(src, env) { return evalExpr(src, env, this) }

  callFunc(name, args, callerEnv) {
    const u = name.toUpperCase()
    const def = this.funcs[u]
    if (!def) throw new Error(`Function '${name}' is not defined. Did you mean a built-in or forget to declare it?`)
    const local = new Env(this.globals)
    def.params.forEach((p,i)=>local.setLocal(p.name, args[i]??null))
    try { this.execBlock(def.body, local) }
    catch(e) { if(e && e.type==='RETURN') return e.value; throw e }
    return null
  }

  record(stmt, env, out=null) {
    this.trace.push({ step:++this.steps, n: stmt.n||'?',
                      code: stmt.text||stmt.type, vars: env.snapshot(), out })
    if (this.steps > this.MAX) throw new Error(`Too many steps (${this.MAX} limit). Check for an infinite loop.`)
  }

  execBlock(block, env) {
    for (const stmt of block) this.execStmt(stmt, env)
  }

  execStmt(stmt, env) {
    if (stmt.type==='IF')       return this.execIf(stmt, env)
    if (stmt.type==='FOR')      return this.execFor(stmt, env)
    if (stmt.type==='WHILE')    return this.execWhile(stmt, env)
    if (stmt.type==='REPEAT')   return this.execRepeatUntil(stmt, env)
    if (stmt.type==='PROC_DEF') return this.registerProc(stmt)
    if (stmt.type==='FUNC_DEF') return this.registerFunc(stmt)
    if (stmt.type==='STMT')     return this.execSimple(stmt, env)
  }

  execIf(node, env) {
    this.record({n:node.n, text: node.branches[0].cond}, env)
    for (const branch of node.branches) {
      const condSrc = branch.cond.replace(/^IF\s+/i,'').replace(/^ELSEIF\s+/i,'').replace(/\s+THEN\s*$/i,'').trim()
      if (this.evalE(condSrc, env)) { this.execBlock(branch.body, env); return }
    }
    if (node.elsebody) this.execBlock(node.elsebody, env)
  }

  execFor(node, env) {
    // FOR varName ← start TO end [STEP n]
    const text = node.text.replace(/^FOR\s+/i,'').trim()
    const stepMatch = text.match(/\bSTEP\s+(.+)$/i)
    const stepExpr = stepMatch ? stepMatch[1].trim() : '1'
    const noStep   = stepMatch ? text.slice(0, stepMatch.index).trim() : text
    const toIdx    = noStep.search(/\bTO\b/i)
    const lhs      = noStep.slice(0, toIdx).trim()
    const endExpr  = noStep.slice(toIdx+2).trim()
    // lhs may be  "varName ← start"
    const arrowIdx = lhs.indexOf('←') >= 0 ? lhs.indexOf('←') : lhs.indexOf(':=')
    const varName  = lhs.slice(0, arrowIdx).trim()
    const startVal = this.evalE(lhs.slice(arrowIdx+1).trim(), env)
    let endVal     = this.evalE(endExpr, env)
    const stepVal  = this.evalE(stepExpr, env)

    env.set(varName, startVal)
    const going = stepVal > 0
    while (going ? env.get(varName)<=endVal : env.get(varName)>=endVal) {
      this.record({n:node.n, text:node.text}, env)
      this.execBlock(node.body, env)
      env.set(varName, env.get(varName)+stepVal)
    }
  }

  execWhile(node, env) {
    const condSrc = node.text.replace(/^WHILE\s+/i,'').replace(/\s+DO\s*$/i,'').trim()
    while (this.evalE(condSrc, env)) {
      this.record({n:node.n, text:node.text}, env)
      this.execBlock(node.body, env)
    }
  }

  execRepeatUntil(node, env) {
    const condSrc = node.untilText.replace(/^UNTIL\s+/i,'').trim()
    do {
      this.record({n:node.n, text:'REPEAT'}, env)
      this.execBlock(node.body, env)
    } while (!this.evalE(condSrc, env))
  }

  registerProc(node) {
    // PROCEDURE Name(param1 : TYPE, ...)
    const m = node.hdr.match(/^PROCEDURE\s+(\w+)\s*(?:\(([^)]*)\))?/i)
    if (!m) throw new Error('Invalid PROCEDURE header: ' + node.hdr)
    const name = m[1].toUpperCase()
    const params = m[2] ? parseParams(m[2]) : []
    this.procs[name] = {params, body: node.body}
  }

  registerFunc(node) {
    const m = node.hdr.match(/^FUNCTION\s+(\w+)\s*(?:\(([^)]*)\))?\s*RETURNS\s+(\w+)/i)
    if (!m) throw new Error('Invalid FUNCTION header: ' + node.hdr)
    const name = m[1].toUpperCase()
    const params = m[2] ? parseParams(m[2]) : []
    this.funcs[name] = {params, retType: m[3], body: node.body}
  }

  execSimple(stmt, env) {
    const text = stmt.text
    const u    = text.toUpperCase()

    // DECLARE
    if (u.startsWith('DECLARE ')) {
      this.execDeclare(text, env); this.record(stmt, env); return
    }

    // RETURN
    if (u.startsWith('RETURN ') || u==='RETURN') {
      const val = u==='RETURN' ? null : this.evalE(text.slice(7).trim(), env)
      throw {type:'RETURN', value: val}
    }

    // CALL
    if (u.startsWith('CALL ')) {
      const rest = text.slice(5).trim()
      const mCall = rest.match(/^(\w+)\s*(?:\(([^)]*)\))?$/)
      if (!mCall) throw new Error('Invalid CALL: ' + text)
      const name = mCall[1].toUpperCase()
      const def  = this.procs[name]
      if (!def) throw new Error(`Procedure '${mCall[1]}' is not defined.`)
      const argSrcs = mCall[2] ? splitArgs(mCall[2]) : []
      const args = argSrcs.map(a=>this.evalE(a.trim(),env))
      const local = new Env(this.globals)
      def.params.forEach((p,i)=>local.setLocal(p.name,args[i]??null))
      this.execBlock(def.body, local)
      this.record(stmt, env); return
    }

    // OUTPUT
    if (u.startsWith('OUTPUT ')) {
      const val = this.evalE(text.slice(7).trim(), env)
      const out = String(val)
      this.output.push(out)
      this.record(stmt, env, out); return
    }

    // INPUT
    if (u.startsWith('INPUT ')) {
      const varName = text.slice(6).trim()
      const raw = this.inputQ.length ? this.inputQ.shift() : '0'
      env.set(varName, coerceInput(raw))
      this.record(stmt, env); return
    }

    // Assignment: varName ← expr  or  varName[idx] ← expr
    const arrow = text.indexOf('←')
    const assign = arrow>=0 ? arrow : text.indexOf(':=')
    if (assign >= 0) {
      const lhs  = text.slice(0, assign).trim()
      const rhs  = text.slice(assign + (arrow>=0?1:2)).trim()
      const val  = this.evalE(rhs, env)

      // Array element assignment: arr[i] ← val
      const arrM = lhs.match(/^(\w+)\[(.+)\]$/)
      if (arrM) {
        const arr = env.get(arrM[1])
        if (!Array.isArray(arr._data)) throw new Error(`'${arrM[1]}' is not an array`)
        const idx = Math.round(this.evalE(arrM[2].trim(), env)) - arr._base
        arr._data[idx] = val
      } else {
        env.set(lhs, val)
      }
      this.record(stmt, env); return
    }

    // Standalone function call  (no CALL keyword)
    const scm = text.match(/^(\w+)\s*\(/)
    if (scm) {
      const name = scm[1].toUpperCase()
      if (this.procs[name]) {
        const argStr = text.slice(scm[0].length-1).replace(/^\s*\(|\)\s*$/g,'')
        const args = argStr.trim() ? splitArgs(argStr).map(a=>this.evalE(a.trim(),env)) : []
        const def  = this.procs[name]
        const local = new Env(this.globals)
        def.params.forEach((p,i)=>local.setLocal(p.name,args[i]??null))
        this.execBlock(def.body, local)
        this.record(stmt, env); return
      }
    }

    // Skip ELSE/ENDIF/ENDWHILE/NEXT/ENDPROCEDURE/ENDFUNCTION/ENDCASE markers
    const MARKERS = ['ELSE','ENDIF','ENDWHILE','ENDPROCEDURE','ENDFUNCTION','ENDCASE']
    if (MARKERS.some(m=>u===m||u.startsWith(m+' '))) return

    // Unknown — warn (don't crash)
    console.warn('Unrecognised statement:', text)
    this.record(stmt, env)
  }

  execDeclare(text, env) {
    // DECLARE varName : TYPE  or  DECLARE arr : ARRAY[lo:hi] OF TYPE
    const m1 = text.match(/^DECLARE\s+(\w+)\s*:\s*ARRAY\s*\[(\d+)\s*:\s*(\d+)\]\s*OF\s+(\w+)/i)
    if (m1) {
      // m1 = [fullMatch, name, lowerBound, upperBound, type] — this destructure
      // previously had one extra skipped slot ([,name,,lo,hi]), silently shifting
      // every field over by one: lo got the upperBound, hi got the TYPE string
      // ("INTEGER"), and parseInt("INTEGER") is NaN, so Array(NaN) threw
      // "Invalid array length" on EVERY 1D array DECLARE — Array & FOR, Bubble
      // Sort and Binary Search were all impossible to complete. Same defect as
      // the one fixed in igcse-y2.html; found by scripts/test-g9-challenges.mjs.
      const [,name,lo,hi] = m1
      const base = parseInt(lo); const size = parseInt(hi)-base+1
      const fill = typeDefault(m1[4])
      env.setLocal(name, {_data: Array(size).fill(fill), _base: base, _hi: parseInt(hi)})
      return
    }
    const m2 = text.match(/^DECLARE\s+(\w+)\s*:\s*(\w+)/i)
    if (m2) env.setLocal(m2[1], typeDefault(m2[2]))
  }
}

function parseParams(src) {
  if (!src.trim()) return []
  return splitArgs(src).map(p=>{
    const m = p.trim().match(/^(\w+)\s*(?::\s*(\w+))?/)
    return { name: m?.[1]||p.trim(), type: m?.[2]||'ANY' }
  })
}

function splitArgs(src) {
  const result=[]; let depth=0,cur=''
  for(const c of src){
    if(c==='('||c==='[') depth++
    else if(c===')'||c===']') depth--
    if(c===','&&depth===0){result.push(cur.trim());cur=''}
    else cur+=c
  }
  if(cur.trim()) result.push(cur.trim())
  return result
}

function typeDefault(t) {
  const u=t.toUpperCase()
  if(u==='INTEGER'||u==='REAL') return 0
  if(u==='STRING')  return ''
  if(u==='BOOLEAN') return false
  if(u==='CHAR')    return ''
  return null
}

function coerceInput(v) {
  if(v.trim().toUpperCase()==='TRUE')  return true
  if(v.trim().toUpperCase()==='FALSE') return false
  const n = parseFloat(v)
  return isNaN(n) ? v.trim() : n
}

CodeMirror.defineSimpleMode('pseudocode', {
  start: [
    { regex: /\/\/.*$/,    token: 'comment' },
    { regex: /"[^"]*"/,    token: 'string'  },
    { regex: /'[^']*'/,    token: 'string'  },
    { regex: /\b(?:DECLARE|IF|THEN|ELSE|ELSEIF|ENDIF|FOR|TO|STEP|NEXT|WHILE|DO|ENDWHILE|REPEAT|UNTIL|PROCEDURE|ENDPROCEDURE|FUNCTION|ENDFUNCTION|RETURNS|RETURN|CALL|OUTPUT|INPUT|AND|OR|NOT|DIV|MOD|ARRAY|OF|CASE|OTHERWISE|ENDCASE)\b/, token: 'keyword' },
    { regex: /\b(?:INTEGER|REAL|STRING|BOOLEAN|CHAR)\b/, token: 'def' },
    { regex: /\b(?:TRUE|FALSE)\b/,   token: 'atom'    },
    { regex: /[0-9]+(?:\.[0-9]+)?/,  token: 'number'  },
    { regex: /←|:=/,                 token: 'operator'},
    { regex: /[+\-*\/&^<>=≤≥]/,      token: 'operator'},
    { regex: /[A-Za-z_]\w*/,         token: 'variable'},

  meta: { lineComment: '//' },
})

// ══════════════════════════════════════════════════════════════════════════════
// UI — run, trace table, challenges
// ══════════════════════════════════════════════════════════════════════════════
let traceVisible = true
const interp = new Interpreter()

function normaliseArrows(src) {
  // Allow students to type <- (two chars) instead of ← (Unicode arrow).
  // Also accept = as assignment when not part of <=, >=, <>, :=, ==.
  return src
    .replace(/<-/g, '←')   // <- → ←  (most common alternative)
    .replace(/=>/g, '←')   // => just in case (arrow confusion)
}

function runCode() {
  const code = normaliseArrows(editor.getValue())
  if (!code.trim()) { appendOut('// Nothing to run.', 'out'); return }
  // Autosave code to Supabase (workspace-level save, idx = -1)
  LessonSaves.save('grade9', -1, { code: editor.getValue() })

  const rawInputs = document.getElementById('input-vals').value
  const inputVals = rawInputs.trim()
    ? rawInputs.split(',').map(s=>s.trim()).filter(Boolean)
    : []

  document.getElementById('output').innerHTML = ''
  clearTraceTable()

  let result
  try {
    result = interp.run(code, inputVals)
  } catch(e) {
    const msg = friendlyErr(e)
    appendOut(msg, 'out-err')
    return
  }

  if (result.output.length) {
    result.output.forEach(line => appendOut(line, 'out'))
  } else {
    appendOut('(no OUTPUT statements)', 'out')
  }

  renderTraceTable(result.trace)
  validateChallenge(code, result)
}

function friendlyErr(e) {
  if (typeof e === 'object' && e.type === 'RETURN') return 'RETURN used outside a function/procedure.'
  const msg = e?.message || String(e)

  if (msg.includes('not been declared')) return `⚠ ${msg}`
  if (msg.includes('not defined'))       return `⚠ ${msg}`
  if (msg.includes('infinite loop')||msg.includes('Too many steps')) return `⚠ ${msg}`
  if (msg.includes('out of bounds'))     return `⚠ ${msg}`
  if (msg.includes('not an array'))      return `⚠ ${msg}`
  if (msg.includes('is not a function')) return `⚠ Function not found. Did you define it above where it's called?`
  if (msg.includes('Division by zero'))  return `⚠ Division by zero — check your divisor!`
  if (msg.includes('Unexpected token'))  return `⚠ Syntax error: ${msg}`
  return `⚠ Error: ${msg}`
}

function appendOut(text, cls='out') {
  const pre = document.getElementById('output')
  const span = document.createElement('span')
  span.className = cls; span.textContent = text + '\n'
  pre.appendChild(span)
}

// ── Trace Table ───────────────────────────────────────────────────────────────
function clearTraceTable() {
  document.getElementById('trace-head').innerHTML = ''
  document.getElementById('trace-body').innerHTML = ''
}

function renderTraceTable(trace) {
  if (!trace.length) return

  // Collect all variable names across all steps
  const allVars = new Set()
  trace.forEach(s => Object.keys(s.vars).forEach(k => allVars.add(k)))
  const varNames = [...allVars].filter(v=>!v.startsWith('_'))

  // Header
  const hdr = document.getElementById('trace-head')
  hdr.innerHTML = '<th>#</th><th>Line</th><th>Statement</th>' +
    varNames.map(v=>`<th>${v}</th>`).join('') + '<th>Output</th>'

  // Body
  const tbody = document.getElementById('trace-body')
  tbody.innerHTML = ''
  let prevVars = {}

  trace.forEach((step, i) => {
    const tr   = document.createElement('tr')
    const changed = varNames.some(v => step.vars[v] !== prevVars[v])
    if (changed) tr.className = 'changed'

    const truncCode = step.code.length > 28 ? step.code.slice(0,27)+'…' : step.code
    tr.innerHTML = `<td>${step.step}</td><td>${step.n}</td><td title="${step.code}">${truncCode}</td>` +
      varNames.map(v => {
        const val = step.vars[v]
        const disp = val===null ? '–' : Array.isArray(val?._data) ? `[${val._data.join(',')}]` : String(val)
        const cls  = step.vars[v] !== prevVars[v] ? ' changed-val' : ''
        return `<td class="${cls}">${disp}</td>`
      }).join('') +
      `<td class="out-col">${step.out ?? ''}</td>`

    tbody.appendChild(tr)
    prevVars = {...step.vars}
  })
}

function toggleTrace() {
  traceVisible = !traceVisible
  document.getElementById('trace-wrap').style.display = traceVisible ? '' : 'none'
}

// -- BF Integration --
BF.seed();
// Soft auth: allow access from Next.js/Supabase context (me = null → XP skipped)
const me = (() => { try { return BF.session() || null; } catch(_) { return null; } })();

const completed = new Set()
let activeIdx = 0; let hintIdx = 0

function renderPills() {
  const row = document.getElementById('ch-pills'); row.innerHTML=''
  CHALLENGES.forEach((ch,i) => {
    const el = document.createElement('div')
    el.className = 'ch-pill'+(i===activeIdx?' active':'')+(completed.has(i)?' done':'')
    el.textContent = (completed.has(i)?'✓ ':'')+ch.mod+' '+ch.name
    el.onclick = ()=>selectChallenge(i)
    row.appendChild(el)
  })
}

function selectChallenge(i) {
  activeIdx=i; hintIdx=0
  const ch=CHALLENGES[i]
  document.getElementById('ch-text').innerHTML=ch.text
  document.getElementById('xp-pill').textContent='+'+ch.xp+' XP'
  editor.setValue(ch.starter||'')
  document.getElementById('output').innerHTML=''
  clearTraceTable()
  renderPills()
}

function resetStarter() {
  const ch=CHALLENGES[activeIdx]; if(ch) editor.setValue(ch.starter||'')
  document.getElementById('output').innerHTML=''; clearTraceTable()
}

function validateChallenge(code, result) {
  const ch=CHALLENGES[activeIdx]; if(!ch||completed.has(activeIdx)) return
  if(ch.check(code,result)) {
    completed.add(activeIdx); renderPills()
    document.getElementById('pass-badge')?.remove?.()
    showToast('Challenge complete! +'+ch.xp+' XP')
    if (me) { BF.addXP(me.id, ch.xp); BF.recordAttempt(me.id, 'g9-' + (ch.mod||'c') + activeIdx, { passed: true, score: 100 }); }
    LessonSaves.save('grade9', activeIdx, { passed: true, xpEarned: ch.xp, code })
  }
}

function showHint() {
  const ch=CHALLENGES[activeIdx]; if(!ch) return
  if(hintIdx<ch.hints.length) appendOut('Hint '+(hintIdx+1)+': '+ch.hints[hintIdx++],'out-ok')
  else appendOut('No more hints!','out-ok')
}

function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3200)
}

// ── Init — restore Supabase saves, then render ───────────────────────────────
;(async () => {
  await LessonSaves.load('grade9')
  // Restore completed challenges
  LessonSaves.completedSet().forEach(idx => completed.add(idx))
  renderPills()
  selectChallenge(0)
  // Restore last saved code (workspace-level save, idx = -1)
  const savedCode = LessonSaves.savedCode()
  if (savedCode) editor.setValue(savedCode)
})()
