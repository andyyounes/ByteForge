<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Chapter — ByteForge</title>
  <link rel="stylesheet" href="../styles.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
    body { padding-top: 64px; background: var(--bg); }
    .page-wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }

    /* ── Chapter header ── */
    .chapter-header { margin-bottom: 32px; }
    .breadcrumb { font-size: 13px; color: var(--fg-dim); margin-bottom: 10px; }
    .breadcrumb a { color: var(--orange); text-decoration: none; }
    .chapter-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
    .chapter-title { font-size: 28px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 8px; }
    .chapter-desc  { font-size: 15px; color: var(--fg-dim); line-height: 1.65; margin-bottom: 16px; }
    .key-topics    { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .topic-chip    { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--bg-card); border: 1px solid var(--border); color: var(--fg-dim); }
    .chapter-progress-bar { background: rgba(255,255,255,.06); border-radius: 999px; height: 6px; margin-top: 16px; overflow: hidden; }
    .chapter-progress-fill { height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--orange), #a855f7); transition: width .6s ease; }

    /* ── Section tabs ── */
    .section-tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 28px; flex-wrap: wrap; }
    .sec-tab { padding: 8px 16px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--fg-dim); transition: .15s; }
    .sec-tab.active { background: var(--bg-raised); color: var(--fg); border: 1px solid var(--border-hi); }

    /* ── Lesson content ── */
    .lesson-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; margin-bottom: 20px; }
    .lesson-block-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .lesson-body { font-size: 15px; line-height: 1.75; color: var(--fg); }
    .lesson-body h3 { font-size: 17px; font-weight: 700; margin: 20px 0 10px; color: var(--fg); }
    .lesson-body p  { margin-bottom: 14px; color: var(--fg-dim); }
    .lesson-body strong { color: var(--fg); }
    .lesson-body ul, .lesson-body ol { padding-left: 22px; margin-bottom: 14px; }
    .lesson-body li { margin-bottom: 6px; color: var(--fg-dim); }
    .lesson-body table { border-collapse: collapse; width: 100%; margin-bottom: 16px; font-size: 14px; }
    .lesson-body th, .lesson-body td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
    .lesson-body th { background: var(--bg-raised); font-weight: 700; color: var(--fg); }
    .lesson-body td { color: var(--fg-dim); }
    .lesson-body code { font-family: var(--mono); background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: var(--orange); }
    .lesson-body pre  { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; overflow-x: auto; font-size: 13px; margin-bottom: 16px; }

    /* Video suggestion card */
    .video-card { background: linear-gradient(135deg, rgba(168,85,247,.07), rgba(59,130,246,.07)); border: 1px solid rgba(168,85,247,.2); border-radius: 16px; padding: 24px; margin-bottom: 20px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
    .video-thumbnail { width: 140px; height: 80px; border-radius: 10px; background: rgba(168,85,247,.12); display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0; }
    .video-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .video-desc  { font-size: 13px; color: var(--fg-dim); line-height: 1.5; margin-bottom: 12px; }
    .video-search-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: rgba(168,85,247,.15); border: 1px solid rgba(168,85,247,.25); color: #c084fc; font-size: 13px; font-weight: 700; text-decoration: none; transition: .15s; }
    .video-search-btn:hover { background: rgba(168,85,247,.25); }

    /* ── Exercises ── */
    .exercise-block { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; margin-bottom: 16px; }
    .exercise-block.done { border-color: rgba(34,197,94,.25); }
    .ex-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .ex-number { width: 28px; height: 28px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ex-title-main { font-size: 16px; font-weight: 700; flex: 1; }
    .ex-meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .ex-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px; }
    .ex-xp-badge { background: rgba(234,179,8,.1); color: #eab308; }
    .ex-diff-badge { background: rgba(249,115,22,.1); color: var(--orange); }
    .ex-marks-badge { background: rgba(59,130,246,.1); color: var(--blue); }
    .ex-done-badge  { background: rgba(34,197,94,.1); color: #22c55e; }
    .question-text { font-size: 15px; color: var(--fg); line-height: 1.7; white-space: pre-wrap; margin-bottom: 18px; }

    /* MCQ options */
    .mcq-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .mcq-option { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; border: 2px solid var(--border); cursor: pointer; transition: .15s; font-size: 14px; }
    .mcq-option:hover:not(.disabled) { border-color: var(--border-hi); background: rgba(255,255,255,.04); }
    .mcq-option.selected { border-color: var(--orange); background: rgba(249,115,22,.07); }
    .mcq-option.correct  { border-color: #22c55e; background: rgba(34,197,94,.08); }
    .mcq-option.wrong    { border-color: #ef4444; background: rgba(239,68,68,.07); }
    .mcq-option.disabled { cursor: default; }
    .option-letter { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-raised); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }
    .mcq-option.selected .option-letter { background: var(--orange); color: #fff; }
    .mcq-option.correct .option-letter  { background: #22c55e; color: #fff; }
    .mcq-option.wrong .option-letter    { background: #ef4444; color: #fff; }

    .feedback-box { border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; font-size: 14px; line-height: 1.55; }
    .feedback-correct { background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.2); color: var(--fg); }
    .feedback-wrong   { background: rgba(239,68,68,.07);  border: 1px solid rgba(239,68,68,.2); color: var(--fg); }

    /* Written answer */
    .written-area { width: 100%; min-height: 120px; padding: 12px 16px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--fg); font-size: 14px; font-family: inherit; line-height: 1.6; resize: vertical; outline: none; transition: .2s; box-sizing: border-box; }
    .written-area:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(249,115,22,.1); }
    .mark-scheme-reveal { background: rgba(34,197,94,.05); border: 1px solid rgba(34,197,94,.15); border-radius: 10px; padding: 16px; margin-top: 12px; display: none; }
    .mark-scheme-reveal.visible { display: block; }
    .mark-scheme-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #22c55e; margin-bottom: 8px; }
    .mark-scheme-body  { font-size: 13px; color: var(--fg-dim); white-space: pre-wrap; line-height: 1.65; }

    .btn-check    { padding: 10px 22px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: .15s; background: var(--orange); color: #fff; }
    .btn-check:hover { background: #ea580c; }
    .btn-check:disabled { opacity: .45; cursor: default; }
    .btn-reveal   { padding: 10px 22px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid var(--border-hi); background: var(--bg-raised); color: var(--fg); transition: .15s; }
    .btn-reveal:hover { background: rgba(255,255,255,.08); }

    /* ── Resources ── */
    .resource-list { display: flex; flex-direction: column; gap: 10px; }
    .resource-row  { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); transition: .2s; }
    .resource-row:hover { border-color: var(--border-hi); }
    .resource-type-icon { font-size: 24px; flex-shrink: 0; }
    .resource-row-info  { flex: 1; }
    .resource-row-title { font-size: 14px; font-weight: 700; }
    .resource-row-desc  { font-size: 12px; color: var(--fg-dim); margin-top: 3px; }
    .resource-row-btn   { padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; background: var(--bg-raised); border: 1px solid var(--border-hi); color: var(--fg); cursor: pointer; text-decoration: none; transition: .15s; white-space: nowrap; }
    .resource-row-btn:hover { background: rgba(255,255,255,.08); }

    /* ── PDF viewer ── */
    .pdf-viewer { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .pdf-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .pdf-nav-btn  { padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-hi); background: var(--bg-raised); color: var(--fg); transition: .15s; }
    .pdf-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,.08); }
    .pdf-nav-btn:disabled { opacity: .4; cursor: default; }
    .pdf-page-info { font-size: 13px; color: var(--fg-dim); }
    #pdf-canvas  { max-width: 100%; border-radius: 8px; display: block; margin: 0 auto; }

    /* ── Quiz prep ── */
    .flashcard { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 12px; cursor: pointer; transition: .2s; user-select: none; }
    .flashcard:hover { border-color: var(--border-hi); }
    .flashcard.flipped { border-color: rgba(34,197,94,.3); }
    .flashcard-q { font-size: 15px; font-weight: 700; line-height: 1.55; }
    .flashcard-hint { font-size: 12px; color: var(--fg-faint); margin-top: 8px; }
    .flashcard-a { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 14px; color: var(--fg-dim); line-height: 1.65; }
    .flashcard.flipped .flashcard-a { display: block; }
    .flashcard.flipped .flashcard-hint { display: none; }

    /* ── Completion banner ── */
    .completion-banner { background: linear-gradient(135deg, rgba(34,197,94,.1), rgba(249,115,22,.08)); border: 1px solid rgba(34,197,94,.2); border-radius: 16px; padding: 28px 32px; text-align: center; margin-top: 32px; }
    .completion-icon  { font-size: 48px; margin-bottom: 12px; }
    .completion-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .completion-sub   { font-size: 14px; color: var(--fg-dim); margin-bottom: 20px; }
    .btn-request-unlock { padding: 12px 28px; border-radius: 10px; font-size: 15px; font-weight: 800; background: linear-gradient(135deg, #eab308, var(--orange)); color: #000; border: none; cursor: pointer; transition: .15s; }
    .btn-request-unlock:hover { filter: brightness(1.1); }
    .btn-request-unlock:disabled { opacity: .5; cursor: default; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; transform: translateY(60px); opacity: 0; transition: .3s; z-index: 9999; }
    .toast-success { background: #166534; color: #bbf7d0; border: 1px solid #16a34a; }
    .toast-error   { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }
    .toast-info    { background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6; }
    .toast-show    { transform: translateY(0); opacity: 1; }

    @media (max-width: 640px) { .page-wrap { padding: 20px 16px 60px; } .lesson-block { padding: 20px; } .exercise-block { padding: 18px; } }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-logo">
      <div class="logo-icon">⚒</div>
      <span class="logo-text">Byte<span>Forge</span></span>
    </div>
    <div class="nav-links">
      <a href="../dashboard-student.html">← My Dashboard</a>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <a id="nav-notif-bell" href="../dashboard-student.html#notifications-panel" style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--bg-raised);border:1px solid var(--border-hi);text-decoration:none;font-size:16px;transition:.15s" title="Notifications">
        🔔
        <span id="nav-notif-dot" style="display:none;position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid var(--bg)"></span>
      </a>
      <button class="nav-cta" onclick="logout()" style="background:var(--bg-raised);border:1px solid var(--border-hi);color:var(--fg);">Sign Out</button>
    </div>
  </nav>

  <div class="page-wrap">

    <!-- Breadcrumb + Header -->
    <div class="chapter-header">
      <div class="breadcrumb">
        <a href="../dashboard-student.html">Dashboard</a> /
        <a id="bc-class" href="../dashboard-student.html">Class</a> /
        <span id="bc-chapter">Chapter</span>
      </div>
      <div class="chapter-badge" id="chapter-badge"></div>
      <div class="chapter-title" id="chapter-title">Loading…</div>
      <div class="chapter-desc"  id="chapter-desc"></div>
      <div class="key-topics"    id="key-topics"></div>
      <div style="display:flex;align-items:center;gap:12px;font-size:13px;color:var(--fg-dim)">
        <span id="progress-label">0 / 0 exercises done</span>
      </div>
      <div class="chapter-progress-bar">
        <div class="chapter-progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Section tabs -->
    <div class="section-tabs" id="section-tabs"></div>

    <!-- Section content -->
    <div id="section-content"></div>

    <!-- Completion banner (shown when all exercises done) -->
    <div class="completion-banner" id="completion-banner" style="display:none">
      <div class="completion-icon">🎉</div>
      <div class="completion-title">Chapter Complete!</div>
      <div class="completion-sub" id="completion-sub">You've finished all exercises in this chapter.</div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a href="../dashboard-student.html" class="btn-sm" style="padding:12px 24px;border-radius:10px;background:var(--bg-raised);border:1px solid var(--border-hi);color:var(--fg);text-decoration:none;font-weight:700;font-size:14px">← Back to Dashboard</a>
        <button class="btn-request-unlock" id="btn-request-unlock" onclick="requestNextChapter()" style="display:none">🔔 Request Next Chapter</button>
        <a id="btn-go-next" href="#" style="display:none;padding:12px 28px;border-radius:10px;background:linear-gradient(135deg,var(--orange),#a855f7);color:#fff;font-weight:800;font-size:15px;text-decoration:none">→ Go to Next Chapter</a>
        <div id="unlock-requested-msg" style="display:none;padding:12px 24px;border-radius:10px;background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.2);color:#eab308;font-weight:700;font-size:14px">⏳ Unlock Request Sent</div>
      </div>
    </div>

  </div>

  <script src="../js/db.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const me = requireAuth('student');
    if (!me) throw new Error('Redirecting');

    const params    = new URLSearchParams(location.search);
    const classId   = params.get('classId');
    const chapterId = params.get('chapterId');

    if (!classId || !chapterId) location.href = '../dashboard-student.html';

    let cls     = BF.classById(classId);
    let chapter = cls?.syllabusBook?.chapters?.find(c => c.id === chapterId);

    if (!chapter || !BF.canStudentAccessChapter(chapter, me.id)) {
      location.href = '../dashboard-student.html';
    }

    const content  = chapter.content || {};
    const lessons  = content.lessons  || [];
    const exercises= content.exercises|| [];
    const resources= content.resources|| [];
    const quizPrep = content.quizPrep || [];
    const chOrder  = (cls.syllabusBook?.chapters || []).sort((a,b)=>(a.order||0)-(b.order||0)).findIndex(c=>c.id===chapterId);

    // Progress
    let cprog = BF.progress(me.id);
    let doneExercises = new Set(cprog['chEx_' + chapterId] || []);

    function reloadProgress() {
      cprog = BF.progress(me.id);
      doneExercises = new Set(cprog['chEx_' + chapterId] || []);
    }

    // ── Curriculum badge ─────────────────────────────────────────────────────
    const CURR_INFO = {
      igcse:     { label:'IGCSE',    badgeStyle:'background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.2)' },
      'as-level':{ label:'AS Level', badgeStyle:'background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.2)' },
      'a-level': { label:'A Level',  badgeStyle:'background:rgba(168,85,247,.12);color:#c084fc;border:1px solid rgba(168,85,247,.2)' },
      general:   { label:'General',  badgeStyle:'background:rgba(249,115,22,.12);color:#f97316;border:1px solid rgba(249,115,22,.2)' },
    };
    const currInfo = CURR_INFO[cls.curriculum] || CURR_INFO.general;

    // ── Init ─────────────────────────────────────────────────────────────────
    // Notification bell badge
    try {
      const unseen = BF.getUnseenCount(me.id);
      if (unseen > 0) { const d = document.getElementById('nav-notif-dot'); if (d) d.style.display = 'block'; }
    } catch(e) {}

    function init() {
      document.title = `${chapter.title} — ByteForge`;
      document.getElementById('bc-class').textContent   = cls.name;
      document.getElementById('bc-chapter').textContent = chapter.title;
      document.getElementById('chapter-title').textContent = chapter.title;
      document.getElementById('chapter-desc').textContent  = content.description || chapter.description || '';

      const badge = document.getElementById('chapter-badge');
      badge.textContent = `${currInfo.label} · Chapter ${chOrder + 1}`;
      badge.setAttribute('style', `display:inline-flex;${currInfo.badgeStyle}`);

      if (content.keyTopics?.length) {
        document.getElementById('key-topics').innerHTML =
          content.keyTopics.map(t => `<span class="topic-chip">${t}</span>`).join('');
      }

      buildTabs();
      updateProgress();
    }

    // ── Section tabs ─────────────────────────────────────────────────────────
    const SECTIONS = [
      { id:'lessons',   label:'📖 Lessons',    show: lessons.length > 0 },
      { id:'exercises', label:'✏️ Exercises',   show: exercises.length > 0 },
      { id:'resources', label:'🔗 Resources',   show: resources.length > 0 },
      { id:'quiz',      label:'🃏 Quiz Prep',   show: quizPrep.length > 0 },
      { id:'pdf',       label:'📕 Textbook',    show: !!(cls.syllabusBook?.resourceId && chapter.pageStart && chapter.pageEnd) },
    ].filter(s => s.show);

    let activeSection = SECTIONS[0]?.id || 'lessons';

    function buildTabs() {
      const tabBar = document.getElementById('section-tabs');
      tabBar.innerHTML = SECTIONS.map(s =>
        `<div class="sec-tab ${s.id === activeSection ? 'active' : ''}" onclick="showSection('${s.id}',this)">${s.label}</div>`
      ).join('');
      renderSection(activeSection);
    }

    function showSection(id, el) {
      activeSection = id;
      document.querySelectorAll('.sec-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderSection(id);
    }

    function renderSection(id) {
      const el = document.getElementById('section-content');
      if      (id === 'lessons')   el.innerHTML = renderLessons();
      else if (id === 'exercises') el.innerHTML = renderExercisesHTML(); attachExerciseHandlers();
      else if (id === 'resources') el.innerHTML = renderResources();
      else if (id === 'quiz')      el.innerHTML = renderQuizPrep();
      else if (id === 'pdf')       { el.innerHTML = renderPDFViewer(); loadPDF(); }
    }

    // ── Lessons ──────────────────────────────────────────────────────────────
    function renderLessons() {
      if (!lessons.length) return `<div style="text-align:center;padding:40px;color:var(--fg-dim)">No lesson content yet.</div>`;
      const isRead = (BF.progress(me.id).readChapters || []).includes(chapterId);
      const lessonBlocks = lessons.map((l, i) => {
        if (l.type === 'text') {
          return `<div class="lesson-block">
            <div class="lesson-block-title">
              <span style="background:rgba(59,130,246,.12);color:var(--blue);padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700">📖 READING</span>
              ${l.title}
            </div>
            <div class="lesson-body">${l.body || ''}</div>
          </div>`;
        } else {
          // Video suggestion
          const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(l.searchQuery || l.title)}`;
          return `<div class="video-card">
            <div class="video-thumbnail">🎬</div>
            <div style="flex:1">
              <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#c084fc;margin-bottom:6px">🎬 VIDEO LESSON</div>
              <div class="video-title">${l.title}</div>
              <div class="video-desc">${l.description || ''}</div>
              <a class="video-search-btn" href="${ytUrl}" target="_blank" rel="noopener">
                ▶ Find on YouTube
              </a>
            </div>
          </div>`;
        }
      }).join('');

      // For reading-only chapters (no exercises): show a "Mark as Complete" CTA at the bottom
      const markReadCTA = exercises.length === 0
        ? (isRead
            ? `<div style="text-align:center;margin-top:28px;padding:20px;background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.15);border-radius:14px">
                 <div style="font-size:20px;margin-bottom:6px">✅</div>
                 <div style="font-size:15px;font-weight:700;color:#22c55e">Chapter read! +30 XP earned</div>
               </div>`
            : `<div style="text-align:center;margin-top:28px;padding:24px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px">
                 <div style="font-size:14px;color:var(--fg-dim);margin-bottom:14px">Finished reading this chapter?</div>
                 <button class="btn-check" onclick="markChapterComplete()" style="padding:12px 28px;font-size:15px;background:linear-gradient(135deg,var(--orange),#a855f7)">
                   ✓ Mark Chapter as Complete (+30 XP)
                 </button>
               </div>`)
        : '';

      return lessonBlocks + markReadCTA;
    }

    // ── Exercises ────────────────────────────────────────────────────────────
    function renderExercisesHTML() {
      if (!exercises.length) return `<div style="text-align:center;padding:40px;color:var(--fg-dim)">No exercises yet.</div>`;
      return exercises.map((ex, i) => {
        const done = doneExercises.has(ex.id);
        const diffDots = '●'.repeat(ex.difficulty||2) + '○'.repeat(5-(ex.difficulty||2));
        const header = `
          <div class="ex-header">
            <div class="ex-number">${i+1}</div>
            <div style="flex:1">
              <div class="ex-title-main">${ex.title}</div>
              <div class="ex-meta-row">
                <span class="ex-badge ex-xp-badge">⚡ ${ex.xpReward||50} XP</span>
                <span class="ex-badge ex-diff-badge">${diffDots}</span>
                ${ex.marks ? `<span class="ex-badge ex-marks-badge">📝 ${ex.marks} marks</span>` : ''}
                ${done ? `<span class="ex-badge ex-done-badge">✓ Done</span>` : ''}
              </div>
            </div>
          </div>`;

        if (ex.type === 'mcq') {
          const opts = (ex.options||[]).map((opt, j) =>
            `<div class="mcq-option ${done && j===ex.correct?'correct':''}" data-idx="${j}" data-exid="${ex.id}" data-correct="${ex.correct}" onclick="selectOption(this)">
              <div class="option-letter">${String.fromCharCode(65+j)}</div>
              <span>${opt}</span>
            </div>`).join('');
          return `<div class="exercise-block ${done?'done':''}" id="exblock-${ex.id}">
            ${header}
            <div class="question-text">${ex.question}</div>
            <div class="mcq-options" id="opts-${ex.id}">${opts}</div>
            <div class="feedback-box" id="fb-${ex.id}" style="display:none"></div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <button class="btn-check" id="check-${ex.id}" onclick="checkMCQ('${ex.id}',${ex.correct},${ex.xpReward||50},'${encodeURIComponent(ex.explanation||'')}')">Check Answer</button>
            </div>
          </div>`;
        } else {
          // Written / exam-style
          return `<div class="exercise-block ${done?'done':''}" id="exblock-${ex.id}">
            ${header}
            <div class="question-text">${ex.question}</div>
            <textarea class="written-area" id="answer-${ex.id}" placeholder="Write your answer here…" ${done?'disabled':''}>${done?'(Already submitted — see mark scheme below)':''}</textarea>
            <div class="mark-scheme-reveal ${done?'visible':''}" id="scheme-${ex.id}">
              <div class="mark-scheme-title">📗 Mark Scheme</div>
              <div class="mark-scheme-body">${ex.markScheme||''}</div>
            </div>
            <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
              ${!done ? `<button class="btn-reveal" onclick="revealScheme('${ex.id}')">👁 Show Mark Scheme</button>
              <button class="btn-check" onclick="markWrittenDone('${ex.id}',${ex.xpReward||100})">✓ Mark as Done</button>` : ''}
            </div>
          </div>`;
        }
      }).join('');
    }

    function attachExerciseHandlers() { /* event delegation done via onclick */ }

    // MCQ interaction
    let mcqSelected = {};

    function selectOption(el) {
      const exId = el.dataset.exid;
      if (doneExercises.has(exId)) return;
      document.querySelectorAll(`#opts-${exId} .mcq-option`).forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      mcqSelected[exId] = parseInt(el.dataset.idx);
    }

    function checkMCQ(exId, correct, xp, explanation) {
      const sel = mcqSelected[exId];
      if (sel === undefined) { toast('Please select an answer first','info'); return; }
      const opts   = document.querySelectorAll(`#opts-${exId} .mcq-option`);
      const fb     = document.getElementById('fb-' + exId);
      const checkBtn = document.getElementById('check-' + exId);
      const isRight= sel === correct;

      opts.forEach((o, i) => {
        o.classList.add('disabled');
        if (i === correct) o.classList.add('correct');
        else if (i === sel && !isRight) o.classList.add('wrong');
      });

      fb.style.display = '';
      if (isRight) {
        fb.className = 'feedback-box feedback-correct';
        fb.innerHTML = `✅ <strong>Correct!</strong> ${decodeURIComponent(explanation)}`;
        if (checkBtn) checkBtn.disabled = true;
        completeExercise(exId, xp);
      } else {
        fb.className = 'feedback-box feedback-wrong';
        fb.innerHTML = `❌ <strong>Not quite.</strong> The correct answer was <strong>${String.fromCharCode(65+correct)}</strong>. ${decodeURIComponent(explanation)}`;
      }
    }

    function revealScheme(exId) {
      const scheme = document.getElementById('scheme-' + exId);
      if (scheme) { scheme.classList.add('visible'); }
    }

    function markWrittenDone(exId, xp) {
      revealScheme(exId);
      completeExercise(exId, xp);
      const area = document.getElementById('answer-' + exId);
      if (area) area.disabled = true;
      // Hide the buttons
      const block = document.getElementById('exblock-' + exId);
      const btns = block?.querySelectorAll('.btn-reveal, .btn-check');
      btns?.forEach(b => b.style.display = 'none');
    }

    function completeExercise(exId, xp) {
      if (doneExercises.has(exId)) return;
      BF.completeChapterExercise(me.id, chapterId, exId, xp);
      reloadProgress();
      updateProgress();
      const block = document.getElementById('exblock-' + exId);
      if (block) block.classList.add('done');
      toast(`+${xp} XP earned! 🎉`, 'success');
    }

    // ── Resources ────────────────────────────────────────────────────────────
    function renderResources() {
      if (!resources.length) return `<div style="text-align:center;padding:40px;color:var(--fg-dim)">No resources yet.</div>`;
      const typeIcons = { video:'🎬', article:'📰', tool:'🛠️', website:'🌐', default:'🔗' };
      return `<div class="resource-list">${resources.map(r => {
        const icon    = typeIcons[r.type] || typeIcons.default;
        const ytSearch= `https://www.youtube.com/results?search_query=${encodeURIComponent(r.searchQuery||r.title)}`;
        const googleSearch = `https://www.google.com/search?q=${encodeURIComponent(r.searchQuery||r.title)}`;
        const href    = r.url && r.url !== 'https://example.com' && r.url.startsWith('http') ? r.url : (r.type==='video' ? ytSearch : googleSearch);
        return `<div class="resource-row">
          <div class="resource-type-icon">${icon}</div>
          <div class="resource-row-info">
            <div class="resource-row-title">${r.title}</div>
            <div class="resource-row-desc">${r.description||''}</div>
          </div>
          <a class="resource-row-btn" href="${href}" target="_blank" rel="noopener">Open →</a>
        </div>`;
      }).join('')}</div>`;
    }

    // ── Quiz Prep Flashcards ─────────────────────────────────────────────────
    function renderQuizPrep() {
      if (!quizPrep.length) return `<div style="text-align:center;padding:40px;color:var(--fg-dim)">No quiz prep yet.</div>`;
      return `<div style="margin-bottom:14px;font-size:13px;color:var(--fg-dim)">💡 Click each card to reveal the answer.</div>` +
        quizPrep.map((fc, i) =>
          `<div class="flashcard" id="fc-${i}" onclick="flipCard(${i})">
            <div class="flashcard-q">❓ ${fc.question}</div>
            <div class="flashcard-hint">Click to reveal answer</div>
            <div class="flashcard-a">✅ ${fc.answer}</div>
          </div>`
        ).join('');
    }

    function flipCard(i) {
      document.getElementById('fc-' + i)?.classList.toggle('flipped');
    }

    // ── PDF Viewer ───────────────────────────────────────────────────────────
    let pdfDoc = null, currentPage = 0, pdfPageStart = 1, pdfPageEnd = 1;

    function renderPDFViewer() {
      return `<div class="pdf-viewer">
        <div class="pdf-controls">
          <button class="pdf-nav-btn" onclick="changePDFPage(-1)" id="pdf-prev">← Previous</button>
          <span class="pdf-page-info" id="pdf-page-info">Loading…</span>
          <button class="pdf-nav-btn" onclick="changePDFPage(1)" id="pdf-next">Next →</button>
        </div>
        <canvas id="pdf-canvas"></canvas>
        <div id="pdf-loading" style="text-align:center;padding:40px;color:var(--fg-dim)">
          <div style="font-size:30px;margin-bottom:10px">📕</div>
          <div>Loading PDF…</div>
        </div>
      </div>`;
    }

    async function loadPDF() {
      const sb  = cls.syllabusBook;
      const res = sb?.resourceId ? (cls.resources||[]).find(r => r.id === sb.resourceId) : null;
      if (!res?.dataUrl) {
        document.getElementById('pdf-loading').innerHTML = '<div style="color:#f87171">PDF not available.</div>';
        return;
      }
      pdfPageStart = chapter.pageStart || 1;
      pdfPageEnd   = chapter.pageEnd   || pdfPageStart;
      currentPage  = pdfPageStart;

      try {
        pdfDoc = await pdfjsLib.getDocument(res.dataUrl).promise;
        pdfPageEnd = Math.min(pdfPageEnd, pdfDoc.numPages);
        document.getElementById('pdf-loading').style.display = 'none';
        renderPDFPage(currentPage);
      } catch(e) {
        document.getElementById('pdf-loading').innerHTML = `<div style="color:#f87171">Could not load PDF: ${e.message}</div>`;
      }
    }

    async function renderPDFPage(pageNum) {
      if (!pdfDoc) return;
      const page     = await pdfDoc.getPage(pageNum);
      const scale    = Math.min(1.6, (window.innerWidth - 80) / page.getViewport({ scale: 1 }).width);
      const viewport = page.getViewport({ scale });
      const canvas   = document.getElementById('pdf-canvas');
      if (!canvas) return;
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

      const info = document.getElementById('pdf-page-info');
      if (info) info.textContent = `Page ${pageNum} (Chapter p.${pdfPageStart}–${pdfPageEnd})`;
      const prev = document.getElementById('pdf-prev');
      const next = document.getElementById('pdf-next');
      if (prev) prev.disabled = pageNum <= pdfPageStart;
      if (next) next.disabled = pageNum >= pdfPageEnd;
    }

    function changePDFPage(delta) {
      const next = currentPage + delta;
      if (next < pdfPageStart || next > pdfPageEnd) return;
      currentPage = next;
      renderPDFPage(currentPage);
    }

    // ── Progress tracking ────────────────────────────────────────────────────
    function updateProgress() {
      const total   = exercises.length;
      const done    = doneExercises.size;
      const isRead  = (BF.progress(me.id).readChapters || []).includes(chapterId);
      // A reading-only chapter (no exercises) is "done" once the student marks it read
      const allDone = total > 0 ? done >= total : isRead;
      const pct     = total > 0 ? Math.round(done / total * 100) : (isRead ? 100 : 0);

      document.getElementById('progress-label').textContent =
        total === 0 ? (isRead ? '✓ Chapter read' : 'Reading chapter') : `${done} / ${total} exercises done`;
      document.getElementById('progress-fill').style.width = pct + '%';

      const banner = document.getElementById('completion-banner');
      if (allDone) {
        banner.style.display = '';
        document.getElementById('completion-sub').textContent = total > 0
          ? `You've completed all ${total} exercise${total > 1 ? 's' : ''} and earned XP. Great work!`
          : 'You\'ve read this chapter. Great work! +30 XP';
        checkNextChapterButton();
        // Mark chapter read — only awards XP for reading-only chapters (avoids double-award for exercise chapters)
        BF.markChapterRead(me.id, chapterId, total === 0 ? 30 : 0);
      } else {
        banner.style.display = 'none';
      }
    }

    function markChapterComplete() {
      // For reading-only chapters: student explicitly marks the chapter done
      BF.markChapterRead(me.id, chapterId, 30);
      reloadProgress();
      updateProgress();
      renderSection(activeSection); // re-render to hide the button
      toast('+30 XP for reading the chapter! 📚', 'success');
      confetti();
    }

    function checkNextChapterButton() {
      const chapters = (cls.syllabusBook?.chapters || []).sort((a,b)=>(a.order||0)-(b.order||0));
      const idx      = chapters.findIndex(c => c.id === chapterId);
      const nextCh   = chapters[idx + 1];

      const btn   = document.getElementById('btn-request-unlock');
      const msg   = document.getElementById('unlock-requested-msg');
      const goBtn = document.getElementById('btn-go-next');

      if (!nextCh) {
        if (btn)   btn.style.display   = 'none';
        if (goBtn) goBtn.style.display = 'none';
        return;
      }

      const alreadyAccessible = BF.canStudentAccessChapter(nextCh, me.id);
      if (alreadyAccessible) {
        if (btn)   btn.style.display   = 'none';
        if (msg)   msg.style.display   = 'none';
        if (goBtn) {
          goBtn.style.display = '';
          goBtn.href = `chapter-view.html?classId=${classId}&chapterId=${nextCh.id}`;
          goBtn.textContent = `→ Go to Next Chapter: ${nextCh.title}`;
        }
        return;
      }
      if (goBtn) goBtn.style.display = 'none';

      const alreadyRequested = (nextCh.unlockRequests||[]).some(r => r.studentId === me.id && r.status==='pending');
      if (alreadyRequested) {
        if (btn) btn.style.display = 'none';
        if (msg) msg.style.display = '';
      } else {
        if (btn) { btn.style.display = ''; btn.dataset.nextChapterId = nextCh.id; }
        if (msg) msg.style.display = 'none';
      }
    }

    function requestNextChapter() {
      const btn    = document.getElementById('btn-request-unlock');
      const nextId = btn?.dataset.nextChapterId;
      if (!nextId) return;
      try {
        BF.requestChapterUnlock(classId, nextId, me.id);
        toast('🔔 Request sent to your teacher!', 'success');
        btn.style.display = 'none';
        const msg = document.getElementById('unlock-requested-msg');
        if (msg) msg.style.display = '';
      } catch(e) {
        toast(e.message, 'info');
      }
    }

    // ── Run ──────────────────────────────────────────────────────────────────
    init();
  </script>
</body>
