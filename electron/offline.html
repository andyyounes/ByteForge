<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ByteForge</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0b1220;
    color: #e5e9f5;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { text-align: center; max-width: 360px; padding: 0 24px; }
  .icon { font-size: 40px; margin-bottom: 14px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 13px; color: #9aa4c0; margin: 0 0 20px; line-height: 1.5; }
  button {
    background: #6366f1; color: #fff; border: none;
    padding: 10px 22px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #4f52d6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">&#128225;</div>
    <h1>Can't reach ByteForge</h1>
    <p>Check your internet connection, then try again.</p>
    <button onclick="retry()">Retry</button>
  </div>
  <script>
    function retry() { window.bf.retryLoad() }
  </script>
</body>
</html>
