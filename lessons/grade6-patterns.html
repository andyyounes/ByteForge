<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <script src="https://unpkg.com/blockly@10.4.3/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly@10.4.3/blocks_compressed.js"></script>

  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { padding-top:64px; background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; }

    .layout { display:grid; grid-template-columns:1fr 460px; height:calc(100vh - 64px); overflow:hidden; }

    /* â”€â”€ Left: Blockly â”€â”€ */
    .blocks-panel { display:flex; flex-direction:column; border-right:1px solid var(--border); overflow:hidden; }
    .panel-header  { padding:11px 16px; background:var(--bg-card); border-bottom:1px solid var(--border);
                     display:flex; align-items:center; justify-content:space-between; gap:10px; flex-shrink:0; }
    .panel-title   { font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px; }
    .grade-badge   { font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px;
                     background:rgba(34,197,94,.15); color:#4ade80; border:1px solid rgba(34,197,94,.3); }
    .btn-row { display:flex; gap:6px; }
    .btn { padding:6px 13px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; transition:.15s; border:none; }
    .btn-brand  { background:#b8ef4a; color:#0d0f1a; }
    .btn-brand:hover { background:#a5d83d; }
    .btn-ghost  { background:var(--bg-raised); color:var(--fg); border:1px solid var(--border-hi); }
    .btn-ghost:hover { background:rgba(255,255,255,.08); }
    #blockly-div { flex:1; min-height:0; }

    /* â”€â”€ Right panel â”€â”€ */
    .right-panel { display:flex; flex-direction:column; overflow:hidden; }

    /* Challenge header */
    .ch-header { flex-shrink:0; background:var(--bg-card); border-bottom:1px solid var(--border); padding:10px 14px; }
    .ch-pills  { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
    .ch-pill   { padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700;
                 border:1px solid var(--border); color:var(--fg-dim); cursor:pointer; transition:.15s; }
    .ch-pill:hover  { border-color:var(--border-hi); color:var(--fg); }
    .ch-pill.active { background:rgba(34,197,94,.12); border-color:#4ade80; color:#4ade80; }
    .ch-pill.done   { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.35); color:#4ade80; }
    .ch-row    { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
    .ch-text   { font-size:13px; color:var(--fg-dim); line-height:1.6; flex:1; }
    .ch-text strong { color:var(--fg); }
    .xp-pill   { font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px;
                 background:rgba(234,179,8,.12); color:#fbbf24; border:1px solid rgba(234,179,8,.25); white-space:nowrap; flex-shrink:0; }
    .pass-badge { display:none; font-size:11px; font-weight:700; padding:3px 10px; border-radius:6px;
                  background:rgba(34,197,94,.15); color:#4ade80; border:1px solid rgba(34,197,94,.3); white-space:nowrap; }

    /* Loop counter demo */
    .demo-strip { flex-shrink:0; padding:10px 14px; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; }
    .demo-label { font-size:11px; font-weight:700; color:var(--fg-faint); text-transform:uppercase; letter-spacing:.06em; }
    .counter-group { display:flex; align-items:center; gap:6px; }
    .counter-badge { font-size:13px; font-weight:800; font-family:var(--mono); color:#4ade80; background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.25); padding:2px 8px; border-radius:6px; min-width:28px; text-align:center; }
    .slider-wrap   { display:flex; align-items:center; gap:5px; }
    .slider-wrap input[type=range] { width:80px; accent-color:#4ade80; }
    .slider-wrap span { font-size:11px; color:var(--fg-faint); font-family:var(--mono); }

    /* Canvas */
    .canvas-wrap { flex:1; display:flex; align-items:center; justify-content:center;
                   background:#05080f; overflow:hidden; position:relative; }
    #pattern-canvas { display:block; }

    /* Log */
    .out-section { flex-shrink:0; border-top:1px solid var(--border); background:var(--bg-card); }
    .out-bar { height:56px; overflow-y:auto; padding:4px 14px; font-size:12px; font-family:var(--mono); }
    .out-line { padding:2px 0; }
    .out-line.ok   { color:#4ade80; }
    .out-line.err  { color:#f87171; }
    .out-line.info { color:#94a3b8; }

    /* Toast */
    .toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:10px;
             font-size:14px; font-weight:600; transform:translateY(60px); opacity:0; transition:.3s; z-index:9999;
             background:#166534; color:#bbf7d0; border:1px solid #16a34a; }
    .toast.show { transform:translateY(0); opacity:1; }

    /* Challenge lock */
    .ch-pill.locked { opacity:0.35; cursor:not-allowed !important; }

    /* AI button */
    .ai-btn { padding:4px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;
              border:1px solid rgba(168,85,247,.35); color:#c084fc; background:rgba(168,85,247,.08); transition:.15s; }
    .ai-btn:hover:not(:disabled) { background:rgba(168,85,247,.18); }
    .ai-btn:disabled { opacity:.45; cursor:not-allowed; }
  </style>
</head>
<body>

  <!-- Navbar injected by auth.js -->

  <div class="layout">

    <!-- â”€â”€ Left: Blockly editor â”€â”€ -->
    <div class="blocks-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="grade-badge">Grade 6</span>
          Patterns &amp; Repetition
        </div>
        <div class="btn-row">
          <button class="btn btn-brand" onclick="runBlocks()">â–¶ Run</button>
          <button class="btn btn-ghost" onclick="clearCanvas()">Clear</button>
          <button class="btn btn-ghost" onclick="showHint()">ðŸ’¡ Hint</button>
          <button class="ai-btn" id="ai-btn" onclick="checkWithAI()">ðŸ¤– AI Check</button>
        </div>
      </div>

    <!-- â”€â”€ Right: canvas + challenge â”€â”€ -->

      <!-- Challenge selector -->

        <div class="ch-pills" id="ch-pills"></div>
        <div class="ch-row">
          <div class="ch-text" id="ch-text">Select a challenge above to begin.</div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            <span class="xp-pill" id="xp-pill">+â€” XP</span>
            <span class="pass-badge" id="pass-badge">âœ“ Passed!</span>
          </div>

      <!-- Live loop-counter demo bar -->
      <div class="demo-strip">

            <span id="cols-val">5</span>
          </div>
          <span class="counter-badge" id="col-counter">j = 1</span>
        </div>
      </div>

      <!-- Canvas -->
      <div class="canvas-wrap">
        <canvas id="pattern-canvas" width="400" height="340"></canvas>
      </div>

      <!-- Output log -->
      <div class="out-section">
        <div class="out-bar" id="out-bar"></div>
      </div>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Blockly toolbox XML -->
  <xml id="toolbox" style="display:none">
    <category name="Loops" colour="#22c55e">
      <block type="bf_repeat">
        <field name="TIMES">5</field>
      </block>
      <block type="bf_repeat_var">
        <field name="VAR">i</field><field name="FROM">1</field><field name="TO">5</field>
      </block>
    </category>
    <category name="Drawing" colour="#f97316">
      <block type="bf_circle"><value name="X"><shadow type="math_number"><field name="NUM">200</field></shadow></value><value name="Y"><shadow type="math_number"><field name="NUM">170</field></shadow></value><value name="R"><shadow type="math_number"><field name="NUM">20</field></shadow></value></block>
      <block type="bf_rect"><value name="X"><shadow type="math_number"><field name="NUM">50</field></shadow></value><value name="Y"><shadow type="math_number"><field name="NUM">50</field></shadow></value><value name="W"><shadow type="math_number"><field name="NUM">60</field></shadow></value><value name="H"><shadow type="math_number"><field name="NUM">60</field></shadow></value></block>
      <block type="bf_fill_rgb"><value name="R"><shadow type="math_number"><field name="NUM">100</field></shadow></value><value name="G"><shadow type="math_number"><field name="NUM">200</field></shadow></value><value name="B"><shadow type="math_number"><field name="NUM">100</field></shadow></value></block>
      <block type="bf_background"></block>
    </category>
    <category name="Variables" colour="#a855f7">
      <block type="variables_set"></block>
      <block type="variables_get"></block>
      <block type="bf_change_var"></block>
    </category>
    <category name="Math" colour="#3b82f6">
      <block type="math_number"><field name="NUM">0</field></block>
      <block type="math_arithmetic"><field name="OP">ADD</field></block>
      <block type="math_arithmetic"><field name="OP">MULTIPLY</field></block>
    </category>
  </xml>

  <script>
// â”€â”€ BF Integration â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
BF.seed();
// Soft auth: allow access from Next.js/Supabase context (me = null → XP skipped)
const me = (() => { try { return BF.session() || null; } catch(_) { return null; } })();

// â”€â”€ Canvas â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const canvas = document.getElementById('pattern-canvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

function clearCanvas() {
  ctx.fillStyle = '#05080f';
  ctx.fillRect(0, 0, W, H);
}
clearCanvas();

// â”€â”€ Execution log â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function logLine(msg, cls = '') {
  const bar = document.getElementById('out-bar');
  const el  = document.createElement('div');
  el.className = 'out-line' + (cls ? ' ' + cls : '');
  el.textContent = msg;
  bar.appendChild(el);
  bar.scrollTop = bar.scrollHeight;
}

// â”€â”€ Custom Blockly blocks â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
Blockly.defineBlocksWithJsonArray([
  {
    type: 'bf_repeat',
    message0: 'repeat %1 times',
    args0: [{ type: 'field_number', name: 'TIMES', value: 5, min: 1, max: 20 }],
    message1: 'do %1',
    args1: [{ type: 'input_statement', name: 'DO' }],
    previousStatement: null, nextStatement: null,
    colour: '#22c55e', tooltip: 'Repeat the blocks inside a number of times.',
  },
  {
    type: 'bf_repeat_var',
    message0: 'for %1 from %2 to %3',
    args0: [
      { type: 'field_variable', name: 'VAR', variable: 'i' },
      { type: 'field_number', name: 'FROM', value: 1, min: 0 },
      { type: 'field_number', name: 'TO',   value: 5, min: 1, max: 20 },
    ],
    message1: 'do %1',
    args1: [{ type: 'input_statement', name: 'DO' }],
    previousStatement: null, nextStatement: null,
    colour: '#22c55e', tooltip: 'Loop with a counting variable.',
  },
  {
    type: 'bf_circle',
    message0: 'draw circle  x %1  y %2  radius %3',
    args0: [
      { type: 'input_value', name: 'X', check: 'Number' },
      { type: 'input_value', name: 'Y', check: 'Number' },
      { type: 'input_value', name: 'R', check: 'Number' },
    ],
    inputsInline: true,
    previousStatement: null, nextStatement: null,
    colour: '#f97316',
  },
  {
    type: 'bf_rect',
    message0: 'draw rectangle  x %1  y %2  width %3  height %4',
    args0: [
      { type: 'input_value', name: 'X', check: 'Number' },
      { type: 'input_value', name: 'Y', check: 'Number' },
      { type: 'input_value', name: 'W', check: 'Number' },
      { type: 'input_value', name: 'H', check: 'Number' },
    ],
    inputsInline: true,
    previousStatement: null, nextStatement: null,
    colour: '#f97316',
  },
  {
    type: 'bf_fill_rgb',
    message0: 'set colour  R %1  G %2  B %3',
    args0: [
      { type: 'input_value', name: 'R', check: 'Number' },
      { type: 'input_value', name: 'G', check: 'Number' },
      { type: 'input_value', name: 'B', check: 'Number' },
    ],
    inputsInline: true,
    previousStatement: null, nextStatement: null,
    colour: '#f97316',
  },
  {
    type: 'bf_background',
    message0: 'clear canvas (dark)',
    previousStatement: null, nextStatement: null,
    colour: '#f97316',
  },
  {
    type: 'bf_change_var',
    message0: 'change %1 by %2',
    args0: [
      { type: 'field_variable', name: 'VAR', variable: 'i' },
      { type: 'field_number', name: 'DELTA', value: 1 },
    ],
    previousStatement: null, nextStatement: null,
    colour: '#a855f7',
  },
]);

// â”€â”€ JavaScript generators for custom blocks â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const jsGen = Blockly.JavaScript;

jsGen.forBlock['bf_repeat'] = (b, g) => {
  const n  = parseInt(b.getFieldValue('TIMES'), 10);
  const body = g.statementToCode(b, 'DO');
  return `for (let __i=0;__i<${n};__i++) {\n${body}}\n`;
};

jsGen.forBlock['bf_repeat_var'] = (b, g) => {
  const varName = g.getVariableName(b.getFieldValue('VAR'));
  const from    = parseInt(b.getFieldValue('FROM'), 10);
  const to      = parseInt(b.getFieldValue('TO'),   10);
  const body    = g.statementToCode(b, 'DO');
  return `for (let ${varName}=${from}; ${varName}<=${to}; ${varName}++) {\n${body}}\n`;
};

jsGen.forBlock['bf_circle'] = (b, g) => {
  const x = g.valueToCode(b,'X',0)||'0';
  const y = g.valueToCode(b,'Y',0)||'0';
  const r = g.valueToCode(b,'R',0)||'10';
  return `__ctx.beginPath(); __ctx.arc(${x},${y},Math.max(1,${r}),0,Math.PI*2); __ctx.fill(); __drawCalls++;\n`;
};

jsGen.forBlock['bf_rect'] = (b, g) => {
  const x = g.valueToCode(b,'X',0)||'0';
  const y = g.valueToCode(b,'Y',0)||'0';
  const w = g.valueToCode(b,'W',0)||'20';
  const h = g.valueToCode(b,'H',0)||'20';
  return `__ctx.fillRect(${x},${y},${w},${h}); __drawCalls++;\n`;
};

jsGen.forBlock['bf_fill_rgb'] = (b, g) => {
  const r = g.valueToCode(b,'R',0)||'255';
  const gg = g.valueToCode(b,'G',0)||'255';
  const bl = g.valueToCode(b,'B',0)||'255';
  return `__ctx.fillStyle = \`rgb(\${Math.round(${r})},\${Math.round(${gg})},\${Math.round(${bl})})\`;\n`;
};

jsGen.forBlock['bf_background'] = () => {
  return `__ctx.fillStyle='#05080f'; __ctx.fillRect(0,0,${W},${H});\n`;
};

jsGen.forBlock['bf_change_var'] = (b, g) => {
  const v = g.getVariableName(b.getFieldValue('VAR'));
  const d = parseFloat(b.getFieldValue('DELTA'));
  return `${v} += ${d};\n`;
};

// â”€â”€ Blockly workspace â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const workspace = Blockly.inject('blockly-div', {
  toolbox: document.getElementById('toolbox'),
  theme: Blockly.Theme.defineTheme('dark', {
    base: Blockly.Themes.Classic,
    componentStyles: {
      workspaceBackgroundColour: '#0d1117',
      toolboxBackgroundColour:   '#0b0e1c',
      toolboxForegroundColour:   '#e2e8f0',
      flyoutBackgroundColour:    '#13172a',
      flyoutForegroundColour:    '#94a3b8',
      scrollbarColour:           '#1e2438',
      insertionMarkerColour:     '#b8ef4a',
      markerColour:              '#b8ef4a',
      cursorColour:              '#b8ef4a',
    },
  }),
  grid: { spacing:20, length:3, colour:'rgba(255,255,255,.04)', snap:true },
  zoom: { controls:true, wheel:true, startScale:0.9 },
  trashcan: true,
  scrollbars: true,
});

// â”€â”€ Run â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let _execLog = { circles: 0, rects: 0, loops: 0, colourChanges: 0 };

function runBlocks() {
  clearCanvas();
  document.getElementById('out-bar').innerHTML = '';
  _execLog = { circles: 0, rects: 0, loops: 0, colourChanges: 0 };

  let code;
  try {
    code = Blockly.JavaScript.workspaceToCode(workspace);
  } catch (e) {
    logLine('Could not read blocks: ' + e.message, 'err'); return;
  }

  if (!code.trim()) { logLine('Add some blocks first!', 'info'); return; }

  // Count loops & draw calls via instrumented code
  const loopCount = (code.match(/for\s*\(/g) || []).length;
  _execLog.loops = loopCount;

  // Wrap in executor with canvas bound as __ctx
  const wrapped = `
    let __drawCalls = 0;
    const __ctx = __canvas.getContext('2d');
    __ctx.fillStyle = 'rgba(100,200,100,0.8)';
    try {
      ${code}
    } catch(e) { throw e; }
    return __drawCalls;
  `;

  try {
    // eslint-disable-next-line no-new-func
    const fn = new Function('__canvas', wrapped);
    const drawCalls = fn(canvas);
    logLine('âœ“ Ran! ' + drawCalls + ' shapes drawn, ' + loopCount + ' loop(s) used.', 'ok');
    _execLog.circles      = (code.match(/\.arc\(/g)       || []).length;
    _execLog.rects        = (code.match(/\.fillRect\(/g)  || []).length;
    _execLog.colourChanges= (code.match(/fillStyle\s*=/g) || []).length;
    checkChallenge();
  } catch (e) {
    const msg = friendlyError(e.message);
    logLine('Oops: ' + msg, 'err');
  }
}

function friendlyError(msg) {
  if (/is not defined/.test(msg)) return msg.replace('ReferenceError: ','') + ' â€” did you create that variable first?';
  if (/Maximum call stack/.test(msg)) return 'Your loop might be running forever â€” check the repeat number!';
  return msg;
}

// â”€â”€ Live demo slider â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let _demoTimer = null;
function updateDemo() {
  const rows = parseInt(document.getElementById('rows-slider').value, 10);
  const cols = parseInt(document.getElementById('cols-slider').value, 10);
  document.getElementById('rows-val').textContent = rows;
  document.getElementById('cols-val').textContent = cols;
  if (_demoTimer) clearTimeout(_demoTimer);
  _demoTimer = setTimeout(() => animateDemo(rows, cols), 100);
}

function animateDemo(rows, cols) {
  clearCanvas();
  const padX = 40, padY = 30;
  const stepX = (W - padX * 2) / Math.max(cols, 1);
  const stepY = (H - padY * 2) / Math.max(rows, 1);
  const r     = Math.min(stepX, stepY) * 0.3;
  let step = 0;
  let i = 1, j = 1;
  const total = rows * cols;

  function drawNext() {
    if (step >= total) {
      document.getElementById('row-counter').textContent = 'i = ' + rows;
      document.getElementById('col-counter').textContent = 'j = ' + cols;
      return;
    }
    const x = padX + (j - 0.5) * stepX;
    const y = padY + (i - 0.5) * stepY;
    const hue = (step / total) * 260;
    ctx.fillStyle = `hsl(${hue},80%,60%)`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    document.getElementById('row-counter').textContent = 'i = ' + i;
    document.getElementById('col-counter').textContent = 'j = ' + j;
    j++;
    if (j > cols) { j = 1; i++; }
    step++;
    setTimeout(drawNext, Math.max(20, 400 / total));
  }
  drawNext();
}

// â”€â”€ Challenges â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const CHALLENGES = [
  {
    mod: 'M3', name: 'Dot Grid', xp: 40,
    text: `<strong>Challenge 1 â€” Dot Grid</strong> â€” Use two nested loops (one for rows, one for columns) to draw a <em>5Ã—5 grid of circles</em>. Use <strong>for i from 1 to 5</strong> and inside it another <strong>for j from 1 to 5</strong>. Position each circle using i and j.`,
    hints: [
      'Use two "for i from 1 to 5" loops â€” one inside the other. The outer loop is rows, the inner is columns.',
      'Calculate x position: j Ã— 70 (spacing of 70 pixels). Calculate y position: i Ã— 60.',
      'Put "set colour" and "draw circle" blocks inside the innermost loop. Radius of 20 works well.',
    ],
    check: (log) => log.circles >= 16 && log.loops >= 2,
  },
  {
    mod: 'M3', name: 'Colour Fade', xp: 45,
    text: `<strong>Challenge 2 â€” Colour Fade</strong> â€” Draw a row of 8 circles that change colour as you go. Create a variable <em>red</em> starting at 20. Inside a loop, draw a circle using <em>red</em> for the R value, then <em>increase red by 30</em> each time.`,
    hints: [
      'Create a variable called "red" and set it to 20 before the loop.',
      'Inside the loop: set colour R=red G=80 B=200, then draw circle, then "change red by 30".',
      'Use "for i from 1 to 8". Position x = i Ã— 45, y = 170. You should see a colour gradient.',
    ],
    check: (log) => log.circles >= 5 && log.loops >= 1 && log.colourChanges >= 1,
  },
  {
    mod: 'M3', name: 'Tile Pattern', xp: 50,
    text: `<strong>Challenge 3 â€” Tile Pattern</strong> â€” Build a tiled wallpaper! Use nested loops to draw a <em>4Ã—4 grid of rectangles</em>. Make alternating tiles different colours â€” use an if-style trick: if the sum of i and j is even, use one colour; if odd, use another.`,
    hints: [
      'Use two loops: for i from 1 to 4, and inside: for j from 1 to 4.',
      'Position: x = (jâˆ’1)Ã—90 + 20, y = (iâˆ’1)Ã—80 + 20, width 80, height 70.',
      'To alternate colours: create a variable "colour" that changes each inner loop. Try: if j is odd use orange, if even use purple â€” or just alternate between two set-colour blocks.',
    ],
    check: (log) => log.rects >= 12 && log.loops >= 2,
  },
];

const completed = new Set();
let activeIdx = 0;
let hintIdx   = 0;

function renderPills() {
  const row = document.getElementById('ch-pills');
  row.innerHTML = '';
  CHALLENGES.forEach((ch, i) => {
    const isLocked = i > 0 && !completed.has(i-1) && !completed.has(i) && i !== activeIdx;
    const el = document.createElement('div');
    el.className = 'ch-pill'
      + (i === activeIdx    ? ' active' : '')
      + (completed.has(i)  ? ' done'   : '')
      + (isLocked          ? ' locked' : '');
    el.textContent = completed.has(i) ? 'âœ“ ' + ch.mod + ' ' + ch.name
                   : isLocked         ? 'ðŸ”’ ' + ch.mod + ' ' + ch.name
                   : ch.mod + ' ' + ch.name;
    if (!isLocked) {
      el.onclick = () => selectChallenge(i);
    } else {
      el.title = 'Complete the previous challenge first!';
    }
    row.appendChild(el);
  });
}

function selectChallenge(i) {
  activeIdx = i;
  hintIdx   = 0;
  const ch  = CHALLENGES[i];
  document.getElementById('ch-text').innerHTML  = ch.text;
  document.getElementById('xp-pill').textContent = '+' + ch.xp + ' XP';
  document.getElementById('pass-badge').style.display = 'none';
  clearCanvas();
  document.getElementById('out-bar').innerHTML = '';
  renderPills();
  logLine('Challenge: ' + ch.name, 'info');
}

function checkChallenge() {
  const ch = CHALLENGES[activeIdx];
  if (!ch || completed.has(activeIdx)) return;
  if (ch.check(_execLog)) {
    completed.add(activeIdx);
    renderPills();
    document.getElementById('pass-badge').style.display = '';
    showToast('Challenge complete! +' + ch.xp + ' XP ðŸŽ‰');
    logLine('âœ… Challenge complete! +' + ch.xp + ' XP', 'ok');
    if (me) {
      BF.addXP(me.id, ch.xp);
      BF.recordAttempt(me.id, 'g6-patterns-c' + activeIdx, { passed: true, score: 100 });
    }
    LessonSaves.save('grade6-patterns', activeIdx, {
      passed: true, xpEarned: ch.xp,
      code: Blockly.JavaScript.workspaceToCode(workspace),
    });
    renderPills(); // unlock next
  } else {
    // Specific feedback on what's missing
    const log = _execLog;
    const missing = [];
    if (activeIdx === 0) { // Dot Grid
      if (log.circles < 16)  missing.push('more circles â€” need at least 16 (5Ã—5 grid)');
      if (log.loops < 2)     missing.push('two nested loops (one for rows, one for columns)');
    } else if (activeIdx === 1) { // Colour Fade
      if (log.circles < 5)       missing.push('at least 5 circles in a row');
      if (log.loops < 1)         missing.push('a loop (for i from 1 to 8)');
      if (log.colourChanges < 2) missing.push('a "set colour" block inside the loop using a variable');
    } else if (activeIdx === 2) { // Tile Pattern
      if (log.rects < 12)  missing.push('more rectangles â€” need at least 12 (4Ã—4 grid)');
      if (log.loops < 2)   missing.push('two nested loops');
    }
    if (missing.length) {
      logLine('âŒ Not quite â€” still needs: ' + missing.join(' Â· '), 'err');
    }
  }
}

function showHint() {
  const ch = CHALLENGES[activeIdx];
  if (!ch) return;
  if (hintIdx < ch.hints.length) {
    logLine('ðŸ’¡ Hint ' + (hintIdx + 1) + ': ' + ch.hints[hintIdx++], 'info');
  } else {
    logLine('No more hints for this challenge!', 'info');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// â”€â”€ Groq AI Check â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
async function checkWithAI() {
  const ch = CHALLENGES[activeIdx];
  if (!ch) return;

  const code = Blockly.JavaScript.workspaceToCode(workspace).trim();
  if (!code) { logLine('Add some blocks first!', 'err'); return; }

  const btn = document.getElementById('ai-btn');
  btn.disabled = true;
  btn.textContent = 'ðŸ¤– Thinkingâ€¦';

  const prompt = `You are a friendly coding tutor for kids aged 11-12.
Challenge: “${ch.name}” â€” ${ch.text.replace(/<[^>]+>/g,'')}
The student used Blockly blocks that generated this JavaScript canvas code.
In 2-3 short sentences: say if it looks right for the challenge. If not, give ONE specific tip. Be encouraging.`;

  try {
    const res = await fetch('/api/ai-check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: (typeof ENV !== 'undefined' && ENV.GROQ_MODEL) || 'llama-3.1-8b-instant',
        messages: [
          { role: 'system', content: prompt },
          { role: 'user',   content: `\`\`\`javascript\n${code}\n\`\`\`` }
        ],
        max_tokens: 150, temperature: 0.4
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || data.error);
    logLine('ðŸ¤– ' + (data.choices?.[0]?.message?.content?.trim() || '(no response)'), 'info');
  } catch(e) {
    logLine('AI check failed: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'ðŸ¤– AI Check';
  }
}

// ── Workspace autosave (Blockly → Supabase, debounced 3 s) ──────────────────
let _g6SaveTimer = null;
workspace.addChangeListener(e => {
  if (e.type === Blockly.Events.UI || e.type === Blockly.Events.VIEWPORT_CHANGE) return;
  clearTimeout(_g6SaveTimer);
  _g6SaveTimer = setTimeout(() => {
    try {
      const xml = Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(workspace));
      LessonSaves.save('grade6-patterns', -1, { saveData: { xml } });
    } catch(_) {}
  }, 3000);
});

// ── Init — restore Supabase saves, then render ───────────────────────────────
;(async () => {
  await LessonSaves.load('grade6-patterns');
  LessonSaves.completedSet().forEach(idx => completed.add(idx));
  const ws = LessonSaves.savedWorkspace();
  if (ws?.xml) {
    try { Blockly.Xml.domToWorkspace(Blockly.Xml.textToDom(ws.xml), workspace); } catch(_) {}
  }
  renderPills();
  selectChallenge(0);
  updateDemo();
})()
