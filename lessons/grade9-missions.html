<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 9 — Mission IDE · ByteForge</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0f1a; color:#e2e8f0; font-family:'Segoe UI',system-ui,sans-serif;
         height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  .nav { display:flex; align-items:center; justify-content:space-between; padding:10px 18px;
         background:#0a0c18; border-bottom:1px solid rgba(255,255,255,.1); flex-shrink:0; }
  .nav-logo { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; }
  .nav-logo .bolt { color:#b8ef4a; }
  .nav a { color:#9ca3af; text-decoration:none; font-size:13px; }
  .nav a:hover { color:#e2e8f0; }

  /* ── Mission bar ── */
  .mbar { display:flex; align-items:center; gap:14px; padding:10px 18px; background:#111320;
          border-bottom:1px solid rgba(255,255,255,.08); flex-shrink:0; }
  .mbar-back { background:none; border:1px solid rgba(255,255,255,.15); color:#9ca3af; border-radius:8px;
               padding:6px 12px; font-size:12px; cursor:pointer; }
  .mbar-back:hover { color:#fff; }
  .mbar-title { font-size:15px; font-weight:800; }
  .mbar-phase { font-size:10px; font-weight:900; letter-spacing:1px; color:#67e8f9;
                background:rgba(103,232,249,.1); border:1px solid rgba(103,232,249,.3);
                padding:3px 10px; border-radius:99px; }
  .mbar-par { margin-left:auto; font-size:11.5px; font-weight:800; color:#fbbf24; }

  /* ── Split layout ── */
  .main { flex:1; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; }
  .left { display:flex; flex-direction:column; border-right:1px solid rgba(255,255,255,.1); overflow:hidden; }
  .scene-wrap { flex:1; display:flex; align-items:center; justify-content:center; background:
    radial-gradient(ellipse at 30% 20%, rgba(103,232,249,.05), transparent 60%), #0b0d16; overflow:hidden; position:relative; }
  canvas { max-width:100%; max-height:100%; }
  .brief { padding:12px 16px; border-top:1px solid rgba(255,255,255,.08); background:#0e1020; flex-shrink:0; }
  .brief-goal { font-size:12.5px; line-height:1.55; color:#c9d1e3; }
  .brief-goal b { color:#67e8f9; }
  .brief-api { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .api-chip { font-family:monospace; font-size:11px; background:#161927; border:1px solid rgba(184,239,74,.25);
              color:#b8ef4a; border-radius:6px; padding:3px 9px; }
  .console { min-height:52px; max-height:110px; overflow-y:auto; padding:9px 16px; font-family:monospace;
             font-size:12px; background:#05060c; border-top:1px solid rgba(255,255,255,.08);
             color:#9ca3af; white-space:pre-wrap; flex-shrink:0; }
  .console .ok { color:#4ade80; } .console .err { color:#f87171; } .console .warn { color:#fbbf24; }

  .right { display:flex; flex-direction:column; overflow:hidden; }
  .ed-head { display:flex; align-items:center; gap:8px; padding:8px 14px; background:#0e1020;
             border-bottom:1px solid rgba(255,255,255,.08); flex-shrink:0; }
  .ed-lang { font-size:11px; font-weight:800; color:#67e8f9; background:rgba(103,232,249,.08);
             border:1px solid rgba(103,232,249,.25); border-radius:6px; padding:4px 10px; }
  .ed-btns { margin-left:auto; display:flex; gap:8px; }
  .btn { border:none; border-radius:8px; padding:8px 18px; font-size:12.5px; font-weight:800; cursor:pointer; transition:.15s; }
  .btn-run { background:#b8ef4a; color:#0d0f1a; }
  .btn-run:hover { background:#a5d83d; }
  .btn-run:disabled { opacity:.5; cursor:default; }
  .btn-reset { background:none; border:1px solid rgba(255,255,255,.18); color:#9ca3af; }
  .btn-reset:hover { color:#fff; }
  .btn-submit { background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; }
  .btn-submit:disabled { opacity:.45; cursor:default; }
  .ed-body { flex:1; overflow:hidden; }
  .CodeMirror { height:100%; font-size:14px; font-family:'Cascadia Code',Consolas,monospace; }
  .cm-error-line { background:rgba(248,113,113,.14) !important; }

  /* ── Mission list overlay ── */
  .mlist { position:fixed; inset:0; z-index:50; background:#0d0f1a; overflow-y:auto; display:none; }
  .mlist.open { display:block; }
  .mlist-hero { text-align:center; padding:30px 16px 10px; }
  .mlist-hero h1 { font-size:24px; font-weight:900;
    background:linear-gradient(90deg,#67e8f9,#b8ef4a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .mlist-hero p { color:#9ca3af; font-size:13px; margin-top:5px; }
  .mgrid { max-width:640px; margin:20px auto 60px; padding:0 16px; display:flex; flex-direction:column; gap:10px; }
  .mcard { display:flex; align-items:center; gap:14px; background:#12141f; border:1px solid rgba(255,255,255,.09);
           border-radius:14px; padding:14px 18px; cursor:pointer; transition:.15s; }
  .mcard:hover { border-color:rgba(103,232,249,.4); transform:translateY(-1px); }
  .mcard.locked { opacity:.45; cursor:default; }
  .mcard.locked:hover { transform:none; border-color:rgba(255,255,255,.09); }
  .mcard-emoji { font-size:26px; }
  .mcard-title { font-size:14px; font-weight:800; }
  .mcard-sub { font-size:11.5px; color:#9ca3af; margin-top:2px; }
  .mcard-stars { margin-left:auto; font-size:13px; color:#fbbf24; }

  /* ── Win overlay ── */
  .win { position:fixed; inset:0; z-index:100; background:rgba(6,8,15,.86); backdrop-filter:blur(4px);
         display:none; align-items:center; justify-content:center; }
  .win.open { display:flex; }
  .win-card { background:#141727; border:1px solid rgba(103,232,249,.35); border-radius:20px; padding:30px 40px;
              text-align:center; max-width:400px; animation:pop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
  .win-stars { font-size:34px; letter-spacing:4px; margin-bottom:8px; }
  .win-stars .dim { opacity:.22; }
  .win-title { font-size:20px; font-weight:900; }
  .win-sub { color:#9ca3af; font-size:13px; margin:8px 0 14px; line-height:1.5; }
  .win-xp { font-size:15px; font-weight:900; color:#fbbf24; margin-bottom:16px; }
  .win-btn { border:none; border-radius:10px; padding:11px 24px; font-size:13.5px; font-weight:800; cursor:pointer;
             background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; margin:0 5px; }
  .win-btn.ghost { background:none; border:1px solid rgba(255,255,255,.18); color:#9ca3af; }

  .mtier { font-size:11px; font-weight:900; letter-spacing:1.4px; color:#67e8f9; margin:16px 4px 2px; }
  select.ed-lang { cursor:pointer; }
  select.ed-lang option { background:#0e1020; color:#e2e8f0; }
</style>
<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/lesson-saves.js"></script>
</head>
<body>

<nav class="nav">
  <div class="nav-logo"><span class="bolt">⚡</span><span>ByteForge · 🌊 Deep Diver</span></div>
  <a href="/student/dashboard">← Dashboard</a>
</nav>

<div class="mbar">
  <button class="mbar-back" onclick="showList()">☰ Missions</button>
  <span class="mbar-phase" id="m-phase">PHASE 1 · TURTLE</span>
  <span class="mbar-title" id="m-title"></span>
  <span class="mbar-par" id="m-par"></span>
</div>

<div class="main">
  <div class="left">
    <div class="scene-wrap"><canvas id="scene" width="640" height="480"></canvas></div>
    <div class="brief">
      <div class="brief-goal" id="m-brief"></div>
      <div class="brief-api" id="m-api"></div>
    </div>
    <div class="console" id="console">// Mission console — Run your code to see what happens.</div>
  </div>
  <div class="right">
    <div class="ed-head">
      <select class="ed-lang" id="ed-lang" onchange="switchLang(this.value)" title="The same mission, two languages — write in either">
        <option value="py">Python 3</option>
        <option value="ps">Pseudocode</option>
      </select>
      <div class="ed-btns">
        <button class="btn btn-reset" onclick="resetMission()">↺ Reset</button>
        <button class="btn btn-run" id="btn-run" onclick="runMission(false)">▶ Run</button>
        <button class="btn btn-submit" id="btn-submit" onclick="runMission(true)" disabled>✓ Submit</button>
      </div>
    </div>
    <div class="ed-body"><textarea id="code"></textarea></div>
  </div>
</div>

<!-- Mission list -->
<div class="mlist open" id="mlist">
  <div class="mlist-hero">
    <h1>🌊 Deep Diver — Mission IDE</h1>
    <p>Your code is the pilot. Write it, run it, watch it fly.</p>
  </div>
  <div class="mgrid" id="mgrid"></div>
</div>

<!-- Win overlay -->
<div class="win" id="win">
  <div class="win-card">
    <div class="win-stars" id="win-stars"></div>
    <div class="win-title" id="win-title">MISSION COMPLETE</div>
    <div class="win-sub" id="win-sub"></div>
    <div class="win-xp" id="win-xp"></div>
    <button class="win-btn" onclick="winNext()">Next mission →</button>
    <button class="win-btn ghost" onclick="winList()">Mission list</button>
  </div>
</div>

<script>
'use strict'

// Editor highlighting for the pseudocode side of the bridge
CodeMirror.defineSimpleMode('pseudog9', {
  start: [
    { regex: /\/\/.*/, token: 'comment' },
    { regex: /'[^']*'|"[^"]*"/, token: 'string' },
    { regex: /\b(FOR|TO|STEP|NEXT|IF|THEN|ELSE|ENDIF|MOD|AND|OR|NOT|OUTPUT|CALL|TRUE|FALSE|WHILE|ENDWHILE)\b/i, token: 'keyword' },
    { regex: /\d+(\.\d+)?/, token: 'number' },
    { regex: /←|<-|<>|<=|>=|[=<>+\-*/]/, token: 'operator' },
    { regex: /[A-Za-z_]\w*(?=\s*\()/, token: 'def' },
  ],
})

// ── Language bridge: the same mission, written in Python or pseudocode ────────
let lang = (() => { try { return localStorage.getItem('bf-g9-lang') || 'py' } catch (e) { return 'py' } })()
function draftKey(id, l) { return 'bf-g9-draft-' + id + '-' + l }
function loadDraft(id, l) { try { return localStorage.getItem(draftKey(id, l)) } catch (e) { return null } }
function saveDraft() {
  if (activeMission && editor) try { localStorage.setItem(draftKey(activeMission.id, lang), editor.getValue()) } catch (e) {}
}
function switchLang(l) {
  saveDraft()
  lang = l
  try { localStorage.setItem('bf-g9-lang', l) } catch (e) {}
  applyLang()
}
function applyLang() {
  document.getElementById('ed-lang').value = lang
  if (!editor || !activeMission) return
  editor.setOption('mode', lang === 'py' ? 'python' : 'pseudog9')
  editor.setValue(loadDraft(activeMission.id, lang) || activeMission.starter[lang])
  clearErrLine()
  setSubmit(false)
}
function parLabel(m) {
  return (m.stars.metric === 'lines' ? '3★: ≤ ' + m.stars.par + ' code lines' : '3★: ' + m.stars.par + ' commands')
}

// ══════════════════════════════════════════════════════════════════════════════
// Mission configs — schema-driven so new missions are data, not code.
//   scene:   start pose + target(s); canvas units
//   api:     commands injected into the student's Python namespace
//   success: checked post-execution against the pure simulation result
//   stars:   par = command count for 3★ (efficiency), par+2 = 2★, pass = 1★
// ══════════════════════════════════════════════════════════════════════════════
const MISSIONS = [
  // ── Tier 1 — Sequencing ──────────────────────────────────────────────────────
  {
    id: 'p1m1', phase: 'PHASE 1 · TURTLE', emoji: '🛰️', title: 'Dock at the Station', xp: 30,
    brief: 'Your supply pod <b>starts facing EAST</b> (→). Fly it to the space station 🛰️. '
      + '<b>forward(distance)</b> moves in the direction you face; <b>left(90)</b> / <b>right(90)</b> '
      + 'rotate on the spot. One grid square = <b>40px</b>.',
    api: ['forward(d)', 'left(deg)', 'right(deg)'],
    starter: {
      py: '# Mission: dock at the station 🛰️\n# You start at the pad, facing EAST →\n# One grid square = 40 pixels\n\nforward(80)\n# your code here…\n',
      ps: '// Mission: dock at the station\n// You start at the pad, facing EAST →\n// One grid square = 40 pixels\n\nforward(80)\n// your code here…\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 120, y: 360, heading: 0 },      // heading 0 = east, degrees CCW
             target: { x: 440, y: 160, r: 34 } },
    success: { type: 'reach' },
    stars: { par: 3 },
  },
  {
    id: 'p1m2', phase: 'PHASE 1 · TURTLE', emoji: '🪨', title: 'The Detour', xp: 35,
    brief: 'An <b>asteroid wall</b> blocks the direct route — touching it destroys the pod. '
      + 'Fly over the top. Plan the whole route <b>before</b> you run.',
    api: ['forward(d)', 'left(deg)', 'right(deg)'],
    starter: {
      py: '# An asteroid wall blocks the way — go OVER it.\n# You start facing EAST. Crashing = mission failed!\n\n',
      ps: '// An asteroid wall blocks the way — go OVER it.\n// You start facing EAST. Crashing = mission failed!\n\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 80, y: 240, heading: 0 },
             target: { x: 520, y: 240, r: 34 },
             walls: [{ x: 280, y: 160, w: 40, h: 320 }] },
    success: { type: 'reach' },
    stars: { par: 6 },
  },
  {
    id: 'p1m3', phase: 'PHASE 1 · TURTLE', emoji: '🔙', title: 'Reverse Thrusters', xp: 30,
    brief: 'Steering is <b>damaged</b> — no turning today! You only have <b>forward()</b> and '
      + '<b>backward()</b>… and the station is <b>behind</b> you. One command can do this.',
    api: ['forward(d)', 'backward(d)'],
    allowed: ['forward', 'backward'],
    starter: {
      py: '# Steering offline! Only forward() and backward() work.\n# The station is BEHIND you…\n\n',
      ps: '// Steering offline! Only forward() and backward() work.\n// The station is BEHIND you…\n\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 400, y: 240, heading: 0 },
             target: { x: 160, y: 240, r: 30 } },
    success: { type: 'reach' },
    stars: { par: 1 },
  },

  // ── Tier 2 — Loops (star metric = lines of code) ────────────────────────────
  {
    id: 'p1m4', phase: 'PHASE 1 · LOOPS', emoji: '🔁', title: 'Square Patrol', xp: 40,
    brief: 'Patrol all <b>4 checkpoints</b> and return to the pad — a perfect square, '
      + '<b>160px per side</b>. This mission <b>requires a loop</b>, and stars now count your '
      + '<b>lines of code</b>, not commands. Loops = shorter code!',
    api: ['forward(d)', 'left(deg)', 'right(deg)'],
    require: 'loop',
    starter: {
      py: '# Patrol all 4 checkpoints and return to the pad.\n# The square is 160px per side — use a loop!\n\nfor i in range(4):\n    # TODO: one side + one turn\n    pass\n',
      ps: '// Patrol all 4 checkpoints and return to the pad.\n// The square is 160px per side — use a loop!\n\nFOR i ← 1 TO 4\n    // TODO: one side + one turn\nNEXT i\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 240, y: 320, heading: 0 },
             waypoints: [{ x: 400, y: 320 }, { x: 400, y: 160 }, { x: 240, y: 160 }, { x: 240, y: 320 }] },
    success: { type: 'waypoints' },
    stars: { metric: 'lines', par: 4 },
  },
  {
    id: 'p1m5', phase: 'PHASE 1 · LOOPS', emoji: '🪜', title: 'The Staircase', xp: 40,
    brief: 'Climb the <b>5-step staircase</b> to the station. Every step is the same '
      + 'pattern: <b>40px across, 40px up</b>. One loop, one step pattern.',
    api: ['forward(d)', 'left(deg)', 'right(deg)'],
    require: 'loop',
    starter: {
      py: '# Climb 5 identical steps: 40px across, 40px up.\n# Facing EAST. Pattern per step: forward, turn, forward, turn.\n\nfor i in range(5):\n    forward(40)\n    left(90)\n    # TODO: finish the step\n',
      ps: '// Climb 5 identical steps: 40px across, 40px up.\n// Pattern per step: forward, turn, forward, turn.\n\nFOR i ← 1 TO 5\n    forward(40)\n    left(90)\n    // TODO: finish the step\nNEXT i\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 120, y: 400, heading: 0 },
             target: { x: 320, y: 200, r: 28 } },
    success: { type: 'reach' },
    stars: { metric: 'lines', par: 6 },
  },
  {
    id: 'p1m6', phase: 'PHASE 1 · LOOPS', emoji: '🌀', title: 'Spiral Scan', xp: 45,
    brief: 'Scan the sector in an <b>expanding spiral</b>: each leg is <b>40px longer</b> than '
      + 'the last (40, 80, 120 … 240), turning left between legs. The <b>loop variable</b> is the key.',
    api: ['forward(d)', 'left(deg)', 'right(deg)'],
    require: 'loop',
    starter: {
      py: '# Spiral outward: leg 1 = 40px, leg 2 = 80px … leg 6 = 240px.\n# Turn LEFT 90 between legs. Use the loop variable!\n\nfor i in range(1, 7):\n    # TODO: forward(40 * i), then turn\n    pass\n',
      ps: '// Spiral outward: leg 1 = 40px, leg 2 = 80px … leg 6 = 240px.\n// Turn LEFT 90 between legs. Use the loop variable!\n\nFOR i ← 1 TO 6\n    // TODO: forward(40 * i), then turn\nNEXT i\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 320, y: 240, heading: 0 },
             target: { x: 440, y: 80, r: 30 } },
    success: { type: 'reach' },
    stars: { metric: 'lines', par: 4 },
  },
  {
    id: 'p1m7', phase: 'PHASE 1 · LOOPS', emoji: '☄️', title: 'Comet Chain', xp: 45,
    brief: 'Collect all <b>6 comets</b> around the hexagon ring: 6 sides of <b>120px</b>, '
      + 'turning <b>LEFT 60°</b> at each corner. No starter this time — you know the pattern.',
    api: ['forward(d)', 'left(deg)', 'right(deg)'],
    require: 'loop',
    starter: {
      py: '# Six comets on a hexagon ring: 6 × (120px side + LEFT 60° turn).\n# Write the whole loop yourself — you\'ve got this!\n\n',
      ps: '// Six comets on a hexagon ring: 6 × (120px side + LEFT 60° turn).\n// Write the whole loop yourself — you\'ve got this!\n\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 200, y: 320, heading: 0 },
             waypoints: [{ x: 320, y: 320 }, { x: 380, y: 216 }, { x: 320, y: 112 },
                         { x: 200, y: 112 }, { x: 140, y: 216 }, { x: 200, y: 320 }] },
    success: { type: 'waypoints' },
    stars: { metric: 'lines', par: 4 },
  },

  // ── Tier 3 — Signals & decisions ─────────────────────────────────────────────
  {
    id: 'p1m8', phase: 'PHASE 1 · SIGNALS', emoji: '🚦', title: 'Signal Run', xp: 50,
    brief: 'Navigation beacons line the corridor — <b>get_signals()</b> gives you their colours in order. '
      + 'Protocol: fly <b>120px</b>, then <b>G = turn LEFT</b>, <b>R = turn RIGHT</b>. After the last beacon, '
      + 'one final <b>forward(120)</b> docks you. An <b>if</b> decision is required.',
    api: ['forward(d)', 'left(deg)', 'right(deg)', 'get_signals()'],
    require: 'if',
    signals: ['G', 'R', 'G'],
    starter: {
      py: '# Beacon protocol: G = LEFT, R = RIGHT. Corridors are 120px.\n# One final forward(120) after the last beacon.\n\nfor s in get_signals():\n    forward(120)\n    if s == \'G\':\n        left(90)\n    # TODO: what about red?\n\nforward(120)\n',
      ps: '// Beacon protocol: G = LEFT, R = RIGHT. Corridors are 120px.\n// The beacon colours are in the signals array (1-based).\n\nFOR i ← 1 TO LENGTH(signals)\n    forward(120)\n    IF signals[i] = \'G\' THEN\n        left(90)\n    ENDIF\n    // TODO: what about red?\nNEXT i\n\nforward(120)\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 120, y: 400, heading: 0 },
             target: { x: 360, y: 160, r: 30 },
             beacons: [{ x: 240, y: 400, c: 'G' }, { x: 240, y: 280, c: 'R' }, { x: 360, y: 280, c: 'G' }] },
    success: { type: 'reach' },
    stars: { metric: 'lines', par: 9 },
  },
  {
    id: 'p1m9', phase: 'PHASE 1 · SIGNALS', emoji: '🌃', title: 'Night Convoy', xp: 55,
    brief: 'A new beacon colour joins the protocol: <b>B (blue) = fly straight through</b>, no turn. '
      + 'Full protocol: <b>R = RIGHT, G = LEFT, B = nothing</b>. 120px corridors, final forward to dock. '
      + 'Three-way decisions — think <b>if / elif</b>.',
    api: ['forward(d)', 'left(deg)', 'right(deg)', 'get_signals()'],
    require: 'if',
    signals: ['R', 'B', 'G', 'B'],
    starter: {
      py: '# Protocol: R = RIGHT, G = LEFT, B = straight through.\n# 120px corridors, final forward(120) to dock.\n\nfor s in get_signals():\n    forward(120)\n    # TODO: three-way decision (if / elif)\n\nforward(120)\n',
      ps: '// Protocol: R = RIGHT, G = LEFT, B = straight through.\n// 120px corridors, final forward(120) to dock.\n\nFOR i ← 1 TO LENGTH(signals)\n    forward(120)\n    // TODO: IF … THEN … ELSE … ENDIF (nest for 3 ways)\nNEXT i\n\nforward(120)\n',
    },
    scene: { w: 640, h: 480, grid: 40,
             start: { x: 80, y: 120, heading: 0 },

// ══════════════════════════════════════════════════════════════════════════════
// Pure turtle simulation — testable in Node, no DOM.
// cmds: [['F', dist] | ['L', deg] | ['R', deg]]  → path points + end pose
// ══════════════════════════════════════════════════════════════════════════════
function simTurtle(scene, cmds) {
  let x = scene.start.x, y = scene.start.y, h = scene.start.heading
  const walls = scene.walls || []
  const wps = scene.waypoints || []
  const visited = new Set()
  const path = [{ x, y }]
  const mark = (px, py) => wps.forEach((w, i) => {
    if (Math.hypot(px - w.x, py - w.y) <= (w.r || 22)) visited.add(i)
  })
  const inWall = (px, py) => walls.some(r =>
    px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h)
  mark(x, y)
  for (const [op, val] of cmds) {
    if (op === 'L') { h = (h + val) % 360; continue }
    if (op === 'R') { h = (h - val) % 360; continue }
    if (op === 'F') {
      const rad = h * Math.PI / 180
      const nx = x + Math.cos(rad) * val
      const ny = y - Math.sin(rad) * val          // canvas y grows downward
      // sample the segment so walls, bounds and waypoints see every step
      const dist = Math.hypot(nx - x, ny - y)
      const steps = Math.max(1, Math.ceil(dist / 4))
      for (let k = 1; k <= steps; k++) {
        const px = x + (nx - x) * k / steps
        const py = y + (ny - y) * k / steps
        if (inWall(px, py)) {
          path.push({ x: px, y: py })
          return { path, end: { x: px, y: py }, crash: true, lost: false, visitedCount: visited.size }
        }
        if (px < 0 || py < 0 || px > scene.w || py > scene.h) {
          path.push({ x: px, y: py })
          return { path, end: { x: px, y: py }, crash: false, lost: true, visitedCount: visited.size }
        }
        mark(px, py)
      }
      x = nx; y = ny
      path.push({ x, y })
    }
  }
  return { path, end: { x, y }, crash: false, lost: false, visitedCount: visited.size }
}

function evalSuccess(mission, sim) {
  if (sim.crash) return { ok: false, why: 'crash' }
  if (sim.lost) return { ok: false, why: 'lost' }
  const sc = mission.scene
  if (mission.success.type === 'waypoints') {
    const total = (sc.waypoints || []).length
    if (sim.visitedCount < total) return { ok: false, why: 'waypoints', missing: total - sim.visitedCount }
    if (sc.target) {
      const d = Math.hypot(sim.end.x - sc.target.x, sim.end.y - sc.target.y)
      if (d > sc.target.r) return { ok: false, why: 'missed', dist: Math.round(d) }
    }
    return { ok: true }
  }
  if (mission.success.type === 'reach') {
    const t = sc.target
    const d = Math.hypot(sim.end.x - t.x, sim.end.y - t.y)
    return d <= t.r ? { ok: true } : { ok: false, why: 'missed', dist: Math.round(d) }
  }
  return { ok: false, why: 'unknown' }
}

// Significant source lines — the star metric for loop/decision missions
function countLines(code) {
  return code.split('\n').filter(l => {
    const t = l.trim()
    return t && !t.startsWith('#') && !t.startsWith('//')
  }).length
}

function starsFor(mission, stats) {
  const v = (mission.stars.metric || 'cmds') === 'lines' ? stats.lines : stats.cmds
  const par = mission.stars.par
  return v <= par ? 3 : v <= par + 2 ? 2 : 1
}

// Mission requirements — a route that "works" without the concept doesn't pass
function checkRequire(mission, code) {
  if (!mission.require) return null
  if (mission.require === 'loop' && !/\b(for|while)\b/i.test(code))
    return 'this mission requires a LOOP — rewrite the repeated commands with one.'
  if (mission.require === 'if' && !/\bif\b/i.test(code))
    return 'this mission requires an IF decision — react to the signals instead of hardcoding the route.'
  return null
}

// ══════════════════════════════════════════════════════════════════════════════
// Cambridge-style pseudocode executor (Phase 1 subset) — the second engine of
// the pluggable pair. Same command-list contract as Python.
//   x ← expr        FOR i ← a TO b [STEP s] … NEXT        IF … THEN / ELSE / ENDIF
//   forward(e) backward(e) left(e) right(e)   signals[i] (1-based)   LENGTH(a)
//   operators: + - * / MOD, = <> < > <= >=, AND OR       OUTPUT e     // comment
// ══════════════════════════════════════════════════════════════════════════════
function execPseudo(src, mission) {
  const cmds = []
  const outputs = []
  const allowedList = mission.allowed || ['forward', 'backward', 'left', 'right']
  const fns = {}
  if (allowedList.includes('forward'))  fns.forward  = d => cmds.push(['F', +d])
  if (allowedList.includes('backward')) fns.backward = d => cmds.push(['F', -d])
  if (allowedList.includes('left'))     fns.left     = a => cmds.push(['L', +a])
  if (allowedList.includes('right'))    fns.right    = a => cmds.push(['R', +a])
  fns.length = a => (Array.isArray(a) || typeof a === 'string')
    ? a.length : (() => { throw { message: 'LENGTH() needs an array or string' } })()
  fns.get_signals = () => (mission.signals || []).slice()

  const lines = []
  src.split('\n').forEach((raw, i) => {
    const t = raw.trim()
    if (t && !t.startsWith('//')) lines.push({ t, ln: i + 1 })
  })

  const env = Object.create(null)
  if (mission.signals) env.signals = mission.signals.slice()

  // ── expression evaluator: tokenizer + precedence climbing ──
  function evalExpr(exprStr, ln) {
    const str = exprStr.trim()
    const toks = []
    const re = /\s*(<=|>=|<>|<-|←|[-+*/(),\[\]=<>]|\d+\.?\d*|'[^']*'|"[^"]*"|[A-Za-z_]\w*)/y
    let pos = 0
    while (pos < str.length) {
      re.lastIndex = pos
      const m = re.exec(str)
      if (!m) throw { message: 'Cannot read: "' + str.slice(pos).trim() + '"', ln }
      toks.push(m[1]); pos = re.lastIndex
    }
    let i = 0
    const peek = () => toks[i]
    const low = t => (t && /^[A-Za-z_]/.test(t)) ? t.toLowerCase() : null
    function primary() {
      const t = toks[i++]
      if (t === undefined) throw { message: 'Unexpected end of expression', ln }
      if (t === '(') { const v = orExpr(); if (toks[i++] !== ')') throw { message: 'Missing )', ln }; return v }
      if (t === '-') return -primary()
      if (/^\d/.test(t)) return parseFloat(t)
      if (/^['"]/.test(t)) return t.slice(1, -1)
      if (/^[A-Za-z_]/.test(t)) {
        const name = t.toLowerCase()
        if (name === 'true') return true
        if (name === 'false') return false
        if (name === 'not') return !truthy(primary())
        if (peek() === '(') {           // function call
          i++
          const args = []
          if (peek() !== ')') { args.push(orExpr()); while (peek() === ',') { i++; args.push(orExpr()) } }
          if (toks[i++] !== ')') throw { message: 'Missing ) after ' + t, ln }
          const f = fns[name]
          if (!f) throw { message: 'Unknown function ' + t + '()', ln }
          return f(...args)
        }
        if (!(name in env)) throw { message: 'Unknown variable "' + t + '"', ln }
        let v = env[name]
        while (peek() === '[') {        // 1-based array indexing
          i++
          const idx = orExpr()
          if (toks[i++] !== ']') throw { message: 'Missing ]', ln }
          if (!Array.isArray(v)) throw { message: t + ' is not an array', ln }
          if (idx < 1 || idx > v.length) throw { message: 'Index ' + idx + ' is outside ' + t + ' (1..' + v.length + ')', ln }
          v = v[idx - 1]
        }
        return v
      }
      throw { message: 'Unexpected "' + t + '"', ln }
    }
    function mulExpr() {
      let v = primary()
      for (;;) {
        const t = peek()
        if (t === '*') { i++; v = v * primary() }
        else if (t === '/') { i++; v = v / primary() }
        else if (low(t) === 'mod') { i++; v = v % primary() }
        else return v
      }
    }
    function addExpr() {
      let v = mulExpr()
      for (;;) {
        const t = peek()
        if (t === '+') { i++; v = v + mulExpr() }
        else if (t === '-') { i++; v = v - mulExpr() }
        else return v
      }
    }
    function cmpExpr() {
      const v = addExpr()
      const t = peek()
      if (t === '=' || t === '<>' || t === '<=' || t === '>=' || t === '<' || t === '>') {
        i++
        const b = addExpr()
        if (t === '=') return v === b
        if (t === '<>') return v !== b
        if (t === '<=') return v <= b
        if (t === '>=') return v >= b
        if (t === '<') return v < b
        return v > b
      }
      return v
    }
    function andExpr() {
      let v = cmpExpr()
      while (low(peek()) === 'and') { i++; v = truthy(v) && truthy(cmpExpr()) }
      return v
    }
    function orExpr() {
      let v = andExpr()
      while (low(peek()) === 'or') { i++; v = truthy(v) || truthy(andExpr()) }
      return v
    }
    const result = orExpr()
    if (i < toks.length) throw { message: 'Unexpected "' + toks[i] + '"', ln }
    return result
  }
  function truthy(v) { return v === true || (typeof v === 'number' && v !== 0) || (typeof v === 'string' && v !== '') }

  // ── block matching ──
  function matchEnd(start, opener, closer) {
    let depth = 1
    for (let j = start + 1; j < lines.length; j++) {
      const up = lines[j].t.toUpperCase()
      if (up.startsWith(opener + ' ')) depth++
      else if (up === closer || up.startsWith(closer + ' ')) { depth--; if (depth === 0) return j }
    }
    throw { message: lines[start].t.split(' ')[0] + ' without a matching ' + closer, ln: lines[start].ln }
  }
  function findElse(start, endIdx) {
    let depth = 0
    for (let j = start + 1; j < endIdx; j++) {
      const up = lines[j].t.toUpperCase()
      if (up.startsWith('IF ')) depth++
      else if (up === 'ENDIF') depth--
      else if (up === 'ELSE' && depth === 0) return j
    }
    return -1
  }

  // ── statement execution ──
  let ops = 0
  function run(i, end) {
    while (i < end) {
      const { t, ln } = lines[i]
      if (++ops > 100000) throw { message: 'Program ran too long — check for an infinite loop', ln }
      const up = t.toUpperCase()
      if (up.startsWith('FOR ')) {
        const m = t.match(/^FOR\s+([A-Za-z_]\w*)\s*(?:←|<-)\s*(.+?)\s+TO\s+(.+?)(?:\s+STEP\s+(.+))?$/i)
        if (!m) throw { message: 'Bad FOR — expected: FOR i ← 1 TO 4', ln }
        const nxt = matchEnd(i, 'FOR', 'NEXT')
        const a = evalExpr(m[2], ln), b = evalExpr(m[3], ln)
        const st = m[4] ? evalExpr(m[4], ln) : 1
        if (st === 0) throw { message: 'STEP 0 never ends', ln }
        const vn = m[1].toLowerCase()
        for (let v = a; st > 0 ? v <= b : v >= b; v += st) {
          env[vn] = v
          run(i + 1, nxt)
        }
        i = nxt + 1
        continue
      }
      if (up.startsWith('IF ')) {
        const m = t.match(/^IF\s+(.+?)\s+THEN\s*$/i)
        if (!m) throw { message: 'Bad IF — put THEN at the end of the line', ln }
        const endif = matchEnd(i, 'IF', 'ENDIF')
        const els = findElse(i, endif)
        if (truthy(evalExpr(m[1], ln))) run(i + 1, els === -1 ? endif : els)
        else if (els !== -1) run(els + 1, endif)
        i = endif + 1
        continue
      }
      if (up === 'ELSE' || up === 'ENDIF' || up === 'NEXT' || up.startsWith('NEXT '))
        throw { message: '"' + t + '" has no matching opener here', ln }
      if (up.startsWith('OUTPUT')) {
        const rest = t.slice(6).trim()
        if (rest) outputs.push(rest.split(',').map(p => String(evalExpr(p, ln))).join(' '))
        i++
        continue
      }
      const am = t.match(/^([A-Za-z_]\w*)\s*(?:←|<-)\s*(.+)$/)
      if (am) { env[am[1].toLowerCase()] = evalExpr(am[2], ln); i++; continue }
      const cm = t.match(/^(?:CALL\s+)?([A-Za-z_]\w*)\s*\((.*)\)$/i)
      if (cm) {
        const f = fns[cm[1].toLowerCase()]
        if (!f) throw { message: 'Unknown command ' + cm[1] + '() — is it allowed in this mission?', ln }
        const args = cm[2].trim() ? cm[2].split(',').map(a => evalExpr(a, ln)) : []
        f(...args)
        i++
        continue
      }
      throw { message: 'Cannot understand this line — check the pseudocode reference in the brief', ln }
    }
  }

  try { run(0, lines.length) }
  catch (err) { return { ok: false, error: err.message || String(err), line: err.ln || null } }
  return { ok: true, cmds, outputs }
}

// Progress (same pattern as Grade 6)

function getProg() { try { return JSON.parse(localStorage.getItem('bf-g9-missions')) || {} } catch (e) { return {} } }
function saveProg(p) { try { localStorage.setItem('bf-g9-missions', JSON.stringify(p)) } catch (e) {} }

// ══════════════════════════════════════════════════════════════════════════════
// Python execution — Pyodide (pluggable: a pseudocode executor lands in the
// bridge-toggle session; both share the command-list contract).
// ══════════════════════════════════════════════════════════════════════════════
let _pyodide = null, _pyLoading = null
function ensurePyodide() {
  if (_pyodide) return Promise.resolve(_pyodide)
  if (!_pyLoading) {
    _pyLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js'
      s.onload = () => globalThis.loadPyodide().then(p => { _pyodide = p; resolve(p) }).catch(reject)
      s.onerror = () => reject(new Error('Could not load the Python engine — check your connection.'))
      document.head.appendChild(s)
    })
  }
  return _pyLoading
}

// Preamble is built per mission: only the allowed commands exist (calling a
// forbidden one is a honest NameError), and signals are injected when present.
function buildPreamble(m) {
  const defs = {
    forward:  'def forward(d): _cmds.append(("F", float(d)))',
    backward: 'def backward(d): _cmds.append(("F", -float(d)))',
    left:     'def left(a): _cmds.append(("L", float(a)))',
    right:    'def right(a): _cmds.append(("R", float(a)))',
  }
  let p = '_cmds = []\n'
  for (const a of (m.allowed || ['forward', 'backward', 'left', 'right'])) p += defs[a] + '\n'
  if (m.signals) p += '_signals = ' + JSON.stringify(m.signals)
    + '\ndef get_signals(): return list(_signals)\n'
  return p + '\n'
}

async function execPython(code, mission) {
  const py = await ensurePyodide()
  const preamble = buildPreamble(mission)
  const preLines = preamble.split('\n').length
  py.runPython('_cmds = []')
  try {
    py.runPython(preamble + code)
    const cmds = py.globals.get('_cmds').toJs({ create_proxies: false })
    return { ok: true, cmds: cmds.map(c => [c[0], c[1]]) }
  } catch (e) {
    // Map the Pyodide traceback back to the student's own line number
    const msg = String(e.message || e)
    let line = null
    const matches = [...msg.matchAll(/File "<exec>", line (\d+)/g)]
    if (matches.length) line = parseInt(matches[matches.length - 1][1]) - preLines + 1
    const lastLine = msg.trim().split('\n').pop()
    return { ok: false, error: lastLine, line: line && line > 0 ? line : null }
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// Scene rendering + animation
// ══════════════════════════════════════════════════════════════════════════════
const cv = document.getElementById('scene')
const ctx = cv.getContext('2d')
let activeMission = null
let editor = null
let animating = false
let lastRunPassed = false

function drawScene(m, pose, tracePath) {
  const s = m.scene
  cv.width = s.w; cv.height = s.h
  ctx.fillStyle = '#0b0d16'
  ctx.fillRect(0, 0, s.w, s.h)
  // grid
  ctx.strokeStyle = 'rgba(255,255,255,.05)'
  ctx.lineWidth = 1
  for (let gx = 0; gx <= s.w; gx += s.grid) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, s.h); ctx.stroke() }
  for (let gy = 0; gy <= s.h; gy += s.grid) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(s.w, gy); ctx.stroke() }
  // launch pad
  ctx.strokeStyle = 'rgba(184,239,74,.45)'
  ctx.setLineDash([5, 4])
  ctx.strokeRect(s.start.x - 26, s.start.y - 26, 52, 52)
  ctx.setLineDash([])
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  // asteroid walls
  for (const r of (s.walls || [])) {
    ctx.fillStyle = 'rgba(120,90,60,.25)'
    ctx.fillRect(r.x, r.y, r.w, r.h)
    ctx.strokeStyle = 'rgba(248,113,113,.5)'
    ctx.strokeRect(r.x, r.y, r.w, r.h)
    ctx.font = '22px serif'
    const n = Math.max(1, Math.floor(r.h / 60))
    for (let i = 0; i < n; i++) ctx.fillText('🪨', r.x + r.w / 2, r.y + (i + 0.5) * r.h / n)
  }
  // waypoint comets
  for (const w of (s.waypoints || [])) {
    ctx.strokeStyle = 'rgba(251,191,36,.45)'
    ctx.setLineDash([3, 3])
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r || 22, 0, Math.PI * 2); ctx.stroke()
    ctx.setLineDash([])
    ctx.font = '20px serif'
    ctx.fillText('☄️', w.x, w.y)
  }
  // signal beacons
  const BEACON_COLORS = { G: '#4ade80', R: '#f87171', B: '#60a5fa' }
  for (const b of (s.beacons || [])) {
    ctx.fillStyle = BEACON_COLORS[b.c] || '#fbbf24'
    ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = '#0b0d16'
    ctx.font = 'bold 10px monospace'
    ctx.fillText(String(b.c), b.x, b.y + 0.5)
  }
  // target station
  if (s.target) {
    const t = s.target
    ctx.strokeStyle = 'rgba(103,232,249,.5)'
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.stroke()
    ctx.font = '30px serif'
    ctx.fillText('🛰️', t.x, t.y)
  }
  // trace
  if (tracePath && tracePath.length > 1) {
    ctx.strokeStyle = '#b8ef4a'
    ctx.lineWidth = 2.5
    ctx.beginPath()
    ctx.moveTo(tracePath[0].x, tracePath[0].y)
    for (const p of tracePath.slice(1)) ctx.lineTo(p.x, p.y)
    ctx.stroke()
  }
  // pod
  const rad = pose.heading * Math.PI / 180
  ctx.save()
  ctx.translate(pose.x, pose.y)
  ctx.rotate(-rad)
  ctx.font = '26px serif'
  ctx.fillText('🚀', 0, 0)
  ctx.restore()
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)) }

async function animate(m, sim) {
  animating = true
  const pts = sim.path
  let heading = m.scene.start.heading
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i]
    heading = Math.atan2(a.y - b.y, b.x - a.x) * 180 / Math.PI
    const dist = Math.hypot(b.x - a.x, b.y - a.y)
    const steps = Math.max(6, Math.round(dist / 7))
    for (let k = 1; k <= steps; k++) {
      const px = a.x + (b.x - a.x) * k / steps
      const py = a.y + (b.y - a.y) * k / steps
      drawScene(m, { x: px, y: py, heading }, pts.slice(0, i).concat([{ x: px, y: py }]))
      await sleep(14)
    }
  }
  animating = false
}

// ══════════════════════════════════════════════════════════════════════════════
// Console + error surfacing
// ══════════════════════════════════════════════════════════════════════════════
let _errLine = null
function clearErrLine() {
  if (_errLine != null && editor) editor.removeLineClass(_errLine, 'background', 'cm-error-line')
  _errLine = null
}
function logC(msg, cls) {
  const c = document.getElementById('console')
  c.innerHTML = cls ? '<span class="' + cls + '">' + msg + '</span>' : msg
}

// ══════════════════════════════════════════════════════════════════════════════
// Mission lifecycle
// ══════════════════════════════════════════════════════════════════════════════
function openMission(id) {
  activeMission = MISSIONS.find(m => m.id === id)
  if (!activeMission) return
  document.getElementById('mlist').classList.remove('open')
  document.getElementById('m-title').textContent = activeMission.emoji + ' ' + activeMission.title
  document.getElementById('m-phase').textContent = activeMission.phase
  document.getElementById('m-par').textContent = parLabel(activeMission)
  document.getElementById('m-brief').innerHTML = activeMission.brief
  document.getElementById('m-api').innerHTML =
    activeMission.api.map(a => '<span class="api-chip">' + a + '</span>').join('')
  if (!editor) {
    editor = CodeMirror.fromTextArea(document.getElementById('code'), {
      mode: 'python', theme: 'dracula', lineNumbers: true, indentUnit: 4,
    })
    let _saveT = null
    editor.on('change', () => {
      clearErrLine(); setSubmit(false)
      clearTimeout(_saveT); _saveT = setTimeout(saveDraft, 800)
    })
  }
  applyLang()
  drawScene(activeMission, activeMission.scene.start, null)
  logC('// Mission loaded. Write your flight plan and press ▶ Run.')
  setTimeout(() => editor.refresh(), 50)
}

function setSubmit(on) {
  lastRunPassed = on
  document.getElementById('btn-submit').disabled = !on
}

function resetMission() {
  if (animating || !activeMission) return
  editor.setValue(activeMission.starter[lang])
  try { localStorage.removeItem(draftKey(activeMission.id, lang)) } catch (e) {}
  clearErrLine()
  setSubmit(false)
  drawScene(activeMission, activeMission.scene.start, null)
  logC('// Reset. Fresh start!')
}

async function runMission(isSubmit) {
  if (animating || !activeMission) return
  const btn = document.getElementById('btn-run')
  btn.disabled = true
  clearErrLine()
  saveDraft()
  const code = editor.getValue()
  if (lang === 'py' && !_pyodide) logC('⏳ Loading Python engine (first run only — a few seconds)…', 'warn')

  let res
  try { res = lang === 'py' ? await execPython(code, activeMission) : execPseudo(code, activeMission) }
  catch (e) { logC('✗ ' + e.message, 'err'); btn.disabled = false; return }

  if (!res.ok) {
    if (res.line != null) {
      _errLine = res.line - 1
      editor.addLineClass(_errLine, 'background', 'cm-error-line')
      logC('✗ Line ' + res.line + ': ' + res.error, 'err')
    } else {
      logC('✗ ' + res.error, 'err')
    }
    btn.disabled = false
    return
  }
  if (!res.cmds.length) {
    logC('🤔 Your program ran but gave no commands — call forward() to move!', 'warn')
    btn.disabled = false
    return
  }

  const sim = simTurtle(activeMission.scene, res.cmds)
  const stats = { cmds: res.cmds.length, lines: countLines(code) }
  const verdict = evalSuccess(activeMission, sim)
  const reqErr = verdict.ok ? checkRequire(activeMission, code) : null

  if (isSubmit) {
    // Submit re-checks everything headlessly and records the result
    if (verdict.ok && !reqErr) completeMission(stats)
    else logC('✗ Submit blocked — fix the run first (press ▶ Run to see why).', 'err')
    btn.disabled = false
    return
  }

  await animate(activeMission, sim)
  if (res.outputs && res.outputs.length) logC('» ' + res.outputs.join('\n» '))

  if (verdict.ok && reqErr) {
    logC('🟡 The route works… but ' + reqErr, 'warn')
    setSubmit(false)
  } else if (verdict.ok) {
    const st = starsFor(activeMission, stats)
    const metric = activeMission.stars.metric === 'lines'
      ? stats.lines + ' code lines (3★ needs ≤ ' + activeMission.stars.par + ')'
      : stats.cmds + ' commands (3★ needs ≤ ' + activeMission.stars.par + ')'
    logC('✅ MISSION ACCOMPLISHED — ' + metric
      + (st === 3 ? ' — perfect! ' : '. ') + 'Press ✓ Submit to claim your stars.', 'ok')
    setSubmit(true)
  } else if (verdict.why === 'crash') {
    logC('💥 CRASH — you flew into an asteroid! Plot a route around it.', 'err')
  } else if (verdict.why === 'lost') {
    logC('🌌 Your pod drifted off the map! Check your distances and turns.', 'err')
  } else if (verdict.why === 'waypoints') {
    logC('☄️ ' + verdict.missing + ' checkpoint' + (verdict.missing > 1 ? 's' : '')
      + ' missed — your route must pass through every comet ring.', 'warn')
  } else {
    logC('✗ Missed the station by ' + verdict.dist + 'px. One grid square = 40px — recount!', 'warn')
  }
  btn.disabled = false
}

function completeMission(stats) {
  const st = starsFor(activeMission, stats)
  const p = getProg()
  const prev = p[activeMission.id] || {}
  const firstTime = !prev.stars
  const xp = firstTime ? activeMission.xp + (st - 1) * 10 : 0
  p[activeMission.id] = {
    stars: Math.max(st, prev.stars || 0),
    xp: (prev.xp || 0) + xp,
    code: editor.getValue(),
    lang: lang,
  }
  saveProg(p)
  const idx = MISSIONS.indexOf(activeMission)
  try { LessonSaves.save('grade9-missions', idx, { passed: true, xpEarned: xp, code: editor.getValue() }) } catch (e) {}
  try { if (me && xp > 0) BF.addXP(me.id, xp) } catch (e) {}

  const isLines = activeMission.stars.metric === 'lines'
  document.getElementById('win-stars').innerHTML =
    '⭐'.repeat(st) + '<span class="dim">' + '⭐'.repeat(3 - st) + '</span>'
  document.getElementById('win-sub').textContent =
    st === 3 ? (isLines ? 'Minimal code — that\'s what loops are for. Beautiful.'
                        : 'Perfect flight — minimum commands. That\'s pilot thinking.') :
    (isLines ? 'Completed in ' + stats.lines + ' lines. Tighter code earns more stars — refactor and re-submit!'
             : 'Docked with ' + stats.cmds + ' commands. A shorter flight plan earns more stars!')
  document.getElementById('win-xp').textContent = xp > 0 ? '+' + xp + ' XP' : 'Already earned — chase the stars!'
  document.getElementById('win').classList.add('open')
}

function winNext() {
  document.getElementById('win').classList.remove('open')
  const idx = MISSIONS.indexOf(activeMission)
  if (MISSIONS[idx + 1]) openMission(MISSIONS[idx + 1].id)
  else showList()
}
function winList() {
  document.getElementById('win').classList.remove('open')
  showList()
}

// ══════════════════════════════════════════════════════════════════════════════
// Mission list
// ══════════════════════════════════════════════════════════════════════════════
const TIERS = [
  { name: '🧭 TIER 1 — SEQUENCING', ids: ['p1m1', 'p1m2', 'p1m3'] },
  { name: '🔁 TIER 2 — LOOPS (new: stars count code lines)', ids: ['p1m4', 'p1m5', 'p1m6', 'p1m7'] },
  { name: '🚦 TIER 3 — SIGNALS & DECISIONS', ids: ['p1m8', 'p1m9', 'p1m10'] },
  { name: '🏆 CAPSTONE', ids: ['p1m11'] },
]
const COMING = [
  { emoji: '⚔️', title: 'Phase 2 — Agent Battles', sub: 'Your code fights. Turn-based combat, enemy AI, boss missions.' },
  { emoji: '📊', title: 'Phase 3 — Data Missions', sub: 'Terrain data, enemy stats, hidden weaknesses — read the data or lose.' },
  { emoji: '🏟️', title: 'Phase 4-5 — The Tournament', sub: 'Your bot vs the whole class. Bracket. Glory.' },
]
function showList() {
  const p = getProg()
  let html = ''
  let prevDone = true                          // sequential unlock down the list
  for (const tier of TIERS) {
    html += '<div class="mtier">' + tier.name + '</div>'
    for (const id of tier.ids) {
      const m = MISSIONS.find(x => x.id === id)
      const st = (p[id] || {}).stars || 0
      const unlocked = st > 0 || prevDone
      html += '<div class="mcard' + (unlocked ? '' : ' locked') + '"'
        + (unlocked ? ' onclick="openMission(\'' + id + '\')"' : '') + '>'
        + '<span class="mcard-emoji">' + (unlocked ? m.emoji : '🔒') + '</span>'
        + '<div><div class="mcard-title">' + m.title + '</div>'
        + '<div class="mcard-sub">' + m.phase + ' · ' + parLabel(m)
        + (m.require ? ' · requires ' + (m.require === 'loop' ? 'a loop' : 'an if') : '') + '</div></div>'
        + '<span class="mcard-stars">' + (st ? '⭐'.repeat(st) : (unlocked ? '—' : '')) + '</span></div>'
      prevDone = st > 0
    }
  }
  COMING.forEach(c => {
    html += '<div class="mcard locked"><span class="mcard-emoji">' + c.emoji + '</span>'
      + '<div><div class="mcard-title">' + c.title + '</div>'
      + '<div class="mcard-sub">' + c.sub + '</div></div>'
      + '<span class="mcard-stars">🔒</span></div>'
  })
  document.getElementById('mgrid').innerHTML = html
  document.getElementById('mlist').classList.add('open')
}

// ── Init ──────────────────────────────────────────────────────────────────────
BF.seed()
const me = (() => { try { return BF.session() || null } catch (e) { return null } })()
;(async () => {
  if (me) { try { await LessonSaves.load('grade9-missions') } catch (e) {} }
  showList()
})()
</script>
